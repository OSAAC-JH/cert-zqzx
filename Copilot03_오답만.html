<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Copilot03 오답 및 유사문항</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#697286;--pri:#3f5efb;--pri2:#7b61ff;--ok:#13a66b;--bad:#db3a34;--yel:#e0a800;--line:#e5e8f0;--soft:#eef2ff;--warn:#fff6df;--warn-line:#f1dc9a;--warn-ink:#5b4a17;--ok-bg:#eafaf3;--ok-line:rgba(19,166,107,.4);--bad-bg:#fff0ef;--bad-line:rgba(219,58,52,.4);--stem:#f8fafc;--hover:#fafbff;--hover-line:#b8c2ff;--pill:#f2f4f8;--pill-ink:#5b6478;--head:rgba(255,255,255,.94);--shadow:0 8px 22px rgba(23,32,51,.05)}
html[data-theme=dark]{color-scheme:dark;--bg:#12131a;--card:#1b1d27;--ink:#eceef6;--muted:#a3a9bb;--pri:#8ea2ff;--pri2:#b39dff;--ok:#4cd694;--bad:#ff8782;--yel:#f5c84c;--line:#32364a;--soft:#262b4a;--warn:#2d2815;--warn-line:#5f5222;--warn-ink:#ecdca3;--ok-bg:#12301f;--ok-line:rgba(76,214,148,.5);--bad-bg:#3a1b1d;--bad-line:rgba(255,135,130,.5);--stem:#20232f;--hover:#232638;--hover-line:#5a67b8;--pill:#262a39;--pill-ink:#b6bdd0;--head:rgba(27,29,39,.94);--shadow:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:15px;line-height:1.65;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:12px 20px;width:100%}
.pgrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px}
.pb{min-width:0}.pb .lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.pb .lab b{color:var(--ink)}.pb .lab .st{overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;width:0;background:var(--ok);transition:width .25s,background .25s}
.pb.yel .bar>span{background:var(--yel)}.pb.red .bar>span{background:var(--bad)}
.pb.yel .lab .st{color:var(--yel)}.pb.red .lab .st{color:var(--bad)}.pb.grn .lab .st{color:var(--ok)}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.tab small{margin-left:4px;opacity:.75;font-weight:800}
.tab.active{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .tab.active{color:#10131f}
button:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
.hero{padding:26px 20px 6px}
.badge{display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:800;font-size:13px}
.hero h1{font-size:30px;letter-spacing:-.04em;margin:12px 0 8px;line-height:1.25}
.hero p{margin:0;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.sumcard b{display:block;font-size:22px;line-height:1.25}.sumcard span{color:var(--muted);font-size:13px}
.sumcard.total{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0}.sumcard.total b,.sumcard.total span{color:#fff}
.note{margin-top:14px;background:var(--warn);border:1px solid var(--warn-line);border-radius:16px;padding:13px 16px;color:var(--warn-ink);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .btn.primary{color:#10131f}
.btn[aria-pressed=true]{border-color:var(--pri);color:var(--pri);background:var(--soft)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:16px 0;padding:22px;box-shadow:var(--shadow);scroll-margin-top:170px;min-width:0;overflow-wrap:anywhere}
.qcard.is-ok{border-left:5px solid var(--ok)}.qcard.is-bad{border-left:5px solid var(--bad)}
.qtop{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--pill);color:var(--pill-ink);font-weight:700}
.pill.sj{background:var(--pri);color:#fff}html[data-theme=dark] .pill.sj{color:#10131f}
.pill.ch{background:var(--soft);color:var(--pri)}
.num{font-weight:900;color:var(--pri);flex:none}
.q{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px;line-height:1.55}
.opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);transition:.15s;min-width:0}
.opt span.t{min-width:0;flex:1}
.opt b{flex:none;color:var(--pri)}
.opt:hover:not(:disabled){border-color:var(--hover-line);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}.opt.correct b{color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}.opt.wrong b{color:var(--bad)}
.opt .mark{flex:none;font-size:12px;font-weight:900}
.opt.correct .mark{color:var(--ok)}.opt.wrong .mark{color:var(--bad)}
.explain{display:none;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--stem);border:1px solid var(--line)}
.explain.show{display:block}
.result{font-weight:900;margin-bottom:6px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.result.peek{color:var(--pri)}
.ans{font-weight:800;margin-bottom:6px}
.src{margin-top:10px;padding:10px 12px;border-left:3px solid var(--warn-line);background:var(--warn);color:var(--warn-ink);border-radius:8px;font-size:13.5px}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-width:100%;overflow-x:auto;font-family:"Cambria Math","Times New Roman",serif;font-size:16px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.frac .top{border-bottom:1.5px solid currentColor;padding:0 4px;line-height:1.3}.frac .bottom{padding:0 4px;line-height:1.3}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.gradebox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.gradebox h2{margin:0 0 6px;font-size:20px}
.verdict{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px;margin-left:8px;vertical-align:middle}
.verdict.pass{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}.verdict.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.score-big{font-size:34px;font-weight:900;color:var(--pri);letter-spacing:-.03em}
.score-big small{font-size:15px;color:var(--muted);font-weight:700;margin-left:6px}
.chrow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.chrow .mini{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.chrow .mini i{display:block;height:100%}
.chrow .val{font-weight:800;white-space:nowrap}
.wrongs{margin-top:14px}.wrongs a{display:inline-block;margin:3px 6px 3px 0;padding:3px 10px;border-radius:999px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
.hidden{display:none!important}
main{padding-bottom:50px}
@media(max-width:820px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.hero h1{font-size:24px}.wrap,.hero{padding-left:14px;padding-right:14px}.qcard{padding:17px;border-radius:18px;scroll-margin-top:200px}.q{font-size:16px}.chrow{grid-template-columns:110px minmax(0,1fr);}.chrow .val{grid-column:1/-1}}
@media print{header,.controls{display:none}.explain{display:block!important}.qcard{break-inside:avoid;box-shadow:none}}

.casebox,.bulletbox{margin:14px 0 4px;padding:14px 16px;border:1px solid var(--hover-line);border-left:5px solid var(--pri);border-radius:12px;background:var(--soft);display:grid;gap:9px}.caseitem{padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);line-height:1.62}.bulletbox{display:block;padding-left:36px}.bulletbox li{margin:7px 0;line-height:1.62}.lesson{display:grid;gap:10px;margin-top:10px}.lesson-row{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);line-height:1.65}.lesson-label{font-weight:800;color:var(--pri)}@media(max-width:640px){.lesson-row{grid-template-columns:1fr;gap:4px}.casebox{padding:11px}.q{line-height:1.68}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="pgrid"><div class="bars" id="bars"></div><button class="theme" id="theme" type="button"></button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="문항 세트"></div>
</div></header>
<section class="hero wrap">
  <span class="badge">오답 35문항 · 유사문항 70문항</span>
  <h1>증권투자권유자문인력<br>Copilot 모의고사 03</h1>
  <p>세트 탭에서 원 오답 또는 유사문항을 선택하세요. 해설에는 정답 근거만 표시합니다.</p>
  <div class="summary" id="summary"></div>
  <div class="note"><b>합격 기준</b><br>과목별 정답률 50% 이상, 총점 70% 이상이어야 합격입니다. 미풀이 문항은 오답으로 처리합니다. 상단 막대는 오답이 과락 경계에 도달하면 <b>노란색</b>, 경계를 넘으면 <b>빨간색</b>으로 바뀝니다.</div>
  <div class="controls">
    <button class="btn" id="wrongBtn" type="button" aria-pressed="false">오답만 보기</button>
    <button class="btn" id="expBtn" type="button" aria-pressed="false">해설 전체 펼치기</button>
    <button class="btn primary" id="gradeBtn" type="button">채점 요약 보기</button>
    <button class="btn" id="resetBtn" type="button">기록 초기화</button>
  </div>
</section>
<main class="wrap">
  <div id="questions"></div>
  <div class="empty hidden" id="empty">조건에 맞는 문항이 없습니다.</div>
  <div class="gradebox hidden" id="gradeBox"></div>
</main>
<script>
const RAW=[[1,"기술적 분석","개념응용","시장가격이 상승추세를 나타낼 때는 종가가격이 최근 시장가격의 변동폭 중 최고점에서 형성되는 경향이 높고, 반대로 하락추세를 나타낼 때는 종가가격이 최근 시장가격의 변동폭 중 최저점에 형성되는 경향이 높다는 과거 경험에서 비롯된 차트에 해당하는 것은?",["MACD","스토캐스틱 기법(Stochastics)","상대강도지수(RSI)","등락주선(ADL)"],1,"[[LESSON:정답 근거｜스토캐스틱 기법은 일정 기간의 주가변동폭에서 현재 종가가 차지하는 위치를 백분율로 나타낸다. 상승추세에서는 종가가 최근 변동폭의 최고점 부근, 하락추세에서는 최저점 부근에 형성되는 경향을 활용한다.]]",1,13],[1,"기술적 분석","계산형","최근 14일간 상승폭 합계가 90, 하락폭 합계가 30일 때 RSI와 일반적인 해석으로 옳은 것은?",["RSI 25, 과매도권","RSI 50, 중립권","RSI 75, 과매수권","RSI 90, 과매도권"],2,"[[LESSON:정답 근거｜RSI=상승폭 합계÷(상승폭 합계+하락폭 합계)×100이다. 90÷(90+30)×100=75이며, 일반적으로 70 이상은 과매수권으로 본다.]]",1,15],[1,"유가증권시장","심화응용","단기과열종목 지정제도에 대한 설명 중 잘못된 것은?",["미확인된 특정 테마 등을 추종매매한 선의의 투자자에 대한 피해를 보호하기 위한 제도이다.","단기과열지표가 되는 것은 주가와 거래량이다.","최초 단기과열지표에 해당하는 종목이 10매매거래일 이내에 다시 단기과열지표에 해당하는 경우 지정예고하고, 그 후 10매매거래일 이내에 다시 단기과열지표에 해당하는 경우 단기과열종목으로 지정한다.","당일 종가가 지정일 전일의 종가보다 20% 이상 높으면 지정기간을 3매매거래일 연장한다."],1,"[[LESSON:정답 근거｜단기과열지표가 되는 것은 주가, 회전율, 변동성이다. i참효] 단기과열지표 · 주가: 당일종가가 직전 40매매거래일 종가 평균 대비 30% 이상 상승 · 회전율: 최근 2거래일 평균회전율이 직전 40매매거래일 회전율 평균 대비 500% 이상 증가 · 변동성: 최근 2거래일 평균일중변동성이 직전 40매매거래일 일중변동성 평균 대비 50% 이상 증가]]",1,18],[1,"코스닥시장","심화응용","코스닥시장의 매매 관련 제도에 대한 설명 중 잘못된 것은?",["호가의 종류에는 지정가, 시장가, 조건부지정가, 최유리지정가, 최우선지정가 등이 있다.","FOK란 호가수량 중 접수 시점에 매매를 체결할 수 있는 수량에 대하여는 매매거래를 성립시키고 체결되지 않은 잔량은 즉시 취소하는 조건을 말한다.","가격제한폭은 유가증권시장과 동일하게 ±30%이다.","반대매매는 결제일 이전에도 가능하고, 유가증권시장과 코스닥시장 간에도 가능하다."],1,"[[LESSON:정답 근거｜호가조건 중 IOC란 호가수량 중 접수 시점에 매매를 체결할 수 있는 수량에 대하여는 매매거래를 성립시키고 체결되지 않은 잔량은 즉시 취소하는 조건을 말한다. 한편 FOK는 호가수량을 접수 시점에 전량 매매체결할 수 있는 경우 매매거래를 성립 시키고, 전량 체결을 충족시키지 못하는 경우 호가전량을 즉시 취소하는 조건을 말한다.]]",1,26],[1,"채권시장","심화응용","채권가격의 상승 예상 시(채권수익률의 하락 예상 시) 적절한 전략은?",["장기채 비중을 낮춘다.","표면이자율이 낮은 채권의 비중을 높인다.","듀레이션을 짧게 한다.","금리선물매도포지션(Short Position)을 취한다."],1,"[[LESSON:정답 근거｜1 장기채 비중을 높인다. _ 3 듀레이션을 길게 한다. 4 금리선물 매수포지션(Long Position)을 취한다. 적극적 투자전략 · 면역전략 · 수익률예측전략 · 만기보유전략 · 채권교체전략 · 인덱스전략 · 수익률곡선타기전략 · 현금흐름일치전략 · 나비형 투자전략 · 사다리형 만기운용전략 · 역나비형 투자전략 · 바벨형 만기운용전략 구 분 만 기 · 단기채 비중 늘림 표면금리 · 표면금리 높은 채권을 늘림 이자지급횟수 · 이자지급 횟수 많은 채권(이표채) · 이자지급 횟수 적은 채권(복리채, 할인채) · 바벨형 포트폴리오 듀레이션 · 짧은 채권]]",1,27],[1,"채권시장","심화응용","이자율의 기간구조에 대한 설명 중 옳은 것은?",["불편기대가설에 의하면 미래의 단기이자율이 현재의 단기이자율보다 높으면 수익률 곡선은 수평이다.","불편기대가설에서 장기이자율이 매년 상승할 것이라고 기대되면 수익률곡선은 우하향 한다.","유동성선호가설에 따르면 모든 조건이 동일할 때 장기이자율은 유동성 프리미엄으로 단기이자율보다 낮아진다.","시장분할가설은 기관투자자들의 경우 자산과 부채구조 등의 요인에 따라 수익률곡선 에서 선호하는 만기가 분할되어 있다고 본다."],3,"[[LESSON:정답 근거｜1 불편기대가설에 의하면 미래의 단기이자율이 현재의 단기이자율보다 높으면 수익률곡선은 우상향한다. 2 불편기대가설에서 장기이자율이 매년 상승할 것이라고 기대되면 수익률곡선은 우상향한다. 3 유동성선호가설에 따르면 모든 조건이 동일할 때 장기이자율은 유동성 프리미엄으로 단기이자율보다 높아진다.]]",1,29],[1,"채권시장","심화응용","채권투자전략 중 수익률변동위험을 제거하고 투자목표를 달성하기 위해 투자기간과 채권 포트폴리오의 듀레이션을 일치시키는 전략은?",["채권교체전략","인덱스전략","면역전략","현금흐름일치전략"],2,"[[LESSON:정답 근거｜면역전략 · 수익률변동위험을 제거하고 투자목표를 달성하기 위한 전략 · 투자기간과 채권 포트폴리오의 듀레이션을 일치시킴으로써 수익률상승(하락) 시 채권가격하락(상승)분과 표면이자에 대한 재투자 수익 증대(감소)분을 상호 상쇄시켜 채권투자 종료 시 실현수익률을 목표수익률과 일치시키는 전략]]",1,31],[1,"채권시장","심화응용","발행주체에 따라 채권을 분류한 것으로 바르게 연결된 것은?",["국채 - 지역개발채권","특수채 — 신주인수권부사채권","금융채 - 통화안정증권","지방채 - 한국도로공사채권"],2,"[[LESSON:정답 근거｜발행주체에 따른 분류 구분 제1종 및 제2종 국민주택채권, 재정증권, 국고채권(양곡기금채권, 외국환평형기금 국채 채권 통합) 지방채 (비금융) 특별법에 의하여 설립된 법인 특수채 금융채 보증사채. 무보증사채, 담보부사채. 전환사채. 교환사채, 신주인수권부사채, 옵션 회사채 부사채]]",1,33],[1,"기타 증권시장","심화응용","K-OTC시장의 매매제도에 대한 설명 중 잘못된 것은?",["호가수량단위는 1주이고, 호가가격단위는 주권의 가격대별로 7단계로 세분화되었다.","매수호가 제출시점에 가장 낮은 매도호가보다 3호가 가격단위를 초과하여 높은 매수호가에 대하여 호가접수를 거부하고 있다.","신규종목의 최초 매매거래개시일에는 기준가격의 30-500% 가격범위 내에서 호가를 접수하여 매매를 체결시킨다.","장 종료 시까지 거래가 형성되지 않더라도 호가가 있는 경우 이를 기준가격에 반영하는 기세제도를 도입하였다."],1,"[[LESSON:정답 근거｜매수호가 제출시점에 가장 낮은 매도호가보다 5호가 가격단위를 초과하여 높은 매수호가에 대하여 호가접수를 거부하고 있 다. 또한 매도호가 제출시점에 가장 높은 매수호가보다 5호가 가격단위를 초과하여 낮은 매도호가에 대한 호가접수를 거부하 고 있다. (불합리한 호가제한)]]",1,34],[2,"금융상품분석","심화응용","금융상품에 대한 설명으로 올바른 것은?",["ELS는 예금자보호법에 의하여 보호된다.","CMA는 예탁금에 제한이 없고 인출 시 원금과 배당금을 지급한다.","MMDA는 만기 이 전에는 인출할 수 없다.","CD는 중도해지가 가능하며, 유통시장을 통해서 매각하여 현금화할 수도 있다."],1,"[[LESSON:정답 근거｜1 ELS는 예금자보호법에 의하여 보호되지 않는다. 3 MMDA는 수시입출금상품이므로 만기 이전에도 인출할 수 있다. 4 CD(양도성예금증서)의 경우, 증서의 만기 전에 은행에서의 중도해지가 불가능하며, 다만 유통시장을 통해 매각하여 현금 화할 수 있다.]]",1,38],[2,"금융상품분석","개념응용","다음 중 CMA(현금자산 관리계좌)와 IMA(종합투자계좌)에 대한 설명으로 옳은 것은?",["IMA는 자산 규모와 상관없이 모든 증권사에서 가입할 수 있는 대중적인 상품이다.","CMA는 원칙적으로 증권사가 원금 지급을 보장하며, 확정 금리만을 제공한다.","IMA는 자기자본 8조 원 이상의 종합금융투자사업자만 취급할 수 있다.","CMA와 IMA 모두 예금자보호법에 따라 모든 증권사에서 1인당 1억 원까지 보호받는다."],2,"[[LESSON:정답 근거｜IMA는 자기자본 8조 원 이상이라는 법적 요건을 충족한 종합금융투자사업자만 취급할 수 있다. 증권사 CMA는 실적배당형 위주로 운용되어 수익률이 변동될 수 있으며 원칙적으로 예금자보호 대상이 아니다.]]",1,41],[2,"금융상품분석","심화응용","다음 중 파생결합증권에 대한 설명으로 잘못된 것은?",["공동사업의 결과에 따른 손익을 귀속받는 계약상의 권리가 표시된 것이다.","기초자산의 가격 등의 변동과 연계하여 지급금액 또는 회수금액이 결정되는 권리가 표시 된 것이다.","대표적인 상품으로 주식워런트증권(ELW)가 있다.","대표적인 상품으로 주가지수연계증권(ELS)이 있다."],0,"[[LESSON:정답 근거｜해당 설명은 투자계약증권에 해당하는 설명이다. 투자계약증권은 특정 투자자가 그 투자자와 타인 간의 공동사업에 금전 등 을 투자하고 주로 타인이 수행한 공동사업의 결과에 따른 손익을 귀속받는 계약상의 권리가 표시된 증권이다.]]",1,42],[2,"투자전략","심화응용","보기의 자료를 바탕으로 효율적 증권과 최적 증권에 관한 설명으로 옳은 것은? [[BOX:A: 기대수익률 12%, 표준편차 15%||B: 기대수익률 12%, 표준편차 20%||C: 기대수익률 6%, 표준편차 4%||D: 기대수익률 5%, 표준편차 4%||E: 기대수익률 9%, 표준편차 12%]]",["A주식과 B주식을 비교할 때 B주식이 효율적 증권이다.","C주식과 D주식을 비교할 때 D주식이 효율적 증권이다.","E주식은 A주식, C주식과 비교할 때 효율적 증권이 아니다.","보수적 투자자에게는 C주식이 최적 증권이 될 수 있다."],3,"[[LESSON:정답 근거｜효율적 증권 A주식. C주식, E주식 중에서 최적 증권의 선택은 투자자의 위험성향에 따라 다르므로 공격적 투자자는 A주식이 최적 증권이 되고, 보수적 투자자는 C주식이 최적 증권이 된다. 1 A주식과 B주식의 기대수익률은 12%로 동일하지만. A주식이 위험(표준편차)이 더 적으므로 효율적 증권이다. 2 C주식과 D주식의 위험(표준편차)은 4%로 동일하지만. C주식이 기대수익률이 더 크旦루 효율적 증권이다. 3 E주식은 A주식, C주식과 비교하여 지배당하는 경우가 아니므로 효율적 증권이다.]]",1,43],[2,"투자전략","심화응용","다음 확률분포를 이용해 A주식과 B주식의 기대수익률을 계산한 값으로 옳은 것은? [[BOX:호황 확률 30%: A 100%, B 40%||정상 확률 40%: A 15%, B 15%||불황 확률 30%: A -70%, B -10%]]",["12%, 12%","12%, 15%","15%, 12%","15%, 15%"],3,"[[LESSON:정답 근거｜투자금액의 비율로 가중평균하여 구하는 방법 E(R„) = Si시 x E(R) E(Rp) = 1dx x E(RJ +(內 x 티凡) ((시: 개별 증권 j에 대한 투자비율, E(R): 개별 증권 j에 대한 기대수익률) · E(Ra) =(0.3 x 1.0) + (0.4 x 0.15) + (0.3 X -0.7) = 0.15 = 15% · E(Rb)= (0.3 x 0.4) + (0.4 x 0.15) + (0.3 X -0.1) = 0.15 = 15%]]",1,45],[2,"투자전략","개념응용","마코위츠 모형에 의한 분산투자효과에 대한 설명 중 옳은 것은?",["구성종목수를 증가시켜도 줄어들지 않는 위험은 비체계적 위험이다.","구성종목수를 증가시킴에 따라 줄어드는 위험은 시장위험이다.","포트폴리오에 포함되는 종목의 수가 증가할 수록 포트폴리오의 위험은 각 종목들 간의 공분산의 평균에 근접한다.","포트폴리오에 포함되는 종목의 수가 감소할 수록 개별종목의 위험이 포트폴리오의 위험에 미칠 영향은 감소한다."],2,"[[LESSON:정답 근거｜동일한 비중으로 구성한 $n$개 종목 포트폴리오의 분산은 개별 종목 분산의 평균에 관한 항과 종목 간 공분산의 평균에 관한 항으로 나뉜다. 종목 수가 커질수록 개별 종목 고유위험의 영향은 작아지고 포트폴리오 위험은 평균 공분산, 즉 시장과 함께 움직이는 체계적 위험에 가까워진다. 종목 수 증가로 감소하는 것은 비체계적 위험이며 시장위험은 제거되지 않는다.]]",1,46],[2,"투자전략","심화응용","다음 두 자산으로 기대수익률 9%의 포트폴리오를 구성하려 한다. 투자비율로 옳은 것은? [[BOX:위험자산 기대수익률 10%, 표준편차 15%||무위험자산 수익률 6%||총투자금액 1억원]]",["50%, 50%","55%, 45%","65%, 35%","75%, 25%"],3,"[[LESSON:정답 근거｜위험자산에 대한 투자비율을 아라고 한다면. 0.09 = w x (0.1) + (1 - w) x 0.06 아 w = 0.75 = 75% 무위험자산에 대한 투자비율은 (1 - w)이므로, 1 - 0.75 = 0.25 = 25%.‘. 75%. 25%]]",1,47],[2,"투자전략","개념응용","자산배분(Asset Allocation)의 중요성이 높아지는 이유와 거리가 먼 것은?",["투자대상 자산군이 증가하고 있기 때문이다.","투자위험관리의 필요성이 증대하고 있기 때문이다.","투자수익률 결정에 자산배분이 절대적인 영향을 미친다는 인식이 높아지고 있기 때문이다.","시장예측이나 증권선택이 총수익률에 미치는 영향이 높아지고 있기 때문이다."],3,"[[LESSON:정답 근거｜자산배분은 기대수익률과 위험수준이 서로 다른 여러 자산집단에 투자자금을 배분하여 최적의 포트폴리오를 구성하는 과정이다. 투자성과 연구에서는 시장예측이나 개별 증권선택보다 자산배분이 총수익률에 더 큰 영향을 미치는 것으로 본다. 따라서 시장예측이나 증권선택의 영향이 높아지고 있다는 설명은 자산배분의 중요성이 커지는 이유와 거리가 멀다.]]",1,48],[2,"투자권유 및 고객관리","개념응용","다음 중 금융투자상품 판매직원의 설명의무에 대한 기술 중 적절하지 않은 것은?",["판매직원은 금융소비자 누구에게나 해당 상품에 대한 설명의 정도를 동일하게 이행할 의무가 있다.","기본계약을 동일한 내용으로 갱신하는 경우 설명서 교부의무가 면제된다.","금융소비자가 설명서의 수령을 거부하는 경우에도 설명서 교부의무가 면제된다.","외화증권을 투자권유하는 경우 일반적인 설명사항 외에 투자대상 국가의 경제 및 시장상황, 환위험 및 헤지비율 등에 대한 설명을 추가로 해야 한다."],0,"[[LESSON:정답 근거｜판매직원은 상품의 복잡성과 위험성, 금융소비자의 투자경험과 이해능력 등을 고려하여 설명의 정도를 달리할 수 있다. 모든 금융소비자에게 동일한 수준과 방식으로 설명해야 한다는 내용은 잘못이다. 외화증권은 일반적인 설명사항 외에도 투자대상 지역의 경제·시장상황, 거래제도, 환율변동 위험 및 헤지 관련 사항 등을 추가로 설명해야 한다.]]",1,52],[2,"직무윤리 및 투자자분쟁예방","심화응용","금융소비자의 청약철회권의 행사에 대한 설명으로 가장 적절한 것은?",["대출성 상품의 경우에는 일반금융소비자가 청약 철회의사를 표시하기 위해 서면 등을 발 송한 때 철회의 효력이 발생한다.","청약이 철회된 경우 금융상품판매 업자는 일반금융소비자에 대하여 청약철회에 따른 손해 배상을 청구할 수는 없으나 위약금을 청구할 수는 있다.","금융소비자보호법상의 청약철회권 규정에 반하는 특약으로 일반금융소비자에게 불리한 것은 취소할 수 있다.","금융소비자보호법상 청약철회권은 금융회사의 고의 또는 과실여부 등 귀책사유가 없더라 도 일반금융소비자가 행사할 수 있다."],3,"[[LESSON:정답 근거｜1 보장성 상품. 투자성 상품, 금융상품자문의 경우에는 일반금융소비자가 청약 철회의사를 표시하기 위해 서면 등을 발송한 때 철회의 효력이 발생한다. 반면, 대출성 상품의 경우에는 일반금융소비자가 청약 철회의사를 표시하기 위해 서면 등을 발송하고. 이미 공급받은 금전 · 재화 등을 반환한 때 철회의 효력이 발생한다. 2 청약이 철회된 경우 금융상품판매업자는 일반금융소비자에 대하여 청약철회에 따른 손해배상 또는 위약금 등 금전의 지 급을 청구할 수 없다. 3 금융소비자보호법상의 청약철회권 규정에 반하는 특약으로 일반금융소비자에게 불리한 것은 무효로 한다.]]",1,54],[2,"직무윤리 및 투자자분쟁예방","개념응용","자본시장법상 이해상충방지체계에 대한 설명 중 옳은 것은?",["금융투자업자는 이해상충방지체계를 자율적으로 마련해야 한다.","금융투자업자는 이해상충 발생 가능성을 파악·평가하고 표준투자권유준칙에 따라 관리해야 한다.","이해상충 발생 가능성이 있다고 인정되는 경우 그 사실을 투자자에게 알리고, 문제가 없는 수준으로 낮춘 후 거래해야 한다.","이해상충 발생 가능성을 낮추기 곤란한 경우 투자자의 승낙을 얻어 거래해야 한다."],2,"[[LESSON:정답 근거｜이해상충 가능성이 있으면 투자자에게 고지하고 투자자보호에 문제가 없는 수준으로 낮춘 뒤 거래해야 한다. 낮추기 곤란하면 승낙을 받더라도 거래해서는 안 되며, 관련 가능성은 내부통제기준에 따라 관리한다.]]",1,61],[2,"직무윤리 및 투자자분쟁예방","심화응용","차명거래금지제도에 대한 설명 중 잘못된 것은?",["모든 차명금융거래는 의심거래보고(STR)의 대상이 되며 금지된다.","실명이 확인된 계좌에 보유하고 있는 금융자산은 명의자소유로 추정된다.","금융종사자는 불법 차명거래의 알선 및 중개가 금지되고. 이를 위반 시 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.","차명거래 금지 위반 시 의심거래보고(STR)를 해야 한다."],0,"[[LESSON:정답 근거｜불법행위를 목적으로 하는 차명금융거래는 금지되나 불법행위를 목적으로 하지 않는 합법적인 차명거래는 가능하고 STR의 보고대상이 아니다. 합법적인 차명거래에는 동창회 회비관리용 차명계좌, 문중 · 교회자산관리용 차명계좌, 미성년 자산보호를 위한 부모명의 차명계좌 등이 있다.]]",1,62],[3,"자본시장 관련 법규","심화응용","금융위원회로부터 적기 시정조치를 받은 금융투자업자는 경영개선계획을 제출하고 이행 해야 한다. 이에 대한 설명으로 잘못된 것은?",["당해 조치일부터 2개월 범위 내에서 당해 조치권자가 정하는 기간 내에 경영개선계획을 금융감독원장에게 제출해야 한다.","금융위원회는 당해 경영개선계획을 제출받은 날부터 1개월 이내에 승인 여부를 결정해야 한다.","경영개선계획의 이행기간은 경영개선권고의 경우 승인일부터 3개월 이내이다.","금융투자업자는 매 분기 말부터 10일 이내에 계획의 분기별 이행실적을 감독원장에게 제출해야 한다."],2,"[[LESSON:정답 근거｜경영개선계획의 이행기간은 경영개선권고의 경우 승인일부터 6개월 이내(부동산신탁업자의 경우는 1년), 경영개선요구의 경 우 승인일부터 1년 이내(부동산신탁업자의 경우는 1년 6개월). 경영개선명령의 경우에는 금융위원회가 승인하면서 그 이행기 한을 정한다. 경영개선권고를 받은 금융투자업자가 그 경영개선계획 이행 중 경영개선요구를 받은 경우에는 경영개선권고에 따른 경영개선계획의 승인일부터 1년(부동산신탁업자의 경우는 1년 6개월) 이내로 한다.]]",1,66],[3,"자본시장 관련 법규","개념응용","금융투자업자의 대주주와의 거래 제한에 대한 설명으로 잘못된 것은?",["원칙적으로 금융투자업자는 대주주가 발행한 증권을 소유할 수 없다.","원칙적으로 금융투자업자는 그 계열사가 발행한 주식, 채권 및 약속어음을 자기자본의 10%를 초과하여 소유할 수 있다.","원칙적으로 금융투자업자는 대주주 및 그 특수관계인에 대한 신용공여가 금지되고, 대주주 및 그 특수관계인은 금융투자업자로부터 신용공여를 받는 것이 금지된다.","금융투자업자는 계열사 발행증권을 한도 내에서 예외적으로 취득하려면 재적이사 전원의 찬성에 의한 이사회 결의를 거쳐야 한다."],1,"[[LESSON:정답 근거｜원칙적으로 금융투자업자는 그 계열사가 발행한 주식, 채권 및 약속어음을 자기자본의 8%를 초과하여 소유할수없다. 금융투자업자의 대주주와의 거래 제한 · 원칙: 금융투자업자는 대주주가 발행한 증권을 소유할 수 없음 대주주 · 예외: 담보권 실행 등 권리행사. 시장조성 안정조작. 대주주가 아닌 자가 대주주가 되는 경우. 인수. 보증 발행증권의 사채 특수채증권의 경우는 가능 소유 제한 · 원칙: 금융투자업자는 그 계열사가 발행한 주식. 채권 및 약속어음을 자기자본의 8%를 초과하여 소유 할 수 없음 계열사 · 예외: 담보권 실행 등 권리행사. 시장조성 안정조작. 계열사가 아닌 자가 계열사가 되는 경우. 인수. 보증 발행증권의 사채 특수채증권, 경영참여목적의 출자. 차익거래. 투자위험회피거래, 자기자본 변동 등의 사유로소유 제한인한 한도 초과 등 · 원칙: 금융투자업자는 대주주 및 그 특수관계인에 대한 신용공여가 금지되고. 대주주 및 그 특수관계인은 대주주 금융투자업자로부터 신용공여를 받는 것이 금지됨신용공여의 제한 · 예외: 임원에 대한 제한적 신용공여. 해외현지법인에 대한 채무보증. 담보권 실행 등의 권리행사 · 재적이사 전원 찬성 원칙: 금융투자업자는 계열사 발행증권을 한도 내에서 예외적으로 취득하거나 대주주 계열사 및 그 특수관계인에 대하여 예외적으로 신용공여하려면 재적이사 전원의 찬성발행증권의에 의한 이사회 결의를 거쳐야 함예외 취득 · 예외: 단일거래금액이 자기자본의 0.1%와 10억원 중 적은 금액의 범위인 경우에는 이사회 결의가 불필요함 금융위의 금융위원회는 금융투자업자의 대주주가 법 제35조(부당한 영향력 행사 금지)를 위반한 혐의가 있다고 인정자료제출명령될 경우에는 금융투자업자 또는 그의 대주주에게 필요한 자료의 제출을 명할 수 있음 (법 제36조)]]",1,67],[3,"자본시장 관련 법규","사례형","전문투자자 구분에 관한 설명으로 옳은 것은? [[BULLETS:국가·한국은행·금융기관 등은 일반투자자 대우를 받을 수 없는 절대적 전문투자자이다.||지방자치단체·주권상장법인 등은 일정한 절차에 따라 일반투자자 대우를 선택할 수 있다.||주권상장법인이 장외파생상품을 거래할 때에는 별도의 의사표시가 없으면 일반투자자로 취급된다.]]",["첫 번째 설명만 옳다.","첫 번째와 두 번째 설명만 옳다.","두 번째와 세 번째 설명만 옳다.","세 설명이 모두 옳다."],3,"[[LESSON:정답 근거｜절대적 전문투자자는 일반투자자 대우로 전환할 수 없지만, 지방자치단체와 주권상장법인 같은 상대적 전문투자자는 서면 통지 등 정해진 절차에 따라 일반투자자 대우를 선택할 수 있다. 특히 주권상장법인의 장외파생상품 거래는 전문투자자 대우 의사를 별도로 표시하지 않으면 일반투자자로 취급하는 점이 핵심 예외다. 따라서 세 설명이 모두 옳다.]]",1,69],[3,"자본시장 관련 법규","개념응용","자본시장 조사업무 규정에 의한 조사대상이 되는 행위와 거리가 먼 것은?",["미공개정보 이용 행위","내부자 단기매매차익 행위","상장법인 공시의무 위반 행위","임직원의 회사재산 횡령행위"],3,"[[LESSON:정답 근거｜자본시장 조사업무 · 협의: 시세조종 등 불공정행위에 대한 조사업무 · 광의: 법령 ·규정 위반 여부 또는 투자자보호를 위해 필요하다고 인정되는 사항을 조사하여 필요한 조치를 취 의 의 하는 업무 · 금융위원회 및 금융감독원 업무와 관련하여 위법행위 혐의가 발견된 경우 · 한국거래소로부터 위법행위 혐의사실을 이첩받은 경우 · 각 급 검찰청의 장으로부터 위법행위에 대한 조사를 요청받거나 그 밖의 행정기관으로부터 위법행위의 혐 의사실을 통보받은 경우 조사대상 · 위법행위에 관한 제보를 받거나 조사를 의뢰하는 민원을 접수한 경우 · 기타 공익 및 투자자보호를 위하여 조사의 필요성이 인정되는 경우 · 주요대상: 미공개정보 이용 행위. 불공정거래 행위. 내부자 단기매매차익. 규","심화응용","청약의 권유 상대방 50인 산정 시 제외되지 않는 자는?",["신용평가업자","회계법인","3% 소유 주주","최대주주"],2,"[[LESSON:정답 근거｜전문가 및 연고자는 청약 권유 상대방 50인 산정 시 제외된다. 참고 전문가 및 연고자에 해당하는 자 전문가 · 최대주주 및 5% 이상의 소유 주주 · 전문투자자 · 발행인의 임원 및 우리사주조합원 · 회계법인 · 발행인의 계열회사와 그 임원 · 신용평가업자 · 발행인이 증권비상장법인인 경우 그 주주 · 공인회계사, 변호사. 세무사 등 · 발행인이 설립 중인 회사인 경우 그 발기인]]",1,74],[3,"자본시장 관련 법규","개념응용","금융소비자의 권익 강화제도에 대한 설명 중 잘못된 것은?",["청약철회권은 보장성 상품과 대출성 상품에만 가능하다.","금융분쟁조정이 신청된 사건에 대하여 소송이 진행 중일 경우 법원은 그 소송을 중지할 수 있다.","소비자가 신청한 소액분쟁이 있는 경우 분쟁조정 완료 시까지 금융회사의 제소가 금지된다.","금융소비자가 분쟁조정·소송 대응 목적으로 금융회사가 유지·관리하는 자료의 열람을 요구하면 금융회사는 정당한 사유가 없는 한 수용해야 한다."],0,"[[LESSON:정답 근거｜금융소비자 권익강화를 위한 제도 (1) 청약철회권 1 의의: 일정기간 내 금융소비자가 금융상품 계약을 철회하는 경우 판매자는 이미 받은 금전 ·재화 등을 반환해야 함(보장성 · 대출성 ·투자성 상품 및 자문에 확대적용) 2 청약철회 가능기간 투자성 상품 | 계약서류 제공일 또는 계약체결일로부터 7일 이내대출성 상품 | 계약서류 제공일 또는 계약체결일로부터 14일 이내 (2) 계약서류 제공의무 및 기록 유지. 관리의무 · 금융상품판매업자는 소비자와 계약체결 시 계약서. 약관. 설명서 등 계약서류를 지체 없이 교 계약서류 제공의무 부해야 함 · 금융상품판매업자는 업무관련 자료를 기록하고 유지 ·관리해야 함 자료기록유지•관리의무 · 유지관리기간: 원칙 10년 (3) 사후구제 제도 소비자는 금융분쟁 발생 시 금융감독원에 분쟁조정 신청할 수 있으며. 분쟁의 당사자가 조정안금융분쟁조정제도을 수락한 경우 재판상 화해와 같은 효력이 있음분쟁조정이 신청된 사건에 대하여 소송이 진행 중일 경우 법원이 그 소송을 중지할 수 있도록소송중지제도한 제도조정이탈금지제도소비자가 신청한 소액분쟁(2천만원 이하의 분쟁)이 있는 경우 분쟁조정 완료 시까지 금융회사의 제소를 금지하는 제도금융소비자가 분쟁조정 ·소송 등 대응 목적으로 금융회사 등이 유지 ·관리하는 자료의 열람 요구자료열람요구권시 금융회사는 수용할 의무가 있음금융상품판매업자가 설명의무를 위반하여 소비자에게 손해를 입힌 경우. 자신의 고의 또는 과손해배상책임실을 입증하지 못하면 손해배상책임을 면할 수 없음(입증책임을 금융소비자에서 금융상품판매업자로 전환시킴)]]",1,75],[3,"자본시장 관련 법규","개념응용","금융감독원의 금융기관 제재절차에 대한 설명으로 잘못된 것은?",["감독원장은 제재심의를 위해 제재심의위원회를 설치하여 심의해야 하나 금융감독원장이 필요하다고 인정하는 때에는 심의회의 심의를 생략할 수도 있다.","감독원장은 제재하고자 할 경우 제재내용을 예외 없이 제재대상자에게 사전에 통지해야 한다.","감독원장은 상당한 기간을 정해 제재대상자에게 구술 또는 서면에 의한 의견진술의 기회를 주어야 한다.","감독원장은 증거서류 오류•누락. 법원의 무죄판결 등으로 그 제재의 위법 ·부당함을 발견하였을 때 직권으로 재심하여 조치할 수 있다."],1,"[[LESSON:정답 근거｜감독원장은 제재하고자 할 경우 제재내용을 사전에 통지해야 하나 처분의 성질상 불필요하다고 인정되는 사유가 있으면 사전통지를 하지 않을 수도 있다. 금융감독원의 금융기관 제재절차 · 감독원장은 제재심의를 위해 제재심의위원회 설치 및 운영 심의회 설치 · 감독원장이 필요하다고 인정하는 때에는 심의회의 심의 생략 가능 · 감독원장은 제재하고자 할 경우 제재내용을 사전에 통지해야 함 사전통지 · 처분의 성질상 불필요하다고 인정되는 사유가 있으면 사전통지를 하지 않을 수 있음 · 감독원장은 상당한 기간을 정해 제재대상자에게 구술 또는 서면에 의한 의견진술 기회를 주어야 함 의견진술 · 금융업관련법에서 의견청취의 방법을 청문 등으로 별도로 정하고 있는 경우에는 그에 따름 불복절차 · 이의신청•행정심판.행정소송 등 · 당해 제재처분(또는 조치요구)이 위법 또는 부당하다고 인정되는 경우에는 금융위원회 또는 감독원장에게 이의신청가능 · 감독원장이 당해 이의신청이 이유가 없다고 인정하는 경우에는 이를 기각하고. 이유가 있다고 인정하는 경 이의신청 우에는 당해 처분을 취소 또는 변경해야 함 · 이의신청 처리결과에 대하여 다시 이의신청을 할 수 없음 · 감독원장은 증거서류 오류 · 누락. 법원의 무죄판결 등으로 그 제재의 위법 · 부당함을 발견하였을 때 직권으로 재 심하여 조치 가능 · 금융기관의 장은 제재조치를 받은 경우 감독원장이 정하는 바에 따라 이사회 앞으로 보고 또는 주주총회 등 이사회 보고 필요한 절차를 취해야 함]]",1,77],[3,"한국금융투자협회 규정","심화응용","투자광고 시 금지행위와 거리가 먼 것은?",["수익률이나 운용실적이 좋은 기간의 수익률이나 운용실적만을 표시하는 행위","집합투자기구의 상환목표수익률을 표시하는 행위","사모의 방법으로 발행하거나 발행된 금융투자상품에 관한 내용을 표시하는 행위","여러 신탁재산을 집합하여 운용한다는 내용을 표시하는 행위"],1,"[[LESSON:정답 근거｜집합투자기구 등 운용실적에 따라 수익이 결정되는 금융투자상품 및 투자자문계약, 투자일임계약 또는 신탁계약 등에 대하여 예상수익률 또는 목표수익률 등 실현되지 않은 수익률을 표시하는 행위는 금지된다. 다만. 집합투자기구의 상환목표수익률, 전환형 집합투자기구의 전환목표수익률, 주식 워런트증권을 제외한 파생 결합증권을 투자대상으로 하는 집합투자기 구의 조건 별 예상수익률은 표시할 수 있다. (규정 제2-38조)]]",1,86],[3,"회사법","심화응용","주주명부에 대한 설명으로 옳은 것은?",["주주 및 회사채권자는 영업시간 외에도 주주명부의 열람 또는 등사가 가능하다.","주주명부 폐쇄는 주주를 주주명부에서 삭제하는 것이다.","주주명부 폐쇄기간 중에도 전환주식 또는 전환사채의 전환권 행사는 가능하나. 당해 주주총회에서 의결권 행사는 불가능하다.","실질주주명부는 상법상의 주주명부와 서로 구별되는 것으로 법적효력이 다르다."],2,"[[LESSON:정답 근거｜1 주주 및 회사채권자는 영업시간 내에는 언제나 주주명부의 열람 또는 등사가 가능하다. 2 주주명부 폐쇄는 권리를 행사할 자를 확정하기 위하여 일정 기간 동안 주주명부의 기재변경(명의개서)을 정지시키는 것이다. 4 실질주주명부는 예탁결제원이 통지한 증권회사별 고객명부를 기초로 하여 상장법인이 작성한 주주명부로 상법상의 주주 명부와 동일한 효력이 있다.]]",1,92],[3,"회사법","개념응용","액면·무액면주식을 불문하고 주주총회의 특별결의를 거쳐야 하는 것은?",["주식소각","주식병합","주식분할","주식매도"],2,"[[LESSON:정답 근거｜주식분할은 회사의 자본이나 재산을 늘리지 않고 1주의 주식을 2개 이상의 주식으로 나누는 것이다. 액면주식은 액면가를 종전보다 작은 금액으로 나누게 되므로 정관변경을 위한 주주총회의 특별결의가 필요하며, 무액면주식도 동일하게 특별결의를 거쳐야 한다. 주식분할 후에도 1주의 액면가는 100원 미만으로 할 수 없다. 주식소각·병합·분할은 각각 요건과 결의 방식이 다르므로 구분해야 한다.]]",1,95],[3,"증권세제","심화응용","상속세의 과세가액 산정 시 가산항목에 대한 설명으로 잘못된 것은?",["상속재산에는 상속개시일 현재 피상속인에게 귀속되는 재산으로 경제적 가치가 있는 모든 물건뿐 아니라 재산적 가치가 있는 법률상 또는 사실상의 모든 권리도 포함된다.","보험금, 신탁재산 및 퇴직금 등도 상속재산으로 의제되므로 과세가액 산출 시 가산항목 이다.","상속개시일 전 10년 이내에 피상속인이 상속인이 아닌 자에게 증여한 재산가액은 가산항목이다.","상속개시일 전 1년 이내에 처분받은 재산이 2억원 이상인 경우 상속재산으로 추정한다."],2,"[[LESSON:정답 근거｜생전증여재산 중 상속개시일 전 10년 이내에 피상속인이 상속인에게 증여한 재산가액, 상속개시일 전 5년 이내에 피상속인이 상속인이 아닌 자에게 증여한 재산가액은 과세가액 산정 시 가산항목이다. 상속세 과세가액 산정 시 가산항목에는 본래의 상 속재산(1), 의제상속재산(2), 상속추정재산(4) 등이 있고 차감항목에는 공과금. 장례비, 채무 등이 있다.]]",1,98],[3,"증권세제","개념응용","배당소득금액의 계산에 대한 설명으로 잘못된 것은?",["배당소득도 이자소득과 같이 필요경비가 인정되지 않으므로 배당소득으로 수입된 총수입금액이 그대로 배당소득이 된다.","배당가산(Gross-up) 적용대상 배당소득이 있는 경우 배당가산액을 가산한 금액을 배당소득금액으로 한다.","이중과세 방지를 위해 배당소득이 부담한 법인세상당액을 배당소득금액에서 공제한다.","내국법인으로부터 받은 배당소득은 배당가산 적용대상 배당소득에 해당한다."],2,"[[LESSON:정답 근거｜법인 단계에서 과세된 소득이 개인주주에게 배당될 때 다시 소득세가 부과되는 이중과세를 조정하기 위해, 법인세상당액을 배당소득금액에 가산한 뒤 산출세액에서 배당세액공제로 차감한다. 즉 법인세상당액을 배당소득금액에서 직접 공제하는 것이 아니다. 배당소득은 필요경비가 인정되지 않으며, 배당가산액은 일반적으로 해당 배당소득의 10%이다.]]",1,99],[1,"기술적 분석","지표","보조지표에 관한 설명으로 옳은 것은?",["RSI가 30 이하이면 과매수, 70 이상이면 과매도 구간으로 해석한다.","MACD는 단기 지수이동평균에서 장기 지수이동평균을 뺀 값이다.","OBV는 가격을 이용해 매매강도를 측정하는 추세지표로 거래량을 사용하지 않는다.","스토캐스틱 %K는 최근 n일 고가와 저가의 차이를 당일 종가로 나눈 값이다."],1,"[[LESSON:정답 근거｜MACD = 단기 EMA − 장기 EMA이며, MACD의 지수이동평균인 시그널선과의 교차로 매매시점을 판단한다. RSI는 70 이상이 과매수, 30 이하가 과매도다. OBV는 상승일 거래량을 더하고 하락일 거래량을 빼는 거래량 지표다. %K = (당일 종가 − n일 최저가) / (n일 최고가 − n일 최저가) × 100이다.]]",2,13],[1,"기술적 분석","복합판단","MACD에 관한 보기 중 옳은 것만 고른 것은? [[BULLETS:ㄱ. 일반적으로 단기 지수이동평균에서 장기 지수이동평균을 차감한다.||ㄴ. MACD가 시그널선을 상향 돌파하면 강세 신호로 해석할 수 있다.||ㄷ. 횡보장에서는 잦은 거짓 신호가 나타날 수 있다.]]",["ㄱ","ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ"],2,"[[LESSON:정답 근거｜세 문장 모두 맞다. MACD는 추세 추종형이므로 방향성이 약한 장에서는 신호 신뢰도가 낮아질 수 있다.]]",2,15],[1,"유가증권시장","시장관리","유가증권시장의 가격제한폭과 시장안정화 장치에 관한 설명으로 옳지 않은 것은?",["변동성완화장치(VI)는 시장 전체의 매매거래를 20분간 정지시키는 제도이다.","서킷브레이커는 코스피지수가 전일 대비 8%, 15%, 20% 이상 하락하는 경우 단계적으로 발동된다.","가격제한폭은 기준가격 대비 상하 30%이다.","사이드카는 코스피200선물 가격이 기준가 대비 5% 이상 변동해 1분간 지속되는 경우 발동된다."],0,"[[LESSON:정답 근거｜VI(변동성완화장치)는 개별종목 가격이 일정 범위를 벗어나면 2분간 단일가매매로 전환해 냉각기간을 부여하는 종목 단위 장치다. 시장 전체를 20분간 정지시키는 것은 서킷브레이커(1·2단계)다. 사이드카는 프로그램매매 호가 효력을 5분간 정지한다.]]",2,18],[1,"코스닥시장","매매","코스닥시장 및 코넥스시장의 매매제도에 관한 설명으로 옳지 않은 것은?",["코넥스시장은 연속매매만 허용되고 단일가매매는 하지 않는다.","코스닥시장의 가격제한폭은 상하 30%이다.","코스닥시장의 정규시장 매매거래시간은 유가증권시장과 같다.","코넥스시장의 가격제한폭은 상하 15%이다."],0,"[[LESSON:정답 근거｜코넥스시장은 정규시장에서 연속매매와 단일가매매(시가·종가 결정)가 모두 이루어지며, 유동성 부족 종목 등에 대해서는 단일가매매 방식도 활용한다. 가격제한폭은 상하 15%, 코스닥은 유가증권시장과 같이 상하 30%다.]]",2,26],[1,"채권시장","심화응용","금리가 하락할 때 발행자의 중도상환 가능성이 커지는 콜옵션부채권의 특성으로 옳은 것은?",["일반채권보다 항상 듀레이션이 길어진다.","투자자에게 유리한 가격상승이 제한될 수 있다.","콜옵션 가치는 금리 하락 시 감소한다.","재투자위험이 사라진다."],1,"[[LESSON:정답 근거｜금리 하락 시 발행자의 상환 유인이 커져 투자자의 가격상승 여력이 제한되고 재투자위험이 커질 수 있다.]]",2,27],[1,"채권시장","수익성","수익률곡선 이론에 관한 설명으로 옳은 것은?",["시장분할이론은 만기별 시장 간 자금 이동이 자유롭다고 가정한다.","유동성선호이론은 투자자가 장기채를 선호한다고 본다.","불편기대이론에서 장기금리는 미래 단기금리 기대치의 평균과 같다.","특정시장선호이론에서 수익률곡선은 반드시 우상향한다."],2,"[[LESSON:정답 근거｜불편기대이론은 장기금리를 현재와 미래 기대 단기금리의 (기하)평균으로 본다. 유동성선호이론은 투자자가 단기채를 선호해 장기채에 유동성프리미엄을 요구한다고 보며, 시장분할이론은 만기별 시장이 분리되어 있다고 가정한다. 특정시장선호이론은 프리미엄 크기에 따라 다양한 형태가 가능하다.]]",2,29],[1,"채권시장","전략","채권 운용전략에 관한 설명으로 옳지 않은 것은?",["사다리형 전략은 각 만기별로 채권을 균등하게 보유한다.","수익률곡선 타기 전략은 수익률곡선이 우상향하고 형태가 변하지 않을 때 효과적이다.","금리 하락이 예상되면 듀레이션을 줄이는 것이 적극적 전략이다.","바벨형 전략은 단기채와 장기채만 보유하고 중기채는 보유하지 않는다."],2,"[[LESSON:정답 근거｜금리 하락이 예상되면 가격상승 효과를 극대화하기 위해 듀레이션을 늘리는(장기채·저쿠폰채 편입) 것이 적극적 전략이다. 금리 상승 예상 시에는 듀레이션을 줄인다. 바벨형·사다리형은 만기 구성 전략이며, 수익률곡선 타기는 롤링효과와 숄더효과를 활용한다.]]",2,31],[1,"채권시장","가격","말킬(Malkiel)의 채권가격정리에 관한 설명으로 옳지 않은 것은?",["표면이율이 낮을수록 동일한 수익률 변동에 대한 가격변동률이 커진다.","채권수익률과 채권가격은 역의 관계이다.","만기가 길수록 동일한 수익률 변동에 대한 가격변동폭이 커진다.","만기가 길어질수록 가격변동률은 체증적으로 증가한다."],3,"[[LESSON:정답 근거｜말킬의 정리에 따르면 만기가 길수록 가격변동폭은 커지지만 그 증가율은 체감한다(만기 증가에 따른 가격변동률은 체감적으로 증가). 또 동일 크기의 수익률 변동이라도 수익률 하락에 따른 가격상승폭이 수익률 상승에 따른 가격하락폭보다 크며(볼록성), 표면이율이 낮을수록 가격변동률이 크다.]]",2,33],[1,"기타 증권시장","시장","K-OTC시장과 대체거래소에 관한 설명으로 옳지 않은 것은?",["K-OTC시장에는 가격제한폭이 상하 30%로 적용된다.","대체거래소(ATS)는 한국거래소와 동일하게 신규상장 심사 기능을 수행한다.","대체거래소는 매매체결 기능을 제공하며 거래소와 경쟁 관계에 있다.","K-OTC시장은 한국금융투자협회가 운영하는 비상장주식 장외시장이다."],1,"[[LESSON:정답 근거｜대체거래소(다자간매매체결회사, 넥스트레이드)는 상장 기능 없이 거래소 상장 종목에 대한 매매체결 서비스만 제공한다. 상장·시장감시 핵심 기능은 한국거래소가 담당한다. K-OTC는 금융투자협회가 운영하며 상대매매 방식, 가격제한폭 30%를 적용한다.]]",2,34],[2,"금융상품분석","개념응용","MMF에 관한 설명으로 가장 적절한 것은?",["주로 장기 주식에 집중 투자한다.","원금과 수익률을 법적으로 보장한다.","만기 전에는 환매할 수 없다.","단기금융상품 중심으로 운용해 유동성과 안정성을 추구한다."],3,"[[LESSON:정답 근거｜MMF는 단기 국공채·기업어음 등 단기금융상품을 중심으로 운용하지만 원금이 보장되는 예금은 아니다.]]",2,38],[2,"금융상품분석","개념응용","변액연금보험에 관한 설명으로 옳은 것은?",["운용성과와 무관하게 모든 급부가 확정된다.","보험 기능이 없다.","특별계정 운용성과가 적립금에 영향을 줄 수 있다.","중도해지 비용이 발생할 수 없다."],2,"[[LESSON:정답 근거｜변액보험은 특별계정 성과가 적립금·보험금에 영향을 주며 사업비와 해지공제도 확인해야 한다.]]",2,41],[2,"금융상품분석","복합판단","파생결합상품의 설명을 바르게 연결한 것은? [[BOX:(가) 원금 일부 또는 전부를 예금으로 두고 지수 성과에 연계한 수익을 제공한다.||(나) 증권회사가 발행하고 주가 이외의 금리·원자재·신용 등을 기초로 수익이 결정될 수 있다.]]",["(가) ETF · (나) ELD","(가) DLS · (나) MMF","(가) ELF · (나) 예금","(가) ELD · (나) DLS"],3,"[[LESSON:정답 근거｜ELD는 예금, DLS는 증권으로 법적 성격과 발행주체·위험이 다르다.]]",2,42],[2,"투자전략","계산응용","자산 A와 B의 기대수익률이 각각 12%, 4%이고 A에 60%, B에 40% 투자할 때 포트폴리오 기대수익률은?",["6.4%","8.8%","8.0%","10.4%"],1,"[[LESSON:정답 근거｜가중평균 기대수익률은 0.6×12%+0.4×4%=8.8%다.]]",2,43],[2,"투자전략","복합판단","다음 투자자의 자산배분 조정으로 가장 적절한 것은? [[BOX:은퇴까지 2년 남음||생활비 목적의 단기 현금수요가 큼||주가 급락을 감내하기 어려움]]",["고변동 성장주 비중을 대폭 확대한다.","유동성과 안정성을 고려해 현금성·우량채권 비중을 높인다.","레버리지 파생상품에 집중한다.","투자기간과 무관하게 위험자산 100%를 유지한다."],1,"[[LESSON:정답 근거｜짧은 투자기간과 낮은 위험감수도, 큰 유동성 수요에는 안정적·유동성 높은 자산 비중 확대가 부합한다.]]",2,45],[2,"투자전략","개념응용","마코위츠 효율적 프런티어에 관한 설명으로 옳은 것은?",["같은 위험에서 기대수익률이 가장 낮은 포트폴리오 집합이다.","무위험자산만으로 구성된다.","투자자의 위험회피도와 무관하게 최적점이 하나로 고정된다.","지배되지 않는 포트폴리오 중 위험 대비 기대수익률이 우월한 경계다."],3,"[[LESSON:정답 근거｜효율적 프런티어는 동일 위험에서 기대수익률이 최대이거나 동일 수익률에서 위험이 최소인 포트폴리오의 집합이다.]]",2,46],[2,"투자전략","계산응용","두 자산의 표준편차가 각각 10%, 20%, 상관계수가 0.5일 때 공분산은?",["0.001","0.1","0.01","1.0"],2,"[[LESSON:정답 근거｜공분산은 상관계수×표준편차의 곱이므로 0.5×0.10×0.20=0.01이다.]]",2,47],[2,"투자전략","개념응용","대체투자 평가 시 유동성 프리미엄을 요구하는 이유로 가장 적절한 것은?",["시장가격을 언제나 실시간으로 확인할 수 있기 때문이다.","원금이 법적으로 보장되기 때문이다.","매각에 시간이 걸리고 거래비용이 커 원하는 시점에 현금화하기 어려울 수 있기 때문이다.","평가가치가 절대 변하지 않기 때문이다."],2,"[[LESSON:정답 근거｜낮은 유동성은 현금화 지연·가격충격·거래비용을 유발하므로 투자자는 추가 보상을 요구할 수 있다.]]",2,48],[2,"투자권유 및 고객관리","개념응용","설명의무 이행 방법으로 가장 적절한 것은?",["투자자가 이해할 수 있도록 중요사항과 위험을 설명하고 이해 여부를 확인한다.","핵심 위험을 생략하고 높은 수익 가능성만 강조한다.","상품설명서를 교부하면 구두 설명은 언제나 불필요하다.","손실 가능성은 계약 후에만 고지한다."],0,"[[LESSON:정답 근거｜설명의무는 형식적 교부가 아니라 중요내용·위험의 실질적 설명과 이해 확인을 요구한다.]]",2,52],[2,"직무윤리 및 투자자분쟁예방","금융소비자보호","금융소비자보호법상 청약철회권에 관한 설명으로 옳지 않은 것은?",["청약철회 시 금융상품판매업자는 철회 접수일부터 30일 이내에 금전을 반환하면 된다.","투자성 상품의 청약철회 기간은 계약서류 제공일 또는 계약체결일부터 7일 이내이다.","대출성 상품의 청약철회 기간은 14일 이내이다.","투자성 상품 중 고난도 금융투자상품 등은 청약철회 대상이 될 수 있다."],0,"[[LESSON:정답 근거｜투자성 상품의 청약을 철회하면 판매업자는 철회 접수일부터 3영업일 이내에 금전을 반환해야 한다. 청약철회 대상 투자성 상품은 고난도 금융투자상품, 고난도 투자일임·금전신탁 등이며 기간은 7일, 대출성은 14일, 보장성은 15일(청약일 30일 이내)이다.]]",2,54],[2,"직무윤리 및 투자자분쟁예방","개념응용","이해상충이 발견된 경우 가장 적절한 업무처리 순서는?",["파악·평가하고 내부통제로 낮추며, 필요 시 고지하고 해소가 어렵다면 거래를 제한한다.","숨긴 뒤 거래를 우선 실행한다.","고객 동의만 받으면 모든 거래를 실행한다.","성과가 크면 통제를 생략한다."],0,"[[LESSON:정답 근거｜이해상충은 사전 식별과 통제로 관리하고 투자자보호가 곤란하면 거래 자체를 제한해야 한다.]]",2,61],[2,"직무윤리 및 투자자분쟁예방","개념응용","직무 관련 재산상 이익 수수에 관한 판단으로 가장 적절한 것은?",["금액과 목적에 관계없이 모두 허용된다.","업무 공정성을 훼손하거나 고객 이익과 충돌할 우려가 있는 이익은 제한해야 한다.","현금이 아니면 제한 대상이 아니다.","사후 기록은 필요 없다."],1,"[[LESSON:정답 근거｜금품·편의 등 형식보다 업무 독립성과 고객 이익을 해칠 가능성을 기준으로 판단하고 관련 절차를 따라야 한다.]]",2,62],[3,"자본시장 관련 법규","공시","공개매수에 관한 설명으로 옳은 것은?",["공개매수자는 공개매수 공고 후 언제든 철회할 수 있다.","공개매수에 응모한 주주는 공개매수 기간 중 응모를 취소할 수 없다.","공개매수 기간은 10일 이상 30일 이내이다.","불특정 다수로부터 증권시장 밖에서 6개월간 10인 이상으로부터 매수해 5% 이상 보유하게 되는 경우 공개매수를 해야 한다."],3,"[[LESSON:정답 근거｜증권시장 밖에서 6개월 동안 10인 이상으로부터 매수해 본인과 특별관계자 보유가 5% 이상이 되면 공개매수가 의무다. 공개매수 기간은 20일 이상 60일 이내이며, 공개매수자는 원칙적으로 철회할 수 없다(대항공개매수 등 예외). 응모주주는 기간 중 언제든 응모를 취소할 수 있다.]]",2,66],[3,"자본시장 관련 법규","개념응용","등록된 투자권유대행인의 업무범위에 대한 설명으로 가장 적절한 것은?",["금융투자업자와 위탁관계 없이 독자적으로 계약을 체결한다.","고객 손실을 개인재산으로 보전해야 한다.","미등록 상태에서도 영업할 수 있다.","위탁받은 범위에서 투자권유를 대행하며 금전·증권을 수취해서는 안 된다."],3,"[[LESSON:정답 근거｜투자권유대행인은 등록 및 위탁 범위 안에서 권유하며 계약체결·고객재산 수취 등은 제한된다.]]",2,67],[3,"자본시장 관련 법규","투자자","전문투자자에 관한 설명으로 옳은 것은?",["주권상장법인은 장외파생상품 거래 시 별도 의사 표시가 없으면 전문투자자로 대우한다.","국가, 한국은행, 금융회사는 일반투자자 대우를 받을 수 없는 절대적 전문투자자이다.","지방자치단체는 상대적 전문투자자로서 일반투자자 대우를 요청할 수 있다.","일정 요건을 갖춘 개인 전문투자자는 금융위원회에 신고해야 한다."],2,"[[LESSON:정답 근거｜국가·한국은행·금융회사 등은 절대적 전문투자자다. 주권상장법인·지방자치단체 등 상대적 전문투자자는 일반투자자 대우를 요청할 수 있다. 주권상장법인이 장외파생상품을 거래할 때는 전문투자자 대우를 받겠다는 의사를 서면으로 통지해야 전문투자자가 된다. 개인 전문투자자는 금융투자회사가 요건을 확인해 지정한다(금융위 신고 불요).]]",2,69],[3,"자본시장 관련 법규","개념응용","투자계약증권의 판단요소로 가장 적절한 것은?",["원금이 보장되는 요구불예금","공동사업에 금전 등을 투자하고 주로 타인의 노력으로 손익을 귀속받는 계약상 권리","재화의 단순 소비계약","근로제공의 대가인 임금채권"],1,"[[LESSON:정답 근거｜공동사업에 투자하고 타인의 사업수행 결과에 따른 손익을 귀속받는 권리는 투자계약증권이 될 수 있다.]]",2,71],[3,"자본시장 관련 법규","집합투자","집합투자기구의 운용 제한에 관한 설명으로 옳지 않은 것은?",["각 집합투자기구 자산총액의 10%를 초과해 동일종목 증권에 투자할 수 없다.","국채·통안증권 등은 자산총액의 100%까지 동일종목 투자가 가능하다.","각 집합투자기구는 동일법인 발행 지분증권 총수의 20%까지 투자할 수 있다.","동일 집합투자업자가 운용하는 전체 집합투자기구 합산으로 동일법인 발행 지분증권 총수의 20%를 초과할 수 없다."],2,"[[LESSON:정답 근거｜각 집합투자기구는 동일법인 등이 발행한 지분증권 총수의 10%를 초과해 투자할 수 없고, 같은 집합투자업자의 전체 집합투자기구 합산 시 20%를 넘을 수 없다. 동일종목 투자 한도는 자산총액의 10%이며, 국채 등은 100%, 지방채·특수채 등은 30%까지 예외가 인정된다.]]",2,72],[3,"자본시장 관련 법규","공시","주식등의 대량보유보고(5% 룰)에 관한 설명으로 옳지 않은 것은?",["주권상장법인 주식등을 5% 이상 보유하게 되면 5일 이내에 보고해야 한다.","경영참가 목적으로 보고한 자는 보고 사유 발생일부터 보고일 이후 5일까지 추가 취득과 의결권 행사가 금지된다.","단순투자 목적 보유자는 어떤 경우에도 보고 의무가 면제된다.","보유비율이 1% 이상 변동되면 변동보고를 해야 한다."],2,"[[LESSON:정답 근거｜단순투자 목적이라도 대량보유보고 의무는 있으며 보고기한과 서식이 간소화될 뿐이다(일반투자 목적 10일, 단순투자 목적 다음 달 10일 등). 경영참가 목적은 5일 이내 보고, 냉각기간 동안 추가 취득·의결권 행사가 금지된다.]]",2,73],[3,"자본시장 관련 법규","공시","증권신고서 제도에 관한 설명으로 옳은 것은?",["증권신고서 효력 발생은 정부가 신고서 내용의 진실성을 보증한다는 뜻이다.","모집가액 또는 매출가액 총액이 10억원 이상이면 증권신고서를 제출해야 한다.","증권신고서는 수리된 날부터 즉시 효력이 발생한다.","50인 이상 청약 권유 산정 시 전문투자자도 포함된다."],1,"[[LESSON:정답 근거｜공모 총액 10억원 이상이면 증권신고서를 제출해야 하며, 효력발생기간(예: 지분증권 상장법인 일반공모 10영업일, 무보증사채 7영업일)이 지나야 효력이 생긴다. 50인 산정 시 전문투자자 등은 제외된다. 효력 발생은 신고서의 진실성이나 증권 가치를 정부가 보증하는 것이 아니다.]]",2,74],[3,"자본시장 관련 법규","개념응용","시세조종행위에 해당할 가능성이 가장 큰 것은?",["공개정보를 분석해 투자한다.","장기 보유 목적으로 주식을 산다.","시장가 주문의 위험을 설명한다.","실질적 소유권 변동 없이 서로 짠 계좌로 반복 매매해 거래가 활발한 것처럼 보이게 한다."],3,"[[LESSON:정답 근거｜통정·가장매매로 거래량이나 시세에 대한 그릇된 외관을 만드는 행위는 대표적 시세조종 유형이다.]]",2,75],[3,"자본시장 관련 법규","개념응용","시장질서 교란행위 규제의 의미로 가장 적절한 것은?",["형사처벌 대상이 아닌 일부 부정거래도 과징금 등으로 시장질서를 보호할 수 있게 한다.","공시된 정보의 정상적 이용을 금지한다.","모든 손실거래를 제재한다.","전문투자자는 적용에서 항상 제외한다."],0,"[[LESSON:정답 근거｜시장질서 교란행위 규제는 전통적 불공정거래 요건에 미달하는 부당한 정보이용·주문행위도 제재할 수 있게 한다.]]",2,77],[3,"한국금융투자협회 규정","투자권유","협회 규정상 투자권유 및 재산상 이익 제공에 관한 설명으로 옳은 것은?",["금융투자회사는 재산상 이익 제공 한도를 폐지하고 이사회 결의 등 내부통제 절차를 거치도록 하고 있다.","동일 거래상대방에 대한 재산상 이익 제공은 1회 20만원으로 엄격히 제한된다.","재산상 이익을 제공받는 경우 내부통제 절차는 필요 없다.","재산상 이익 제공 내역은 기록·보관 의무가 없다."],0,"[[LESSON:정답 근거｜협회 규정상 재산상 이익 제공의 1인당·회사별 금액 한도는 폐지되었고, 대신 일정 금액을 초과하는 경우 이사회 사전 의결, 인터넷 홈페이지 공시, 제공 내역 5년 기록·보관 등 내부통제를 강화했다. 수령 시에도 내부통제기준에 따라 보고해야 한다.]]",2,86],[3,"회사법","기관","이사와 이사회에 관한 설명으로 옳지 않은 것은?",["대표이사는 반드시 주주총회에서 선임해야 한다.","이사는 이사회 승인 없이 자기 또는 제3자 계산으로 회사 영업부류 거래를 할 수 없다.","자본금 10억원 미만 회사는 이사를 1명 또는 2명으로 할 수 있다.","이사의 임기는 3년을 초과하지 못한다."],0,"[[LESSON:정답 근거｜대표이사는 원칙적으로 이사회 결의로 선임하며, 정관으로 주주총회에서 선임하도록 정할 수 있다. 이사 임기는 3년 이내, 소규모회사는 이사 1-2명이 가능하고, 이사는 경업금지·회사기회유용금지·자기거래 제한 의무를 진다.NOTE:2025년 개정 상법으로 이사의 충실의무 대상에 '주주'가 추가되고 상장회사 집중투표·감사위원 분리선출 확대 등이 순차 시행 중이다. 교재가 개정 전이면 해설과 차이가 있을 수 있다.]]",2,92],[3,"회사법","개념응용","이사회의 권한으로 가장 적절한 것은?",["정관을 단독으로 변경한다.","주주총회 특별결의를 대신해 합병을 항상 확정한다.","회사의 업무집행에 관한 중요사항을 결의하고 이사의 직무집행을 감독한다.","감사의 해임을 단독 결정한다."],2,"[[LESSON:정답 근거｜이사회는 중요 업무집행을 결정하고 대표이사 등 이사의 직무집행을 감독한다.]]",2,95],[3,"증권세제","개념응용","생전 증여재산의 상속세 과세가액 가산기간에 관한 설명으로 옳은 것은?",["상속인에게 증여한 재산은 상속개시 전 5년 이내의 것만 가산한다.","상속인이 아닌 자에게 증여한 재산은 상속개시 전 10년 이내의 것만 가산한다.","상속인에게 증여한 재산은 상속개시 전 10년 이내, 상속인이 아닌 자에게 증여한 재산은 5년 이내의 것을 가산한다.","증여재산은 수증자가 누구든 상속세 과세가액에 가산하지 않는다."],2,"[[LESSON:정답 근거｜생전증여재산은 상속인에게 증여한 경우 상속개시 전 10년 이내, 상속인이 아닌 자에게 증여한 경우 5년 이내의 재산가액을 상속세 과세가액에 가산한다.]]",2,98],[3,"증권세제","개념응용","배당소득의 이중과세 조정 취지로 가장 적절한 것은?",["배당을 근로소득으로 바꾼다.","모든 배당세를 면제한다.","법인 단계와 주주 단계에서 같은 이익이 중복 과세되는 문제를 완화한다.","주식 양도손실을 자동 환급한다."],2,"[[LESSON:정답 근거｜법인세가 과세된 이익의 배당에 대해 일정한 조정을 두어 법인·주주 단계의 경제적 이중과세를 완화한다.]]",2,99],[1,"기술적 분석","개념응용","OBV(On-Balance Volume)에 관한 설명으로 옳은 것은?",["가격만으로 과매수 여부를 계산한다.","상승일 거래량은 더하고 하락일 거래량은 빼 거래량 흐름을 누적한다.","단기이동평균과 장기이동평균의 차이다.","고가·저가·종가의 표준편차만 이용한다."],1,"[[LESSON:정답 근거｜OBV는 가격 등락 방향에 따라 거래량을 가감해 수급 흐름과 가격 추세의 확인·괴리를 살핀다.]]",3,13],[1,"기술적 분석","적중","차트분석에 대한 설명이다. 옳은 것은?",["전일종가 보다 당일종가가 높을 때를 양선(양봉)이라 고 한다.","미국식 차트는 시가, 고가, 저가, 종가, 모두 표시한 다.","점수도표는 매일매일의 주가변화 그대로를 나타낸다.","선차트는 매일의 종가를 직선으로 연결한 도표이다."],3,"[[LESSON:정답 근거｜선차트는 각 거래일의 종가를 직선으로 연결한 도표이다.]]",3,15],[1,"유가증권시장","복합판단","다음 호가의 매매체결 우선순위를 바르게 설명한 것은? [[BOX:같은 종목의 매도호가 A: 10,000원·09:00:01 접수||매도호가 B: 9,900원·09:00:03 접수||매도호가 C: 9,900원·09:00:02 접수]]",["C → B → A","A → B → C","B → C → A","A → C → B"],0,"[[LESSON:정답 근거｜매도호가는 낮은 가격이 우선이고 같은 가격에서는 먼저 접수된 C가 B보다 앞선다.]]",3,18],[1,"코스닥시장","개념응용","코스닥시장의 기술성장기업 상장특례 취지로 가장 적절한 것은?",["현재 이익 규모만으로 모든 기업을 평가한다.","공시의무를 전부 면제한다.","기술성과 성장성이 있으나 이익요건 충족이 어려운 기업에 별도 심사경로를 제공한다.","상장 뒤 주가 하락을 거래소가 보전한다."],2,"[[LESSON:정답 근거｜기술상장특례는 현재 재무성과만으로 포착하기 어려운 기술력과 성장성을 별도 평가해 상장기회를 제공한다.]]",3,26],[1,"채권시장","개념응용","다른 조건이 같은 두 채권 중 볼록성이 큰 채권에 대한 설명으로 옳은 것은?",["금리 하락 시 가격상승폭이 더 작고 금리 상승 시 가격하락폭이 더 크다.","금리 변화와 가격 변화가 항상 정비례한다.","듀레이션이 0이 된다.","금리 하락 시 가격상승폭이 더 크고 금리 상승 시 가격하락폭이 더 작다."],3,"[[LESSON:정답 근거｜양(+)의 볼록성이 클수록 같은 금리변화에서 상승 이점은 커지고 하락 손실은 완화된다.]]",3,27],[1,"채권시장","복합판단","수익률곡선의 큰 변화에 대비한 포트폴리오 구조 설명으로 옳은 것은? [[BOX:(가) 만기가 중간 구간에 집중된 포트폴리오||(나) 단기채와 장기채에 비중을 나누어 둔 포트폴리오]]",["(가) 불릿 · (나) 바벨","(가) 바벨 · (나) 불릿","(가) 래더 · (나) 불릿","(가) 바벨 · (나) 래더"],0,"[[LESSON:정답 근거｜중간 만기에 집중하면 불릿, 단기와 장기 양끝에 배분하면 바벨 전략이다.]]",3,29],[1,"채권시장","계산응용","1년 현물이자율이 4%, 2년 현물이자율이 연 5%일 때 복리 기준 1년 후부터 1년간의 선도이자율에 가장 가까운 것은?",["4.0%","6.0%","5.0%","10.0%"],1,"[[LESSON:정답 근거｜(1.05)^2=(1.04)(1+f)이므로 f는 약 6.0%다.]]",3,31],[1,"채권시장","개념응용","경과이자에 관한 설명으로 옳은 것은?",["채권의 액면가와 항상 같다.","무이표채에만 존재한다.","직전 이자지급일부터 결제일까지 발생한 이자에 해당한다.","매매수익률과 무관하므로 결제금액에 반영되지 않는다."],2,"[[LESSON:정답 근거｜이표채 매매 시 매수자는 직전 지급일 이후 누적된 이자 상당액을 매도자에게 보전한다.]]",3,33],[1,"기타 증권시장","개념응용","K-OTC시장에 관한 설명으로 가장 적절한 것은?",["비상장주식의 장외거래를 일정한 규칙 아래 중개하는 시장이다.","거래소 유가증권시장과 동일한 상장시장이다.","모든 비상장주식이 자동으로 거래된다.","원금보장 상품만 거래된다."],0,"[[LESSON:정답 근거｜K-OTC는 비상장주식 거래의 투명성과 편의성을 높이기 위해 운영되는 제도권 장외시장이다.]]",3,34],[2,"금융상품분석","개념응용","상장리츠(REITs)의 일반적 특성으로 옳은 것은?",["채권자만 투자할 수 있다.","부동산 관련 자산에   card.classList.toggle('is-ok',ok);card.classList.toggle('is-bad',done&&!ok);
  card.querySelectorAll('.opt').forEach(o=>{const j=+o.dataset.j;o.disabled=done;
    o.classList.toggle('correct',done&&j===x.a);o.classList.toggle('wrong',done&&j===ch&&ch!==x.a);
    let m=o.querySelector('.mark');if(m)m.remove();
    if(done&&(j===x.a||j===ch)){m=document.createElement('span');m.className='mark';m.textContent=j===x.a?(j===ch?'정답 · 내 선택':'정답'):'내 선택';o.appendChild(m)}});
  card.querySelector('.explain').classList.toggle('show',done||expand);
  const r=card.querySelector('.result');r.textContent=done?(ok?'정답입니다.':`오답입니다. 내 선택 ${MARK[ch]}`):'정답 미리보기';r.className='result '+(done?(ok?'ok':'bad'):'peek');
  card.querySelector('.ans').textContent='정답 '+MARK[x.a];
}
function tally(s){const id=idxOf(s);const a=id.filter(i=>saved[i]!==undefined).length,c=id.filter(i=>saved[i]===Q[i].a).length;return{n:id.length,a,c,w:a-c}}
function stats(){['all',...SUBS].forEach(s=>{const t=tally(s),L=limit(s),el=$('pb-'+s);
  const st=t.w>L?'red':t.w===L?'yel':'grn';el.className='pb '+st;
  el.querySelector('.bar>span').style.width=(t.a/t.n*100)+'%';el.querySelector('.bar').setAttribute('aria-valuenow',Math.round(t.a/t.n*100));
  el.querySelector('.st').textContent=`${t.a}/${t.n} · 오답 ${t.w}/${L}${st==='red'?(s==='all'?' 불합격':' 과락'):st==='yel'?' 경계':''}`;})}
function visible(i){const x=Q[i];if(x.set!==setFilter)return false;if(filter!=='all'&&x.s!==+filter)return false;if(wrongOnly&&!(saved[i]!==undefined&&saved[i]!==x.a))return false;return true}
function applyFilter(){let n=0;Q.forEach((x,i)=>{const v=visible(i);$('q'+i).classList.toggle('hidden',!v);if(v)n++});$('empty').classList.toggle('hidden',n>0)}
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const i=+b.closest('.qcard').dataset.i;if(saved[i]!==undefined)return;saved[i]=+b.dataset.j;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}paint(i);stats();if(!$('gradeBox').classList.contains('hidden'))grade(false)}));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');setFilter=+t.dataset.set;filter='all';applyFilter()}));
$('wrongBtn').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);e.currentTarget.textContent=wrongOnly?'전체 문항 보기':'오답만 보기';applyFilter()};
$('expBtn').onclick=e=>{expand=!expand;e.currentTarget.setAttribute('aria-pressed',expand);e.currentTarget.textContent=expand?'해설 전체 접기':'해설 전체 펼치기';Q.forEach((_,i)=>paint(i))};
$('resetBtn').onclick=()=>{if(!confirm('응답 기록을 모두 초기화할까요?'))return;saved={};try{localStorage.removeItem(KEY)}catch(e){}Q.forEach((_,i)=>paint(i));stats();$('gradeBox').classList.add('hidden');applyFilter();scrollTo({top:0,behavior:'smooth'})};
function grade(scroll=true){
  const box=$('gradeBox'),T=tally('all');let pass=T.c>=Math.ceil(T.n*0.7-1e-9);
  const rows=SUBS.map(s=>{const t=tally(s),need=Math.ceil(t.n*0.5-1e-9),okS=t.c>=need;if(!okS)pass=false;
    const chs=[...new Set(idxOf(s).map(i=>Q[i].ch))].map(ch=>{const id=idxOf(s).filter(i=>Q[i].ch===ch),k=id.filter(i=>saved[i]===Q[i].a).length;return `${esc(ch)} ${k}/${id.length}`}).join(' · ');
    return `<div class="chrow"><span><b>제${s}과목</b><br><small>${SUBJ[s]}</small></span><div class="mini"><i style="width:${t.c/t.n*100}%;background:${okS?'var(--ok)':'var(--bad)'}"></i></div><span class="val">${t.c} / ${t.n} (${Math.round(t.c/t.n*100)}%) ${okS?'통과':'과락'}</span></div><div style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">${chs}</div>`}).join('');
  const wrong=Q.map((q,i)=>i).filter(i=>saved[i]!==undefined&&saved[i]!==Q[i].a);
  box.innerHTML=`<h2>채점 요약<span class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</span></h2><div class="score-big">${T.c}점<small>${T.c} / ${T.n} 정답 · 풀이 ${T.a} · 미풀이 ${T.n-T.a}(오답 처리)</small></div><div style="margin-top:14px">${rows}</div>`+
    (wrong.length?`<div class="wrongs"><b>틀린 문항</b><br>${wrong.map(i=>`<a data-go="${i}">Q${String(i+1).padStart(2,'0')}</a>`).join('')}</div>`:'');
  box.classList.remove('hidden');
  box.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{filter='all';wrongOnly=false;$('wrongBtn').setAttribute('aria-pressed','false');$('wrongBtn').textContent='오답만 보기';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',+t.dataset.set===setFilter));applyFilter();$('q'+a.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})});
  if(scroll)box.scrollIntoView({behavior:'smooth',block:'center'});
}
$('gradeBtn').onclick=()=>grade(true);
Q.forEach((_,i)=>paint(i));stats();applyFilter();
</script>
</body>
</html>
