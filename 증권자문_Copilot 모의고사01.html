<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>증권자문 Copilot 모의고사01 - 증권투자권유자문인력</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#697286;--pri:#3f5efb;--pri2:#7b61ff;--ok:#13a66b;--bad:#db3a34;--yel:#e0a800;--line:#e5e8f0;--soft:#eef2ff;--warn:#fff6df;--warn-line:#f1dc9a;--warn-ink:#5b4a17;--ok-bg:#eafaf3;--ok-line:rgba(19,166,107,.4);--bad-bg:#fff0ef;--bad-line:rgba(219,58,52,.4);--stem:#f8fafc;--hover:#fafbff;--hover-line:#b8c2ff;--pill:#f2f4f8;--pill-ink:#5b6478;--head:rgba(255,255,255,.94);--shadow:0 8px 22px rgba(23,32,51,.05)}
html[data-theme=dark]{color-scheme:dark;--bg:#12131a;--card:#1b1d27;--ink:#eceef6;--muted:#a3a9bb;--pri:#8ea2ff;--pri2:#b39dff;--ok:#4cd694;--bad:#ff8782;--yel:#f5c84c;--line:#32364a;--soft:#262b4a;--warn:#2d2815;--warn-line:#5f5222;--warn-ink:#ecdca3;--ok-bg:#12301f;--ok-line:rgba(76,214,148,.5);--bad-bg:#3a1b1d;--bad-line:rgba(255,135,130,.5);--stem:#20232f;--hover:#232638;--hover-line:#5a67b8;--pill:#262a39;--pill-ink:#b6bdd0;--head:rgba(27,29,39,.94);--shadow:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:15px;line-height:1.65;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:12px 20px;width:100%}
.pgrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px}
.pb{min-width:0}.pb .lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.pb .lab b{color:var(--ink)}.pb .lab .st{overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;width:0;background:var(--ok);transition:width .25s,background .25s}
.pb.yel .bar>span{background:var(--yel)}.pb.red .bar>span{background:var(--bad)}
.pb.yel .lab .st{color:var(--yel)}.pb.red .lab .st{color:var(--bad)}.pb.grn .lab .st{color:var(--ok)}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.tab small{margin-left:4px;opacity:.75;font-weight:800}
.tab.active{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .tab.active{color:#10131f}
button:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
.hero{padding:26px 20px 6px}
.badge{display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:800;font-size:13px}
.hero h1{font-size:30px;letter-spacing:-.04em;margin:12px 0 8px;line-height:1.25}
.hero p{margin:0;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.sumcard b{display:block;font-size:22px;line-height:1.25}.sumcard span{color:var(--muted);font-size:13px}
.sumcard.total{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0}.sumcard.total b,.sumcard.total span{color:#fff}
.note{margin-top:14px;background:var(--warn);border:1px solid var(--warn-line);border-radius:16px;padding:13px 16px;color:var(--warn-ink);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .btn.primary{color:#10131f}
.btn[aria-pressed=true]{border-color:var(--pri);color:var(--pri);background:var(--soft)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:16px 0;padding:22px;box-shadow:var(--shadow);scroll-margin-top:170px;min-width:0;overflow-wrap:anywhere}
.qcard.is-ok{border-left:5px solid var(--ok)}.qcard.is-bad{border-left:5px solid var(--bad)}
.qtop{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--pill);color:var(--pill-ink);font-weight:700}
.pill.sj{background:var(--pri);color:#fff}html[data-theme=dark] .pill.sj{color:#10131f}
.pill.ch{background:var(--soft);color:var(--pri)}
.num{font-weight:900;color:var(--pri);flex:none}
.q{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px;line-height:1.55}
.opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);transition:.15s;min-width:0}
.opt span.t{min-width:0;flex:1}
.opt b{flex:none;color:var(--pri)}
.opt:hover:not(:disabled){border-color:var(--hover-line);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}.opt.correct b{color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}.opt.wrong b{color:var(--bad)}
.opt .mark{flex:none;font-size:12px;font-weight:900}
.opt.correct .mark{color:var(--ok)}.opt.wrong .mark{color:var(--bad)}
.explain{display:none;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--stem);border:1px solid var(--line)}
.explain.show{display:block}
.result{font-weight:900;margin-bottom:6px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.result.peek{color:var(--pri)}
.ans{font-weight:800;margin-bottom:6px}
.src{margin-top:10px;padding:10px 12px;border-left:3px solid var(--warn-line);background:var(--warn);color:var(--warn-ink);border-radius:8px;font-size:13.5px}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-width:100%;overflow-x:auto;font-family:"Cambria Math","Times New Roman",serif;font-size:16px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.frac .top{border-bottom:1.5px solid currentColor;padding:0 4px;line-height:1.3}.frac .bottom{padding:0 4px;line-height:1.3}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.gradebox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.gradebox h2{margin:0 0 6px;font-size:20px}
.verdict{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px;margin-left:8px;vertical-align:middle}
.verdict.pass{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}.verdict.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.score-big{font-size:34px;font-weight:900;color:var(--pri);letter-spacing:-.03em}
.score-big small{font-size:15px;color:var(--muted);font-weight:700;margin-left:6px}
.chrow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.chrow .mini{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.chrow .mini i{display:block;height:100%}
.chrow .val{font-weight:800;white-space:nowrap}
.wrongs{margin-top:14px}.wrongs a{display:inline-block;margin:3px 6px 3px 0;padding:3px 10px;border-radius:999px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
.hidden{display:none!important}
main{padding-bottom:50px}
@media(max-width:820px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.hero h1{font-size:24px}.wrap,.hero{padding-left:14px;padding-right:14px}.qcard{padding:17px;border-radius:18px;scroll-margin-top:200px}.q{font-size:16px}.chrow{grid-template-columns:110px minmax(0,1fr);}.chrow .val{grid-column:1/-1}}
@media print{header,.controls{display:none}.explain{display:block!important}.qcard{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="pgrid"><div class="bars" id="bars"></div><button class="theme" id="theme" type="button"></button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="과목 필터"></div>
</div></header>
<section class="hero wrap">
  <span class="badge">실전·최고난도 100문항</span>
  <h1>증권투자권유자문인력<br>Copilot 모의고사 01</h1>
  <p>선택지를 누르면 정답 여부와 해설이 바로 열리고, 풀이 기록은 이 기기에 저장됩니다.</p>
  <div class="summary" id="summary"></div>
  <div class="note"><b>합격 기준</b><br>과목별 정답률 50% 이상, 총점 70% 이상이어야 합격입니다. 미풀이 문항은 오답으로 처리합니다. 상단 막대는 오답이 과락 경계에 도달하면 <b>노란색</b>, 경계를 넘으면 <b>빨간색</b>으로 바뀝니다.</div>
  <div class="controls">
    <button class="btn" id="wrongBtn" type="button" aria-pressed="false">오답만 보기</button>
    <button class="btn" id="expBtn" type="button" aria-pressed="false">해설 전체 펼치기</button>
    <button class="btn primary" id="gradeBtn" type="button">채점 요약 보기</button>
    <button class="btn" id="resetBtn" type="button">기록 초기화</button>
  </div>
</section>
<main class="wrap">
  <div id="questions"></div>
  <div class="empty hidden" id="empty">조건에 맞는 문항이 없습니다.</div>
  <div class="gradebox hidden" id="gradeBox"></div>
</main>
<script>
const RAW=[[1, "경기분석", "개념", "경기순환에 관한 설명으로 옳지 않은 것은?", ["진폭은 정점과 저점 간 경제활동 수준의 차이로 측정한다.", "경기순환의 주기는 저점에서 다음 저점까지 또는 정점에서 다음 정점까지의 기간이다.", "우리나라 기준순환일은 통계청이 경기선행지수의 전환점만으로 결정한다.", "확장국면은 저점에서 정점까지, 수축국면은 정점에서 저점까지이다."], 2, "기준순환일은 통계청이 경기종합지수(특히 동행지수 순환변동치), 개별 구성지표, 경제 전문가 의견 등을 종합해 사후적으로 설정한다. 선행지수는 전환점을 미리 예고하는 보조 지표일 뿐 기준순환일 결정 근거가 아니다. 주기·국면·진폭의 정의는 나머지 보기의 설명과 같다."], [1, "경기분석", "지표", "경기종합지수(CI)의 구성지표 분류로 옳은 것은?", ["동행지수 - 비농림어업취업자수", "후행지수 - 경제심리지수", "선행지수 - 광공업생산지수", "동행지수 - 코스피(KOSPI)"], 0, "동행종합지수는 비농림어업취업자수, 광공업생산지수, 서비스업생산지수, 소매판매액지수, 내수출하지수, 건설기성액, 수입액으로 구성된다. 코스피와 경제심리지수는 선행지수, 광공업생산지수는 동행지수 구성지표다. 후행지수에는 취업자수, 생산자제품재고지수, 소비자물가지수변화율(서비스), 소비재수입액, CP유통수익률이 포함된다."], [1, "경기분석", "계산", "전체 조사 업체 200곳 중 경기 호전 응답 90곳, 악화 응답 70곳, 불변 40곳일 때 기업경기실사지수(BSI)는?", ["90", "110", "45", "120"], 1, "BSI = (긍정 응답 업체 수 − 부정 응답 업체 수) / 전체 응답 업체 수 × 100 + 100 이다. (90 − 70) / 200 × 100 + 100 = 110. BSI가 100을 넘으면 경기를 긍정적으로 보는 업체가 많다는 뜻이며 0-200 범위를 가진다. 불변 응답은 분자에는 영향을 주지 않지만 분모에는 포함된다."], [1, "경기분석", "이론", "경기변동이론에 관한 설명으로 옳은 것은?", ["실물경기변동이론(RBC)은 화폐적 충격을 경기변동의 주된 원인으로 본다.", "새고전학파(루카스)는 예상치 못한 통화량 변화가 불완전 정보로 인해 일시적 경기변동을 일으킨다고 본다.", "새케인즈학파는 임금과 가격이 완전 신축적이라고 가정한다.", "통화주의는 재정정책이 통화정책보다 효과적이라고 본다."], 1, "루카스의 화폐적 균형경기변동이론은 합리적 기대를 가정하되 경제주체가 일반물가와 상대가격 변화를 구분하지 못하는 불완전 정보 때문에 예상치 못한 통화충격이 일시적으로 산출에 영향을 준다고 본다. RBC는 기술충격 같은 실물적 충격을, 새케인즈학파는 메뉴비용 등에 따른 가격·임금 경직성을 강조한다. 통화주의는 재량적 재정정책보다 준칙에 따른 통화정책을 중시한다."], [1, "경기분석", "정책", "IS-LM 모형에서 투자의 이자율 탄력성이 0이고 LM곡선이 우상향하는 경우에 관한 설명으로 옳은 것은?", ["통화정책은 효과가 없고 재정정책은 구축효과 없이 효과가 크다.", "유동성함정과 동일한 상황으로 LM곡선이 수평이다.", "통화정책은 매우 효과적이며 재정정책은 효과가 없다.", "두 정책 모두 효과가 없다."], 0, "투자의 이자율 탄력성이 0이면 IS곡선이 수직이 된다. 이 경우 통화량 증가로 이자율이 하락해도 투자가 늘지 않아 통화정책은 무력하고, 재정지출 증가로 이자율이 올라도 투자가 감소하지 않아 구축효과가 발생하지 않는다. 유동성함정은 LM곡선이 수평인 상황으로, 원인은 다르지만 결과적으로 재정정책이 효과적이라는 점은 같다."], [1, "경기분석", "정책", "통화정책의 파급경로에 관한 설명으로 옳지 않은 것은?", ["금리경로는 정책금리 변경이 시장금리를 거쳐 소비·투자에 영향을 주는 경로이다.", "환율경로에서 정책금리 인상은 일반적으로 자국통화 약세를 유발해 순수출을 늘린다.", "자산가격경로에는 토빈의 q와 부(富)의 효과가 포함된다.", "신용경로는 은행 대출 공급의 변화가 실물경제에 영향을 주는 경로이다."], 1, "정책금리를 인상하면 내외금리차 확대로 자본이 유입되어 자국통화가 절상(강세)되고, 수출가격 경쟁력이 낮아져 순수출이 감소하는 것이 일반적인 환율경로다. 금리경로, 자산가격경로(토빈의 q, 부의 효과), 신용경로(은행대출경로·대차대조표경로), 기대경로가 통화정책의 주요 파급경로다."], [1, "기본적 분석", "재무비율", "A사의 매출액순이익률 5%, 총자산회전율 1.6회, 부채비율 150%일 때 듀퐁분석에 의한 ROE는?", ["20%", "12%", "16%", "8%"], 0, "ROE = 매출액순이익률 × 총자산회전율 × (총자산/자기자본) 이다. 부채비율이 150%이면 부채 = 1.5 × 자기자본, 총자산 = 2.5 × 자기자본이므로 재무레버리지는 2.5배다. 5% × 1.6 × 2.5 = 20%. 부채비율을 그대로 곱하는 실수(5%×1.6×1.5=12%)를 노린 함정에 주의한다."], [1, "기본적 분석", "평가모형", "B사의 올해 주당배당금(D₀)은 1,000원, 배당성장률은 5%로 영구히 일정하고 요구수익률은 10%이다. 정률성장배당할인모형에 의한 적정주가는?", ["21,000원", "20,000원", "10,000원", "22,050원"], 0, "[[P₀ = |D₁|k − g]] 이고 D₁ = D₀ × (1 + g) = 1,000 × 1.05 = 1,050원이다. P₀ = 1,050 / (0.10 − 0.05) = 21,000원. D₀를 그대로 넣으면 20,000원이 나오므로 반드시 다음 기 배당(D₁)으로 환산해야 한다. 모형은 k > g일 때만 성립한다."], [1, "기본적 분석", "평가모형", "PER 평가모형에 관한 설명으로 옳지 않은 것은?", ["이익의 질이 낮거나 일시적 이익이 포함되면 PER의 신뢰성이 떨어진다.", "다른 조건이 같다면 배당성향이 높을수록 이론적 PER은 항상 높아진다.", "다른 조건이 같다면 요구수익률이 높을수록 이론적 PER은 낮아진다.", "적자기업은 PER 평가모형을 적용하기 어렵다."], 1, "고든모형에서 PER = (1 − b) / (k − g), g = b × ROE 이다. 배당성향을 높이면 분자는 커지지만 유보율 b가 줄어 성장률 g도 낮아진다. 따라서 ROE > k이면 배당성향 증가가 오히려 PER을 낮추고, ROE < k일 때만 PER을 높인다. '항상'이라는 표현이 틀린 이유다."], [1, "기본적 분석", "평가모형", "EV/EBITDA 비율에 관한 설명으로 옳은 것은?", ["EV는 주식 시가총액에서 순차입금을 차감한 값이다.", "감가상각 방법의 차이에 따른 이익 왜곡을 줄일 수 있다.", "자본구조가 다른 기업 간 비교에는 PER보다 불리하다.", "EBITDA가 음(−)인 기업에도 의미 있게 적용된다."], 1, "EV(기업가치) = 시가총액 + 순차입금(총차입금 − 현금성자산)이다. EBITDA는 이자·세금·감가상각비 차감 전 이익이므로 감가상각 방법·세율·자본구조 차이의 영향을 덜 받아 기업 간 비교에 유리하다. EBITDA가 음수이면 비율 해석이 불가능하다."], [1, "기본적 분석", "계산", "ROE 15%, 요구수익률 12%, 사내유보율 40%인 기업의 PBR(정상 PBR, 고든모형 가정)은?", ["1.75배", "1.0배", "1.25배", "1.5배"], 3, "PBR = (ROE − g) / (k − g), g = b × ROE = 0.4 × 15% = 6%. PBR = (15% − 6%) / (12% − 6%) = 9 / 6 = 1.5배. ROE가 요구수익률보다 높으면 PBR은 1보다 크고, 낮으면 1보다 작다. 즉 PBR은 자기자본을 요구수익률 이상으로 운용하는 능력을 반영한다."], [1, "기술적 분석", "이론", "다우이론의 강세시장 3국면 중 일반투자자가 시장에 가장 활발히 참여하며 전문투자자가 매도로 대응하는 국면은?", ["과열국면", "매집국면", "상승국면", "분산국면"], 0, "다우이론의 강세시장은 매집국면(전문투자자 매수) → 상승국면(기술적 분석가 수익 극대화) → 과열국면(일반투자자 과열 참여, 전문투자자 매도)으로 진행된다. 약세시장은 분산국면 → 공포국면 → 침체국면이다. 분산국면은 약세시장의 첫 단계로 전문투자자가 이익을 실현하는 시기다."], [1, "기술적 분석", "이론", "엘리엇 파동이론의 절대불가침 법칙으로 옳지 않은 것은?", ["2번 파동의 저점은 1번 파동의 시작점보다 낮을 수 없다.", "4번 파동의 저점은 1번 파동의 고점과 겹칠 수 없다.", "5번 파동은 반드시 3번 파동보다 길어야 한다.", "3번 파동은 1·3·5번 충격파동 중 가장 짧을 수 없다."], 2, "엘리엇 파동이론의 3대 절대법칙은 ① 2번 파동은 1번 파동의 시작점 아래로 내려갈 수 없고, ② 3번 파동은 충격파동 중 가장 짧을 수 없으며, ③ 4번 파동은 1번 파동과 겹칠 수 없다는 것이다. 5번 파동의 길이에 관한 절대규칙은 없으며 연장(extension)은 주로 3번 파동에서 나타난다."], [1, "기술적 분석", "지표", "보조지표에 관한 설명으로 옳은 것은?", ["RSI가 30 이하이면 과매수, 70 이상이면 과매도 구간으로 해석한다.", "MACD는 단기 지수이동평균에서 장기 지수이동평균을 뺀 값이다.", "OBV는 가격을 이용해 매매강도를 측정하는 추세지표로 거래량을 사용하지 않는다.", "스토캐스틱 %K는 최근 n일 고가와 저가의 차이를 당일 종가로 나눈 값이다."], 1, "MACD = 단기 EMA − 장기 EMA이며, MACD의 지수이동평균인 시그널선과의 교차로 매매시점을 판단한다. RSI는 70 이상이 과매수, 30 이하가 과매도다. OBV는 상승일 거래량을 더하고 하락일 거래량을 빼는 거래량 지표다. %K = (당일 종가 − n일 최저가) / (n일 최고가 − n일 최저가) × 100이다."], [1, "기술적 분석", "패턴", "반전형 패턴에 해당하지 않는 것은?", ["원형천장형", "깃발형(Flag)", "이중천장형(M자형)", "헤드앤숄더형"], 1, "깃발형·페넌트형·삼각형·쐐기형·직사각형은 기존 추세가 잠시 쉬었다가 같은 방향으로 이어지는 지속형 패턴이다. 헤드앤숄더, 이중천장·이중바닥, 삼중천장·바닥, 원형천장·바닥, V자형은 추세 전환을 예고하는 반전형 패턴이다."], [1, "유가증권시장", "발행시장", "증권의 발행방법에 관한 설명으로 옳은 것은?", ["모집주선(위탁모집)에서는 인수인이 미청약분을 인수한다.", "직접발행은 반드시 금융투자회사를 통해야 한다.", "잔액인수는 인수인이 발행회사를 대신해 모집만 주선하고 미청약분은 발행회사가 부담한다.", "총액인수는 인수인이 발행 총액을 매입하고 발행위험을 전부 부담한다."], 3, "총액인수는 인수단이 전량을 매입한 뒤 투자자에게 매출하므로 발행·판매 위험을 모두 부담한다. 잔액인수는 모집 후 남은 잔량만 인수하는 방식이며, 모집주선은 인수인이 주선만 하고 미청약분 위험은 발행회사가 진다. 직접발행은 발행회사가 직접 모집하는 방식이다."], [1, "유가증권시장", "발행시장", "유상증자 시 신주 발행가액 결정에 관한 설명으로 옳지 않은 것은?", ["주주배정 유상증자의 발행가액은 자유롭게 정할 수 있다.", "일반공모 유상증자는 기준주가에 30% 이내 할인율을 적용할 수 있다.", "제3자배정 유상증자의 할인율은 10% 이내이다.", "일반공모 유상증자의 할인율 한도는 50% 이내이다."], 3, "상장법인의 유상증자 발행가액은 기준주가 대비 일반공모 30% 이내, 제3자배정 10% 이내 할인율을 적용한다. 주주배정과 주주우선공모는 발행가액을 자유롭게 정할 수 있다. 50%라는 할인율 한도는 존재하지 않는다.[[NOTE:2026년 10월 기준 증권의 발행 및 공시 등에 관한 규정상 할인율이다. 개별 상장법인 정관이나 규정 개정 여부는 교재 최신판과 대조한다.]]"], [1, "유가증권시장", "매매", "유가증권시장의 매매체결에 관한 설명으로 옳은 것은?", ["시간외 단일가매매는 16:00-18:00까지 30분 단위로 체결된다.", "시가 결정을 위한 단일가매매 호가접수 시간은 08:00-09:00이다.", "종가 결정을 위한 단일가매매 호가접수 시간은 15:00-15:30이다.", "정규시장 매매거래시간은 09:00-15:30이다."], 3, "정규시장은 09:00-15:30이며, 시가 단일가 호가접수는 08:30-09:00, 종가 단일가 호가접수는 15:20-15:30이다. 시간외 단일가매매는 16:00-18:00 동안 10분 단위로 체결된다. 장 개시 전 시간외 종가매매는 08:30-08:40, 장 종료 후 시간외 종가매매는 15:40-16:00이다.[[NOTE:2025년 출범한 대체거래소(넥스트레이드)는 08:00-20:00 프리·메인·애프터마켓을 운영한다. 한국거래소 시간과 혼동하지 않는다.]]"], [1, "유가증권시장", "시장관리", "유가증권시장의 가격제한폭과 시장안정화 장치에 관한 설명으로 옳지 않은 것은?", ["변동성완화장치(VI)는 시장 전체의 매매거래를 20분간 정지시키는 제도이다.", "서킷브레이커는 코스피지수가 전일 대비 8%, 15%, 20% 이상 하락하는 경우 단계적으로 발동된다.", "가격제한폭은 기준가격 대비 상하 30%이다.", "사이드카는 코스피200선물 가격이 기준가 대비 5% 이상 변동해 1분간 지속되는 경우 발동된다."], 0, "VI(변동성완화장치)는 개별종목 가격이 일정 범위를 벗어나면 2분간 단일가매매로 전환해 냉각기간을 부여하는 종목 단위 장치다. 시장 전체를 20분간 정지시키는 것은 서킷브레이커(1·2단계)다. 사이드카는 프로그램매매 호가 효력을 5분간 정지한다."], [1, "유가증권시장", "공시", "공시제도에 관한 설명으로 옳은 것은?", ["자율공시 사항은 공시하더라도 불성실공시 제재 대상이 될 수 없다.", "공정공시는 중요정보를 특정인에게 선별 제공하기 전에 모든 시장참가자에게 공시하도록 하는 제도이다.", "주요사항보고서는 거래소에 제출하는 수시공시의 일종이다.", "조회공시 요구에 대한 답변 기한은 풍문 관련 시 요구시점이 오전이면 다음 날 오전까지이다."], 1, "공정공시는 중요정보를 애널리스트·기관 등 특정인에게 선별 제공하려는 경우 그 이전에 시장에 공시하도록 하여 정보 비대칭을 막는 제도다. 조회공시는 요구시점이 오전이면 당일 오후, 오후면 다음 날 오전까지 답변해야 한다. 자율공시도 공시 후 번복하면 불성실공시가 된다. 주요사항보고서는 자본시장법에 따라 금융위원회에 제출하는 발행공시·유통공시다."], [1, "유가증권시장", "시장관리", "신용거래와 공매도에 관한 설명으로 옳은 것은?", ["신용거래로 매수한 주식은 담보로 제공되지 않는다.", "공매도 호가는 직전가격보다 낮은 가격으로도 자유롭게 제출할 수 있다.", "무차입공매도는 원칙적으로 금지되며 차입공매도는 업틱룰(직전가 이하 호가 제한) 등의 규제를 받는다.", "신용거래융자의 담보유지비율은 법령상 일률적으로 200%로 정해져 있다."], 2, "자본시장법상 무차입공매도는 금지되며, 차입공매도는 원칙적으로 직전가격 이하로 호가할 수 없는 가격제한(업틱룰)을 적용받는다. 신용거래 담보유지비율은 140% 이상에서 회사별로 정하며, 신용매수 주식은 융자의 담보가 된다.[[NOTE:공매도는 2023년 11월-2025년 3월 전면 금지 후 2025년 3월 31일 전면 재개되었고, 기관·개인 담보비율 통일, 불법공매도 전산시스템(NSDS) 의무화 등이 반영되었다. 교재가 금지 기간 기준이면 현재 기준으로 갱신해 학습한다.]]"], [1, "유가증권시장", "결제", "증권시장의 청산·결제에 관한 설명으로 옳지 않은 것은?", ["결제방식은 차감결제가 원칙이다.", "한국거래소는 중앙거래당사자(CCP)로서 매도자와 매수자 사이에서 채무를 인수한다.", "결제는 거래소가 직접 증권과 대금의 계좌대체를 수행하며 예탁결제원은 관여하지 않는다.", "유가증권시장의 보통거래 결제일은 매매체결일로부터 2거래일째(T+2)이다."], 2, "거래소는 CCP로서 청산(채무인수·차감·확정)을 담당하고, 결제기관인 한국예탁결제원이 증권 계좌대체와 대금 이체를 처리한다. 보통거래는 T+2 결제, 차감결제와 집중결제가 원칙이다."], [1, "유가증권시장", "상장", "상장폐지와 관리종목에 관한 설명으로 옳은 것은?", ["관리종목으로 지정되면 즉시 매매거래가 영구 정지된다.", "상장폐지가 결정되면 정리매매 기간 없이 즉시 상장이 폐지된다.", "주가가 액면가의 20%에 미달하는 상태가 1일만 있어도 상장폐지된다.", "감사인의 감사의견이 '부적정' 또는 '의견거절'인 경우 상장폐지 사유에 해당한다."], 3, "감사의견 부적정·의견거절은 형식적 상장폐지 사유다(유가증권시장 기준 반기 한정 등은 관리종목 사유). 관리종목 지정은 투자주의 환기 조치이며 매매는 계속된다. 상장폐지 결정 후에는 투자자 환금 기회 보장을 위해 7매매일의 정리매매 기간을 둔다.[[NOTE:2026년 상장폐지 요건 강화(시가총액·매출액 기준 상향, 개선기간 단축)가 단계적으로 시행 중이다. 수치형 요건은 시험 직전 거래소 규정으로 재확인한다.]]"], [1, "유가증권시장", "매매", "호가의 종류에 관한 설명으로 옳지 않은 것은?", ["최유리지정가호가는 상대방 최우선호가 가격으로 지정되는 호가이다.", "조건부지정가호가는 장 종료 단일가매매 시까지 미체결 시 시장가호가로 전환된다.", "시장가호가는 종목과 수량만 지정하고 가격은 지정하지 않는다.", "최우선지정가호가는 상대방 최우선호가 가격으로 즉시 체결을 지향한다."], 3, "최우선지정가호가는 자기 방향(매도는 최우선 매도호가, 매수는 최우선 매수호가)의 최우선 가격으로 지정되는 호가로, 대기 성격이 강하다. 상대방 최우선호가 가격으로 지정되어 즉시 체결을 지향하는 것은 최유리지정가호가다. 두 호가의 차이는 자주 출제되는 함정이다."], [1, "코스닥시장", "상장", "코스닥시장 상장제도에 관한 설명으로 옳은 것은?", ["코스닥 상장기업은 유가증권시장 이전상장이 금지된다.", "코스닥시장에는 이익미실현기업의 상장 경로가 존재하지 않는다.", "코스닥시장은 상장심사 시 질적 심사를 하지 않는다.", "기술특례상장은 전문평가기관 두 곳의 기술평가에서 일정 등급 이상을 받아야 한다."], 3, "기술특례상장은 거래소가 지정한 전문평가기관 2곳에서 A등급 및 BBB등급 이상을 받아야 신청할 수 있다(초격차기술 특례 등은 1곳 평가 예외). 이익미실현기업 상장(테슬라요건), 성장성 추천 특례 등 다양한 경로가 있으며, 질적 심사도 수행한다. 요건을 충족하면 유가증권시장으로 이전상장할 수 있다."], [1, "코스닥시장", "매매", "코스닥시장 및 코넥스시장의 매매제도에 관한 설명으로 옳지 않은 것은?", ["코넥스시장은 연속매매만 허용되고 단일가매매는 하지 않는다.", "코스닥시장의 가격제한폭은 상하 30%이다.", "코스닥시장의 정규시장 매매거래시간은 유가증권시장과 같다.", "코넥스시장의 가격제한폭은 상하 15%이다."], 0, "코넥스시장은 정규시장에서 연속매매와 단일가매매(시가·종가 결정)가 모두 이루어지며, 유동성 부족 종목 등에 대해서는 단일가매매 방식도 활용한다. 가격제한폭은 상하 15%, 코스닥은 유가증권시장과 같이 상하 30%다."], [1, "코스닥시장", "시장관리", "투자주의 환기 및 불공정거래 예방제도 중 '투자경고종목' 지정 후 주가가 추가 급등하는 경우의 다음 단계 조치는?", ["투자위험종목 지정", "정리매매", "투자주의종목 지정", "관리종목 지정"], 0, "시장경보제도는 투자주의 → 투자경고 → 투자위험의 3단계로 운영된다. 투자경고종목은 신용거래가 제한되고 위탁증거금 100% 징수 대상이며, 이후 추가 급등 시 투자위험종목으로 지정되고 지정 시 1일 매매거래가 정지될 수 있다. 관리종목은 상장요건 미달 등 기업 실적·지배구조 문제로 지정하는 별개 제도다."], [1, "채권시장", "가격", "말킬(Malkiel)의 채권가격정리에 관한 설명으로 옳지 않은 것은?", ["표면이율이 낮을수록 동일한 수익률 변동에 대한 가격변동률이 커진다.", "채권수익률과 채권가격은 역의 관계이다.", "만기가 길수록 동일한 수익률 변동에 대한 가격변동폭이 커진다.", "만기가 길어질수록 가격변동률은 체증적으로 증가한다."], 3, "말킬의 정리에 따르면 만기가 길수록 가격변동폭은 커지지만 그 증가율은 체감한다(만기 증가에 따른 가격변동률은 체감적으로 증가). 또 동일 크기의 수익률 변동이라도 수익률 하락에 따른 가격상승폭이 수익률 상승에 따른 가격하락폭보다 크며(볼록성), 표면이율이 낮을수록 가격변동률이 크다."], [1, "채권시장", "계산", "액면 10,000원, 표면이율 연 4%(연 1회 후급), 잔존만기 2년인 채권의 만기수익률이 5%일 때 이론가격에 가장 가까운 것은?", ["10,000원", "9,814원", "9,900원", "10,186원"], 1, "[[P = |400|1.05| + |10,400|1.05²]] = 380.95 + 9,433.11 ≈ 9,814원이다. 만기수익률(5%)이 표면이율(4%)보다 높으므로 할인채 형태로 거래되어 액면가보다 낮은 가격이 나온다. 반대로 시장수익률이 표면이율보다 낮으면 할증 발행된다."], [1, "채권시장", "계산", "수정듀레이션 3.5, 볼록성 20인 채권의 수익률이 1%p 하락할 때 듀레이션과 볼록성을 모두 고려한 가격변동률은?", ["약 +3.7%", "약 −3.4%", "약 +3.4%", "약 +3.6%"], 3, "[[ΔP/P ≈ −D_m × Δy + |1|2| × 볼록성 × (Δy)²]] = −3.5 × (−0.01) + 0.5 × 20 × 0.0001 = 0.035 + 0.001 = +3.6%이다. 볼록성 효과는 수익률 상승·하락과 무관하게 항상 가격에 (+)로 작용하므로 듀레이션만으로 추정한 값을 보정한다."], [1, "채권시장", "위험", "듀레이션에 관한 설명으로 옳은 것은?", ["시장수익률이 높을수록 듀레이션은 짧아진다.", "표면이율이 높을수록 듀레이션은 길어진다.", "무이표채의 듀레이션은 잔존만기보다 짧다.", "이자지급 주기가 짧아질수록 듀레이션은 길어진다."], 0, "듀레이션은 현금흐름 회수의 가중평균기간이다. 시장수익률이 높으면 먼 미래 현금흐름의 현재가치 비중이 작아져 듀레이션이 짧아진다. 무이표채의 듀레이션은 잔존만기와 같고, 표면이율이 높거나 이자지급 주기가 짧을수록 초기 현금흐름 비중이 커져 듀레이션은 짧아진다."], [1, "채권시장", "전략", "채권 운용전략에 관한 설명으로 옳지 않은 것은?", ["사다리형 전략은 각 만기별로 채권을 균등하게 보유한다.", "수익률곡선 타기 전략은 수익률곡선이 우상향하고 형태가 변하지 않을 때 효과적이다.", "금리 하락이 예상되면 듀레이션을 줄이는 것이 적극적 전략이다.", "바벨형 전략은 단기채와 장기채만 보유하고 중기채는 보유하지 않는다."], 2, "금리 하락이 예상되면 가격상승 효과를 극대화하기 위해 듀레이션을 늘리는(장기채·저쿠폰채 편입) 것이 적극적 전략이다. 금리 상승 예상 시에는 듀레이션을 줄인다. 바벨형·사다리형은 만기 구성 전략이며, 수익률곡선 타기는 롤링효과와 숄더효과를 활용한다."], [1, "채권시장", "상품", "신종채권에 관한 설명으로 옳은 것은?", ["전환사채의 전환권 행사 시 발행회사에 신규 자금이 유입된다.", "분리형 신주인수권부사채는 신주인수권 행사 후에도 사채가 존속한다.", "수의상환채권(callable bond)은 투자자에게 유리한 권리가 부여된 채권이다.", "교환사채의 교환권 행사 시 발행회사의 자본금이 증가한다."], 1, "BW는 신주인수권 행사 시 별도로 주금을 납입하므로 자금이 유입되고 사채는 만기까지 존속한다. CB는 사채가 주식으로 바뀌므로 신규 자금 유입이 없다. EB는 발행회사가 보유한 다른 회사 주식과 교환하므로 발행회사 자본금 변동이 없다. 수의상환권은 발행자 권리로 투자자에게 불리하다.[[NOTE:공모 분리형 BW만 허용되며 사모 분리형 BW는 발행이 금지되어 있다.]]"], [1, "채권시장", "수익성", "수익률곡선 이론에 관한 설명으로 옳은 것은?", ["시장분할이론은 만기별 시장 간 자금 이동이 자유롭다고 가정한다.", "유동성선호이론은 투자자가 장기채를 선호한다고 본다.", "불편기대이론에서 장기금리는 미래 단기금리 기대치의 평균과 같다.", "특정시장선호이론에서 수익률곡선은 반드시 우상향한다."], 2, "불편기대이론은 장기금리를 현재와 미래 기대 단기금리의 (기하)평균으로 본다. 유동성선호이론은 투자자가 단기채를 선호해 장기채에 유동성프리미엄을 요구한다고 보며, 시장분할이론은 만기별 시장이 분리되어 있다고 가정한다. 특정시장선호이론은 프리미엄 크기에 따라 다양한 형태가 가능하다."], [1, "기타 증권시장", "시장", "K-OTC시장과 대체거래소에 관한 설명으로 옳지 않은 것은?", ["K-OTC시장에는 가격제한폭이 상하 30%로 적용된다.", "대체거래소(ATS)는 한국거래소와 동일하게 신규상장 심사 기능을 수행한다.", "대체거래소는 매매체결 기능을 제공하며 거래소와 경쟁 관계에 있다.", "K-OTC시장은 한국금융투자협회가 운영하는 비상장주식 장외시장이다."], 1, "대체거래소(다자간매매체결회사, 넥스트레이드)는 상장 기능 없이 거래소 상장 종목에 대한 매매체결 서비스만 제공한다. 상장·시장감시 핵심 기능은 한국거래소가 담당한다. K-OTC는 금융투자협회가 운영하며 상대매매 방식, 가격제한폭 30%를 적용한다."], [2, "금융상품", "예금성", "예금자보호제도에 관한 설명으로 옳은 것은?", ["증권회사의 CMA는 상품 유형과 관계없이 모두 보호된다.", "보호한도는 금융회사별 1인당 원금과 소정이자를 합해 1억원이다.", "주택청약종합저축은 예금보험공사의 보호를 받는다.", "외화예금은 예금자보호 대상에서 제외된다."], 1, "2025년 9월 1일부터 예금자보호한도가 5천만원에서 1억원으로 상향되었다. 증권사 CMA는 종금형만 보호되고 RP형·MMF형·MMW형은 비보호다. 외화예금은 보호 대상이며, 주택청약종합저축은 국민주택기금으로 조성되어 정부가 관리하므로 예금보험 대상이 아니다.[[NOTE:교재가 2025년 이전 판이면 보호한도를 5천만원으로 서술한다. 2026년 10월 기준 1억원이다.]]"], [2, "금융상품", "투자성", "집합투자기구의 법적 형태에 관한 설명으로 옳지 않은 것은?", ["투자신탁은 집합투자업자와 신탁업자 간 신탁계약으로 설정된다.", "투자합자조합은 무한책임조합원인 업무집행조합원 1인과 유한책임조합원으로 구성된다.", "우리나라 공모펀드의 대부분은 투자회사 형태이다.", "투자회사는 상법상 주식회사 형태이며 서류상 회사이다."], 2, "우리나라 집합투자기구는 대부분 투자신탁 형태다. 투자회사는 이사회·주주총회 등 기관 운영 비용이 들어 주로 PEF·M&A 펀드 등에 활용된다. 법적 형태는 투자신탁, 투자회사, 투자유한회사, 투자합자회사, 투자유한책임회사, 투자합자조합, 투자익명조합의 7가지다."], [2, "금융상품", "투자성", "ETF와 ETN에 관한 설명으로 옳은 것은?", ["ETN은 발행 증권사의 신용위험에 노출되며 만기가 있다.", "ETF는 기초지수를 추적하므로 추적오차가 발생하지 않는다.", "ETN은 집합투자증권으로 분류된다.", "ETF는 장중 실시간 거래가 불가능하고 기준가격으로만 환매된다."], 0, "ETN은 증권사가 자기신용으로 발행하는 파생결합증권으로 발행사 신용위험이 있으며 1-20년의 만기가 있다. ETF는 집합투자증권으로 신탁재산이 분리 보관되지만 보수·현금 보유·복제 방식 등으로 추적오차가 발생한다. ETF는 상장되어 장중에 거래된다."], [2, "금융상품", "투자성", "주가연계증권(ELS)의 수익구조에 관한 설명으로 옳은 것은?", ["ELS는 예금자보호 대상이다.", "ELS의 조기상환 조건은 투자자가 임의로 선택할 수 있다.", "원금비보장형 ELS는 기초자산 하락 시에도 원금이 보장된다.", "녹인(Knock-in)형 스텝다운 ELS는 기초자산이 녹인 배리어를 한 번도 터치하지 않으면 만기에 약정 수익을 받는다."], 3, "스텝다운 ELS는 조기상환 평가일마다 조건 충족 시 상환되고, 만기까지 상환되지 않아도 녹인 배리어를 터치하지 않았다면 약정 수익을 지급한다. 녹인이 발생하고 만기 상환조건을 못 맞추면 기초자산 하락률만큼 손실이 난다. ELS는 파생결합증권으로 예금자보호 대상이 아니며 조기상환 조건은 발행 시 확정된다."], [2, "금융상품", "부동산", "부동산 투자의 위험 및 특성에 관한 설명으로 옳지 않은 것은?", ["부동산은 개별성(비대체성)이 있어 동일한 부동산이 존재하지 않는다.", "부동산은 유동성위험이 크다.", "부동산 투자는 레버리지를 활용하면 자기자본수익률의 변동성이 축소된다.", "부동산 가격은 금리·정책 등 외부 요인에 크게 영향을 받는다."], 2, "레버리지를 활용하면 기대 자기자본수익률은 커질 수 있지만 그 변동성(위험)도 확대된다. 차입이자율이 총투자수익률보다 높으면 부(負)의 레버리지가 발생한다. 부동산은 부동성·개별성·부증성·영속성 등 자연적 특성으로 유동성위험과 정책위험이 크다."], [2, "금융상품", "신탁·랩", "신탁상품과 랩어카운트에 관한 설명으로 옳은 것은?", ["자문형 랩어카운트는 증권사가 투자판단 전부를 일임받아 운용한다.", "특정금전신탁은 위탁자가 운용방법을 지정하는 신탁이다.", "일임형 랩어카운트에서는 투자자가 매매 시마다 직접 지시해야 한다.", "불특정금전신탁은 현재 신규 판매가 자유롭다."], 1, "특정금전신탁은 위탁자가 운용대상을 지정하는 실적배당형 신탁이다. 불특정금전신탁은 집합투자와 유사해 연금신탁 등 일부를 제외하고 신규 수탁이 금지된다. 일임형 랩은 증권사가 투자판단을 일임받아 운용하고, 자문형 랩은 자문사 자문을 받아 증권사가 운용하는 구조다."], [2, "금융상품", "연금·절세", "개인종합자산관리계좌(ISA)에 관한 설명으로 옳은 것은?", ["일반형 ISA의 비과세 한도는 500만원이다.", "중개형 ISA에서는 국내 상장주식 투자가 불가능하다.", "만기 시 순이익 전액이 비과세된다.", "의무가입기간은 3년이며 연간 납입한도는 2,000만원(총 1억원)이다."], 3, "ISA는 의무가입기간 3년, 연 2,000만원(미불입분 이월, 총 1억원) 한도로 납입하며, 순이익 중 일반형 200만원(서민·농어민형 400만원)까지 비과세, 초과분은 9.9% 분리과세된다. 중개형 ISA는 국내 상장주식 직접투자가 가능하다.[[NOTE:2025-2026년 세법 개정으로 ISA 납입·비과세 한도 상향, 국내투자형 ISA 신설 등이 추진되었다. 시행 여부와 적용 시기를 시험 공고 기준으로 재확인한다.]]"], [2, "금융상품", "연금·절세", "연금저축과 IRP에 관한 설명으로 옳지 않은 것은?", ["연금저축계좌는 위험자산 투자 한도 없이 레버리지·인버스 ETF에 투자할 수 있다.", "IRP는 위험자산 투자 한도가 적립금의 70%로 제한된다.", "연금 수령 시 수령 나이에 따라 3-5%의 연금소득세가 적용된다.", "연금저축과 IRP를 합산한 세액공제 대상 납입한도는 연 900만원이다."], 0, "연금저축계좌는 원칙적으로 위험자산 투자 한도가 없지만, 레버리지·인버스 ETF 등 파생상품 위험평가액이 40%를 초과하는 ETF에는 투자할 수 없다. IRP는 위험자산 70% 한도가 있다. 세액공제 한도는 연금저축 600만원 포함 합산 900만원이며 연금소득세는 70세 미만 5%, 70-79세 4%, 80세 이상 3%다."], [2, "금융상품", "투자성", "파생결합증권과 파생상품 구분에 관한 설명으로 옳은 것은?", ["ELD는 증권회사가 발행하는 파생결합증권이다.", "ELW는 파생결합증권이며 거래소에 상장되어 거래된다.", "ELF는 은행 예금 상품으로 원금이 보장된다.", "DLS는 이자율·환율·원자재 등 주가 이외의 기초자산과 연계되며 파생상품으로 분류된다."], 1, "ELW는 주식워런트증권으로 파생결합증권에 해당하며 거래소에 상장되어 유동성공급자(LP)가 호가를 제출한다. DLS는 파생결합증권이며, ELD는 은행의 주가연계예금(예금자보호), ELF는 ELS 등에 투자하는 집합투자기구(펀드)다."], [2, "금융상품", "투자성", "특수한 형태의 집합투자기구에 관한 설명으로 옳지 않은 것은?", ["전환형 집합투자기구는 다른 집합투자기구로 전환 시 환매수수료를 부과한다.", "모자형 집합투자기구에서 자펀드는 모펀드에만 투자한다.", "환매금지형 집합투자기구는 공모 시 설정일로부터 90일 이내에 상장해야 한다.", "종류형 집합투자기구는 판매보수·수수료 차이로 여러 클래스를 둔다."], 0, "전환형 집합투자기구는 사전에 정한 다른 펀드로 전환할 권리를 부여하며, 전환 시 환매수수료를 부과하지 않는 것이 핵심 특징이다. 환매금지형 공모펀드는 90일 이내 상장 의무가 있고, 종류형은 클래스 간 운용 성과는 같지만 비용 차이로 수익률이 다르다."], [2, "증권투자", "포트폴리오", "두 자산 A와 B의 상관계수가 −1일 때에 관한 설명으로 옳은 것은?", ["분산투자 효과가 전혀 없다.", "포트폴리오 위험은 개별자산 위험의 가중평균과 같다.", "적절한 비중 조합으로 포트폴리오 위험을 0으로 만들 수 있다.", "포트폴리오 기대수익률이 0이 된다."], 2, "상관계수가 −1이면 두 자산이 완전히 반대로 움직이므로 비중을 [[w_A = |σ_B|σ_A + σ_B|]]로 조합하면 포트폴리오 표준편차가 0이 된다. 상관계수가 +1이면 위험이 가중평균과 같아 분산효과가 없고, 1보다 작아지면 분산효과가 발생한다. 기대수익률은 상관계수와 무관한 가중평균이다."], [2, "증권투자", "계산", "자산 A(기대수익률 10%, 표준편차 20%)와 B(기대수익률 6%, 표준편차 10%)에 각각 50%씩 투자하고 상관계수가 0일 때 포트폴리오 표준편차에 가장 가까운 것은?", ["약 22.4%", "약 7.5%", "약 15.0%", "약 11.2%"], 3, "σ_p² = 0.5² × 0.2² + 0.5² × 0.1² + 2 × 0.5 × 0.5 × 0 × 0.2 × 0.1 = 0.01 + 0.0025 = 0.0125, σ_p = √0.0125 ≈ 0.1118 → 약 11.2%. 상관계수가 0이어도 가중평균 표준편차 15%보다 낮아져 분산투자 효과가 나타난다. 기대수익률은 8%다."], [2, "증권투자", "CAPM", "무위험이자율 3%, 시장포트폴리오 기대수익률 9%, 주식 C의 베타 1.5일 때 CAPM에 의한 C의 요구수익률은?", ["12%", "10.5%", "13.5%", "9%"], 0, "CAPM: E(R) = R_f + β × [E(R_m) − R_f] = 3% + 1.5 × (9% − 3%) = 12%. 증권시장선(SML)은 체계적 위험(베타)과 기대수익률의 관계를 나타내며, 실제 기대수익률이 SML보다 위에 있으면 과소평가(매수), 아래에 있으면 과대평가(매도) 자산이다."], [2, "증권투자", "CAPM", "자본시장선(CML)과 증권시장선(SML)에 관한 설명으로 옳지 않은 것은?", ["CML은 효율적 포트폴리오만을 대상으로 한다.", "SML은 개별자산과 비효율적 포트폴리오에도 적용된다.", "CML의 기울기는 개별자산의 베타이다.", "CML의 위험 척도는 표준편차, SML의 위험 척도는 베타이다."], 2, "CML의 기울기는 [E(R_m) − R_f] / σ_m으로 위험 1단위당 위험보상(샤프비율)이다. SML의 기울기는 시장위험프리미엄 [E(R_m) − R_f]이다. CML은 총위험(표준편차), SML은 체계적 위험(베타)을 위험 척도로 쓴다."], [2, "증권투자", "성과평가", "성과평가지표에 관한 설명으로 옳은 것은?", ["트레이너비율은 총위험 1단위당 초과수익률이다.", "젠센의 알파는 CAPM 기대수익률 대비 실제 초과수익률이다.", "샤프비율은 체계적 위험 1단위당 초과수익률이다.", "정보비율은 무위험수익률 대비 초과수익률을 베타로 나눈 값이다."], 1, "젠센의 알파 = 실제수익률 − [R_f + β(R_m − R_f)]로, 양(+)이면 위험 대비 우수한 성과다. 샤프비율은 총위험(표준편차), 트레이너비율은 체계적 위험(베타) 1단위당 초과수익률이다. 정보비율은 벤치마크 대비 초과수익률을 추적오차로 나눈 값이다."], [2, "증권투자", "자산배분", "전략적 자산배분과 전술적 자산배분에 관한 설명으로 옳은 것은?", ["전술적 자산배분은 역투자전략과 무관하다.", "전술적 자산배분은 자산 가격이 단기적으로 균형가격에서 벗어날 수 있다는 가정에 기반한다.", "전략적 자산배분은 시장 상황 변화에 따라 자산 비중을 단기적으로 조정한다.", "전략적 자산배분은 시장의 효율성을 부정한다."], 1, "전술적 자산배분은 단기적으로 자산가격이 내재가치에서 이탈한다고 보고, 고평가 자산을 매도하고 저평가 자산을 매수하는 역투자전략(평균회귀 활용)을 쓴다. 전략적 자산배분은 장기 투자목표에 따라 자산구성을 정하는 의사결정으로, 단기 시장 예측을 하지 않으며 효율적 시장을 전제한다."], [2, "증권투자", "자산배분", "자산배분 시 기대수익률 추정 방법 중 '시나리오 분석법'에 관한 설명으로 옳은 것은?", ["과거 수익률의 평균을 그대로 미래 기대수익률로 사용한다.", "시장 참여자의 주관적 견해만을 반영한다.", "여러 경제변수 상황별 발생확률을 부여해 기대수익률을 추정한다.", "무위험이자율에 위험프리미엄을 더하는 방식만 해당한다."], 2, "시나리오 분석법은 경기 국면 등 경제 상황별 시나리오와 발생 확률을 설정하고, 각 상황의 예상수익률을 확률가중평균해 기대수익률을 추정한다. 과거 평균을 쓰는 추세분석법, 리스크프리미엄 합산 방식(근본적 분석법), 전문가 의견을 쓰는 펀더멘털·시장공동예측치 방식과 구별된다."], [2, "증권투자", "포트폴리오", "효율적 시장가설(EMH)에 관한 설명으로 옳지 않은 것은?", ["준강형 효율적 시장이 성립하면 약형 효율적 시장은 성립하지 않을 수 있다.", "강형 효율적 시장에서는 내부자 정보로도 초과수익을 얻을 수 없다.", "약형 효율적 시장에서는 기술적 분석으로 초과수익을 얻을 수 없다.", "준강형 효율적 시장에서는 공개 정보를 이용한 기본적 분석으로 초과수익을 얻을 수 없다."], 0, "효율성은 포함 관계를 가진다. 강형은 준강형을, 준강형은 약형을 포함하므로 준강형이 성립하면 약형은 반드시 성립한다. 약형은 과거 가격정보, 준강형은 모든 공개정보, 강형은 내부정보까지 이미 가격에 반영되었다고 본다."], [2, "증권투자", "위험", "포트폴리오의 위험에 관한 설명으로 옳은 것은?", ["편입 종목 수를 늘리면 비체계적 위험은 감소하고 체계적 위험만 남는다.", "베타가 1보다 큰 주식은 방어적 주식이다.", "총위험은 체계적 위험에서 비체계적 위험을 뺀 값이다.", "분산투자로 체계적 위험을 제거할 수 있다."], 0, "총위험 = 체계적 위험 + 비체계적 위험이다. 종목 수를 늘리면 기업 고유 위험인 비체계적 위험이 소멸하고, 경기·금리 등 시장 전체 요인에서 오는 체계적 위험(분산불능위험)만 남는다. 베타가 1보다 크면 공격적 주식, 작으면 방어적 주식이다."], [2, "증권투자", "자산배분", "리밸런싱(rebalancing)과 업그레이딩(upgrading)에 관한 설명으로 옳은 것은?", ["리밸런싱은 위험 대비 기대수익이 더 높은 자산으로 교체하는 것이다.", "업그레이딩은 거래비용이 발생하지 않는다.", "업그레이딩은 기존 자산 비중을 그대로 유지하는 것이다.", "리밸런싱은 상대가격 변동으로 달라진 자산 비중을 원래 비중으로 되돌리는 것이다."], 3, "리밸런싱은 시장가격 변동으로 변한 구성 비중을 당초 목표 비중으로 복원하는 조정이다. 업그레이딩은 새로운 상황 전개로 기대수익과 위험이 달라진 자산을 더 우월한 자산으로 교체하는 것으로, 손실이 큰 자산을 식별해 제거하는 방식이 주로 쓰이며 거래비용이 발생한다."], [2, "투자권유", "직무윤리", "직무윤리의 기본원칙에 관한 설명으로 옳은 것은?", ["직무윤리는 금융투자회사 임직원 중 정규직에게만 적용된다.", "고객우선의 원칙과 신의성실의 원칙은 법적 강제력이 없는 윤리 원칙일 뿐이다.", "이해상충 발생 시 회사의 이익을 고객의 이익보다 우선한다.", "신의성실의 원칙은 윤리적 의무이자 법적 의무이다."], 3, "신의성실의 원칙은 직무윤리상 의무이면서 민법 제2조 등에 근거한 법적 의무로, 위반 시 법적 책임이 따를 수 있다. 이해상충 시 고객 이익이 최우선이며(고객 > 회사 > 임직원), 직무윤리는 고용 형태·보수 여부와 무관하게 관련 업무에 종사하는 모든 사람에게 적용된다."], [2, "투자권유", "직무윤리", "이해상충 방지 의무에 관한 설명으로 옳지 않은 것은?", ["정보교류차단(Chinese Wall) 장치를 설치해야 한다.", "투자자에게 이해상충 사실을 알리면 그 수준과 무관하게 거래할 수 있다.", "이해상충 가능성을 낮추기 어려우면 거래를 하지 않아야 한다.", "이해상충 발생 가능성이 있으면 투자자에게 알리고 그 가능성을 낮춘 후 거래해야 한다."], 1, "자본시장법상 이해상충 관리는 '파악·평가 → 공시(고지) → 위험 저감 → 저감 불가 시 거래 중단'의 단계로 이루어진다. 단순히 알리는 것만으로 거래가 허용되지 않으며, 투자자 보호에 문제가 없는 수준으로 낮추지 못하면 거래를 해서는 안 된다."], [2, "투자권유", "직무윤리", "과당매매(churning) 판단 시 고려 사항이 아닌 것은?", ["일반투자자가 부담하는 수수료 총액", "해당 거래로 회사가 얻는 영업이익의 순위", "일반투자자의 재산상태와 투자목적에 적합한지 여부", "일반투자자의 투자지식·경험에 비추어 거래의 위험을 이해하는지 여부"], 1, "금융투자업규정상 과당매매 판단 기준은 수수료 총액, 재산상태·투자목적 적합성, 투자자의 거래 위험 이해 여부, 개별 매매거래 시 권유 내용의 타당성 등이다. 회사 수익 순위는 판단 기준이 아니며, 오히려 회사 이익을 위한 과도한 매매 유도가 과당매매의 본질이다."], [2, "투자권유", "금소법", "금융소비자보호법상 6대 판매원칙에 해당하지 않는 것은?", ["설명의무", "적정성 원칙", "적합성 원칙", "최선집행의무"], 3, "금소법 6대 판매원칙은 적합성 원칙, 적정성 원칙, 설명의무, 불공정영업행위 금지, 부당권유행위 금지, 허위·과장광고 금지다. 최선집행의무는 자본시장법상 투자매매·중개업자가 청약·주문을 최선의 조건으로 집행해야 하는 의무로 금소법 6대 원칙과 구별된다."], [2, "투자권유", "금소법", "금융소비자보호법상 위법계약해지권에 관한 설명으로 옳은 것은?", ["위법 사실을 안 날부터 1년 이내, 계약 체결일부터 5년 이내에 해지를 요구할 수 있다.", "청약철회권과 동일하게 투자성 상품 전반에 적용된다.", "해지 시 금융상품판매업자는 기납입 원금과 이자를 전액 반환해야 한다.", "계약 체결일로부터 1년 이내에 행사할 수 있으며 위법 사실을 안 날과 무관하다."], 0, "위법계약해지권은 판매원칙 위반 계약에 대해 위법 사실을 안 날부터 1년, 계약일부터 5년 이내에 해지를 요구하는 권리로, 판매업자는 10일 이내 수락 여부를 통지해야 한다. 해지는 장래를 향해 효력이 있어 해지 이전까지 발생한 비용·손실은 원상회복 대상이 아니다. 청약철회권(숙려기간)과는 별개 제도다."], [2, "투자권유", "투자권유", "투자권유 절차에 관한 설명으로 옳지 않은 것은?", ["투자자가 투자권유를 희망하지 않는 경우 적합성 원칙 확인서 없이 무조건 원금보장 상품만 판매해야 한다.", "고령투자자(65세 이상)에게 파생상품 등 고위험 상품 판매 시 강화된 보호 절차가 적용된다.", "투자권유 전 투자자가 일반투자자인지 전문투자자인지 확인해야 한다.", "투자자정보를 제공하지 않는 일반투자자에게는 투자권유를 할 수 없다."], 0, "투자권유를 희망하지 않는 투자자는 '투자권유 희망 및 투자자정보 제공 여부 확인서'를 받고 투자자 스스로 판단에 따라 상품을 선택할 수 있다. 다만 파생상품 등 적정성 원칙 대상 상품은 투자자정보를 받아야 한다. 원금보장 상품만 판매해야 한다는 규정은 없다."], [2, "투자권유", "분쟁예방", "금융분쟁조정 제도에 관한 설명으로 옳은 것은?", ["조정 신청 시 소송 진행 여부와 관계없이 조정이 계속된다.", "분쟁조정 신청 시효는 존재하지 않는다.", "금융감독원 금융분쟁조정위원회의 조정안을 당사자가 수락하면 재판상 화해와 동일한 효력이 있다.", "한국금융투자협회 분쟁조정의 성립은 재판상 화해 효력을 가진다."], 2, "금융감독원 금융분쟁조정위원회의 조정이 성립하면 재판상 화해와 동일한 효력이 있다. 한국거래소·금융투자협회 등 자율조정기구의 조정 성립은 민법상 화해계약 효력에 그친다. 금소법상 일반금융소비자가 신청한 2천만원 이하 소액분쟁은 조정 완료 전까지 금융회사가 소송을 제기할 수 없다(소송중지·소액분쟁 특례)."], [2, "투자권유", "고객관리", "고객관리(CRM)에 관한 설명으로 옳지 않은 것은?", ["고객평생가치(LTV) 관점에서 우량고객과의 관계를 강화한다.", "CRM은 상품 중심 판매를 강화하는 전략이다.", "CRM은 고객 획득보다 유지·확대에 더 큰 비중을 둔다.", "교차판매·상향판매 기회를 발굴하는 데 활용된다."], 1, "CRM은 상품 중심에서 고객 중심으로 영업 패러다임을 바꾸는 전략으로, 신규고객 획득보다 기존고객 유지와 고객 점유율 확대를 중시한다. 고객평생가치를 높이기 위해 교차판매(cross-selling)와 상향판매(up-selling)를 활용한다."], [2, "투자권유", "분쟁예방", "개인정보보호법상 개인정보 처리에 관한 설명으로 옳은 것은?", ["개인정보 처리 목적이 달성되어도 회사는 영구 보관할 수 있다.", "개인정보 유출 시 손해배상은 실제 손해만 인정되며 징벌적 손해배상은 없다.", "주민등록번호는 정보주체의 동의만 있으면 언제든 처리할 수 있다.", "민감정보와 고유식별정보는 원칙적으로 처리가 제한된다."], 3, "민감정보·고유식별정보는 별도 동의나 법령 근거가 있는 경우에만 처리할 수 있으며, 주민등록번호는 법령 근거 등 엄격한 예외에서만 처리 가능하다(동의만으로는 불가). 고의·중과실 유출 시 손해액의 5배 이내 징벌적 손해배상이 인정되고, 처리 목적이 달성되면 지체 없이 파기해야 한다."], [2, "투자권유", "직무윤리", "내부통제와 준법감시인에 관한 설명으로 옳지 않은 것은?", ["준법감시인은 해임 시 이사 총수의 3분의 2 이상 찬성이 필요하다.", "준법감시인은 내부통제기준 준수 여부를 점검하고 위반 시 감사위원회에 보고한다.", "준법감시인은 자산운용·영업 등 회사 본연의 업무를 겸직할 수 있다.", "준법감시인은 이사회 의결을 거쳐 임면한다."], 2, "지배구조법상 준법감시인은 자산 운용, 회사 본질적 업무, 겸영·부수업무 등을 겸직할 수 없다. 이사회 의결로 임면하고, 해임에는 이사 총수 3분의 2 이상 찬성이 필요하며 임기는 2년 이상이다.[[NOTE:2024년 시행 개정 지배구조법으로 대표이사의 내부통제 총괄 관리의무와 임원별 책무구조도 제출 의무가 도입되었다. 금융투자회사는 규모별로 단계적 적용 중이다.]]"], [3, "자본시장 관련 법규", "금융투자상품", "자본시장법상 금융투자상품에 관한 설명으로 옳은 것은?", ["원본손실 가능성이 있는 모든 금융상품은 금융투자상품이다.", "주식매수선택권(스톡옵션)은 증권에 해당한다.", "원화로 표시된 양도성예금증서(CD)는 금융투자상품에서 제외된다.", "관리형 신탁의 수익권은 금융투자상품에 포함된다."], 2, "금융투자상품은 투자성(원본손실 가능성)이 있는 권리이지만, 원화 표시 CD, 관리형 신탁의 수익권, 주식매수선택권은 명시적으로 제외된다. 투자성 판단 시 판매수수료 등은 투자금액에서, 환매수수료·세금 등은 회수금액에서 제외하지 않는 점에 유의한다."], [3, "자본시장 관련 법규", "금융투자상품", "자본시장법상 증권의 종류와 예시의 연결로 옳지 않은 것은?", ["수익증권 - 투자신탁의 수익증권", "채무증권 - 기업어음증권(CP)", "파생결합증권 - 교환사채(EB)", "지분증권 - 신주인수권이 표시된 것"], 2, "교환사채·전환사채·신주인수권부사채는 채무증권에 해당하며 파생결합증권에서 명시적으로 제외된다. 증권은 채무증권, 지분증권, 수익증권, 투자계약증권, 파생결합증권, 증권예탁증권의 6종이다. CP는 채무증권, 신주인수권 표시 증서는 지분증권이다."], [3, "자본시장 관련 법규", "투자자", "전문투자자에 관한 설명으로 옳은 것은?", ["주권상장법인은 장외파생상품 거래 시 별도 의사 표시가 없으면 전문투자자로 대우한다.", "국가, 한국은행, 금융회사는 일반투자자 대우를 받을 수 없는 절대적 전문투자자이다.", "지방자치단체는 상대적 전문투자자로서 일반투자자 대우를 요청할 수 있다.", "일정 요건을 갖춘 개인 전문투자자는 금융위원회에 신고해야 한다."], 2, "국가·한국은행·금융회사 등은 절대적 전문투자자다. 주권상장법인·지방자치단체 등 상대적 전문투자자는 일반투자자 대우를 요청할 수 있다. 주권상장법인이 장외파생상품을 거래할 때는 전문투자자 대우를 받겠다는 의사를 서면으로 통지해야 전문투자자가 된다. 개인 전문투자자는 금융투자회사가 요건을 확인해 지정한다(금융위 신고 불요)."], [3, "자본시장 관련 법규", "금융투자업", "금융투자업의 정의와 적용 배제에 관한 설명으로 옳지 않은 것은?", ["불특정 다수인을 대상으로 발행되는 간행물을 통한 투자조언은 투자자문업에서 제외된다.", "투자중개업은 타인의 계산으로 금융투자상품을 매매하는 영업이다.", "투자매매업은 누구의 명의로 하든 자기의 계산으로 금융투자상품을 매매하는 영업이다.", "자기가 발행한 증권을 자기가 매매하는 경우에도 모두 투자매매업에 해당한다."], 3, "자기가 증권을 발행하는 경우는 원칙적으로 투자매매업 적용이 배제된다(다만 투자신탁 수익증권, 파생결합증권 발행 등은 투자매매업). 간행물·방송 등 불특정 다수 대상 조언은 투자자문업에서 제외된다."], [3, "자본시장 관련 법규", "인가·등록", "금융투자업 인가·등록에 관한 설명으로 옳은 것은?", ["인가를 받은 후에는 인가요건을 유지할 의무가 없다.", "투자자문업과 투자일임업은 인가 대상이다.", "투자매매업·투자중개업·집합투자업·신탁업은 인가 대상이다.", "온라인소액투자중개업자는 인가를 받아야 한다."], 2, "고객자산을 직접 수탁하는 투자매매·중개·집합투자·신탁업은 인가제, 투자자문·투자일임업과 온라인소액투자중개업은 등록제다. 인가·등록 후에도 자기자본 등 요건을 계속 유지해야 하며, 자기자본 요건은 매 회계연도 말 기준 70% 이상 유지가 필요하다."], [3, "자본시장 관련 법규", "건전성", "순자본비율(NCR)에 관한 설명으로 옳은 것은?", ["순자본비율 = (영업용순자본 − 총위험액) / 필요유지자기자본 × 100", "순자본비율은 매년 말 1회만 산정해 보고한다.", "순자본비율이 낮을수록 재무건전성이 높다.", "순자본비율이 150% 미만이면 경영개선명령 대상이다."], 0, "[[순자본비율 = |영업용순자본 − 총위험액|필요유지자기자본| × 100]]이다. 100% 미만이면 경영개선권고, 50% 미만 경영개선요구, 0% 미만 경영개선명령 대상이다. 금융투자업자는 순자본비율을 매일 산정하고 분기별로 보고하며, 높을수록 건전하다."], [3, "자본시장 관련 법규", "영업행위", "투자매매업자·투자중개업자의 영업행위 규칙으로 옳지 않은 것은?", ["최선집행기준을 마련하고 공표해야 한다.", "자기계약 금지 원칙상 동일 매매에서 자신이 본인이 되는 동시에 상대방 투자중개업자가 될 수 없다.", "증권시장을 통한 매매라도 자기계약은 예외 없이 금지된다.", "매매형태 명시 의무에 따라 자기가 매매 상대방인지 중개인인지를 미리 밝혀야 한다."], 2, "자기계약 금지에는 예외가 있으며, 증권시장·파생상품시장을 통해 매매가 이루어지도록 한 경우 등은 허용된다(시장을 통하면 상대방이 우연히 결정되기 때문). 매매형태 명시 의무와 최선집행의무도 영업행위 규칙이다."], [3, "자본시장 관련 법규", "영업행위", "투자매매·중개업자의 신용공여에 관한 설명으로 옳은 것은?", ["신용공여는 투자중개업 인가 없이도 가능하다.", "신용공여 총액은 자기자본 범위 이내여야 한다.", "투자자가 기한 내 상환하지 않아도 담보증권을 처분할 수 없다.", "신용거래 담보비율은 신용공여금액의 100% 이상이어야 한다."], 1, "신용공여 총액한도는 자기자본 범위 이내이며 종류별 한도는 금융위가 정한다. 담보비율은 신용공여금액의 140% 이상이어야 하고, 상환하지 않거나 담보비율 미달 시 담보를 처분해 회수할 수 있다. 신용공여는 투자매매·중개업자의 겸영업무다."], [3, "자본시장 관련 법규", "영업행위", "투자권유대행인에 관한 설명으로 옳은 것은?", ["투자권유대행인은 투자자로부터 금전·증권 등 재산을 수취할 수 있다.", "투자권유대행인은 파생상품 등에 대한 투자권유를 대행할 수 있다.", "투자권유대행인의 행위로 손해가 발생해도 위탁 금융투자회사는 책임을 지지 않는다.", "투자권유대행인은 둘 이상의 금융투자회사와 위탁계약을 체결할 수 없다."], 3, "투자권유대행인은 1개 금융투자회사와만 위탁계약을 체결할 수 있고, 파생상품 등 투자권유와 재산 수취는 금지된다. 투자권유대행인의 투자권유로 투자자에게 손해가 생기면 위탁한 금융투자회사가 사용자책임을 진다.[[NOTE:금소법 시행 이후 투자권유대행인은 금소법상 금융상품판매대리·중개업자로도 규율된다.]]"], [3, "자본시장 관련 법규", "집합투자", "집합투자기구의 운용 제한에 관한 설명으로 옳지 않은 것은?", ["각 집합투자기구 자산총액의 10%를 초과해 동일종목 증권에 투자할 수 없다.", "국채·통안증권 등은 자산총액의 100%까지 동일종목 투자가 가능하다.", "각 집합투자기구는 동일법인 발행 지분증권 총수의 20%까지 투자할 수 있다.", "동일 집합투자업자가 운용하는 전체 집합투자기구 합산으로 동일법인 발행 지분증권 총수의 20%를 초과할 수 없다."], 2, "각 집합투자기구는 동일법인 등이 발행한 지분증권 총수의 10%를 초과해 투자할 수 없고, 같은 집합투자업자의 전체 집합투자기구 합산 시 20%를 넘을 수 없다. 동일종목 투자 한도는 자산총액의 10%이며, 국채 등은 100%, 지방채·특수채 등은 30%까지 예외가 인정된다."], [3, "자본시장 관련 법규", "집합투자", "집합투자증권의 환매에 관한 설명으로 옳은 것은?", ["MMF는 환매청구일에 공고되는 기준가격으로 환매할 수 없다.", "환매대금은 환매청구일로부터 15일 이내에 지급해야 한다.", "판매회사는 자기 계산으로 환매청구 수익증권을 취득할 수 없다.", "환매가격은 환매청구일 이전에 산정된 기준가격으로 한다."], 1, "환매대금은 청구일부터 15일 이내 지급해야 하며, 환매가격은 환매청구일 후에 산정되는 기준가격(미래가격, Forward Pricing)으로 한다. 판매회사 등이 자기 계산으로 취득하는 것은 원칙적으로 금지되나 MMF 일정 한도 등 예외가 있고, MMF는 당일 기준가 환매 예외가 인정된다."], [3, "자본시장 관련 법규", "공시", "증권신고서 제도에 관한 설명으로 옳은 것은?", ["증권신고서 효력 발생은 정부가 신고서 내용의 진실성을 보증한다는 뜻이다.", "모집가액 또는 매출가액 총액이 10억원 이상이면 증권신고서를 제출해야 한다.", "증권신고서는 수리된 날부터 즉시 효력이 발생한다.", "50인 이상 청약 권유 산정 시 전문투자자도 포함된다."], 1, "공모 총액 10억원 이상이면 증권신고서를 제출해야 하며, 효력발생기간(예: 지분증권 상장법인 일반공모 10영업일, 무보증사채 7영업일)이 지나야 효력이 생긴다. 50인 산정 시 전문투자자 등은 제외된다. 효력 발생은 신고서의 진실성이나 증권 가치를 정부가 보증하는 것이 아니다."], [3, "자본시장 관련 법규", "공시", "주식등의 대량보유보고(5% 룰)에 관한 설명으로 옳지 않은 것은?", ["주권상장법인 주식등을 5% 이상 보유하게 되면 5일 이내에 보고해야 한다.", "경영참가 목적으로 보고한 자는 보고 사유 발생일부터 보고일 이후 5일까지 추가 취득과 의결권 행사가 금지된다.", "단순투자 목적 보유자는 어떤 경우에도 보고 의무가 면제된다.", "보유비율이 1% 이상 변동되면 변동보고를 해야 한다."], 2, "단순투자 목적이라도 대량보유보고 의무는 있으며 보고기한과 서식이 간소화될 뿐이다(일반투자 목적 10일, 단순투자 목적 다음 달 10일 등). 경영참가 목적은 5일 이내 보고, 냉각기간 동안 추가 취득·의결권 행사가 금지된다."], [3, "자본시장 관련 법규", "공시", "공개매수에 관한 설명으로 옳은 것은?", ["공개매수자는 공개매수 공고 후 언제든 철회할 수 있다.", "공개매수에 응모한 주주는 공개매수 기간 중 응모를 취소할 수 없다.", "공개매수 기간은 10일 이상 30일 이내이다.", "불특정 다수로부터 증권시장 밖에서 6개월간 10인 이상으로부터 매수해 5% 이상 보유하게 되는 경우 공개매수를 해야 한다."], 3, "증권시장 밖에서 6개월 동안 10인 이상으로부터 매수해 본인과 특별관계자 보유가 5% 이상이 되면 공개매수가 의무다. 공개매수 기간은 20일 이상 60일 이내이며, 공개매수자는 원칙적으로 철회할 수 없다(대항공개매수 등 예외). 응모주주는 기간 중 언제든 응모를 취소할 수 있다."], [3, "자본시장 관련 법규", "불공정거래", "미공개중요정보 이용행위 규제 대상자에 해당하지 않는 것은?", ["해당 법인과 계약 체결을 교섭 중인 자", "내부자로부터 정보를 받은 자로부터 다시 전달받은 2차 이상 정보수령자", "해당 법인에 대한 허가 권한을 가진 공무원", "해당 법인의 임직원"], 1, "제174조 형사처벌 대상은 내부자, 준내부자(허가권 공무원, 계약 체결·교섭자 등), 이들로부터 직접 정보를 받은 1차 정보수령자다. 2차 이상 정보수령자는 형사처벌 대상이 아니지만 시장질서 교란행위로 과징금 부과 대상이 될 수 있다."], [3, "자본시장 관련 법규", "불공정거래", "단기매매차익 반환제도에 관한 설명으로 옳은 것은?", ["주권상장법인의 모든 직원은 반환 대상이다.", "반환 청구는 증권선물위원회만 할 수 있다.", "미공개정보를 이용하지 않았음을 입증하면 반환 의무가 면제된다.", "특정증권등을 매수 후 6개월 이내에 매도해 얻은 이익을 회사에 반환해야 한다."], 3, "임원, 주요주주, 직무상 미공개정보를 알 수 있는 직원 등이 6개월 이내 매수·매도(또는 매도·매수)로 얻은 이익은 회사에 반환해야 한다. 정보 이용 여부와 무관한 엄격책임이며, 청구권자는 해당 법인이고 법인이 청구하지 않으면 주주가 대위 청구할 수 있다."], [3, "자본시장 관련 법규", "불공정거래", "시장질서 교란행위에 관한 설명으로 옳지 않은 것은?", ["목적성이 없더라도 시세에 부당한 영향을 주는 대량 허수호가는 교란행위가 될 수 있다.", "교란행위는 반드시 형사처벌 대상이다.", "교란행위에는 과징금이 부과된다.", "과징금은 위반행위로 얻은 이익의 1.5배가 5억원을 초과하면 그 금액 이하로 부과할 수 있다."], 1, "시장질서 교란행위는 불공정거래 형사처벌의 사각지대를 보완하기 위해 도입된 행정제재로, 목적성 요건 없이 과징금(5억원 이하, 이익 또는 회피손실의 1.5배가 5억원을 넘으면 그 금액 이하)이 부과된다. 형사처벌 대상이 아니다."], [3, "자본시장 관련 법규", "금융소비자보호", "금융소비자보호법상 설명의무에 관한 설명으로 옳은 것은?", ["설명서를 제공하고 일반금융소비자가 이해했음을 서명 등으로 확인받아야 한다.", "전문금융소비자에게도 설명의무를 동일하게 이행해야 한다.", "설명의무 위반에 따른 손해배상 시 금융소비자가 고의·과실을 입증해야 한다.", "설명의무 위반 시 과징금은 부과되지 않는다."], 0, "설명의무는 일반금융소비자를 대상으로 하며, 설명서 제공과 이해 확인(서명·기명날인·녹취 등)이 필요하다. 위반 시 관련 수입의 50% 이내 과징금, 1억원 이하 과태료가 가능하며, 손해배상 시 고의·과실 입증책임은 금융상품판매업자에게 전환된다."], [3, "자본시장 관련 법규", "금융소비자보호", "금융소비자보호법상 청약철회권에 관한 설명으로 옳지 않은 것은?", ["청약철회 시 금융상품판매업자는 철회 접수일부터 30일 이내에 금전을 반환하면 된다.", "투자성 상품의 청약철회 기간은 계약서류 제공일 또는 계약체결일부터 7일 이내이다.", "대출성 상품의 청약철회 기간은 14일 이내이다.", "투자성 상품 중 고난도 금융투자상품 등은 청약철회 대상이 될 수 있다."], 0, "투자성 상품의 청약을 철회하면 판매업자는 철회 접수일부터 3영업일 이내에 금전을 반환해야 한다. 청약철회 대상 투자성 상품은 고난도 금융투자상품, 고난도 투자일임·금전신탁 등이며 기간은 7일, 대출성은 14일, 보장성은 15일(청약일 30일 이내)이다."], [3, "자본시장 관련 법규", "감독·제재", "금융투자업자 임직원에 대한 제재로 옳지 않은 것은?", ["직원 제재에는 면직요구, 정직요구, 감봉요구, 견책요구, 경고, 주의가 있다.", "임원 제재에는 해임요구, 직무정지, 문책경고, 주의적 경고, 주의가 있다.", "임원에 대한 문책경고는 향후 금융회사 임원 선임에 아무런 제한이 없다.", "제재에 불복하는 경우 이의신청을 할 수 있다."], 2, "임원 문책경고를 받으면 일정 기간(3년) 금융회사 임원 선임이 제한된다. 해임요구는 5년, 직무정지는 4년 제한이 따른다. 제재 대상자는 통보받은 날부터 30일 이내 이의신청이 가능하다."], [3, "한국금융투자협회 규정", "투자권유", "협회 규정상 투자권유 및 재산상 이익 제공에 관한 설명으로 옳은 것은?", ["금융투자회사는 재산상 이익 제공 한도를 폐지하고 이사회 결의 등 내부통제 절차를 거치도록 하고 있다.", "동일 거래상대방에 대한 재산상 이익 제공은 1회 20만원으로 엄격히 제한된다.", "재산상 이익을 제공받는 경우 내부통제 절차는 필요 없다.", "재산상 이익 제공 내역은 기록·보관 의무가 없다."], 0, "협회 규정상 재산상 이익 제공의 1인당·회사별 금액 한도는 폐지되었고, 대신 일정 금액을 초과하는 경우 이사회 사전 의결, 인터넷 홈페이지 공시, 제공 내역 5년 기록·보관 등 내부통제를 강화했다. 수령 시에도 내부통제기준에 따라 보고해야 한다."], [3, "한국금융투자협회 규정", "조사분석", "조사분석자료 관련 협회 규정으로 옳지 않은 것은?", ["조사분석 대상 법인 등 외부의 압력으로부터 독립성을 유지해야 한다.", "금융투자분석사의 보수는 기업금융업무 실적에 연동하여 지급해야 한다.", "금융투자분석사는 자신이 담당하는 업종의 주식을 매매하는 경우 공표 후 24시간 경과 후 등 제한이 적용된다.", "회사가 발행주식 총수의 1% 이상을 보유한 법인에 대한 조사분석자료 공표 시 그 사실을 고지해야 한다."], 1, "금융투자분석사의 보수를 기업금융(IB) 업무와 연동하는 것은 이해상충 우려로 금지된다. 회사가 1% 이상 보유한 법인 등 이해관계를 고지해야 하며, 분석사 본인의 매매도 공표 후 24시간 경과 및 7일 이내 등 제한이 있다."], [3, "한국금융투자협회 규정", "계좌관리", "협회 규정상 계좌관리 및 투자자정보에 관한 설명으로 옳은 것은?", ["투자자가 투자자정보를 변경하지 않으면 회사는 다시 확인할 수 없다.", "투자자정보 확인서는 영구적으로 유효하다.", "투자자 계좌의 잔액이 10만원 이하이고 최근 6개월간 거래가 없으면 통합계좌로 별도 관리할 수 있다.", "금융투자회사는 위임장 없이 대리인의 주문을 받을 수 있다."], 2, "협회 규정상 잔액·잔량이 10만원 이하이고 최근 6개월간 거래가 없는 계좌는 통합계좌로 별도 관리할 수 있다. 투자자정보는 유효기간을 설정해 주기적으로 재확인하며, 대리인 주문은 위임 확인 절차가 필요하다."], [3, "한국금융투자협회 규정", "광고", "협회 규정상 투자광고에 관한 설명으로 옳지 않은 것은?", ["금융투자회사의 투자광고는 준법감시인의 사전 확인을 받아야 한다.", "집합투자기구 광고 시 운용실적 표시는 기준일 및 산정기간 등을 명시해야 한다.", "단순 이미지 광고 등 일부 광고는 협회 심사가 면제될 수 있다.", "손실보전 또는 이익보장으로 오인할 우려가 있는 표현도 고지문을 함께 쓰면 허용된다."], 3, "손실보전·이익보장으로 오인하게 하는 표현은 고지문 기재 여부와 무관하게 금지된다. 투자광고는 준법감시인의 사전 확인 후 협회 심사를 받으며, 이미지 광고 등은 심사 면제가 가능하다. 운용실적 광고는 기준일, 산정기간, 과거 실적이 미래를 보장하지 않는다는 문구를 표시한다."], [3, "회사법", "주식회사", "주식회사의 설립에 관한 설명으로 옳은 것은?", ["현물출자는 정관에 기재하지 않아도 효력이 있다.", "발기설립에서 발기인은 설립 시 발행주식 일부만 인수하고 나머지는 모집한다.", "모집설립에서는 창립총회를 개최해야 한다.", "주식회사의 최저자본금은 5천만원이다."], 2, "모집설립은 발기인이 일부를 인수하고 나머지를 주주 모집으로 인수하며, 창립총회에서 임원 선임·설립경과 보고를 한다. 발기설립은 발기인이 전부를 인수한다. 현물출자는 변태설립사항으로 정관에 기재해야 효력이 있고, 최저자본금 제도는 2009년 폐지되었다."], [3, "회사법", "주식", "주식의 종류와 자기주식에 관한 설명으로 옳지 않은 것은?", ["회사는 배당가능이익 범위에서 자기주식을 취득할 수 있다.", "상환주식은 회사의 이익으로 소각할 수 있는 종류주식이다.", "자기주식은 의결권이 있으나 이익배당청구권은 없다.", "의결권 없거나 제한되는 종류주식은 발행주식 총수의 4분의 1을 초과할 수 없다."], 2, "회사가 보유한 자기주식은 의결권이 없으며, 이익배당청구권 등 자익권도 인정되지 않는다는 것이 통설이다. 의결권 제한 종류주식은 발행주식 총수의 4분의 1을 넘을 수 없고, 상법상 자기주식 취득은 배당가능이익 범위에서 허용된다.[[NOTE:2025-2026년 상법 개정 논의로 자기주식 의무 소각 제도화가 추진되었다. 시험 기준일 현재 시행 여부를 확인한다.]]"], [3, "회사법", "기관", "주주총회의 결의에 관한 설명으로 옳은 것은?", ["정관 변경은 보통결의 사항이다.", "보통결의는 출석 주주 의결권의 과반수와 발행주식 총수의 4분의 1 이상으로 한다.", "이사의 선임은 특별결의 사항이다.", "특별결의는 출석 주주 의결권의 3분의 2 이상과 발행주식 총수의 과반수로 한다."], 1, "보통결의는 출석 의결권 과반수 + 발행주식 총수 4분의 1 이상, 특별결의는 출석 의결권 3분의 2 이상 + 발행주식 총수 3분의 1 이상이다. 정관 변경, 영업양도, 이사·감사 해임, 합병 등은 특별결의, 이사·감사 선임과 재무제표 승인은 보통결의 사항이다."], [3, "회사법", "기관", "이사와 이사회에 관한 설명으로 옳지 않은 것은?", ["대표이사는 반드시 주주총회에서 선임해야 한다.", "이사는 이사회 승인 없이 자기 또는 제3자 계산으로 회사 영업부류 거래를 할 수 없다.", "자본금 10억원 미만 회사는 이사를 1명 또는 2명으로 할 수 있다.", "이사의 임기는 3년을 초과하지 못한다."], 0, "대표이사는 원칙적으로 이사회 결의로 선임하며, 정관으로 주주총회에서 선임하도록 정할 수 있다. 이사 임기는 3년 이내, 소규모회사는 이사 1-2명이 가능하고, 이사는 경업금지·회사기회유용금지·자기거래 제한 의무를 진다.[[NOTE:2025년 개정 상법으로 이사의 충실의무 대상에 '주주'가 추가되고 상장회사 집중투표·감사위원 분리선출 확대 등이 순차 시행 중이다. 교재가 개정 전이면 해설과 차이가 있을 수 있다.]]"], [3, "회사법", "자본", "신주발행에 관한 설명으로 옳은 것은?", ["신주발행 무효의 소는 신주발행일로부터 1년 이내에 제기해야 한다.", "신주인수권은 양도할 수 없다.", "액면주식을 액면 미달로 발행하는 것은 어떠한 경우에도 금지된다.", "주주 외의 자에게 신주를 배정하려면 정관에 근거가 있고 경영상 목적을 달성하기 위해 필요한 경우여야 한다."], 3, "제3자배정은 정관 근거와 신기술 도입·재무구조 개선     if(done&&(j===x.a||j===ch)){m=document.createElement('span');m.className='mark';m.textContent=j===x.a?(j===ch?'정답 · 내 선택':'정답'):'내 선택';o.appendChild(m)}});
  card.querySelector('.explain').classList.toggle('show',done||expand);
  const r=card.querySelector('.result');r.textContent=done?(ok?'정답입니다.':`오답입니다. 내 선택 ${MARK[ch]}`):'정답 미리보기';r.className='result '+(done?(ok?'ok':'bad'):'peek');
  card.querySelector('.ans').textContent='정답 '+MARK[x.a];
}
function tally(s){const id=idxOf(s);const a=id.filter(i=>saved[i]!==undefined).length,c=id.filter(i=>saved[i]===Q[i].a).length;return{n:id.length,a,c,w:a-c}}
function stats(){['all',...SUBS].forEach(s=>{const t=tally(s),L=limit(s),el=$('pb-'+s);
  const st=t.w>L?'red':t.w===L?'yel':'grn';el.className='pb '+st;
  el.querySelector('.bar>span').style.width=(t.a/t.n*100)+'%';el.querySelector('.bar').setAttribute('aria-valuenow',Math.round(t.a/t.n*100));
  el.querySelector('.st').textContent=`${t.a}/${t.n} · 오답 ${t.w}/${L}${st==='red'?(s==='all'?' 불합격':' 과락'):st==='yel'?' 경계':''}`;})}
function visible(i){const x=Q[i];if(filter!=='all'&&x.s!==+filter)return false;if(wrongOnly&&!(saved[i]!==undefined&&saved[i]!==x.a))return false;return true}
function applyFilter(){let n=0;Q.forEach((x,i)=>{const v=visible(i);$('q'+i).classList.toggle('hidden',!v);if(v)n++});$('empty').classList.toggle('hidden',n>0)}
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const i=+b.closest('.qcard').dataset.i;if(saved[i]!==undefined)return;saved[i]=+b.dataset.j;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}paint(i);stats();if(!$('gradeBox').classList.contains('hidden'))grade(false)}));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.f;applyFilter()}));
$('wrongBtn').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);e.currentTarget.textContent=wrongOnly?'전체 문항 보기':'오답만 보기';applyFilter()};
$('expBtn').onclick=e=>{expand=!expand;e.currentTarget.setAttribute('aria-pressed',expand);e.currentTarget.textContent=expand?'해설 전체 접기':'해설 전체 펼치기';Q.forEach((_,i)=>paint(i))};
$('resetBtn').onclick=()=>{if(!confirm('응답 기록을 모두 초기화할까요?'))return;saved={};try{localStorage.removeItem(KEY)}catch(e){}Q.forEach((_,i)=>paint(i));stats();$('gradeBox').classList.add('hidden');applyFilter();scrollTo({top:0,behavior:'smooth'})};
function grade(scroll=true){
  const box=$('gradeBox'),T=tally('all');let pass=T.c>=Math.ceil(T.n*0.7-1e-9);
  const rows=SUBS.map(s=>{const t=tally(s),need=Math.ceil(t.n*0.5-1e-9),okS=t.c>=need;if(!okS)pass=false;
    const chs=[...new Set(idxOf(s).map(i=>Q[i].ch))].map(ch=>{const id=idxOf(s).filter(i=>Q[i].ch===ch),k=id.filter(i=>saved[i]===Q[i].a).length;return `${esc(ch)} ${k}/${id.length}`}).join(' · ');
    return `<div class="chrow"><span><b>제${s}과목</b><br><small>${SUBJ[s]}</small></span><div class="mini"><i style="width:${t.c/t.n*100}%;background:${okS?'var(--ok)':'var(--bad)'}"></i></div><span class="val">${t.c} / ${t.n} (${Math.round(t.c/t.n*100)}%) ${okS?'통과':'과락'}</span></div><div style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">${chs}</div>`}).join('');
  const wrong=Q.map((q,i)=>i).filter(i=>saved[i]!==undefined&&saved[i]!==Q[i].a);
  box.innerHTML=`<h2>채점 요약<span class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</span></h2><div class="score-big">${T.c}점<small>${T.c} / ${T.n} 정답 · 풀이 ${T.a} · 미풀이 ${T.n-T.a}(오답 처리)</small></div><div style="margin-top:14px">${rows}</div>`+
    (wrong.length?`<div class="wrongs"><b>틀린 문항</b><br>${wrong.map(i=>`<a data-go="${i}">Q${String(i+1).padStart(2,'0')}</a>`).join('')}</div>`:'');
  box.classList.remove('hidden');
  box.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{filter='all';wrongOnly=false;$('wrongBtn').setAttribute('aria-pressed','false');$('wrongBtn').textContent='오답만 보기';document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===0));applyFilter();$('q'+a.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})});
  if(scroll)box.scrollIntoView({behavior:'smooth',block:'center'});
}
$('gradeBtn').onclick=()=>grade(true);
Q.forEach((_,i)=>paint(i));stats();applyFilter();
</script>
</body>
</html>
