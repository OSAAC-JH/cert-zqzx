<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>증권자문 Copilot 모의고사04 - 증권투자권유자문인력</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#697286;--pri:#3f5efb;--pri2:#7b61ff;--ok:#13a66b;--bad:#db3a34;--yel:#e0a800;--line:#e5e8f0;--soft:#eef2ff;--warn:#fff6df;--warn-line:#f1dc9a;--warn-ink:#5b4a17;--ok-bg:#eafaf3;--ok-line:rgba(19,166,107,.4);--bad-bg:#fff0ef;--bad-line:rgba(219,58,52,.4);--stem:#f8fafc;--hover:#fafbff;--hover-line:#b8c2ff;--pill:#f2f4f8;--pill-ink:#5b6478;--head:rgba(255,255,255,.94);--shadow:0 8px 22px rgba(23,32,51,.05)}
html[data-theme=dark]{color-scheme:dark;--bg:#12131a;--card:#1b1d27;--ink:#eceef6;--muted:#a3a9bb;--pri:#8ea2ff;--pri2:#b39dff;--ok:#4cd694;--bad:#ff8782;--yel:#f5c84c;--line:#32364a;--soft:#262b4a;--warn:#2d2815;--warn-line:#5f5222;--warn-ink:#ecdca3;--ok-bg:#12301f;--ok-line:rgba(76,214,148,.5);--bad-bg:#3a1b1d;--bad-line:rgba(255,135,130,.5);--stem:#20232f;--hover:#232638;--hover-line:#5a67b8;--pill:#262a39;--pill-ink:#b6bdd0;--head:rgba(27,29,39,.94);--shadow:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:15px;line-height:1.65;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:12px 20px;width:100%}
.pgrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px}
.pb{min-width:0}.pb .lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.pb .lab b{color:var(--ink)}.pb .lab .st{overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;width:0;background:var(--ok);transition:width .25s,background .25s}
.pb.yel .bar>span{background:var(--yel)}.pb.red .bar>span{background:var(--bad)}
.pb.yel .lab .st{color:var(--yel)}.pb.red .lab .st{color:var(--bad)}.pb.grn .lab .st{color:var(--ok)}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.tab small{margin-left:4px;opacity:.75;font-weight:800}
.tab.active{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .tab.active{color:#10131f}
button:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
.hero{padding:26px 20px 6px}
.badge{display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:800;font-size:13px}
.hero h1{font-size:30px;letter-spacing:-.04em;margin:12px 0 8px;line-height:1.25}
.hero p{margin:0;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.sumcard b{display:block;font-size:22px;line-height:1.25}.sumcard span{color:var(--muted);font-size:13px}
.sumcard.total{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0}.sumcard.total b,.sumcard.total span{color:#fff}
.note{margin-top:14px;background:var(--warn);border:1px solid var(--warn-line);border-radius:16px;padding:13px 16px;color:var(--warn-ink);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .btn.primary{color:#10131f}
.btn[aria-pressed=true]{border-color:var(--pri);color:var(--pri);background:var(--soft)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:16px 0;padding:22px;box-shadow:var(--shadow);scroll-margin-top:170px;min-width:0;overflow-wrap:anywhere}
.qcard.is-ok{border-left:5px solid var(--ok)}.qcard.is-bad{border-left:5px solid var(--bad)}
.qtop{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--pill);color:var(--pill-ink);font-weight:700}
.pill.sj{background:var(--pri);color:#fff}html[data-theme=dark] .pill.sj{color:#10131f}
.pill.ch{background:var(--soft);color:var(--pri)}
.num{font-weight:900;color:var(--pri);flex:none}
.q{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px;line-height:1.55}
.opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);transition:.15s;min-width:0}
.opt span.t{min-width:0;flex:1}
.opt b{flex:none;color:var(--pri)}
.opt:hover:not(:disabled){border-color:var(--hover-line);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}.opt.correct b{color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}.opt.wrong b{color:var(--bad)}
.opt .mark{flex:none;font-size:12px;font-weight:900}
.opt.correct .mark{color:var(--ok)}.opt.wrong .mark{color:var(--bad)}
.explain{display:none;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--stem);border:1px solid var(--line)}
.explain.show{display:block}
.result{font-weight:900;margin-bottom:6px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.result.peek{color:var(--pri)}
.ans{font-weight:800;margin-bottom:6px}
.src{margin-top:10px;padding:10px 12px;border-left:3px solid var(--warn-line);background:var(--warn);color:var(--warn-ink);border-radius:8px;font-size:13.5px}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-width:100%;overflow-x:auto;font-family:"Cambria Math","Times New Roman",serif;font-size:16px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.frac .top{border-bottom:1.5px solid currentColor;padding:0 4px;line-height:1.3}.frac .bottom{padding:0 4px;line-height:1.3}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.gradebox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.gradebox h2{margin:0 0 6px;font-size:20px}
.verdict{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px;margin-left:8px;vertical-align:middle}
.verdict.pass{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}.verdict.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.score-big{font-size:34px;font-weight:900;color:var(--pri);letter-spacing:-.03em}
.score-big small{font-size:15px;color:var(--muted);font-weight:700;margin-left:6px}
.chrow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.chrow .mini{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.chrow .mini i{display:block;height:100%}
.chrow .val{font-weight:800;white-space:nowrap}
.wrongs{margin-top:14px}.wrongs a{display:inline-block;margin:3px 6px 3px 0;padding:3px 10px;border-radius:999px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
.hidden{display:none!important}
main{padding-bottom:50px}
@media(max-width:820px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.hero h1{font-size:24px}.wrap,.hero{padding-left:14px;padding-right:14px}.qcard{padding:17px;border-radius:18px;scroll-margin-top:200px}.q{font-size:16px}.chrow{grid-template-columns:110px minmax(0,1fr);}.chrow .val{grid-column:1/-1}}
@media print{header,.controls{display:none}.explain{display:block!important}.qcard{break-inside:avoid;box-shadow:none}}

.casebox,.bulletbox{margin:14px 0 4px;padding:14px 16px;border:1px solid var(--hover-line);border-left:5px solid var(--pri);border-radius:12px;background:var(--soft);display:grid;gap:9px}.caseitem{padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);line-height:1.62}.bulletbox{display:block;padding-left:36px}.bulletbox li{margin:7px 0;line-height:1.62}.lesson{display:grid;gap:10px;margin-top:10px}.lesson-row{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);line-height:1.65}.lesson-label{font-weight:800;color:var(--pri)}@media(max-width:640px){.lesson-row{grid-template-columns:1fr;gap:4px}.casebox{padding:11px}.q{line-height:1.68}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="pgrid"><div class="bars" id="bars"></div><button class="theme" id="theme" type="button"></button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="과목 필터"></div>
</div></header>
<section class="hero wrap">
  <span class="badge">실전응용·복합판단 100문항</span>
  <h1>증권투자권유자문인력<br>Copilot 모의고사 04</h1>
  <p>선택지를 누르면 정답 여부와 해설이 바로 열리고, 풀이 기록은 이 기기에 저장됩니다.</p>
  <div class="summary" id="summary"></div>
  <div class="note"><b>합격 기준</b><br>과목별 정답률 50% 이상, 총점 70% 이상이어야 합격입니다. 미풀이 문항은 오답으로 처리합니다. 상단 막대는 오답이 과락 경계에 도달하면 <b>노란색</b>, 경계를 넘으면 <b>빨간색</b>으로 바뀝니다.</div>
  <div class="controls">
    <button class="btn" id="wrongBtn" type="button" aria-pressed="false">오답만 보기</button>
    <button class="btn" id="expBtn" type="button" aria-pressed="false">해설 전체 펼치기</button>
    <button class="btn primary" id="gradeBtn" type="button">채점 요약 보기</button>
    <button class="btn" id="resetBtn" type="button">기록 초기화</button>
  </div>
</section>
<main class="wrap">
  <div id="questions"></div>
  <div class="empty hidden" id="empty">조건에 맞는 문항이 없습니다.</div>
  <div class="gradebox hidden" id="gradeBox"></div>
</main>
<script>
const RAW=[[1,"경기분석","개념응용","명목GDP와 실질GDP의 관계에 대한 설명으로 옳은 것은?",["GDP 디플레이터는 명목GDP를 실질GDP로 나눈 뒤 100을 곱해 구한다.","실질GDP는 당해 연도 가격으로 생산량을 평가한다.","명목GDP 증가율은 언제나 실질GDP 증가율보다 낮다.","기준연도가 바뀌어도 실질GDP 계열은 전혀 달라지지 않는다."],0,"GDP 디플레이터는 국내 생산물 전반의 가격수준을 명목GDP÷실질GDP×100으로 측정한다."],[1,"경기분석","복합판단","다음 경기지표의 일반적 움직임을 바르게 연결한 것은? [[BOX:(가) 재고순환지표가 개선되기 시작한다.||(나) 취업자 수가 경기 전환 뒤 늦게 반응한다.||(다) 산업생산이 현재 경기와 함께 움직인다.]]",["(가) 동행 · (나) 선행 · (다) 후행","(가) 선행 · (나) 후행 · (다) 동행","(가) 후행 · (나) 동행 · (다) 선행","(가) 선행 · (나) 동행 · (다) 후행"],1,"경기 전환을 먼저 비추는 지표는 선행, 현재 활동을 반영하면 동행, 고용처럼 늦게 반응하면 후행이다."],[1,"경기분석","개념응용","가속도원리에 관한 설명으로 가장 적절한 것은?",["소비 변화가 유발투자에 영향을 주지 않는다고 본다.","산출량 증가율이 둔화해도 투자는 항상 같은 폭으로 증가한다.","수요 증가에 필요한 자본스톡 조정 때문에 투자가 산출 변화보다 크게 변동할 수 있다.","이자율만이 투자를 결정한다고 본다."],2,"가속도원리는 산출 또는 수요의 변화가 필요한 자본스톡 조정을 거쳐 투자 변동을 증폭할 수 있다고 본다."],[1,"경기분석","심화응용","완전고용에 가까운 경제에서 정부지출 확대가 민간투자를 위축시킬 수 있는 경로로 옳은 것은?",["화폐수요 감소 → 이자율 하락 → 투자 감소","조세 감소 → 가처분소득 감소 → 투자 감소","통화공급 증가 → 이자율 상승 → 투자 감소","국채발행 증가 → 자금수요 증가 → 이자율 상승 → 투자 감소"],3,"정부의 자금수요가 시장금리를 높여 민간투자를 밀어내는 현상이 구축효과다."],[1,"경기분석","개념응용","단기 필립스곡선에 관한 설명으로 옳은 것은?",["단기에는 실업률과 인플레이션 사이에 상충관계가 나타날 수 있다.","예상인플레이션이 변해도 곡선의 위치는 변하지 않는다.","장기 필립스곡선은 자연실업률에서 수평이다.","공급충격은 인플레이션과 실업률을 같은 방향으로 움직일 수 없다."],0,"단기에는 수요 변화로 인플레이션과 실업률 사이의 상충관계가 나타날 수 있으나 장기에는 그 관계가 안정적이지 않다."],[1,"경기분석","복합판단","중앙은행의 정책금리 결정에 관한 보기 중 옳은 것만 고른 것은? [[BULLETS:ㄱ. 다른 조건이 같다면 실제 물가상승률이 목표를 웃돌수록 긴축 필요성이 커질 수 있다.||ㄴ. 산출갭이 음(-)이면 경기부양 필요성이 커질 수 있다.||ㄷ. 정책금리 인상은 일반적으로 총수요를 확대한다.]]",["ㄱ","ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],1,"물가의 목표 상회는 긴축, 음의 산출갭은 완화 요인이다. 금리 인상은 통상 총수요를 억제한다."],[1,"기본적 분석","계산응용","유동자산 240억원, 재고자산 60억원, 유동부채 120억원인 기업의 유동비율과 당좌비율은?",["유동비율 150% · 당좌비율 100%","유동비율 200% · 당좌비율 50%","유동비율 200% · 당좌비율 150%","유동비율 300% · 당좌비율 150%"],2,"유동비율은 240÷120=200%, 당좌비율은 (240-60)÷120=150%다."],[1,"기본적 분석","계산응용","매출액이 10% 증가할 때 영업이익이 25% 증가했다면 영업레버리지도(DOL)는?",["0.4","1.5","3.5","2.5"],3,"영업레버리지도는 영업이익 변화율÷매출액 변화율이므로 25%÷10%=2.5다."],[1,"기본적 분석","복합판단","A기업의 자료를 이용한 듀퐁분석 결과로 옳은 것은? [[BOX:매출액순이익률 6%||총자산회전율 1.5회||자기자본승수 2.0배]]",["ROA 9%, ROE 18%","ROA 4%, ROE 8%","ROA 12%, ROE 18%","ROA 9%, ROE 12%"],0,"ROA는 6%×1.5=9%, ROE는 9%×2.0=18%다."],[1,"기본적 분석","계산응용","ROE가 12%이고 배당성향이 25%로 일정할 때 내부성장요인을 단순화한 지속가능성장률은?",["3%","9%","6%","12%"],1,"사내유보율은 75%이므로 지속가능성장률은 ROE×유보율=12%×75%=9%다."],[1,"기본적 분석","개념응용","기업잉여현금흐름(FCFF)에 관한 설명으로 옳은 것은?",["채권자에게 이자를 지급한 뒤 주주에게만 귀속되는 현금흐름이다.","배당금과 항상 같은 금액이다.","영업활동으로 창출된 현금에서 영업에 필요한 투자 등을 차감한, 자금제공자 전체에 귀속되는 현금흐름이다.","감가상각비를 반드시 현금유출로 차감한다."],2,"FCFF는 영업성과에서 운전자본·설비투자 등을 반영한 뒤 채권자와 주주 전체에 귀속되는 현금흐름이다."],[1,"기본적 분석","개념응용","잔여이익모형에서 기업가치를 높이는 요인으로 가장 적절한 것은?",["ROE가 자기자본비용보다 낮은 상태의 장기 지속","장부가치의 무조건적 감소","요구수익률 상승","ROE와 자기자본비용의 차이가 양(+)으로 확대"],3,"잔여이익은 순이익에서 자기자본에 대한 요구보상을 차감한 값이므로 ROE가 자기자본비용을 웃돌수록 커진다."],[1,"기본적 분석","계산응용","제품 단가 5만원, 단위당 변동비 3만원, 연간 고정비 2억원일 때 손익분기점 판매량은?",["10,000개","5,000개","8,000개","20,000개"],0,"단위당 공헌이익은 2만원이고 손익분기점 수량은 2억원÷2만원=10,000개다."],[1,"기술적 분석","개념응용","OBV(On-Balance Volume)에 관한 설명으로 옳은 것은?",["가격만으로 과매수 여부를 계산한다.","상승일 거래량은 더하고 하락일 거래량은 빼 거래량 흐름을 누적한다.","단기이동평균과 장기이동평균의 차이다.","고가·저가·종가의 표준편차만 이용한다."],1,"OBV는 가격 등락 방향에 따라 거래량을 가감해 수급 흐름과 가격 추세의 확인·괴리를 살핀다."],[1,"기술적 분석","복합판단","MACD에 관한 보기 중 옳은 것만 고른 것은? [[BULLETS:ㄱ. 일반적으로 단기 지수이동평균에서 장기 지수이동평균을 차감한다.||ㄴ. MACD가 시그널선을 상향 돌파하면 강세 신호로 해석할 수 있다.||ㄷ. 횡보장에서는 잦은 거짓 신호가 나타날 수 있다.]]",["ㄱ","ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ"],2,"세 문장 모두 맞다. MACD는 추세 추종형이므로 방향성이 약한 장에서는 신호 신뢰도가 낮아질 수 있다."],[1,"기술적 분석","개념응용","볼린저밴드에 대한 설명으로 옳지 않은 것은?",["통상 이동평균선을 중심으로 표준편차를 이용해 상·하단 밴드를 만든다.","변동성이 확대되면 밴드 폭이 넓어질 수 있다.","밴드 폭은 시장 변동성 판단에 활용된다.","가격이 상단 밴드에 닿으면 이후 하락이 확정된다."],3,"밴드 접촉은 상대적 위치를 보여줄 뿐 반전이나 하락을 확정하지 않는다."],[1,"기술적 분석","개념응용","지지선이 유효하게 하향 돌파된 뒤 나타날 수 있는 현상으로 가장 적절한 것은?",["기존 지지선이 저항선으로 작용할 수 있다.","거래량과 무관하게 즉시 상승추세가 확정된다.","저점이 높아지므로 강세가 확정된다.","추세 개념을 적용할 수 없게 된다."],0,"돌파 뒤 역할 전환 원리에 따라 기존 지지 영역이 반등 시 저항 영역으로 바뀔 수 있다."],[1,"기술적 분석","복합판단","다음 상황에 대한 기술적 판단으로 가장 적절한 것은? [[BOX:주가는 전고점을 소폭 경신했다.||거래량은 이전 고점 형성 때보다 뚜렷하게 감소했다.||OBV는 전고점을 돌파하지 못했다.]]",["가격 상승이 거래량으로 확인된 전형적 강세다.","가격과 거래량 지표의 약세 다이버전스를 의심할 수 있다.","하락추세 종료가 확정된다.","거래량은 추세 판단과 관계없다."],1,"가격의 신고가를 거래량과 OBV가 확인하지 못하면 상승추세의 힘이 약해지는 다이버전스를 의심한다."],[1,"유가증권시장","개념응용","증권 발행에서 총액인수에 관한 설명으로 옳은 것은?",["미청약분을 발행인이 전부 부담한다.","발행사무만 대행하고 인수위험은 지지 않는다.","인수인이 발행증권 전부를 자기 책임으로 인수해 매출한다.","기존 주주에게만 배정할 때 사용하는 명칭이다."],2,"총액인수에서는 인수인이 발행증권 전부를 인수하므로 판매되지 않은 물량의 위험도 부담한다."],[1,"유가증권시장","계산응용","권리락 전 주가 12,000원, 신주발행가 8,000원이며 구주 4주당 신주 1주를 배정할 때 이론권리락 주가는?",["8,800원","10,000원","11,500원","11,200원"],3,"이론권리락 주가는 (12,000×4+8,000)÷5=11,200원이다."],[1,"유가증권시장","복합판단","다음 호가의 매매체결 우선순위를 바르게 설명한 것은? [[BOX:같은 종목의 매도호가 A: 10,000원·09:00:01 접수||매도호가 B: 9,900원·09:00:03 접수||매도호가 C: 9,900원·09:00:02 접수]]",["C → B → A","A → B → C","B → C → A","A → C → B"],0,"매도호가는 낮은 가격이 우선이고 같은 가격에서는 먼저 접수된 C가 B보다 앞선다."],[1,"유가증권시장","개념응용","시장가호가의 일반적 특징으로 가장 적절한 것은?",["체결가격보다 지정가격 준수를 우선한다.","가격을 지정하지 않고 상대호가와 신속한 체결을 추구한다.","미체결 잔량은 언제나 다음 날로 이월된다.","단일가매매에서는 제출할 수 없다."],1,"시장가호가는 가격 조건보다 즉시 체결 가능성을 우선하므로 예상보다 불리한 가격에 체결될 위험이 있다."],[1,"유가증권시장","개념응용","프로그램매매호가의 효력을 일시 정지하는 사이드카의 주된 목적은?",["상장법인의 공시를 면제한다.","개별 종목의 상장폐지를 확정한다.","파생시장 급변이 현물시장에 미치는 충격을 일시 완화한다.","모든 매매거래를 하루 동안 종료한다."],2,"사이드카는 선물가격 급변에 따른 프로그램매매 충격을 완화하기 위한 일시적 호가효력 정지 장치다."],[1,"유가증권시장","개념응용","공매도에 관한 설명으로 옳은 것은?",["소유하지 않은 증권을 매도하는 모든 행위는 언제나 허용된다.","공매도 손실은 최초 매도가격으로 제한된다.","결제의무가 발생하지 않는다.","차입한 증권을 매도하면 가격 하락 시 이익, 가격 상승 시 손실이 발생할 수 있다."],3,"공매도자는 이후 증권을 매수해 상환해야 하므로 가격이 오르면 손실이 커질 수 있다."],[1,"유가증권시장","복합판단","기업공개 과정의 수요예측에 관한 보기 중 옳은 것만 고른 것은? [[BULLETS:ㄱ. 기관투자자의 수요와 희망가격 정보를 파악하는 절차다.||ㄴ. 공모가격 결정의 참고자료가 될 수 있다.||ㄷ. 수요예측 참여 주문은 일반 청약자의 최종 배정과 항상 동일하다.]]",["ㄱ, ㄴ","ㄱ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ"],0,"수요예측은 기관 수요를 토대로 공모가격과 배정을 판단하는 절차이며 일반청약 배정과 동일한 개념이 아니다."],[1,"유가증권시장","개념응용","주식예탁증서(DR)에 관한 설명으로 옳은 것은?",["원주와 무관하게 발행되는 무담보채권이다.","해외 투자자가 원주를 직접 이전받지 않고도 예탁기관이 발행한 증서를 통해 투자할 수 있게 한다.","발행기업의 의결권과 배당권을 항상 소멸시킨다.","국내에서만 거래할 수 있다."],1,"DR은 원주를 예탁한 뒤 그 권리를 표시하는 증서를 발행해 국경 간 주식투자를 쉽게 한다."],[1,"코스닥시장","개념응용","코스닥시장의 기술성장기업 상장특례 취지로 가장 적절한 것은?",["현재 이익 규모만으로 모든 기업을 평가한다.","공시의무를 전부 면제한다.","기술성과 성장성이 있으나 이익요건 충족이 어려운 기업에 별도 심사경로를 제공한다.","상장 뒤 주가 하락을 거래소가 보전한다."],2,"기술상장특례는 현재 재무성과만으로 포착하기 어려운 기술력과 성장성을 별도 평가해 상장기회를 제공한다."],[1,"기타 증권시장","개념응용","코넥스시장의 지정자문인 제도에 관한 설명으로 옳은 것은?",["상장기업의 모든 경영판단을 대신한다.","투자자의 손실을 보전한다.","세무조사 권한을 가진다.","기업 발굴·상장 적격성 심사와 상장 후 공시·의무이행 지원 역할을 수행한다."],3,"지정자문인은 초기 중소기업의 상장 적격성을 살피고 상장 후 공시·시장규정 준수를 지원한다."],[1,"기타 증권시장","개념응용","K-OTC시장에 관한 설명으로 가장 적절한 것은?",["비상장주식의 장외거래를 일정한 규칙 아래 중개하는 시장이다.","거래소 유가증권시장과 동일한 상장시장이다.","모든 비상장주식이 자동으로 거래된다.","원금보장 상품만 거래된다."],0,"K-OTC는 비상장주식 거래의 투명성과 편의성을 높이기 위해 운영되는 제도권 장외시장이다."],[1,"채권시장","계산응용","1년 현물이자율이 4%, 2년 현물이자율이 연 5%일 때 복리 기준 1년 후부터 1년간의 선도이자율에 가장 가까운 것은?",["4.0%","6.0%","5.0%","10.0%"],1,"(1.05)^2=(1.04)(1+f)이므로 f는 약 6.0%다."],[1,"채권시장","개념응용","경과이자에 관한 설명으로 옳은 것은?",["채권의 액면가와 항상 같다.","무이표채에만 존재한다.","직전 이자지급일부터 결제일까지 발생한 이자에 해당한다.","매매수익률과 무관하므로 결제금액에 반영되지 않는다."],2,"이표채 매매 시 매수자는 직전 지급일 이후 누적된 이자 상당액을 매도자에게 보전한다."],[1,"채권시장","개념응용","다른 조건이 같은 두 채권 중 볼록성이 큰 채권에 대한 설명으로 옳은 것은?",["금리 하락 시 가격상승폭이 더 작고 금리 상승 시 가격하락폭이 더 크다.","금리 변화와 가격 변화가 항상 정비례한다.","듀레이션이 0이 된다.","금리 하락 시 가격상승폭이 더 크고 금리 상승 시 가격하락폭이 더 작다."],3,"양(+)의 볼록성이 클수록 같은 금리변화에서 상승 이점은 커지고 하락 손실은 완화된다."],[1,"채권시장","복합판단","수익률곡선의 큰 변화에 대비한 포트폴리오 구조 설명으로 옳은 것은? [[BOX:(가) 만기가 중간 구간에 집중된 포트폴리오||(나) 단기채와 장기채에 비중을 나누어 둔 포트폴리오]]",["(가) 불릿 · (나) 바벨","(가) 바벨 · (나) 불릿","(가) 래더 · (나) 불릿","(가) 바벨 · (나) 래더"],0,"중간 만기에 집중하면 불릿, 단기와 장기 양끝에 배분하면 바벨 전략이다."],[1,"채권시장","심화응용","금리가 하락할 때 발행자의 중도상환 가능성이 커지는 콜옵션부채권의 특성으로 옳은 것은?",["일반채권보다 항상 듀레이션이 길어진다.","투자자에게 유리한 가격상승이 제한될 수 있다.","콜옵션 가치는 금리 하락 시 감소한다.","재투자위험이 사라진다."],1,"금리 하락 시 발행자의 상환 유인이 커져 투자자의 가격상승 여력이 제한되고 재투자위험이 커질 수 있다."],[1,"기타 증권시장","복합판단","자산유동화 구조에 관한 설명으로 옳은 것은? [[BULLETS:ㄱ. 기초자산의 현금흐름이 원리금 지급재원이 된다.||ㄴ. 선·후순위 구조는 내부 신용보강 수단이 될 수 있다.||ㄷ. 자산의 진정매각은 자산보유자의 도산위험과 분리하는 데 중요하다.]]",["ㄱ","ㄱ, ㄴ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ"],2,"유동화는 기초자산 현금흐름, 신용보강, 도산절연 구조를 결합해 증권을 발행한다."],[2,"금융상품분석","개념응용","MMF에 관한 설명으로 가장 적절한 것은?",["주로 장기 주식에 집중 투자한다.","원금과 수익률을 법적으로 보장한다.","만기 전에는 환매할 수 없다.","단기금융상품 중심으로 운용해 유동성과 안정성을 추구한다."],3,"MMF는 단기 국공채·기업어음 등 단기금융상품을 중심으로 운용하지만 원금이 보장되는 예금은 아니다."],[2,"금융상품분석","계산응용","집합투자기구의 자산총액이 520억원, 부채총액이 20억원, 발행 좌수가 5,000만 좌일 때 1,000좌당 기준가격은?",["10,000원","1,000원","5,000원","100,000원"],0,"순자산은 500억원이고 1좌당 1,000원이므로 1,000좌당 기준가격은 10,000원이다."],[2,"금융상품분석","개념응용","ETF의 추적오차가 커질 수 있는 요인으로 가장 적절한 것은?",["기초지수의 존재 자체","운용보수와 거래비용","거래소 상장","순자산가치 공시"],1,"운용보수·매매비용·현금보유·복제방식 차이는 ETF 수익률이 기초지수와 어긋나는 원인이 된다."],[2,"금융상품분석","개념응용","ETN 투자자가 추가로 고려해야 할 고유 위험은?",["예금보험료 변동위험","실물 부동산 관리위험만","발행 증권회사의 신용위험","주주총회 의결권 희석위험"],2,"ETN은 발행사의 지급의무에 기초한 무담보 증권이므로 기초지수 위험 외에 발행사 신용위험이 있다."],[2,"금융상품분석","복합판단","파생결합상품의 설명을 바르게 연결한 것은? [[BOX:(가) 원금 일부 또는 전부를 예금으로 두고 지수 성과에 연계한 수익을 제공한다.||(나) 증권회사가 발행하고 주가 이외의 금리·원자재·신용 등을 기초로 수익이 결정될 수 있다.]]",["(가) ETF · (나) ELD","(가) DLS · (나) MMF","(가) ELF · (나) 예금","(가) ELD · (나) DLS"],3,"ELD는 예금, DLS는 증권으로 법적 성격과 발행주체·위험이 다르다."],[2,"금융상품분석","개념응용","금전신탁과 투자일임계약의 공통점으로 가장 적절한 것은?",["수탁자 또는 일임업자가 계약 범위에서 자산을 운용한다.","예금자보호가 항상 적용된다.","모든 고객 자산을 하나의 펀드로 합쳐야 한다.","투자자가 운용지시를 전혀 할 수 없다."],0,"두 제도 모두 계약에 따라 전문업자가 자산을 운용하지만 법적 구조와 재산 귀속 방식은 다르다."],[2,"금융상품분석","개념응용","상장리츠(REITs)의 일반적 특성으로 옳은 것은?",["채권자만 투자할 수 있다.","부동산 관련 자산에 투자하고 임대수익·매각이익을 배당재원으로 활용할 수 있다.","시장가격 변동위험이 없다.","실물 부동산보다 항상 유동성이 낮다."],1,"상장리츠는 부동산 간접투자수단으로 거래소에서 거래될 수 있어 직접투자보다 소액·분산투자가 용이하다."],[2,"금융상품분석","개념응용","변액연금보험에 관한 설명으로 옳은 것은?",["운용성과와 무관하게 모든 급부가 확정된다.","보험 기능이 없다.","특별계정 운용성과가 적립금에 영향을 줄 수 있다.","중도해지 비용이 발생할 수 없다."],2,"변액보험은 특별계정 성과가 적립금·보험금에 영향을 주며 사업비와 해지공제도 확인해야 한다."],[2,"금융상품분석","개념응용","주택연금의 기능으로 가장 적절한 것은?",["주택가격 하락 위험을 가입자가 전혀 부담하지 않는 단기예금이다.","주식투자 수익률을 보장한다.","주택 소유권을 가입 즉시 무조건 상실한다.","주택을 담보로 노후 현금흐름을 마련한다."],3,"주택연금은 보유주택을 활용해 정기적 노후소득을 확보하는 역모기지 성격의 제도다."],[2,"금융상품분석","복합판단","분산형 펀드 A와 집중형 펀드 B를 비교한 설명으로 옳은 것은? [[BOX:A: 여러 업종과 종목에 폭넓게 투자||B: 소수 성장주에 자산 대부분을 투자]]",["A는 비체계적 위험 완화 가능성이 B보다 크다.","B는 종목 고유위험이 자동으로 제거된다.","A는 시장위험까지 완전히 없앤다.","B는 손실 가능성이 없다."],0,"분산은 개별 종목 고유위험을 줄일 수 있지만 시장 전체의 체계적 위험까지 제거하지는 못한다."],[2,"투자전략","계산응용","자산 A와 B의 기대수익률이 각각 12%, 4%이고 A에 60%, B에 40% 투자할 때 포트폴리오 기대수익률은?",["6.4%","8.8%","8.0%","10.4%"],1,"가중평균 기대수익률은 0.6×12%+0.4×4%=8.8%다."],[2,"투자전략","계산응용","두 자산의 표준편차가 각각 10%, 20%, 상관계수가 0.5일 때 공분산은?",["0.001","0.1","0.01","1.0"],2,"공분산은 상관계수×표준편차의 곱이므로 0.5×0.10×0.20=0.01이다."],[2,"투자전략","계산응용","베타가 1.2인 주식에 40%, 베타가 0.8인 주식에 60% 투자한 포트폴리오의 베타는?",["0.80","1.00","1.20","0.96"],3,"포트폴리오 베타는 가중평균이므로 0.4×1.2+0.6×0.8=0.96이다."],[2,"투자전략","복합판단","다음 자료에서 펀드의 젠센 알파는? [[BOX:펀드수익률 11%||무위험수익률 3%||시장수익률 8%||펀드 베타 1.2]]",["2%","-2%","0%","5%"],0,"CAPM 요구수익률은 3%+1.2×(8%-3%)=9%이므로 알파는 11%-9%=2%다."],[2,"투자전략","개념응용","정보비율(Information Ratio)의 분모에 해당하는 것은?",["총위험","추적오차","하방편차","베타"],1,"정보비율은 벤치마크 대비 초과수익을 추적오차로 나누어 액티브 운용의 효율을 평가한다."],[2,"투자전략","개념응용","증권시장선(SML)보다 위에 위치한 증권에 대한 일반적 해석으로 옳은 것은?",["무위험자산보다 반드시 위험이 낮다.","알파가 음(-)이다.","베타에 비해 기대수익률이 높아 저평가된 상태로 볼 수 있다.","시장균형에서 항상 고평가다."],2,"SML 위의 증권은 체계적 위험에 비해 기대수익률이 높아 양(+)의 알파를 갖는 것으로 해석한다."],[2,"투자전략","개념응용","마코위츠 효율적 프런티어에 관한 설명으로 옳은 것은?",["같은 위험에서 기대수익률이 가장 낮은 포트폴리오 집합이다.","무위험자산만으로 구성된다.","투자자의 위험회피도와 무관하게 최적점이 하나로 고정된다.","지배되지 않는 포트폴리오 중 위험 대비 기대수익률이 우월한 경계다."],3,"효율적 프런티어는 동일 위험에서 기대수익률이 최대이거나 동일 수익률에서 위험이 최소인 포트폴리오의 집합이다."],[2,"투자전략","개념응용","정액분할투자에 관한 설명으로 가장 적절한 것은?",["가격이 낮을 때 더 많은 수량, 높을 때 더 적은 수량을 매수하는 효과가 있다.","상승장에서 일시투자보다 항상 높은 수익을 보장한다.","시장위험을 완전히 제거한다.","매수단가가 매 기간 최고가로 고정된다."],0,"일정 금액을 반복 투자하면 가격이 낮을 때 더 많은 수량을 사 평균매입단가를 평준화할 수 있으나 수익을 보장하지는 않는다."],[2,"투자전략","복합판단","다음 투자자의 자산배분 조정으로 가장 적절한 것은? [[BOX:은퇴까지 2년 남음||생활비 목적의 단기 현금수요가 큼||주가 급락을 감내하기 어려움]]",["고변동 성장주 비중을 대폭 확대한다.","유동성과 안정성을 고려해 현금성·우량채권 비중을 높인다.","레버리지 파생상품에 집중한다.","투자기간과 무관하게 위험자산 100%를 유지한다."],1,"짧은 투자기간과 낮은 위험감수도, 큰 유동성 수요에는 안정적·유동성 높은 자산 비중 확대가 부합한다."],[2,"투자전략","개념응용","대체투자 평가 시 유동성 프리미엄을 요구하는 이유로 가장 적절한 것은?",["시장가격을 언제나 실시간으로 확인할 수 있기 때문이다.","원금이 법적으로 보장되기 때문이다.","매각에 시간이 걸리고 거래비용이 커 원하는 시점에 현금화하기 어려울 수 있기 때문이다.","평가가치가 절대 변하지 않기 때문이다."],2,"낮은 유동성은 현금화 지연·가격충격·거래비용을 유발하므로 투자자는 추가 보상을 요구할 수 있다."],[2,"투자권유 및 고객관리","복합판단","적합성 원칙과 적정성 원칙의 적용을 바르게 연결한 것은? [[B function fml(src){const p=src.split('|');let h='';for(let i=0;i<p.length;i+=3){if(p[i])h+=`<span>${esc(p[i])}</span>`;if(p[i+1]!==undefined)h+=`<span class="frac"><span class="top">${esc(p[i+1])}</span><span class="bottom">${esc(p[i+2]||'')}</span></span>`}return `<div class="formula">${h}</div>`}
function rich(s){return String(s).split(/(\[\[[\s\S]*?\]\])/).map(seg=>{const m=seg.match(/^\[\[([\s\S]*)\]\]$/);if(!m)return esc(seg).replace(/\n/g,'<br>');const z=m[1];if(z.startsWith('NOTE:'))return `<div class="src"><b>📘 교재 기준 주석</b> ${esc(z.slice(5))}</div>`;if(z.startsWith('BOX:'))return `<div class="casebox">${z.slice(4).split('||').map(v=>`<div class="caseitem">${esc(v)}</div>`).join('')}</div>`;if(z.startsWith('BULLETS:'))return `<ul class="bulletbox">${z.slice(8).split('||').map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`;if(z.startsWith('LESSON:'))return `<div class="lesson">${z.slice(7).split('||').map(v=>{const p=v.split('｜');return `<div class="lesson-row"><span class="lesson-label">${esc(p.shift()||'학습 포인트')}</span><span>${esc(p.join('｜'))}</span></div>`}).join('')}</div>`;return fml(z)}).join('')}

function paint(i){

}
function tally(s){const id=idxOf(s);const a=id.filter(i=>saved[i]!==undefined).length,c=id.filter(i=>saved[i]===Q[i].a).length;return{n:id.length,a,c,w:a-c}}
function stats(){['all',...SUBS].forEach(s=>{const t=tally(s),L=limit(s),el=$('pb-'+s);
  const st=t.w>L?'red':t.w===L?'yel':'grn';el.className='pb '+st;
  el.querySelector('.bar>span').style.width=(t.a/t.n*100)+'%';el.querySelector('.bar').setAttribute('aria-valuenow',Math.round(t.a/t.n*100));
  el.querySelector('.st').textContent=`${t.a}/${t.n} · 오답 ${t.w}/${L}${st==='red'?(s==='all'?' 불합격':' 과락'):st==='yel'?' 경계':''}`;})}
function visible(i){const x=Q[i];if(filter!=='all'&&x.s!==+filter)return false;if(wrongOnly&&!(saved[i]!==undefined&&saved[i]!==x.a))return false;return true}
function applyFilter(){let n=0;Q.forEach((x,i)=>{const v=visible(i);$('q'+i).classList.toggle('hidden',!v);if(v)n++});$('empty').classList.toggle('hidden',n>0)}
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const i=+b.closest('.qcard').dataset.i;if(saved[i]!==undefined)return;saved[i]=+b.dataset.j;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}paint(i);stats();if(!$('gradeBox').classList.contains('hidden'))grade(false)}));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.f;applyFilter()}));
$('wrongBtn').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);e.currentTarget.textContent=wrongOnly?'전체 문항 보기':'오답만 보기';applyFilter()};
$('expBtn').onclick=e=>{expand=!expand;e.currentTarget.setAttribute('aria-pressed',expand);e.currentTarget.textContent=expand?'해설 전체 접기':'해설 전체 펼치기';Q.forEach((_,i)=>paint(i))};
$('resetBtn').onclick=()=>{if(!confirm('응답 기록을 모두 초기화할까요?'))return;saved={};try{localStorage.removeItem(KEY)}catch(e){}Q.forEach((_,i)=>paint(i));stats();$('gradeBox').classList.add('hidden');applyFilter();scrollTo({top:0,behavior:'smooth'})};
function grade(scroll=true){
  const box=$('gradeBox'),T=tally('all');let pass=T.c>=Math.ceil(T.n*0.7-1e-9);
  const rows=SUBS.map(s=>{const t=tally(s),need=Math.ceil(t.n*0.5-1e-9),okS=t.c>=need;if(!okS)pass=false;
    const chs=[...new Set(idxOf(s).map(i=>Q[i].ch))].map(ch=>{const id=idxOf(s).filter(i=>Q[i].ch===ch),k=id.filter(i=>saved[i]===Q[i].a).length;return `${esc(ch)} ${k}/${id.length}`}).join(' · ');
    return `<div class="chrow"><span><b>제${s}과목</b><br><small>${SUBJ[s]}</small></span><div class="mini"><i style="width:${t.c/t.n*100}%;background:${okS?'var(--ok)':'var(--bad)'}"></i></div><span class="val">${t.c} / ${t.n} (${Math.round(t.c/t.n*100)}%) ${okS?'통과':'과락'}</span></div><div style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">${chs}</div>`}).join('');
  const wrong=Q.map((q,i)=>i).filter(i=>saved[i]!==undefined&&saved[i]!==Q[i].a);
  box.innerHTML=`<h2>채점 요약<span class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</span></h2><div class="score-big">${T.c}점<small>${T.c} / ${T.n} 정답 · 풀이 ${T.a} · 미풀이 ${T.n-T.a}(오답 처리)</small></div><div style="margin-top:14px">${rows}</div>`+
    (wrong.length?`<div class="wrongs"><b>틀린 문항</b><br>${wrong.map(i=>`<a data-go="${i}">Q${String(i+1).padStart(2,'0')}</a>`).join('')}</div>`:'');
  box.classList.remove('hidden');
  box.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{filter='all';wrongOnly=false;$('wrongBtn').setAttribute('aria-pressed','false');$('wrongBtn').textContent='오답만 보기';document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===0));applyFilter();$('q'+a.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})});
  if(scroll)box.scrollIntoView({behavior:'smooth',block:'center'});
}
$('gradeBtn').onclick=()=>grade(true);
Q.forEach((_,i)=>paint(i));stats();applyFilter();
</script>
</body>
</html>
