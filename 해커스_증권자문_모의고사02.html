*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.65}.wrap{max-width:1080px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.head{padding:12px 20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;white-space:nowrap}.progress{flex:1;min-width:170px;height:9px;background:var(--line);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:.2s}.stat{font-size:13px;font-weight:800;color:var(--pri);white-space:nowrap}.iconbtn,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;font:inherit;font-weight:800;cursor:pointer}.iconbtn{padding:7px 10px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.tab.active{background:var(--pri);border-color:var(--pri);color:#fff}

bottom:1.5px solid currentColor;padding:0 9px 3px}.frac .bottom{padding:3px 9px 0}.delta,.mul{white-space:nowrap}.grade{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin:18px 0}.score{font-size:36px;font-weight:950;color:var(--pri)}.wronglinks button{margin:4px;border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--card));color:var(--bad);border-radius:99px;padding:5px 10px;cursor:pointer}footer{color:var(--muted);font-size:13px;padding:20px 20px 50px}

<section class="hero wrap"><span class="badge">증권투자권유자문인력 · 100문항</span><h1>제2회 적중 실전모의고사</h1><p>문항을 선택하면 정답과 함께 교재 해설을 확인할 수 있습니다.</p><div class="summary" id="summary"></div><div class="controls"><button class="btn" id="wrong" aria-pressed="false">오답만 보기</button><button class="btn primary" id="grade">채점 요약</button><button class="btn" id="reset">응답 초기화</button></div></section>

<script>const Q=[{"n": 1, "title": "거시경제지표에 대한 설명으로 잘못된 것은?", "options": ["<div>실물경제지표로는 국민소득계정(NIPA)과 국내총생산(GDP)이 있다.</div>", "<div>물가지수로는 소비자물가지수(CPI), 생산자물가지수(PPI), GDP 디플레이터 등이 있다.</div>", "<div>통화지표로는 M1, M2, Lf, L이 있다.</div>", "<div>통화유통속도의 경우 사후적으로 추계가 가능하며, 국내 통화유통속도는 장기적으로 상승하는 추세이다.</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 4}, {"n": 2, "title": "경기변동에 대한 설명으로 잘못된 것은?", "options": ["<div>루카스의 경우 완전 정보로 인하여 물가변화 같은 주요 경제변수들의 움직임을 정확히 예측할 수 있다고 전제하였다.</div>", "<div>프리드먼의 경우 경기순환현상이 나타나는 것은 통화당국의 자의적인 통화량 조절 때문이라고 하였다.</div>", "<div>케인즈의 경우 불안정한 총수요의 변화는 생산의 불안정한 변동을 유발한다고 하였다.</div>", "<div>슘페터의 경우 기술이나 생산성 변화와 같은 공급측면이 경기변동을 유발한다고 하였다.</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 1}, {"n": 3, "title": "프리드먼을 중심으로 하는 통화주의자들의 경기에 대한 주장으로 거리가 먼 것은?", "options": ["<div>경기순환의 원인을 기업가의 투자심리 또는 동물적 감각(Animal Spirit)에서 찾았다.</div>", "<div>경기조절을 위하여 준칙적 통화조절이 필요하다.</div>", "<div>경기조절을 위하여 총수요관리가 필요하다.</div>", "<div>경제는 완전고용 산출수준으로 회귀하려는 경향이 있다.</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 1}, {"n": 4, "title": "경기안정화 정책 관련 시차와 경기정책에 대한 설명으로 잘못된 것은?", "options": ["<div>외부시차는 정책을 실시한 시점부터 경제에 영향을 미칠 때까지의 시차를 말한다.</div>", "<div>케인즈학파는 외부시차로 인하여 총수요관리정책은 정확하다고 본다.</div>", "<div>통화정책은 외부시차가 상당히 길고 가변적이다.</div>", "<div>재정정책은 입법과정에서 국회의 동의가 필요하기 때문에 내부시차가 길다.</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 2}, {"n": 5, "title": "경기종합지수(CI)에 대한 설명으로 잘못된 것은?", "options": ["<div>경기변동의 방향, 전환점은 파악할 수 있으나 진폭까지는 알 수 없다.</div>", "<div>선행, 동행, 후행지수를 구분하여 발표한다.</div>", "<div>전월 대비 지표증감률이 (+)인 경우에는 경기상승을, (−)인 경우에는 경기하강을 의미한다.</div>", "<div>객관적이나 과거 데이터에 의존한다는 약점이 있다.</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 1}, {"n": 6, "title": "소비자동향지수(CSI)에 대한 설명으로 잘못된 것은?", "options": ["<div>기업경기실사지수(BSI)와 같이 0-200의 값을 갖는다.</div>", "<div>경기수축기에 기업실사지수(BSI)보다 일정 기간 선행하는 특성을 갖고 있어 경기수축국면 및 경기저점을 예측하는 데 유용하다.</div>", "<div>소비자의 구매의도나 구매태도, 전망 등을 설문조사하여 지수화한 것이다.</div>", "<div>지수가 90이라는 것은 경기를 긍정적으로 보는 소비자가 부정적으로 보는 소비자보다 많다는 것을 의미한다.</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 4}, {"n": 7, "title": "비율분석의 한계점에 대한 설명으로 잘못된 것은?", "options": ["<div>재무제표는 과거자료라는 한계가 있다.</div>", "<div>손익계산서와 재무상태표의 시간적 차이가 있다.</div>", "<div>자산·부채 인식기준의 차이가 있다.</div>", "<div>회계기준처리가 상이하다.</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 3}, {"n": 8, "title": "다음 보기의 재무비율과 그 구성이 올바르게 연결된 것은?", "options": ["<div>A-㉠, B-㉡, C-㉢, D-㉣</div>", "<div>A-㉡, B-㉢, C-㉠, D-㉣</div>", "<div>A-㉢, B-㉠, C-㉡, D-㉣</div>", "<div>A-㉣, B-㉡, C-㉠, D-㉢</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "<div class=\"tablewrap\"><table><thead><tr><th>구분</th><th>내용</th></tr></thead><tbody><tr><td>종류</td><td>A. 수익성 지표, B. 안정성 지표, C. 활동성 지표, D. 성장성 지표</td></tr><tr><td>구성</td><td>㉠ 총자산회전율, 고정자산회전율, 재고자산회전율<br>㉡ 총자본이익률, 자기자본이익률, 매출액영업이익률<br>㉢ 유동비율, 부채비율, 고정비율, 이자보상비율<br>㉣ 매출액증가율, 총자산증가율, 영업이익증가율</td></tr></tbody></table></div>", "answer": 2}, {"n": 9, "title": "A기업은 적정부채 수준의 결정 시 이자보상비율을 이용한다. 이 회사는 균형비율을 7.0으로 생각하고, 내년도 영업이익을 1억 4,000만원으로 기대하며, 부채규모는 1억원, 이자비용은 10%이다. 앞으로도 동일 이자율로 차입이 가능할 것으로 추정할 경우 내년에 추가적으로 이용할 수 있는 부채규모로 옳은 것은?", "options": ["<div>1억원</div>", "<div>1억 5,000만원</div>", "<div>2억원</div>", "<div>2억 5,000만원</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 1}, {"n": 10, "title": "다음 중 다른 조건이 일정할 경우 설명이 잘못된 것은?", "options": ["<div>PER은 기대되는 배당성향이 클수록 커지고, 이익성장률이 클수록 작아진다.</div>", "<div>PBR은 기업의 마진, 활동성, 부채레버리지, 기업수익력의 질적 측면을 반영한 지표이다.</div>", "<div>체계적 위험이 클수록, 위험 프리미엄이 높을수록 요구수익률이 높아진다.</div>", "<div>EVA는 자기자본 사용에 따른 기회비용을 감안한 성과측정 수단이다.</div>"], "subject": {"number": 1, "name": "증권분석 및 증권시장"}, "stem": "", "answer": 1}, {"n": 11, "title": "한 기업의 최근 재무자료로 다음 정보를 얻었다. 항상성장모형의 가정하에서 이 기업의 성장률로 옳은 것은?", "options": ["<div>4%</div>", "<div>6%</div>", "<div>8%</div>", "<div>12%</div>"], "subject": {"number": 1, "name": " const E={"1": "국내 통화유통속도는 장기적으로 하락하는 추세이다.", "2": "루카스의 경우 불완전 정보로 인하여 물가변화 같은 주요 경제변수들의 움직임을 정확히 예측할 수 없다고 전제하였다.", "3": "케인즈학파에서 경기순환의 원인으로 생각한 내용이다.", "4": "케인즈학파는 내부시차와 외부시차로 인하여 총수요관리정책은 부정확하고 부적절할 수 있다고 한다.", "5": "경기변동의 방향, 전환점은 물론 진폭(속도)까지도 파악할 수 있다.", "6": "지수가 90이라는 것은 경기를 긍정적으로 보는 소비자가 부정적으로 보는 소비자보다 적다는 것을 의미한다.", "7": "자산·부채 인식기준의 차이는 PBR이 1이 아닌 이유 중 하나이다.", "8": "<div class=\"tablewrap\"><table><thead><tr><th>구분</th><th>구성</th></tr></thead><tbody><tr><td>A. 수익성 지표</td><td>총자본이익률, 자기자본이익률, 매출액영업이익률</td></tr><tr><td>B. 안정성 지표</td><td>유동비율, 부채비율, 고정비율, 이자보상비율</td></tr><tr><td>C. 활동성 지표</td><td>총자산회전율, 고정자산회전율, 재고자산회전율</td></tr><tr><td>D. 성장성 지표</td><td>매출액증가율, 총자산증가율, 영업이익증가율</td></tr></tbody></table></div>", "9": "<span class=\"formula-line\"><span class=\"formula\">이자보상비율(7.0) = <span class=\"frac\"><span class=\"top\">영업이익(1억 4,000만원)</span><span class=\"bottom\">이자비용</span></span></span></span>이므로, 이자비용은 최대 2,000만원까지 부담할 수 있다. 현재 1억원 부채에 1,000만원(이자비용 10%)을 이자비용으로 부담하고 있으므로 다음 기에 최대 1억원의 추가 부채(1,000만원 이자비용)를 부담할 수 있다.", "10": "<span class=\"formula-line\"><span class=\"formula\">PER = <span class=\"frac\"><span class=\"top\">(1 − f)(1 + g)</span><span class=\"bottom\">k − g</span></span></span></span>이며, f는 유보율, (1 − f)는 배당성향, g는 이익성장률, k는 자본비용이다. 즉, 배당성향과 이익성장률이 클수록 PER은 커진다.", "11": "<span class=\"formula-line\"><span class=\"formula\">성장률 = 유보율 × 자기자본이익률 = (1 − 0.4) × <span class=\"frac\"><span class=\"top\">1백만원</span><span class=\"bottom\">5백만원</span></span> = 0.6 × 0.2 = 0.12</span></span>∴ 성장률은 12%이다.", "12": "② 추세반대방향 파동을 조정파라고 한다.<br>③ 일반적으로 3번 파동은 가장 짧은 파동이 될 수 없다.<br>④ a파동은 하락 시에 나타나는 파동으로 충격파이다.", "13": "② 저점을 중심으로 평균거래량은 증가한다.<br>③ 깃대형은 지속형 패턴이다.<br>④ 상승쐐기형은 주가의 하락반전 가능성을 시사한다.", "14": "중·장기이동평균선의 상승이 계속된 후 단기이동평균선이 하락세로 돌아서면 천정권으로 본다.", "15": "①②③은 주가 상승을 예고한다.", "16": "직접발행은 발행주체가 자기의 책임과 계산으로 발행위험과 발행사무를 모두 부담하는 방법이고, 간접발행은 발행주체가 중개인인 발행기관을 거쳐 발행하는 방법이다.", "17": "종류주식을 이익배당 및 잔여재산에 따라 구분하면 보통주, 우선주, 후배주, 혼합주 등으로 구분한다.", "18": "상장폐지는 거래소시장에서 상장된 증권에 대하여 유가증권시장에서 매매거래대상이 될 수 있는 적격성을 상실시키는 조치이고, 관리종목지정은 상장폐지의 우려가 있다고 판단되는 경우 사전예고 단계라고 할 수 있다.", "19": "주권상장법인은 공시의무사항이 아닌 경우에도 투자자의 투자판단에 중대한 영향을 미칠 수 있는 사항에 대하여 자율공시할 수 있다.", "20": "대용증권을 현금에 갈음하여 위탁증거금으로 활용할 수 있다.", "21": "주가지수가 전일종가지수에 대비하여 각각 8%, 15%, 20% 이상 하락하여 1분간 지속되면 Circuit Breakers를 발동한다.", "22": "프로그램매매 관리제도에는 프로그램매매호가 구분 표시, 지수차익잔고 공시, 선물·옵션 최종거래일의 사전신고, Side Car(프로그램매매호가의 효력 일시정지제도) 등이 있다.", "23": "우리나라는 실물결제방식, 차감결제방식, 집중결제방식을 채택하고 있다.", "24": "주주명부에 등록되기 위해서는 12월 28일까지 주식을 매수해야 한다.", "25": "공정공시대상 정보에는 장래 사업계획 또는 경영계획, 매출액, 영업손익 등에 대한 전망 또는 예측, 정기(사업·반기·분기)보고서 제출 이전의 영업실적, 수시공시사항 관련 중요정보 중 공시의무 시한이 미경과한 사항 등이 있다.", "26": "거래소는 코스닥 불성실공시법인에 대하여 10억원(유가증권시장의 불성실공시법인 경우 20억원) 한도 내에서 공시의무 위반제재금을 부과할 수 있다.", "27": "신종자본증권과 함께 후순위채로 분류된다.", "28": "이표채의 듀레이션은 다른 조건이 일정할 경우 표면이율이 커질수록 감소한다. 따라서 이 문제의 채권의 표면이율이 8%이고 채권의 듀레이션이 2.78년인데, 알고자 하는 채권의 표면이율은 10%이므로 2.78년보다 작아야 한다.", "29": "상승형에 대한 설명이다.", "30": "수익률곡선타기전략은 유동성선호가설과 관련이 깊다.", "31": "<span class=\"formula-line\"><span class=\"formula\">전환가격 = <span class=\"frac\"><span class=\"top\">액면가액</span><span class=\"bottom\">전환주 수</span></span> = <span class=\"frac\"><span class=\"top\">10,000원</span><span class=\"bottom\">5</span></span> = 2,000원</span></span><span class=\"formula-line\"><span class=\"formula\">패리티 = <span class=\"frac\"><span class=\"top\">주식의 시장가격</span><span class=\"bottom\">전환가격</span></span> × 100% = <span class=\"frac\"><span class=\"top\">1,500원</span><span class=\"bottom\">2,000원</span></span> × 100% = 75%</span></span>∴ 패리티 = 75%이다.", "32": "<span class=\"formula-line\"><span class=\"formula\">패리티 = <span class=\"frac\"><span class=\"top\">주식의 시장가격</span><span class=\"bottom\">전환가격</span></span> × 100% = <span class=\"frac\"><span class=\"top\">7,000원</span><span class=\"bottom\">전환가격</span></span> × 100% = 140%</span></span>∴ 전환가격은 5,000원이다.", "33": "새로 발행된 회사채를 기초자산으로 하는 ABS는 Primary CBO라고 하고, 기존에 발행된 채권을 기초자산으로 하는 ABS는 Secondary CBO라고 한다.", "34": "K-OTC시장의 불성실공시 유형에는 공시불이행, 공시번복, 허위공시 등이 있다.", "35": "조회공시 요구 시점이 오전인 경우 당일 오후까지, 요구 시점이 오후인 경우 다음 날 오전까지 답변해야 한다. 단, 매매거래정지가 수반된 경우에는 요구 시점과 관계없이 다음 날 오후 6시까지 답변할 수 있다.", "36": "증권펀드(집합투자기구)에 대한 설명이다.", "37": "주식워런트증권(ELW : Equity Linked Warrant)에 대한 설명이다.", "38": "랩어카운트는 자산운용방식과 투자대상이 다양하다.", "39": "CD는 예금자보호대상이 아니므로 외화예금과 정기예금의 원금 및 소정이율, 가계당좌예금의 원금 및 소정이율만 수령할 수 있다.", "40": "주식형 펀드는 약관상 주식·주가지수선물·옵션에 투자한 비율이 신탁재산의 60% 이상인 펀드이다.", "41": "수익증권은 실적배당상품으로 예금자보호대상이 아니다.", "42": "㉢ 전술적 자산배분은 기본적으로 자본시장의 과잉반응을 이용한 전략이다.<br>㉣ 합리적인 평가방법을 세우지 않고 절대수익률과 같은 시장상황에 좌우되는 평가방법을 제시할 경우 자금운용자들은 자연스럽게 시장수익률을 시장변화와 같은 방향으로 추적하게 되므로 역투자전략이 기본인 전술적 자산배분은 불가능하게 된다.", "43": "주가가 상승하는 시기에는 투자자의 위험선호도가 낮아지게 된다.", "44": "시장공동예측치 사용법에 대한 설명이다.", "45": "업그레이딩에 대한 설명이다.", "46": "기하평균수익률(GRR)에 대한 설명이다.", "47": "블랙리터만의 자산배분 모델에 대한 설명이다.", "48": "투자자의 시장전망을 반영하는 방법으로는 절대적 시장전망을 반영하는 방법, 상대적 시장전망을 반영하는 방법, 그룹 간 시장전망을 반영하는 방법이 있다.", "49": "투자자에게 투자권유를 하는 경우 금융투자상품의 내용, 투자에 따르는 위험, 투자상품의 투자성에 관한 구조와 성격, 수수료, 조기상환에 관한 사항, 계약 해제 또는 해지에 관한 사항 등을 투자자가 이해할 수 있도록 설명하고, 이를 서명 등의 방법으로 확인받아야 한다.", "50": "해외 집합투자기구에 투자하는 경우가 아니라 조건부자본증권에 투자하는 경우에 추가로 설명해야 할 사항이다.", "51": "④는 금지되는 행위이다.", "52": "확대형질문에 대한 설명이다.", "53": "반감은 또 하나의 관심의 표현이라고 할 수 있다.", "54": "금리 및 변동여부는 대출성 상품을 일반금융소비자에게 권유하는 경우에 설명해야 할 사항에 해당한다.", "55": "투자상담업무종사자가 이해관계자의 대리인이 되는 것은 금지된다.", "56": "설명했음에도 불구하고 투자자가 주요 손익 및 위험을 이해하지 못하면 투자권유를 중지해야 한다.", "57": "보고는 단순히 위임업무를 처리했다는 사실의 통지만으로는 부족하고, 그 보고에 의하여 고객이 업무처리내용을 구체적으로 알 수 있도록 해야 하고, 그에 따라 고객이 적절한 지시를 함에 있어서 필요한 구체적인 사항을 포함해야 한다. 예를 들어 주식 위탁매매를 위임받았다면 매매시기, 종목, 수량, 가격 등을 보고해야 한다.", "58": "금융투자업종사자는 회사, 주주 또는 고객과 이해상충이 발생할 수 있는 대외활동을 하고자 하는 경우 활동의 성격, 이해상충의 정도 등에 따라 소속 부점장, 준법감시인 또는 대표이사의 사전승인을 받아야 한다.", "59": "금융투자업자는 내부통제기준을 제정하거나 변경할 때 이사회의 결의를 거쳐야 하며, 이사회는 내부통제체계의 구축 및 운영에 관한 기준을 정해야 한다.", "60": "이해상충 가능성이 인정되는 경우 투자자보호에 문제가 없는 수준으로 낮춘 후에 거래해야 하고, 그것이 곤란한 경우에는 거래를 하지 말아야 한다.", "61": "개인정보의 처리정지, 정정, 삭제 및 파기를 요구할 수 있는 자는 개인정보처리자가 아니라 정보주체이다.", "62": "금융투자업자가 취급하는 대표적인 대출성 상품에는 신용거래융자, 신용대주, 증권담보대출, 청약자금대출 등이 있다.", "63": "금융소비자보호에 관한 내부통제조직은 이사회, 대표이사, 금융소비자보호 내부통제위원회, 금융소비자보호 총괄기관 등으로 구성된다.", "64": "자금세탁 위험이 낮은 고객은 고객확인 절차와 방법을 간소화하여 확인할 수 있으나 그 경우에도 고객신원확인은 해야 한다.", "65": "특정금융거래보고법상 자금세탁방지제도에는 고객확인제도, 의심스런 거래보고제도, 고액현금거래보고제도 등이 있다.", "66": "자본시장법은 신용공여를 원칙적으로 인정하되 인수업무와 관련된 일정한 경우에만 금지하고 있다.", "67": "증권은 원본을 초과한 손실 가능성이 없는 금융투자상품으로 채무증권, 지분증권, 수익증권, 투자계약증권, 증권예탁증권, 파생결합증권 등을 의미한다.", "68": "일반 회사채 증권을 취득하는 경우는 예외적으로 허용하는 경우에 해당하지 않는다.<br><b>참고</b> 대주주 발행증권 소유금지의 예외<br>· 대주주가 변경됨에 따라 이미 소유하고 있는 증권이 대주주가 발행한 증권으로 되는 경우<br>· 인수와 관련하여 해당 증권을 취득하는 경우<br>· 관련 법령에 따라 사채보증 업무를 할 수 있는 금융기관 등이 원리금의 지급을 보증하는 사채권을 취득하는 경우<br>· 특수채 증권을 취득하는 경우<br>· 그 밖에 금융투자업자의 경영건전성을 해치지 않는 경우로서 금융위원회가 정하여 고시하는 경우", "69": "투자매매업자 또는 투자중개업자만이 취급하는 증권에 대한 대차거래와 그 중개·주선·대리업무를 겸영할 수 있다.", "70": "단순히 당해 법인의 주식을 10년 보유했다고 하여 내부자가 되는 것은 아니다.", "71": "단기매매차익을 반환해야 하는 경우이다.", "72": "위험도가 높은 투자성 상품 또는 대출성 상품은 계약체결의 권유가 없는 경우에도 적정성 여부를 금융소비자에게 알려야 한다. 적합성 원칙은 금융상품판매업자의 계약체결의 권유가 있는 경우에만 적용되지만, 적정성 원칙은 소비자가 자발적으로 계약체결의사를 밝힌 경우에도 적용된다.", "73": "등록업무 단위는 인가업무 단위와 동일하나 인가제보다 진입규제가 완화되어 사업계획의 타당성, 건전성과 같은 적합성 기준이 적용되지 않는다.", "74": "수익증권은 공개매수규정이 적용되지 않는다. 일반적으로 공개매수규정이 적용되는 증권은 주권 및 주식으로 바뀔 수 있는 증권(신주인수권이 표시된 것, 전환사채권, 신주인수권부사채권, 교환사채권, 증권예탁증권 등)이다.", "75": "본인이 아닌 대리인에게 설명하는 경우, 설명의무 이행여부는 대리인 기준으로 판단한다.", "76": "흡수합병인 경우에는 합병한 날, 신설합병인 경우에는 상장일이 보고기준일이 된다.", "77": "매매주문 처리가 체결된 경우 지체 없이 투자자에게 통지하고 그 증빙을 3년 이상 보관·유지해야 한다.", "78": "금융투자업자는 영업용순자본을 총위험액 이상으로 유지해야 한다.", "79": "투자광고 포함사항(제4-11조①)에는 타 기관 등으로부터 수상, 선정, 인증, 특허 등을 받은 내용을 표기하는 경우 당해 기관의 명칭, 수상 등의 시기 및 내용, 과거의 재무상태 또는 영업실적을 표기하는 경우 투자광고 시점(또는 기간) 및 미래에는 이와 다를 수 있다는 내용, 최소비용을 표기하는 경우 그 최대비용(최대수익을 표기하는 경우 그 최소수익), 관련 법령·약관 등의 시행일 또는 관계 기관의 인·허가 전에 실시하는 광고의 경우 투자자가 당해 거래 또는 계약 등의 시기 및 조건 등을 이해하는 데에 필요한 내용, 통계수치나 도표 등을 인용하는 경우 해당 자료의 출처, 그 밖에 투자자보호를 위하여 필요한 사항으로서 협회가 정하는 사항 등이 있다.", "80": "집합투자재산, 투자일임재산 및 신탁재산의 구성내역과 운용에 관한 정보 중 2개월이 지난 정보에 대한 사내정보교류도 허용된다.", "81": "투자매매(중개)업자는 분쟁조정에 따라 손실을 배상하는 경우 손실을 보전하는 행위를 할 수 있다.", "82": "ETF는 파생결합증권이 아니라 수익증권이다.", "83": "정상인 경우에도 0.5%의 충당금을 적립해야 한다.", "84": "순자본비율이 0% 미만인 경우 경영개선명령 조치가 내려진다.", "85": "부과대상은 금융상품직접판매업자와 금융상품자문업자이다. 금융상품판매대리·중개업자의 위반행위는 판매를 대리·중개하게 한 금융상품직접판매업자에게 과징금을 부과한다.", "86": "펀드투자권유대행인은 파생상품펀드에 대한 투자권유를 하지 못한다.", "87": "청약하여 취득한 주식은 취득가액(단, 당해 주식이 상장된 후에는 당일 종가)으로 평가한다.", "88": "일반투자자가 시스템매매프로그램에 의하여 매매거래를 신청하는 경우 프로그램에 내재된 가격예측이론 및 사용방법 등에 대한 사전교육 이수 여부를 확인해야 하며, 별도의 신청서에 의하여 처리해야 한다.", "89": "고객 또는 그 대리인으로부터 매매주문을 수탁하는 행위는 허용되지 않는다.", "90": "회사는 실체구성 절차가 종료된 후 2주일 내에 설립등기를 해야 한다. 회사의 성립은 본점소재지에서 설립등기를 함으로써 성립한다. 즉, 설립등기는 실체가 완성된 회사가 법인격을 취득하기 위한 회사성립 요건이라고 할 수 있다. 설립등기는 회사가 성립된 사실과 그 조직의 중요한 내용을 공시함으로써 다수 이해관계인의 이익을 보호하고 거래의 안전을 도모하는 데 그 취지가 있다.", "91": "①③④는 보통결의사항이다.", "92": "② 1인 또는 2인도 가능하다.<br>③ 신탁관계 → 위임관계<br>④ 정관에서 달리 정하는 경우를 제외하고 이사회는 이사의 전부 또는 일부가 직접 회의에 출석하지 않고 모든 이사가 음성을 동시에 송수신하는 원격통신수단에 의하여 결의에 참가하는 것을 허용할 수 있다. 이 경우 당해 이사는 이사회에 직접 출석한 것으로 본다.", "93": "대표이사의 임기는 이사의 임기를 초과하지 못한다. 따라서 이사의 자격을 상실하면 대표이사의 지위도 종임하게 된다. 그러나 대표이사의 지위를 상실하였다고 하여 당연히 이사의 자격도 상실하는 것은 아니다.", "94": "현물배당도 가능하다.", "95": "사채권자집회는 사채를 발행한 회사 또는 사채관리회사가 소집한다.", "96": "보험금은 상속재산에 포함되므로 과세가액 산정 시 공제되지 않는다.", "97": "양도소득은 분류과세되는 소득으로 종합소득과 구분하여 각 소득별로 별도의 절차와 방법에 따라 소득세를 신고·납부한다.", "98": "사업소득이 있는 자는 매년 5월에 반드시 신고를 해야 한다.", "99": "국내사업장이나 부동산소득이 없는 비거주자는 국내원천소득을 분리과세한다.", "100": "비실명자산에 대한 소득으로 지급자가 금융기관인 경우 원천징수세율은 90%이다."};
const $=x=>document.getElementById(x);let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};let subject=0,wrongOnly=false;
const subjects=[{number:0,name:'전체',range:'01-100'},...Array.from(new Map(Q.map(q=>[q.subject.number,q.subject])).values()).map(s=>({...s,range:s.number===1?'01-35':s.number===2?'36-65':'66-100'}))];
function save(){localStorage.setItem(KEY,JSON.stringify(saved))}
function buildTabs(){tabs.innerHTML=subjects.map(s=>`<button class="tab ${s.number===subject?'active':''}" data-s="${s.number}">${s.number?`제${s.number}과목 · `:''}${s.name}<small> ${s.range}</small></button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{subject=+b.dataset.s;buildTabs();filter();scrollTo({top:0,behavior:'smooth'})})}
function render(){questions.innerHTML=Q.map(q=>`<article class="qcard" id="q${q.n}" data-n="${q.n}" data-s="${q.subject.number}"><div class="qtop"><span class="pill">제${q.subject.number}과목</span><span class="num">Q${String(q.n).padStart(2,'0')}</span></div><div class="qtitle">${q.title}</div><div class="stem">${q.stem}</div><div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i+1}"><span class="mark">${MARK[i]}</span><span>${o}</span></button>`).join('')}</div><div class="feedback"></div></article>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const c=b.closest('.qcard'),n=+c.dataset.n;if(saved[n])return;saved[n]=+b.dataset.i;save();paint(n);stats()});Q.forEach(q=>paint(q.n));filter();stats()}
function paint(n){const q=Q[n-1],c=$('q'+n),pick=saved[n],done=!!pick;c.classList.toggle('ok',done&&pick===q.answer);c.classList.toggle('bad',done&&pick!==q.answer);c.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=done;b.classList.toggle('correct',done&&i+1===q.answer);b.classList.toggle('wrong',done&&i+1===pick&&pick!==q.answer);b.querySelector('.tag')?.remove();if(done&&(i+1===q.answer||i+1===pick)){const t=document.createElement('span');t.className='tag';t.textContent=i+1===q.answer?'정답':'내 선택';b.appendChild(t)}});const f=c.querySelector('.feedback');f.classList.toggle('show',done);if(done)f.innerHTML=`<span class="result" style="color:var(--${pick===q.answer?'ok':'bad'})">${pick===q.answer?'정답입니다.':'오답입니다.'} 정답은 ${MARK[q.answer-1]}입니다.</span><div class="explain">${E[n]||'해설을 준비 중입니다.'}</div>`}
function filter(){Q.forEach(q=>{const v=(!subject||q.subject.number===subject)&&(!wrongOnly||(saved[q.n]&&saved[q.n]!==q.answer));$('q'+q.n).classList.toggle('hidden',!v)})}
function stats(){const done=Q.filter(q=>saved[q.n]).length,ok=Q.filter(q=>saved[q.n]===q.answer).length;$('stat').textContent=`${done} / 100 풀이 · ${ok} 정답`;$('bar').style.width=done+'%';$('summary').innerHTML=`<div class="sum"><b>100</b><span>전체 문항</span></div>`+subjects.slice(1).map(s=>{const a=Q.filter(q=>q.subject.number===s.number),d=a.filter(q=>saved[q.n]).length,k=a.filter(q=>saved[q.n]===q.answer).length;return `<div class="sum"><b>${k} / ${a.length}</b><span>제${s.number}과목 정답 · ${d}풀이</span></div>`}).join('')}
$('wrong').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);e.currentTarget.textContent=wrongOnly?'전체 문항 보기':'오답만 보기';filter()};
$('reset').onclick=()=>{if(confirm('모든 응답 기록을 초기화할까요?')){saved={};save();Q.forEach(q=>paint(q.n));stats();filter();gradebox.classList.add('hidden')}};
$('grade').onclick=()=>{const ok=Q.filter(q=>saved[q.n]===q.answer).length,done=Q.filter(q=>saved[q.n]).length,wrong=Q.filter(q=>saved[q.n]&&saved[q.n]!==q.answer);gradebox.innerHTML=`<h2>채점 요약</h2><div class="score">${ok}점</div><p>${ok} / 100 정답 · ${done}문항 풀이${done<100?' · 미풀이 문항은 0점 처리':''}</p>`+(wrong.length?`<div class="wronglinks"><b>오답 문항</b><br>${wrong.map(q=>`<button data-go="${q.n}">Q${String(q.n).padStart(2,'0')}</button>`).join('')}</div>`:'<p>현재까지 오답이 없습니다.</p>');gradebox.classList.remove('hidden');gradebox.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{subject=0;wrongOnly=false;buildTabs();filter();$('q'+b.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})});gradebox.scrollIntoView({behavior:'smooth'})};
function theme(t){document.documentElement.dataset.theme=t;$('theme').textContent=t==='dark'?'☀️':'🌙'}let th=localStorage.getItem(TKEY)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');theme(th);$('theme').onclick=()=>{th=document.documentElement.dataset.theme==='dark'?'light':'dark';theme(th);localStorage.setItem(TKEY,th)};
buildTabs();render();
</script></body></html>
