<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>제1과목 모의고사 2세트 - 증권분석 및 증권시장</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--bg2:#fff;--card:#fff;--ink:#172033;--muted:#697286;--pri:#3f5efb;--pri2:#7b61ff;--hard:#d9480f;--hard2:#f08c00;--ok:#13a66b;--bad:#db3a34;--line:#e5e8f0;--soft:#eef2ff;--warn:#fff6df;--warn-line:#f1dc9a;--warn-ink:#5b4a17;--ok-bg:#eafaf3;--ok-line:rgba(19,166,107,.4);--bad-bg:#fff0ef;--bad-line:rgba(219,58,52,.4);--stem:#f8fafc;--hover:#fafbff;--hover-line:#b8c2ff;--pill:#f2f4f8;--pill-ink:#5b6478;--head:rgba(255,255,255,.93);--shadow:0 8px 22px rgba(23,32,51,.05)}
html[data-theme=dark]{color-scheme:dark;--bg:#12131a;--bg2:#12131a;--card:#1b1d27;--ink:#eceef6;--muted:#a3a9bb;--pri:#8ea2ff;--pri2:#b39dff;--hard:#ff9f6e;--hard2:#ffc46b;--ok:#4cd694;--bad:#ff8782;--line:#32364a;--soft:#262b4a;--warn:#2d2815;--warn-line:#5f5222;--warn-ink:#ecdca3;--ok-bg:#12301f;--ok-line:rgba(76,214,148,.5);--bad-bg:#3a1b1d;--bad-line:rgba(255,135,130,.5);--stem:#20232f;--hover:#232638;--hover-line:#5a67b8;--pill:#262a39;--pill-ink:#b6bdd0;--head:rgba(27,29,39,.93);--shadow:none}
body.hard{--pri:var(--hard);--pri2:var(--hard2);--soft:#fff1e8;--hover:#fff8f3;--hover-line:#f4b48f}
html[data-theme=dark] body.hard{--soft:#3a2417;--hover:#2a2320;--hover-line:#a8693f}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg) 45%,var(--bg2));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:15px;line-height:1.65}
header{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:12px 20px}
.toprow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--pill);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--pri);color:#fff}
html[data-theme=dark] .seg button.on{color:#10131f}
.seg button small{opacity:.85;font-weight:700;margin-left:4px}
.progress-area{flex:1;min-width:200px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:width .25s}
.stat{font-weight:800;color:var(--pri);white-space:nowrap;font-size:13.5px}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:8px;margin-top:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.tab small{margin-left:4px;opacity:.75;font-weight:800}
.tab.active{background:var(--pri);border-color:var(--pri);color:#fff}
html[data-theme=dark] .tab.active{color:#10131f}
button:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
.hero{padding:28px 20px 8px}
.badge{display:inline-flex;gap:8px;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:800;font-size:13px}
.hero h1{font-size:31px;letter-spacing:-.04em;margin:14px 0 8px;line-height:1.28}
.hero p{margin:0;color:var(--muted)}
.lvbox{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:16px}
.lv{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:14px}
.lv b{display:block;margin-bottom:2px}.lv span{color:var(--muted);font-size:13px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin-top:14px}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.sumcard b{display:block;font-size:21px;line-height:1.25}.sumcard span{color:var(--muted);font-size:13px}
.sumcard.total{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0}.sumcard.total b,.sumcard.total span{color:#fff}
.note{margin-top:14px;background:var(--warn);border:1px solid var(--warn-line);border-radius:16px;padding:13px 16px;color:var(--warn-ink);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .btn.primary{color:#10131f}
.btn[aria-pressed=true]{border-color:var(--pri);color:var(--pri);background:var(--soft)}
main.wrap{padding-top:6px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:16px 0;padding:22px;box-shadow:var(--shadow);scroll-margin-top:150px}
.qcard.is-ok{border-left:5px solid var(--ok)}.qcard.is-bad{border-left:5px solid var(--bad)}
.qtop{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.meta{display:flex;gap:8px;flex-wrap:wrap}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--pill);color:var(--pill-ink);font-weight:700}
.pill.ch{background:var(--soft);color:var(--pri)}
.num{font-weight:900;color:var(--pri)}
.q{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px;line-height:1.6;white-space:pre-wrap}
.opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);transition:.15s}
.opt b{flex:none;color:var(--pri)}
.opt:hover:not(:disabled){border-color:var(--hover-line);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}.opt.correct b{color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}.opt.wrong b{color:var(--bad)}
.opt .mark{margin-left:auto;flex:none;font-size:12px;font-weight:900;padding-left:8px}
.opt.correct .mark{color:var(--ok)}.opt.wrong .mark{color:var(--bad)}
.explain{display:none;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--stem);border:1px solid var(--line)}
.explain.show{display:block}
.result{font-weight:900;margin-bottom:6px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.result.peek{color:var(--pri)}
.explain .ans{font-weight:800;margin-bottom:4px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.gradebox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.gradebox h2{margin:0 0 6px;font-size:20px}
.score-big{font-size:34px;font-weight:900;color:var(--pri);letter-spacing:-.03em}
.score-big small{font-size:14px;color:var(--muted);font-weight:700;margin-left:6px}
.chrow{display:grid;grid-template-columns:130px 1fr auto;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.chrow .mini{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.chrow .mini i{display:block;height:100%;background:var(--ok)}
.chrow .val{font-weight:800;white-space:nowrap}
.cmp{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.cmp div{flex:1;min-width:150px;border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--stem)}
.cmp b{display:block;font-size:20px}.cmp span{font-size:13px;color:var(--muted)}
.wrongs{margin-top:14px}.wrongs a{display:inline-block;margin:3px 6px 3px 0;padding:3px 10px;border-radius:999px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
.hidden{display:none!important}
footer{color:var(--muted);font-size:13px;padding:10px 20px 50px}
@media(max-width:700px){.hero h1{font-size:24px}.wrap{padding-left:14px;padding-right:14px}.hero{padding-left:14px;padding-right:14px}.progress-area{grid-template-columns:1fr;gap:4px}.qcard{padding:17px;border-radius:18px}.q{font-size:16px}.chrow{grid-template-columns:100px 1fr auto}.seg button{padding:6px 10px;font-size:13px}}
@media print{header,.controls,.theme{display:none}.explain{display:block!important}.qcard{break-inside:avoid;box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="toprow">
    <div class="seg" id="seg" role="tablist" aria-label="세트 선택">
      <button type="button" data-set="1" class="on" role="tab">SET 1<small>표준</small></button>
      <button type="button" data-set="2" role="tab">SET 2<small>고난도</small></button>
    </div>
    <div class="progress-area"><div class="bar" role="progressbar" aria-label="풀이 진행률" aria-valuemin="0" aria-valuemax="100"><span id="progress"></span></div><div class="stat" id="stat"></div></div>
    <button class="theme" id="theme" type="button"></button>
  </div>
  <div class="tabs" id="tabs" role="tablist" aria-label="장별 필터"></div>
</div></header>

<section class="hero wrap">
  <span class="badge" id="badge"></span>
  <h1>증권분석 및 증권시장<br>모의고사 2세트</h1>
  <div class="lvbox">
    <div class="lv"><b>SET 1 · 표준 난이도</b><span>정의·분류·기준값 확인과 1단계 계산. 학습노트의 핵심 개념을 실전 형식으로 점검합니다.</span></div>
    <div class="lv"><b>SET 2 · 고난도</b><span>2~3단계 계산, ㄱㄴㄷ 복합 진술, 상황 매칭, 수치 함정이 많은 문항으로 구성했습니다.</span></div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="controls">
    <button class="btn" id="wrongBtn" type="button" aria-pressed="false">오답만 보기</button>
    <button class="btn" id="expBtn" type="button" aria-pressed="false">해설 전체 펼치기</button>
    <button class="btn primary" id="gradeBtn" type="button">채점 요약 보기</button>
    <button class="btn" id="resetBtn" type="button">이 세트 기록 초기화</button>
  </div>
</section>

<main class="wrap">
  <div id="questions"></div>
  <div class="empty hidden" id="empty">조건에 맞는 문항이 없습니다.</div>
  <div class="gradebox hidden" id="gradeBox"></div>
</main>
<footer class="wrap">학습용 모의고사입니다. 제도·수치(호가단위, 가격제한폭, 결제주기, 시장 상장요건 등)는 시험 직전 한국거래소·금융투자협회의 최신 기준과 대조하세요.</footer>

<script>
const SETS={1:[{"ch": "경기분석", "type": "순환 측정", "q": "경기순환에서 ‘확장기간’을 바르게 설명한 것은?", "o": ["정점에서 저점까지의 기간(후퇴기 + 불황기)", "저점에서 정점까지의 기간(회복기 + 호황기)", "저점에서 다음 저점까지의 기간", "정점과 저점의 높이 차이"], "a": 1, "e": "확장기간은 저점→정점, 수축기간은 정점→저점이다. 저점→다음 저점은 순환주기, 정점과 저점의 높이 차이는 진폭이다."}, {"ch": "경기분석", "type": "물가지수", "q": "명목GDP가 2,400조원, 실질GDP가 2,000조원일 때 GDP 디플레이터는?", "o": ["83.3", "100", "200", "120"], "a": 3, "e": "GDP 디플레이터 = 명목GDP ÷ 실질GDP × 100 = 2,400 ÷ 2,000 × 100 = 120. 거꾸로 나누면 83.3이 된다."}, {"ch": "경기분석", "type": "통화지표", "q": "M2(광의통화)에는 포함되지만 M1(협의통화)에는 포함되지 않는 것은?", "o": ["만기 2년 미만의 정기예적금", "현금통화", "요구불예금", "수시입출식 저축성예금"], "a": 0, "e": "M1 = 현금통화 + 요구불예금 + 수시입출식 저축성예금. M2는 여기에 만기 2년 미만 정기예적금, CD·MMF 등을 더한 것이다."}, {"ch": "경기분석", "type": "경기변동이론", "q": "예상하지 못한 통화충격과 합리적 기대(루카스의 오인모형)를 강조하는 학파는?", "o": ["케인즈학파", "새케인즈학파", "새고전학파", "실물경기변동이론"], "a": 2, "e": "새고전학파는 합리적 기대 아래 ‘예상치 못한’ 통화충격만 실물에 영향을 준다고 본다. 실물경기변동이론은 기술 등 실물충격을 원인으로 본다."}, {"ch": "경기분석", "type": "파급경로", "q": "토빈의 q가 1보다 클 때의 의미로 옳은 것은?", "o": ["시장가치가 재구입비용보다 작아 설비투자가 줄어든다", "기업의 시장가치가 자본의 재구입비용보다 커서 신규 설비투자가 유리해진다", "통화량이 감소하고 있음을 뜻한다", "원화가치가 하락하고 있음을 뜻한다"], "a": 1, "e": "q = 기업의 시장가치 ÷ 자본의 재구입비용. q > 1이면 새 설비를 사는 것이 수익성이 있어 투자가 늘고, q < 1이면 기존 기업 인수가 유리하다."}, {"ch": "경기분석", "type": "경기예측", "q": "기업경기실사지수(BSI)에 대한 설명으로 옳은 것은?", "o": ["기준값은 50이다", "경기수준과 진폭을 직접 알 수 있다", "0~200의 범위에서 100을 넘으면 긍정 응답이 우세함을 뜻한다", "공식 통계에 기반하므로 주관성이 없다"], "a": 2, "e": "BSI는 기업가의 판단을 묻는 설문 지수로 기준값은 100이다(DI의 기준값이 50). 경기국면은 알 수 있으나 수준·진폭은 알 수 없다."}, {"ch": "기본적 분석", "type": "분석 접근", "q": "하향식(Top-down) 분석의 순서로 옳은 것은?", "o": ["경제 → 산업 → 기업", "기업 → 산업 → 경제", "산업 → 기업 → 경제", "기업 → 경제 → 산업"], "a": 0, "e": "하향식 분석은 큰 흐름(경제)에서 산업, 개별 기업으로 투자대상을 좁혀 간다."}, {"ch": "기본적 분석", "type": "재무비율", "q": "유동자산이 450억원, 유동부채가 300억원일 때 유동비율은?", "o": ["66.7%", "100%", "150%", "200%"], "a": 2, "e": "유동비율 = 유동자산 ÷ 유동부채 × 100 = 450 ÷ 300 × 100 = 150%. 높을수록 단기 지급능력이 좋다."}, {"ch": "기본적 분석", "type": "수익성", "q": "ROE를 올바르게 분해한 식은?", "o": ["ROE = ROI × (자기자본 ÷ 총자본)", "ROE = 매출액순이익률 × 총자본", "ROE = ROI ÷ 총자본회전율", "ROE = ROI × (총자본 ÷ 자기자본)"], "a": 3, "e": "ROE = 순이익/자기자본 = ROI × 총자본/자기자본(재무레버리지). ROI는 다시 매출액순이익률 × 총자본회전율로 분해된다."}, {"ch": "기본적 분석", "type": "배당평가", "q": "올해 배당 D₀가 1,000원이고 매년 5%씩 일정하게 성장한다. 요구수익률이 10%일 때 정률성장모형의 이론 주가는?", "o": ["10,500원", "21,000원", "11,000원", "20,000원"], "a": 1, "e": "D₁ = 1,000 × 1.05 = 1,050원. P₀ = D₁ ÷ (k − g) = 1,050 ÷ (0.10 − 0.05) = 21,000원. D₀를 그대로 쓰면 20,000원이 되어 오답이다."}, {"ch": "기본적 분석", "type": "PER", "q": "이론 PER을 높이는 요인의 조합으로 옳은 것은?", "o": ["배당성향 상승, 이익성장률 상승, 요구수익률 하락", "배당성향 하락, 성장률 하락, 요구수익률 상승", "배당성향 상승, 성장률 하락, 요구수익률 상승", "요구수익률만 상승"], "a": 0, "e": "이론 PER = 배당성향 × (1+g) ÷ (k − g). 많이 나누고(배당성향↑), 빨리 크고(g↑), 덜 할인할수록(k↓) PER은 커진다."}, {"ch": "기술적 분석", "type": "다우이론", "q": "다우이론에서 강세시장의 3국면을 순서대로 나열한 것은?", "o": ["분산국면 → 공포국면 → 침체국면", "상승국면 → 매집국면 → 과열국면", "매집국면 → 상승국면 → 과열국면", "과열국면 → 상승국면 → 매집국면"], "a": 2, "e": "강세시장은 매집→상승→과열, 약세시장은 분산→공포→침체 순으로 진행한다."}, {"ch": "기술적 분석", "type": "엘리엇", "q": "엘리엇 파동이론의 규칙으로 옳은 것은?", "o": ["2파는 1파의 출발점 아래로 내려갈 수 있다", "3파는 1·3·5파 중 가장 짧을 수 없다", "4파는 항상 1파의 가격영역과 겹친다", "충격파는 2파와 4파이다"], "a": 1, "e": "충격파는 1·3·5파, 조정파는 2·4파이다. 2파는 1파 출발점 아래로 내려가지 않고, 4파는 일반적으로 1파와 겹치지 않으며, 3파는 가장 짧을 수 없다."}, {"ch": "기술적 분석", "type": "이동평균", "q": "정배열 상태를 바르게 설명한 것은?", "o": ["위에서 아래로 장기선 > 중기선 > 단기선 > 주가 순이다", "단기선이 장기선을 아래에서 위로 막 돌파한 상태이다", "모든 이동평균선이 한 점에서 만난 상태이다", "위에서 아래로 주가 > 단기선 > 중기선 > 장기선 순이다"], "a": 3, "e": "정배열은 주가와 단기·중기·장기선이 위에서 아래로 배열된 상승구조이고, 역배열은 그 반대이다. 단기선의 상향 돌파는 골든크로스다."}, {"ch": "기술적 분석", "type": "지표 계산", "q": "분석기간의 평균 상승폭이 6, 평균 하락폭이 4일 때 RSI는?", "o": ["60", "40", "50", "150"], "a": 0, "e": "RSI = 평균 상승폭 ÷ (평균 상승폭 + 평균 하락폭) × 100 = 6 ÷ 10 × 100 = 60. 70 이상이면 과매수, 30 이하면 과매도로 본다."}, {"ch": "유가증권시장", "type": "시장 구조", "q": "발행시장의 기능으로 옳은 것은?", "o": ["이미 발행된 증권의 환금성을 제공한다", "투자자끼리 증권을 사고판다", "공정한 시세 형성만을 담당한다", "투자자의 자금이 발행인에게 신규로 이전된다"], "a": 3, "e": "발행시장은 신규 자금조달, 유통시장은 유동성 제공과 가격 형성을 담당한다."}, {"ch": "유가증권시장", "type": "발행형태", "q": "이미 발행된 증권을 50인 이상의 투자자에게 매도하도록 청약을 권유하는 것은?", "o": ["모집", "매출", "사모", "모집주선"], "a": 1, "e": "모집은 새로 발행되는 증권, 매출은 이미 발행된 증권을 50인 이상 대상으로 청약 권유하는 것이다."}, {"ch": "유가증권시장", "type": "인수방식", "q": "잔액인수에서 인수기관이 부담하는 위험은?", "o": ["모집·매출 후 남은(미매각) 물량만 인수한다", "발행총액 전량을 인수한다", "판매를 주선할 뿐 인수 위험은 지지 않는다", "발행인이 전부 부담하고 인수기관은 아무 책임이 없다"], "a": 0, "e": "총액인수는 전량 인수, 잔액인수는 미매각분만 인수, 모집주선은 위험을 부담하지 않고 판매만 주선한다."}, {"ch": "유가증권시장", "type": "유상증자", "q": "기존 주주에게 먼저 청약기회를 주고, 실권주는 일반투자자 대상 공모로 처리하는 방식은?", "o": ["주주배정", "일반공모", "주주우선공모", "제3자배정"], "a": 2, "e": "주주배정은 기존 주주에게만, 일반공모는 기존 주주 우선권 없이 일반 투자자에게, 제3자배정은 특정 제3자에게 배정한다."}, {"ch": "유가증권시장", "type": "호가단위", "q": "주가가 43,000원인 종목의 호가가격단위는?", "o": ["10원", "50원", "100원", "500원"], "a": 1, "e": "2만원 이상 5만원 미만 구간의 호가가격단위는 50원이다(5만원 이상 100원, 20만원 이상 500원, 50만원 이상 1,000원)."}, {"ch": "유가증권시장", "type": "공시", "q": "특정인에게 먼저 공개한 중요 정보를 시장 참가자에게 공평하게 알리는 공시는?", "o": ["자율공시", "조회공시", "정기공시", "공정공시"], "a": 3, "e": "공정공시는 정보의 동시성·공평성을 위한 제도이다. 조회공시는 거래소가 풍문·보도의 사실 여부를 묻는 공시다."}, {"ch": "유가증권시장", "type": "시장관리", "q": "개별 종목의 가격이 급변할 때 일정 시간 단일가매매로 전환하여 냉각기간을 주는 장치는?", "o": ["변동성완화장치(VI)", "서킷브레이커", "사이드카", "정리매매"], "a": 0, "e": "VI는 개별 종목, 서킷브레이커는 시장 전체 급락, 사이드카는 선물시장 급변에 따른 프로그램매매 호가 효력 제한 장치다."}, {"ch": "유가증권시장", "type": "청산결제", "q": "국내 주식의 일반적인 결제주기는?", "o": ["T (당일)", "T+1", "T+2 (거래일 이후 2영업일)", "T+5"], "a": 2, "e": "국내 주식은 매매 체결일 이후 2영업일에 결제한다. 청산(채권·채무 확정) 뒤에 결제(증권·대금 이전)가 이루어진다."}, {"ch": "코스닥시장", "type": "시장 구조", "q": "코스닥시장에 대한 설명으로 옳은 것은?", "o": ["금융투자협회가 운영하는 장외시장이다", "한국거래소가 운영하는 장내시장이며 경쟁매매 방식이다", "상대매매 방식으로 거래된다", "비상장기업만 거래되는 시장이다"], "a": 1, "e": "코스닥은 거래소가 운영하는 장내시장이다. 협회가 운영하는 장외시장은 K-OTC이다."}, {"ch": "코스닥시장", "type": "상장 종류", "q": "증자·주식배당 등으로 이미 상장된 종목에 주식을 더하여 상장하는 것은?", "o": ["추가상장", "신규상장", "재상장", "변경상장"], "a": 0, "e": "신규상장은 처음 진입, 추가상장은 기존 종목에 주식 추가, 변경상장은 상장 주식의 내용 변경, 재상장은 상장 이력 후 분할·합병 등으로 다시 상장하는 것이다."}, {"ch": "코스닥시장", "type": "우회상장", "q": "비상장기업이 상장기업과의 합병·주식교환·영업양수 등을 통해 실질적으로 시장에 진입하는 방식은?", "o": ["추가상장", "재상장", "기업공개(IPO)", "우회상장"], "a": 3, "e": "우회상장은 상장요건을 우회하는지, 결합의 실질과 지배력 변화를 거래소가 심사한다."}, {"ch": "채권시장", "type": "채권 가격", "q": "액면 10,000원, 잔존만기 2년인 할인채(무이표채)의 만기수익률이 연 10%(연 복리)일 때 이론가격은?", "o": ["약 8,000원", "약 9,000원", "약 8,264원", "약 9,091원"], "a": 2, "e": "10,000 ÷ 1.1² = 10,000 ÷ 1.21 ≈ 8,264원. 1.1로 한 번만 나누면 9,091원이 되어 오답이다."}, {"ch": "채권시장", "type": "채권 위험", "q": "금리가 상승할 때 이표채에 나타나는 효과로 옳은 것은?", "o": ["채권가격은 하락하고 이자의 재투자수익은 증가한다", "채권가격과 재투자수익이 모두 증가한다", "채권가격은 상승하고 재투자수익은 감소한다", "채권가격과 재투자수익이 모두 감소한다"], "a": 0, "e": "이표채의 이자율위험은 가격위험과 재투자위험의 결합이며 금리 변화는 둘에 반대 방향으로 작용한다."}, {"ch": "채권시장", "type": "듀레이션", "q": "듀레이션에 관한 설명으로 옳은 것은?", "o": ["이표채의 듀레이션은 잔존기간보다 길다", "무이표채의 듀레이션은 잔존기간과 같다", "이자지급빈도가 높을수록 듀레이션이 길어진다", "만기수익률이 높을수록 듀레이션이 길어진다"], "a": 1, "e": "무이표채는 만기에만 현금흐름이 있어 듀레이션 = 잔존기간이고, 이표채는 중간 이자 때문에 잔존기간보다 짧다. 이자지급빈도·만기수익률이 높으면 듀레이션은 짧아진다."}, {"ch": "채권시장", "type": "듀레이션 계산", "q": "맥컬리 듀레이션이 3.3년이고 만기수익률이 연 10%일 때 수정듀레이션은?", "o": ["2.7", "3.3", "3.63", "3.0"], "a": 3, "e": "수정듀레이션 = 맥컬리 듀레이션 ÷ (1 + y) = 3.3 ÷ 1.1 = 3.0."}, {"ch": "채권시장", "type": "수익률곡선", "q": "장기채에는 기간(유동성) 프리미엄이 붙어 수익률곡선이 우상향하기 쉽다고 설명하는 가설은?", "o": ["불편기대가설", "시장분할가설", "유동성선호가설", "효율적시장가설"], "a": 2, "e": "불편기대가설은 위험중립·완전대체, 시장분할가설은 만기별 시장이 분리되었다고 본다. 유동성선호가설은 투자자가 장기채를 더 위험하게 봐 프리미엄을 요구한다고 본다."}, {"ch": "채권시장", "type": "투자전략", "q": "소극적 채권투자전략에 해당하는 것은?", "o": ["현금흐름 일치전략", "수익률 예측전략", "채권교체전략", "수익률곡선 타기전략"], "a": 0, "e": "적극적 전략은 수익률 예측·채권교체·수익률곡선 타기, 소극적 전략은 만기보유·인덱스·현금흐름 일치·사다리형·면역전략이다."}, {"ch": "채권시장", "type": "옵션부채권", "q": "수의상환채권(콜부채권)의 가치를 바르게 나타낸 것은?", "o": ["일반채권 가치 + 콜옵션 가치", "일반채권 가치 − 콜옵션 가치", "일반채권 가치 + 풋옵션 가치", "일반채권 가치 − 풋옵션 가치"], "a": 1, "e": "콜권리는 발행자에게 유리하므로 채권가치에서 빼고, 투자자에게 유리한 풋권리는 더한다(수의상환청구채권 = 일반채권 + 풋가치)."}, {"ch": "기타 증권시장", "type": "코넥스", "q": "코넥스시장에 대한 설명으로 옳은 것은?", "o": ["금융투자협회가 운영하는 장외시장이다", "가격제한폭은 ±30%이다", "지정자문인 제도가 없다", "한국거래소가 운영하는 중소기업 전용 장내시장이다"], "a": 3, "e": "코넥스는 거래소 운영 장내시장(지정자문인 제도 운영, 가격제한폭 ±15%)이다. 금융투자협회가 운영하는 조직화된 장외시장은 K-OTC다."}, {"ch": "기타 증권시장", "type": "K-OTC", "q": "K-OTC시장의 매매제도로 옳은 것은?", "o": ["시장가호가가 가능하다", "지정가호가만 가능하고 상대매매 방식이며 가격제한폭은 ±30%이다", "접속매매 방식이며 가격제한폭은 ±15%이다", "위탁증거금이 면제된다"], "a": 1, "e": "K-OTC는 지정가호가만 가능, 상대매매, ±30%, 위탁증거금 100%, 신용거래·대용증권 불가이다. 시장가·접속매매·±15%는 코넥스의 특징이다."}],2:[{"ch": "경기분석", "type": "계산 · 2단계", "q": "명목GDP가 1,800조원이고 GDP 디플레이터가 120, 통화량(M)이 300조원이다. 통화유통속도(V)는?", "o": ["5회", "6회", "7.2회", "10회"], "a": 1, "e": "V = 명목GDP ÷ M = 1,800 ÷ 300 = 6. 디플레이터로 구한 실질GDP(1,500조원)를 분자에 쓰면 5회가 되어 오답이다."}, {"ch": "경기분석", "type": "계산 · 교환방정식", "q": "실질GDP 증가율 4%, 물가상승률 2%이고 통화증가율 목표가 7%일 때 통화유통속도 변화율은? (교환방정식 MG = PG + YG − VG)", "o": ["+1%", "+5%", "−5%", "−1%"], "a": 3, "e": "VG = PG + YG − MG = 2 + 4 − 7 = −1%. 유통속도가 1% 하락해야 통화증가율 7%가 물가 2%와 성장 4%에 대응한다."}, {"ch": "경기분석", "type": "계산 · 해석", "q": "어느 업종 설문에서 긍정 36%, 보합 20%, 부정 44%였다. BSI 값과 해석으로 옳은 것은?", "o": ["92이며 부정 응답이 우세하다", "108이며 긍정 응답이 우세하다", "80이며 전환점이다", "100이며 기준값과 같다"], "a": 0, "e": "BSI = (긍정% − 부정%) + 100 = (36 − 44) + 100 = 92. 기준값 100 미만이므로 부정 응답이 우세하다."}, {"ch": "경기분석", "type": "계산 · 해석", "q": "경기확산지수(DI) 구성계열 24개 중 증가 13개, 보합 4개, 감소 7개일 때 DI와 해석으로 옳은 것은?", "o": ["62.5이며 경기수준까지 판단할 수 있다", "54.2이며 감소 계열이 우세하다", "62.5이며 증가 계열이 우세하나 경기수준·진폭은 알 수 없다", "70.8이며 경기수준 판단이 가능하다"], "a": 2, "e": "DI = (증가 + 보합 × 0.5) ÷ 전체 × 100 = (13 + 2) ÷ 24 × 100 = 62.5. 기준값 50 초과이나 DI는 국면만 보여 줄 뿐 수준과 진폭은 보여 주지 못한다."}, {"ch": "경기분석", "type": "복합 진술", "q": "안정화정책에 대한 설명 중 옳은 것만 묶은 것은?\n\nㄱ. 재정정책은 입법·예산 절차로 내부시차가 길지만, 집행된 지출은 총수요에 직접 닿아 외부시차가 짧다.\nㄴ. 통화정책은 내부시차가 짧지만 소비·투자가 반응하기까지 외부시차가 길다.\nㄷ. 순조세(조세수입 − 이전지출)는 별도 결정 없이 경기에 대응하는 자동안정화장치다.\nㄹ. 구축효과는 확장적 재정정책이 금리를 낮추어 민간투자를 늘리는 현상이다.", "o": ["ㄱ, ㄴ", "ㄱ, ㄴ, ㄷ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄷ, ㄹ"], "a": 1, "e": "구축효과는 확장적 재정정책이 금리를 올려 민간투자를 줄이는 현상이므로 ㄹ이 틀렸다. ㄱ·ㄴ·ㄷ은 모두 옳다."}, {"ch": "경기분석", "type": "부정형", "q": "경기변동이론에 대한 설명으로 옳지 않은 것은?", "o": ["케인즈학파는 동물적 감각과 승수·가속도 원리로 투자 변동을 설명한다", "통화주의는 준칙에 따른 통화정책을 선호한다", "실물경기변동이론은 화폐적 충격을 경기변동의 주된 원인으로 보고 통화정책의 중요성을 강조한다", "새고전학파는 예상하지 못한 통화충격이 실물에 영향을 준다고 본다"], "a": 2, "e": "실물경기변동이론은 기술·생산성 같은 실물충격을 원인으로 보며 정책개입 효과에 회의적이다. 화폐적 충격을 강조하는 것은 통화주의다."}, {"ch": "기본적 분석", "type": "계산 · 레버리지", "q": "영업이익이 300억원, 이자비용이 100억원이고 영업레버리지도(DOL)가 3이다. 결합레버리지도(DCL)는?", "o": ["4.5", "1.5", "3", "9"], "a": 0, "e": "DFL = 영업이익 ÷ (영업이익 − 이자비용) = 300 ÷ 200 = 1.5. DCL = DOL × DFL = 3 × 1.5 = 4.5."}, {"ch": "기본적 분석", "type": "계산 · 복합", "q": "무위험수익률 3%, 시장기대수익률 9%, 베타 1.5, ROE 15%, 배당성향 40%인 기업의 내년 주당배당(D₁)이 1,200원이다. 정률성장모형으로 구한 이론 주가는?", "o": ["10,000원", "13,333원", "40,000원", "80,000원"], "a": 2, "e": "k = 3 + 1.5 × (9 − 3) = 12%. g = (1 − 0.4) × 15% = 9%. P₀ = 1,200 ÷ (0.12 − 0.09) = 40,000원. g를 빠뜨리면 10,000원, k 대신 g로 나누면 13,333원이 된다."}, {"ch": "기본적 분석", "type": "계산 · PBR", "q": "PER이 8배이고 ROE가 15%인 기업의 PBR은?", "o": ["0.53배", "1.2배", "1.9배", "12배"], "a": 1, "e": "PBR = PER × ROE = 8 × 0.15 = 1.2배. 주가/BPS = (주가/EPS) × (EPS/BPS)이고 EPS/BPS가 ROE이기 때문이다."}, {"ch": "기본적 분석", "type": "계산 · EV/EBITDA", "q": "시가총액 800억원, 이자부부채 300억원, 현금성자산 100억원, 영업이익 80억원, 감가상각비 20억원일 때 EV/EBITDA는?", "o": ["8배", "11배", "12.5배", "10배"], "a": 3, "e": "EV = 800 + 300 − 100 = 1,000억원. EBITDA = 80 + 20 = 100억원. EV/EBITDA = 10배. 시가총액만 쓰면 8배가 된다."}, {"ch": "기본적 분석", "type": "계산 · 배당지표", "q": "주당순이익 5,000원, 주당배당금 1,500원, 주가 30,000원, 액면가 500원일 때 배당성향 · 배당수익률 · 배당률을 순서대로 나열한 것은?", "o": ["30% · 5% · 300%", "5% · 30% · 300%", "30% · 300% · 5%", "5% · 300% · 30%"], "a": 0, "e": "배당성향 = 1,500/5,000 = 30%, 배당수익률 = 1,500/30,000 = 5%, 배당률 = 1,500/500(액면가) = 300%. 분모는 각각 이익·주가·액면가다."}, {"ch": "기술적 분석", "type": "계산 · OBV", "q": "전일 OBV가 50만주이다. 이후 4거래일의 결과가 ① 상승·거래량 30만 ② 하락·거래량 20만 ③ 보합·거래량 10만 ④ 상승·거래량 40만일 때 마지막 날의 OBV는?", "o": ["120만주", "80만주", "100만주", "60만주"], "a": 2, "e": "50 + 30 = 80 → 80 − 20 = 60 → 보합은 변동 없음 60 → 60 + 40 = 100(만주)."}, {"ch": "기술적 분석", "type": "계산 · 스토캐스틱", "q": "분석기간 최고가 9,200원, 최저가 8,000원, 현재 종가 8,400원이다. 스토캐스틱 %K는?", "o": ["50%", "약 33.3%", "약 66.7%", "약 8.7%"], "a": 1, "e": "%K = (종가 − 최저가) ÷ (최고가 − 최저가) × 100 = 400 ÷ 1,200 × 100 ≈ 33.3%."}, {"ch": "기술적 분석", "type": "계산 · VR", "q": "분석기간 중 상승일 거래량 합 600만주, 하락일 300만주, 보합일 200만주이다. 거래량비율(VR)은?", "o": ["160%", "200%", "233%", "175%"], "a": 3, "e": "VR = (상승일 + 0.5 × 보합일) ÷ (하락일 + 0.5 × 보합일) × 100 = 700 ÷ 400 × 100 = 175%. 보합일을 무시하면 200%, 보합일을 전량 더하면 160%가 된다."}, {"ch": "기술적 분석", "type": "복합 진술", "q": "기술적 분석에 대한 설명 중 옳은 것만 묶은 것은?\n\nㄱ. 진행갭은 추세 중간에 나타나 기존 추세의 지속을 시사한다.\nㄴ. 소멸갭은 추세 말기에 나타나 추세반전 가능성을 시사한다.\nㄷ. 지지선을 거래량 없이 일시적으로 이탈하면 곧바로 추세전환으로 확정한다.\nㄹ. 하락 뒤 저점권에서 나타난 긴 아랫꼬리의 망치형은 상승반전 신호로 해석한다.", "o": ["ㄱ, ㄴ, ㄹ", "ㄱ, ㄴ", "ㄴ, ㄷ, ㄹ", "ㄱ, ㄷ, ㄹ"], "a": 0, "e": "거래량 없는 일시적 이탈을 추세전환으로 단정해서는 안 되므로 ㄷ이 틀렸다. ㄱ·ㄴ·ㄹ은 옳다."}, {"ch": "유가증권시장", "type": "호가단위 적용", "q": "주가가 22,000원 부근인 종목에서 호가가격단위에 맞는 호가는?", "o": ["21,980원", "21,990원", "21,995원", "21,950원"], "a": 3, "e": "2만원 이상 5만원 미만 구간의 호가가격단위는 50원이므로 50원의 배수인 21,950원만 유효하다."}, {"ch": "유가증권시장", "type": "우선순위 사례", "q": "매도호가가 A 10,100원(10:00), B 10,050원(10:05), C 10,050원(10:02), D 10,200원(10:01)이다. 대량 시장가 매수 주문이 들어올 때 세 번째로 체결되는 호가는?", "o": ["B", "A", "C", "D"], "a": 1, "e": "가격우선(낮은 매도호가 우선) → 동일 가격은 시간우선이다. 체결 순서는 C(10,050, 10:02) → B(10,050, 10:05) → A(10,100) → D(10,200)이다."}, {"ch": "유가증권시장", "type": "IPO 절차", "q": "기업공개(IPO)의 일반적 절차 순서로 옳은 것은?", "o": ["주관사 선정·실사 → 증권신고서 → 상장예비심사 → 수요예측·공모가 결정 → 청약·납입 → 신규상장", "수요예측·공모가 결정 → 주관사 선정·실사 → 상장예비심사 → 증권신고서 → 청약·납입 → 신규상장", "주관사 선정·실사 → 상장예비심사 → 증권신고서 → 수요예측·공모가 결정 → 청약·납입 → 신규상장", "상장예비심사 → 청약·납입 → 증권신고서 → 수요예측·공모가 결정 → 주관사 선정·실사 → 신규상장"], "a": 2, "e": "심사받고(상장예비심사), 신고하고(증권신고서), 가격을 정해(수요예측) 청약한 뒤 상장한다. 상장예비심사 통과는 공모 완료나 상장 완료를 뜻하지 않는다."}, {"ch": "유가증권시장", "type": "발행·인수", "q": "증권의 발행형태에 대한 설명으로 옳지 않은 것은?", "o": ["모집주선은 인수기관이 미매각분을 전량 인수하는 방식이다", "새로 발행하는 증권을 50인 이상에게 청약 권유하면 모집이다", "이미 발행된 증권을 50인 이상에게 매도 청약 권유하면 매출이다", "총액인수는 인수기관이 발행물량 전체를 인수해 판매 위험을 부담한다"], "a": 0, "e": "모집주선은 판매 주선만 하고 위험을 부담하지 않는다. 미매각분을 인수하는 것은 잔액인수다."}, {"ch": "유가증권시장", "type": "시장관리 매칭", "q": "다음 상황과 시장관리제도를 순서대로 바르게 짝지은 것은?\n\nㄱ. KOSPI200 선물가격이 급변하여 현물 프로그램매매 호가의 효력을 일시 정지\nㄴ. 시장 전체가 급락하여 거래를 단계적으로 중단\nㄷ. 개별 종목 가격이 급변하여 해당 종목을 단일가매매로 전환", "o": const KEYS={1:'sec1mock2-set1',2:'sec1mock2-set2'},TKEY='sec1mock2-theme',SKEY='sec1mock2-lastset',MARK='①②③④';

function paint(i){
  const x=Q[i],card=$('q'+i),ch=saved[i],done=ch!==undefined,ok=done&&ch===x.a;
  card.classList.toggle('is-ok',ok);card.classList.toggle('is-bad',done&&!ok);
  card.querySelectorAll('.opt').forEach(o=>{
    const j=+o.dataset.j;o.disabled=done;
    o.classList.toggle('correct',done&&j===x.a);o.classList.toggle('wrong',done&&j===ch&&ch!==x.a);
    let m=o.querySelector('.mark');if(m)m.remove();
    if(done&&(j===x.a||j===ch)){m=document.createElement('span');m.className='mark';m.textContent=j===x.a?'정답':'내 선택';o.appendChild(m)}
  });
  card.querySelector('.explain').classList.toggle('show',done||expand);
  const r=card.querySelector('.result');
  r.textContent=done?(ok?'정답입니다.':'오답입니다.'):'정답 미리보기';
  r.className='result '+(done?(ok?'ok':'bad'):'peek');
  card.querySelector('.ans').textContent='정답 '+(x.a+1)+'. '+x.o[x.a];
  card.querySelector('.why').textContent=x.e;

function visible(i){const x=Q[i];if(filter!=='all'&&x.ch!==filter)return false;if(wrongOnly&&!(saved[i]!==undefined&&saved[i]!==x.a))return false;return true}
function applyFilter(){let n=0;Q.forEach((x,i)=>{const v=visible(i);$('q'+i).classList.toggle('hidden',!v);if(v)n++});$('empty').classList.toggle('hidden',n>0)}
function stats(){const n=Object.keys(saved).length,c=Object.keys(saved).filter(i=>saved[i]===Q[i].a).length;$('stat').textContent=`${n} / ${Q.length} 풀이 · 정답 ${c}`;$('progress').style.width=(n/Q.length*100)+'%';$('progress').parentNode.setAttribute('aria-valuenow',Math.round(n/Q.length*100))}
function tally(n){const s=saveds[n],S=SETS[n];return {n:Object.keys(s).length,c:Object.keys(s).filter(i=>s[i]===S[i].a).length}}

document.querySelectorAll('#seg button').forEach(b=>b.addEventListener('click',()=>{build(+b.dataset.set);scrollTo({top:0,behavior:'smooth'})}));
$('wrongBtn').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);e.currentTarget.textContent=wrongOnly?'전체 문항 보기':'오답만 보기';applyFilter()};
$('expBtn').onclick=e=>{expand=!expand;e.currentTarget.setAttribute('aria-pressed',expand);e.currentTarget.textContent=expand?'해설 전체 접기':'해설 전체 펼치기';Q.forEach((_,i)=>paint(i))};
$('resetBtn').onclick=()=>{if(!confirm('SET '+cur+'의 응답 기록을 모두 초기화할까요?'))return;Object.keys(saved).forEach(k=>delete saved[k]);try{localStorage.removeItem(KEYS[cur])}catch(e){}Q.forEach((_,i)=>paint(i));stats();$('gradeBox').classList.add('hidden');applyFilter();scrollTo({top:0,behavior:'smooth'})};

function grade(scroll=true){
  const box=$('gradeBox'),t=tally(cur),n=t.n,c=t.c;
  const rows=chapters.map(ch=>{const idx=Q.map((q,i)=>i).filter(i=>Q[i].ch===ch);const a=idx.filter(i=>saved[i]!==undefined).length,k=idx.filter(i=>saved[i]===Q[i].a).length;
    return `<div class="chrow"><span>${esc(ch)}</span><div class="mini"><i style="width:${k/idx.length*100}%"></i></div><span class="val">${k} / ${idx.length} 정답${a<idx.length?` · ${a}풀이`:''}</span></div>`}).join('');
  const wrong=Q.map((q,i)=>i).filter(i=>saved[i]!==undefined&&saved[i]!==Q[i].a);
  const t1=tally(1),t2=tally(2);
  box.innerHTML=`<h2>SET ${cur} 채점 요약</h2><div class="score-big">${Math.round(c/Q.length*100)}점<small>${c} / ${Q.length} 정답 · ${n}문항 풀이${n<Q.length?' (미풀이는 오답 처리)':''}</small></div><div style="margin-top:14px">${rows}</div>`+
    (wrong.length?`<div class="wrongs"><b>틀린 문항</b><br>${wrong.map(i=>`<a data-go="${i}">Q${String(i+1).padStart(2,'0')}</a>`).join('')}</div>`:(n?'<p>틀린 문항이 없습니다. 👏</p>':''))+
    `<div class="cmp"><div><b>${Math.round(t1.c/35*100)}점</b><span>SET 1 · ${t1.c}/35 정답 (${t1.n}풀이)</span></div><div><b>${Math.round(t2.c/35*100)}점</b><span>SET 2 · ${t2.c}/35 정답 (${t2.n}풀이)</span></div></div>`+
    `<div class="note">실전 목표는 70점 이상입니다. SET 2는 계산과 복합 진술 비중이 높아 점수가 낮을 수 있으니, 틀린 문항의 해설에서 풀이 과정을 다시 따라 써 보세요.</div>`;
  box.classList.remove('hidden');
  box.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{filter='all';wrongOnly=false;$('wrongBtn').setAttribute('aria-pressed','false');$('wrongBtn').textContent='오답만 보기';document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===0));applyFilter();$('q'+a.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})});
  if(scroll)box.scrollIntoView({behavior:'smooth',block:'center'});
}
$('gradeBtn').onclick=()=>grade(true);

let start=1;try{start=+(localStorage.getItem(SKEY)||1)}catch(e){}
build(start===2?2:1);
</script>
</body>
</html>
