<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#697386;--line:#e3e7ef;--pri:#3f5efb;--pri2:#7657ed;--ok:#118a58;--bad:#cf3e38;--soft:#eef2ff;--shadow:0 10px 28px rgba(26,36,60,.06)}
html[data-theme=dark]{--bg:#11131a;--card:#1a1d27;--ink:#edf0f7;--muted:#a7afc1;--line:#333849;--pri:#93a5ff;--pri2:#b49cff;--ok:#4ed397;--bad:#ff8a85;--soft:#252c50;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.65}.wrap{max-width:1080px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.head{padding:12px 20px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.brand{font-weight:900;white-space:nowrap}.progress{flex:1;min-width:170px;height:9px;background:var(--line);border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pri),var(--pri2));transition:.2s}.stat{font-size:13px;font-weight:800;color:var(--pri);white-space:nowrap}.iconbtn,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;font:inherit;font-weight:800;cursor:pointer}.iconbtn{padding:7px 10px}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0 2px;scrollbar-width:none}.tab{flex:none;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;font-weight:800;cursor:pointer}.tab.active{background:var(--pri);border-color:var(--pri);color:#fff}
.hero{padding:30px 20px 5px}.badge{display:inline-block;padding:5px 10px;border-radius:99px;background:var(--soft);color:var(--pri);font-size:13px;font-weight:900}.hero h1{font-size:30px;line-height:1.3;letter-spacing:-.04em;margin:12px 0 7px}.hero p{color:var(--muted);margin:0}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:17px 0}.sum{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px}.sum b{font-size:21px;display:block}.sum span{font-size:12px;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}.btn[aria-pressed=true]{background:var(--soft);color:var(--pri);border-color:var(--pri)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:21px;margin:15px 0;box-shadow:var(--shadow);scroll-margin-top:130px}.qcard.ok{border-left:5px solid var(--ok)}.qcard.bad{border-left:5px solid var(--bad)}.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:var(--soft);color:var(--pri);padding:4px 9px;border-radius:99px;font-size:12px;font-weight:900}.num{font-weight:900;color:var(--pri)}.qtitle{font-size:17px;font-weight:850;margin:12px 0}.stem{background:color-mix(in srgb,var(--bg) 66%,var(--card));border-radius:13px;padding:12px 14px;margin:0 0 13px}.stem:empty{display:none}.gap{height:7px}.opts{display:grid;gap:8px}.opt{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:13px;padding:12px 14px;font:inherit;display:flex;gap:10px;cursor:pointer}.opt:hover:not(:disabled){border-color:var(--pri);background:var(--soft)}.opt:disabled{cursor:default}.opt .mark{font-weight:900;color:var(--pri);flex:none}.opt.correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--card))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}.tag{margin-left:auto;font-size:12px;font-weight:900}.correct .tag{color:var(--ok)}.wrong .tag{color:var(--bad)}.feedback{display:none;margin-top:12px;padding:11px 14px;border-radius:12px;background:var(--soft);font-weight:800}.feedback.show{display:block}.hidden{display:none!important}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid var(--line);padding:8px;text-align:left}th{background:var(--soft)}code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.formula{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-family:Cambria,"Times New Roman",serif;font-size:18px}.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15;vertical-align:middle}.frac .top{border-bottom:1.5px solid currentColor;padding:0 9px 3px}.frac .bottom{padding:3px 9px 0}.delta,.mul{white-space:nowrap}.grade{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;margin:18px 0}.score{font-size:36px;font-weight:950;color:var(--pri)}.wronglinks button{margin:4px;border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line));background:color-mix(in srgb,var(--bad) 8%,var(--card));color:var(--bad);border-radius:99px;padding:5px 10px;cursor:pointer}footer{color:var(--muted);font-size:13px;padding:20px 20px 50px}
.feedback{font-weight:500;line-height:1.75}.feedback .result{display:block;font-weight:900;margin-bottom:8px}.feedback .explain{padding-top:9px;border-top:1px dashed color-mix(in srgb,var(--pri) 32%,var(--line))}.feedback .explain b{color:var(--pri)}.feedback .formula-line{display:block;margin:6px 0;padding:7px 9px;border-radius:8px;background:color-mix(in srgb,var(--card) 65%,transparent);font-family:Cambria,"Times New Roman","Noto Sans KR",serif;font-weight:700}
@media(max-width:700px){.wrap{padding-left:14px;padding-right:14px}.hero{padding-left:14px;padding-right:14px}.hero h1{font-size:24px}.summary{grid-template-columns:repeat(2,1fr)}.qcard{padding:16px}.brand{width:100%}}
@media print{header,.controls{display:none}.qcard{break-inside:avoid;box-shadow:none}}

<header><div class="wrap head"><div class="row"><div class="brand">제1회 적중 실전모의고사</div><div class="progress"><i id="bar"></i></div><div class="stat" id="stat"></div><button class="iconbtn" id="theme">🌙</button></div><div class="tabs" id="tabs"></div></div></header>
<section class="hero wrap"><span class="badge">증권투자권유자문인력 · 100문항</span><h1>제1회 적중 실전모의고사</h1><p>문항을 선택하면 정답과 함께 핵심 개념, 판단 근거, 혼동하기 쉬운 포인트를 확인할 수 있습니다.</p><div class="summary" id="summary"></div><div class="controls"><button class="btn" id="wrong" aria-pressed="false">오답만 보기</button><button class="btn primary" id="grade">채점 요약</button><button class="btn" id="reset">응답 초기화</button></div></section>
<main class="wrap"><div id="questions"></div><div id="gradebox" class="grade hidden"></div></main><footer class="wrap">문항·정답은 모의고사 MD·JSON을, 해설은 학습노트와 참고자료의 2026 시험 대비 개념을 바탕으로 재구성했습니다. 브라우저 로컬 저장소에 응답 기록이 저장됩니다.</footer>
<script>
const Q=[{"n":1,"title":"물가지수와 각각의 특징을 올바르게 연결한 것은?","stem":"<div class=\"tablewrap\"><table><thead><tr><th>종류</th><th>특징</th></tr></thead><tbody><tr><td>A. 소비자물가지수</td><td>ㄱ. 모든 서비스의 가격을 종합적으로 고려, 국민경제 전체의 물가압력 측정</td></tr><tr><td>B. 생산자물가지수</td><td>ㄴ. 전반적 상품의 수급동향 반영, 기업 간 거래되는 상품 및 서비스 가격이 조사대상임</td></tr><tr><td>C. GDP 디플레이터</td><td>ㄷ. 임금이 차지하는 비중이 상대적으로 높고 경기변동에 크게 민감하지 않음</td></tr></tbody></table></div>","options":["<div>A-ㄱ, B-ㄴ, C-ㄷ</div>","<div>A-ㄱ, B-ㄷ, C-ㄴ</div>","<div>A-ㄴ, B-ㄱ, C-ㄷ</div>","<div>A-ㄷ, B-ㄴ, C-ㄱ</div>"],"answer":4,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":2,"title":"케인즈가 강조한 ‘수요 충격(demand shock)’에 의한 경기변동 설명으로 옳지 않은 것은?","stem":"","options":["<div>경기변동의 주된 원인을 민간기업의 투자지출 변화에서 찾는다.</div>","<div>기업가의 미래수익에 대한 기대는 매우 안정적이기 때문에 투자는 일정한 수준을 유지한다.</div>","<div>기업가의 투자심리나 ‘동물적 감각(animal spirits)’이 투자의 결정에 큰 영향을 미친다.</div>","<div>임금과 가격의 경직성으로 인해 불안정한 총수요의 변화가 생산의 변동을 유발한다.</div>"],"answer":2,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":3,"title":"통화주의자 경기변동이론에 대한 설명으로 잘못된 것은?","stem":"","options":["<div>통화공급이 불안정하기 때문에 경기순환이 발생한다고 주장하였다.</div>","<div>경제는 자연산출 수준, 즉 완전고용 산출수준으로 회귀하는 경향이 있다고 본다.</div>","<div>프리드먼과 슈워츠는 시계열 자료 분석을 통해 GDP 변동이 통화량 변동에 선행함을 주장하였다.</div>","<div>정책당국은 통화공급량을 해마다 일정한 비율로 증가시켜야 한다고 주장하였다.</div>"],"answer":3,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":4,"title":"시차와 경기정책에 대한 내용으로 올바른 것은?","stem":"","options":["<div>통화정책의 경우 내부시차는 짧으며, 외부시차는 길다.</div>","<div>재정정책의 경우 내부시차는 짧으며, 외부시차는 길다.</div>","<div>통화정책의 경우 내부시차는 길며, 외부시차는 짧다.</div>","<div>재정정책의 경우 내부시차와 외부시차 모두 길다.</div>"],"answer":1,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":5,"title":"자산가격경로에 대한 내용으로 거리가 먼 것은?","stem":"","options":["<div>토빈(J. Tobin)의 q이론에 따르면 \\(q &gt; 1\\)인 경우에는 투자가 증가한다.</div>","<div>토빈의 q이론과 부(富)의 효과(Wealth Effect)를 통하여 설명하였다.</div>","<div>부의 효과는 부동산과 같은 실물자산의 가치변동을 통해서도 나타난다.</div>","<div>토빈의 q이론은 일반인들이 보유하고 있는 주식가격의 변화가 소비에 미치는 영향을 분석한 것이다.</div>"],"answer":4,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":6,"title":"다음 중 경기예측방법에 대한 내용이 잘못 연결된 것은?","stem":"","options":["<div>경기지표: 경기종합지수(CI), 경기확산지수(DI)</div>","<div>설문조사: 기업경기실사지수(BSI), 소비자동향지수(CSI)</div>","<div>설문조사: 소비자물가지수(CPI), 경제심리지수(ESI)</div>","<div>경제모형: 시계열모형, 거시경제계량모형</div>"],"answer":3,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":7,"title":"주식가격을 예측하는 방법에 대한 설명으로 잘못된 것은?","stem":"","options":["<div>기본적 분석은 기업의 내재가치(Intrinsic Value) 또는 본질가치(Fundamental Value)를 찾아내고, 이렇게 찾아낸 진정한 가치가 시장에 반영될 것으로 기대한다.</div>","<div>기술적 분석에서 주가는 시장에서의 수요와 공급에 의해서 결정되고, 수요와 공급은 시장에 참여하는 투자자들의 심리상태에 의하여 결정된다고 본다.</div>","<div>기본적 분석과 기술적 분석은 모두 기본적으로 증권시장의 비효율성을 가정하고 초과이익을 얻으려는 투자전략이다.</div>","<div>‘기업분석 → 산업분석 → 경제분석’의 순서로 분석하는 것을 Bottom-Up 방식이라 하며, 이는 기본적 분석에서 가장 많이 쓰이는 방식이다.</div>"],"answer":4,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":8,"title":"통화량과 주가의 관계에 대한 설명과 거리가 먼 것은?","stem":"","options":["<div>통화량의 증가는 기업의 자금확보를 용이하게 하고, 이는 기업의 수익성을 향상시켜 주가를 상승하게 한다.</div>","<div>통화량의 증가는 민간부문의 저축 및 투자를 확대시켜 주식 및 채권에 대한 수요를 증가시키고 이에 따라 주가가 상승하게 되는데, 이를 유동성효과라고 한다.</div>","<div>피셔효과(Fisher Effect)란 화폐공급의 증가로 인플레이션이 발생하면 피셔방정식에 의하여 명목금리가 상승하게 되는 효과를 말하는데, 이는 장기적으로 주가에 부정적인 영향을 준다.</div>","<div>통화지표에는 협의통화(M1), 광의통화(M2), 금융기관의 유동성(Lf), 광의 유동성(L) 4가지가 있으며, 매월 한국은행에서 발표하고 있다.</div>"],"answer":2,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":9,"title":"기본적 분석에 대한 설명으로 거리가 먼 것은?","stem":"","options":["<div>기업의 본질가치를 찾고자 한다.</div>","<div>시장가격이 본질가치보다 크면 고평가된 것으로 본다.</div>","<div>객관적인 방법이다.</div>","<div>투자자의 요구수익률이 중요하다.</div>"],"answer":3,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":10,"title":"다음 설명 중 잘못된 것은?","stem":"","options":["<div>주당순이익이 크면 클수록 주식의 가격이 높은 것이 보통이다.</div>","<div>주가수익비율이 높으면, 주당순이익은 평균수준인데 주가가 높은 경우와 주가는 평균수준이나 주당순이익이 너무 낮은 두 가지로 볼 수 있다.</div>","<div>주가순자산비율(PBR: Price Book-value Ratio)은 주가를 주당순자산으로 나눈 것이다.</div>","<div>주가수익비율이 높은 경우에도 주가현금흐름비율(PCR)이 낮으면 해당 주식에 대한 주가가 과대평가될 가능성이 크다.</div>"],"answer":4,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":11,"title":"어느 기업이 지난 해 100원의 배당을 하였고 금후에도 이익의 40%를 배당으로 지급할 예정이다. 이 기업의 자기자본이익률이 10%이고 요구수익률이 12%라면, 이 기업주식의 가치는 얼마인 것인가?","stem":"<div>(단, 소수점 첫째 자리에서 반올림하여 원을 구함)</div>","options":["<div>1,250원</div>","<div>1,300원</div>","<div>1,767원</div>","<div>1,867원</div>"],"answer":3,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":12,"title":"다음 다우이론의 설명에 해당하는 국면은?","stem":"<div>&gt; 전반적인 경제여건 및 기업의 영업이익이 호전됨으로써 일반투자자의 관심이 고조되며 주가가 상승하고 거래량이 증가한다.</div>","options":["<div>매집</div>","<div>상승</div>","<div>분산</div>","<div>침체</div>"],"answer":2,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":13,"title":"엘리엇 파동이론에 대한 설명으로 옳은 것은?","stem":"","options":["<div>2번 파동의 저점이 1번 파동의 저점보다 낮아서는 안 된다.</div>","<div>3번 파동이 상승 국면의 5개 파동 중에서 가장 짧다.</div>","<div>4번 파동의 저점이 1번 파동의 고점보다 높으면 안 된다.</div>","<div>5번 파동의 거래량이 3번 파동의 거래량보다 많다.</div>"],"answer":1,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":14,"title":"캔들차트 분석에 대한 설명과 거리가 먼 것은?","stem":"","options":["<div>유성(Shooting Star)형은 대개 갭(Gap)을 수반하며, 양선보다 음선의 신뢰도가 높다.</div>","<div>관통형은 하락추세에서 주가 상승을 암시한다.</div>","<div>먹구름형은 천장권에서 주가 하락을 암시한다.</div>","<div>교수(Hanging Man)형은 주가 상승을 암시하며, 음선보다는 양선의 신뢰도가 높다.</div>"],"answer":4,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":15,"title":"주가가 장중 등락을 거듭하다가 종가와 시가가 같아지는 경우는?","stem":"","options":["<div>유성형</div>","<div>샅바형</div>","<div>우산형</div>","<div>십자형</div>"],"answer":4,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":16,"title":"상장의 준비단계에 대한 설명으로 잘못된 것은?","stem":"","options":["<div>거래소의 유가증권시장에 상장하고자 하는 법인은 최근 3사업연도의 재무제표에 대해 외부감사인으로부터 감사를 받아야 한다.</div>","<div>우리사주조합원은 모집 또는 매출하는 주식의 20%까지 우선배정받을 권리가 있으며 취득일로부터 1개월 이후에 처분할 수 있다.</div>","<div>유가증권시장에 주권을 상장하기 위해서는 대표주관회사와 대표주관계약을 체결해야 한다.</div>","<div>다양한 종류의 주식을 발행하기 위해서는 정관에 회사가 발행할 수 있는 각종 주식의 내용과 수를 정하여야 한다.</div>"],"answer":2,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":17,"title":"신규상장종목의 최초가격 결정범위(최저호가가격, 최고호가가격)는?","stem":"","options":["<div>평가가격(기준가격)의 50-150%</div>","<div>평가가격(기준가격)의 70-150%</div>","<div>평가가격(기준가격)의 60-400%</div>","<div>평가가격(기준가격)의 100-200%</div>"],"answer":3,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":18,"title":"자본시장법상 상장 시 혜택에 대한 설명 중 잘못된 것은?","stem":"","options":["<div>주권상장법인은 이사회의 결의로 주식의 액면미달발행이 가능하다.</div>","<div>주권상장법인은 중간배당이 가능하다.</div>","<div>이사회의 결의로 구주주의 신주인수권을 배제하고 불특정 다수인을 대상으로 한 일반공모증자방식에 의한 유상증자가 가능하다.</div>","<div>이사회의 결의로 조건부 자본증권의 발행이 가능하다.</div>"],"answer":1,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":19,"title":"자본시장법상 발행시장의 공시에 해당하는 것은?","stem":"","options":["<div>사업보고서</div>","<div>연결재무제표</div>","<div>조회공시</div>","<div>증권신고서</div>"],"answer":4,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":20,"title":"주문의 조건(IOC, FOK)에 대한 설명 중 잘못된 것은?","stem":"","options":["<div>IOC조건은 주문이 제출된 즉시 체결 가능한 수량은 체결하고, 미결제잔량은 취소되는 조건을 말한다.</div>","<div>FOK조건은 주문이 제출된 즉시 전량체결 시키되, 전량체결이 불가능한 경우에는 주문전량이 취소되는 조건을 말한다.</div>","<div>조건부지정가주문에 대하여 IOC조건 또는 FOK조건으로 주문할 수 있다.</div>","<div>코넥스시장 상장종목의 경우 IOC조건, FOK조건의 주문을 부여할 수 없다.</div>"],"answer":3,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":21,"title":"다음 중 유가증권시장의 가격제한폭에 대한 설명으로 가장 잘못된 것은?","stem":"","options":["<div>가격제한폭은 가격결정에 있어 정보의 효율적 반영에 도움을 준다.</div>","<div>일반적으로 가격제한폭의 기준가격은 전일종가이다.</div>","<div>주식워런트증권은 가격제한폭이 없다.</div>","<div>신규상장종목은 시가결정 후 가격제한폭이 적용된다.</div>"],"answer":1,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":22,"title":"우리나라 유가증권시장에서 원칙적으로 취하고 있는 결제방식과 가장 거리가 먼 것은?","stem":"","options":["<div>실물결제방식</div>","<div>개별결제방식</div>","<div>차감결제방식</div>","<div>집중결제방식</div>"],"answer":2,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":23,"title":"공매도에 대한 내용으로 잘못된 것은?","stem":"","options":["<div>공매도는 차익거래를 하는 경우에도 직전가격 이하의 가격으로 호가할 수 없다.</div>","<div>극단적인 시황급변이 있는 경우 거래소는 금융위원회의 승인을 받아 상장증권의 전부 또는 일부에 대하여 차입공매도를 제한할 수 있다.</div>","<div>거래소는 공매도거래의 투명성 제고를 위해 공매도거래 현황을 공표하고 있다.</div>","<div>협회는 예탁결제원, 증권금융 및 증권회사를 통한 대차거래 현황을 집계하여 종목 및 투자자별 대차잔고를 공표하고 있다.</div>"],"answer":1,"subject":{"number":1,"name":"증권분석 및 증권시장"}},{"n":24,"title":"코스닥 상장의 종류와 내용이 잘못된 것은?","stem":"","options":["<div>신규상장: 코스닥시장에 최초 상장하는 것을 말하며 주식을 분산하여 상장하는 공모상장과 분산절차를 생략하는 직상장이 있다.</div>" :["<div>기초공제</div>","<div>인적공제</div>","<div>조특공제</div>","<div>감정평가수수료</div>"],"answer":3,"subject":{"number":3,"name":"법규 및 세제"}}], MARK='①②③④', KEY='hackers-advisor-mock01', TKEY=KEY+'-theme';
const E={
1:`<b>핵심 개념</b> CPI는 가계가 구입하는 재화·서비스의 가격으로 생계비를 측정하므로 임금 비중이 크고 비교적 경기 비민감적이다. PPI는 기업 간 거래가격을 통해 상품 수급과 원가압력을 반영하고, GDP 디플레이터는 국내에서 생산된 모든 최종재·서비스를 포괄한다. 따라서 A-ㄷ, B-ㄴ, C-ㄱ이다.`,
2:`<b>핵심 개념</b> 케인즈 이론에서는 투자지출이 기대와 ‘동물적 감각’에 좌우되어 불안정하다고 본다. 가격·임금이 경직적이면 이 수요충격이 즉시 가격조정으로 흡수되지 않고 생산·고용 변동으로 이어진다. 기대가 안정적이어서 투자가 일정하다는 ②는 이 전제와 반대다.`,
3:`<b>핵심 개념</b> 통화주의는 불안정한 통화공급을 경기변동의 중요한 원인으로 보고, 장기에는 자연산출량으로 복귀한다고 본다. 프리드먼·슈워츠의 실증적 주장은 통화량 변화가 산출량 변화에 선행한다는 것이므로, GDP가 통화량에 선행한다는 ③은 인과의 시간순서를 뒤집었다.`,
4:`<b>판단 기준</b> 내부시차는 정책을 인식·결정·집행하기까지, 외부시차는 집행 후 실물경제가 반응하기까지의 시간이다. 통화정책은 중앙은행이 비교적 빨리 결정하지만 금리 변화가 소비·투자로 전달되는 데 시간이 걸려 ‘내부 짧음·외부 김’이다. 재정정책은 국회·예산 절차 때문에 내부시차가 길다.`,
5:`<b>핵심 개념</b> 자산가격경로는 토빈 q와 부의 효과로 나뉜다. q는 기업의 시장가치를 자본 재구입비용으로 나눈 값이라 q&gt;1이면 새 설비투자의 유인이 커진다. 반면 주식·부동산 가격 상승이 가계의 순자산과 소비를 늘리는 설명은 부의 효과이므로, 이를 토빈 q라고 한 ④가 틀리다.`,
6:`<b>분류 기준</b> CI·DI는 통계지표, BSI·CSI·ESI는 설문을 이용한 심리지표, 시계열·거시계량모형은 경제모형이다. CPI는 실제 가격자료로 산출하는 물가지수이지 설문조사 지표가 아니므로 CPI와 ESI를 함께 설문조사로 묶은 ③이 잘못됐다.`,
7:`<b>핵심 개념</b> 기본적 분석은 내재가치와 시장가격의 괴리를, 기술적 분석은 가격·거래량에 나타난 수급과 심리를 이용하므로 두 방법 모두 시장이 완전히 효율적이지 않다는 전제에서 초과수익을 노린다. 기업→산업→경제는 Bottom-Up이 맞지만 기본적 분석의 전형적 접근을 ‘가장 많이 쓰이는 방식’으로 단정한 부분이 틀리며, 일반적 Top-Down은 경제→산업→기업 순이다.`,
8:`<b>핵심 개념</b> 통화증가는 유동성 공급과 금리하락, 기업의 자금조달 여건 개선을 통해 단기적으로 주가에 우호적일 수 있다. 다만 유동성효과는 늘어난 화폐가 주식·채권 수요로 이동하는 포트폴리오 조정 효과이지, 민간저축 자체가 확대된다는 설명이 아니다. ②는 전달경로의 원인을 잘못 연결했다.`,
9:`<b>핵심 개념</b> 기본적 분석은 미래 현금흐름과 요구수익률을 추정해 내재가치를 계산한다. 이 과정에는 성장률·위험·할인율에 대한 판단이 들어가므로 완전히 객관적인 방법이라고 할 수 없다. 시장가격&gt;내재가치면 고평가, 반대면 저평가라는 비교원리는 맞다.`,
10:`<b>판단 기준</b> PER=주가/EPS, PCR=주가/주당현금흐름, PBR=주가/BPS다. PCR이 낮다는 것은 현금흐름에 비해 주가가 낮다는 뜻이므로 다른 조건이 같다면 과대평가보다 저평가 신호에 가깝다. 하나의 배수만으로 결론 내릴 수는 없지만 ④의 방향은 반대다.`,
11:`<b>계산 원리</b> 배당성향 40%이면 사내유보율은 60%, 지속성장률은 g=ROE×유보율=10%×60%=6%다. 다음 배당 D₁=100×1.06=106원이고 고든모형을 적용한다.<span class="formula-line">P₀ = D₁ ÷ (k-g) = 106 ÷ (0.12-0.06) = 1,766.67원 ≈ 1,767원</span>D₀가 아니라 성장한 D₁을 분자에 넣는 점이 핵심이다.`,
12:`<b>핵심 개념</b> 다우이론의 강세장은 매집→상승→과열·분산 국면으로 전개된다. 경제와 기업이익의 호전이 확인되고 일반투자자의 참여, 주가와 거래량이 함께 늘어나는 시기는 대중참여가 확대되는 상승국면이다. 매집은 소수 선도투자자가 악재 속에서 조용히 사들이는 초기 단계다.`,
13:`<b>핵심 개념</b> 엘리엇 상승 5파의 불변규칙은 ②파가 ①파의 출발점을 침범하지 않고, ③파가 가장 짧지 않으며, ④파가 통상 ①파의 가격영역과 겹치지 않는다는 것이다. 따라서 ①이 옳다. ⑤파 거래량은 보통 ③파보다 약해 다이버전스가 나타날 수 있다.`,
14:`<b>판단 기준</b> 캔들은 모양만이 아니라 출현 위치를 함께 본다. 관통형은 하락 후 상승반전, 먹구름형은 상승 후 하락반전, 유성형은 고점권의 약세 신호다. 교수형은 상승추세 끝에서 나타나는 하락반전 경고이며 음선일수록 신뢰도가 높으므로 ④는 방향과 신뢰도 모두 반대다.`,
15:`<b>핵심 개념</b> 시가와 종가가 같거나 거의 같으면 몸통이 사라지고 십자 모양이 된다. 이는 장중 매수·매도 공방이 있었지만 종가에서 균형을 이뤘다는 뜻이다. 다만 실제 반전 여부는 앞선 추세와 다음 봉의 확인이 필요하다.`,
16:`<b>핵심 개념</b> 우리사주조합 우선배정은 상장 준비 과정의 분산·종업원 참여 장치지만, 취득 주식에는 통상 보호예수 제약이 붙는다. 취득 후 1개월만 지나 자유롭게 처분할 수 있다는 ②는 보호예수 취지를 무너뜨리는 설명이다. 대표주관계약, 외부감사, 종류주식의 정관 근거는 상장 준비의 기본요건이다.`,
17:`<b>핵심 개념</b> 신규상장종목은 기존 종가가 없어 공모가격 등 평가가격을 기준으로 최초가격을 정한다. 시험 기준의 호가 범위는 기준가격의 60%~400%로 넓게 두어 시장의 가격발견 기능을 확보하고, 시가가 정해진 뒤에는 통상 가격제한폭이 적용된다.`,
18:`<b>법리</b> 액면미달발행은 자본충실을 해칠 수 있어 단순한 이사회 결의만으로 허용되는 상장특례가 아니다. 상법상 엄격한 요건과 주주총회 특별결의 등 별도 절차가 필요하다. 중간배당, 일반공모증자, 조건부자본증권 발행에는 상장회사에 인정되는 특례가 있다.`,
19:`<b>구분 기준</b> 발행공시는 새 증권을 모집·매출할 때 투자판단 정보를 제공하는 절차로 증권신고서와 투자설명서가 중심이다. 사업보고서는 상장 후 계속공시, 조회공시는 거래소 유통시장 공시에 해당한다. 따라서 발행시장 공시는 ④다.`,
20:`<b>핵심 개념</b> IOC는 즉시 체결 가능한 수량만 체결하고 잔량을 취소하며, FOK는 전량 즉시 체결이 가능할 때만 체결한다. 이 조건은 지정가·시장가·최유리 지정가 등에 붙일 수 있지만 장 마감에 가격이 바뀌는 조건부지정가에는 붙일 수 없다.`,
21:`<b>제도 취지</b> 가격제한폭은 급격한 가격변동을 완화하고 투자자에게 숙고시간을 주지만, 새로운 정보가 가격에 즉시 반영되는 것을 막아 가격발견을 지연시킬 수 있다. 따라서 정보의 효율적 반영에 도움을 준다는 ①이 가장 부적절하다. ELW에는 가격제한폭이 없고 신규상장종목도 시가 형성 후 제한폭이 적용된다.`,
22:`<b>결제 구조</b> 거래소시장은 중앙청산·결제기구를 통해 매수·매도 채무를 차감하고 집중결제하며, 증권과 대금을 맞바꾸는 실물결제 원칙을 사용한다. 거래 당사자가 건별로 직접 결제하는 개별결제는 조직화된 거래소 결제의 원칙과 거리가 멀다.`,
23:`<b>핵심 개념</b> 공매도 호가가격 제한에는 차익거래·헤지거래 등 예외가 있다. 따라서 차익거래에도 예외 없이 직전가격 이하 호가가 금지된다는 ①은 지나친 절대화다. 공매도 현황과 대차잔고 공시는 거래 투명성과 결제가능성 점검을 위한 장치다.`,
24:`<b>구분 기준</b> 비상장법인이 상장법인과 합병해 사실상 상장되는 것은 우회상장이다. 재상장은 상장법인의 분할·분할합병 등으로 새로 설립된 법인의 주권을 다시 상장하는 제도다. ③은 우회상장의 구조를 재상장으로 잘못 정의했다.`,
25:`<b>핵심 개념</b> 결제일까지 확실히 취득·반환될 증권의 매도는 소유한 것으로 보아 공매도에서 제외된다. 매수 후 결제 전 재매도, 권리행사·증자·배당으로 받을 주식, 타 보관기관 보유분, DR 해지분, ETF 환매 교부분이 여기에 해당한다. 반면 대주거래로 빌린 주식의 매도는 차입공매도이므로 ㅂ은 제외되지 않는다.`,
26:`<b>주문 구분</b> 최유리지정가는 매수 시 최우선매도호가, 매도 시 최우선매수호가로 가격을 정하며 미체결 잔량은 그 가격의 지정가로 남는다. 장 종료 단일가 때 잔량이 시장가로 전환되는 것은 조건부지정가의 특징이므로 ①은 주문 유형을 바꿔 설명했다.`,
27:`<b>핵심 개념</b> CBO는 채권, CLO는 대출채권, CDO는 여러 채무자산을 기초로 유동화한 구조이므로 ABS 계열이다. CMA는 증권사가 단기금융상품 등에 운용하는 종합자산관리계좌로, 기초자산 현금흐름을 증권화한 ABS가 아니다.`,
28:`<b>계산 원리</b> 복리채는 중간 현금흐름이 없어 맥컬리 듀레이션이 잔존만기 4년과 같다. 가격민감도에는 수정듀레이션 D/(1+y)를 쓰고 금리와 가격의 역관계를 음(-)으로 표시한다.<span class="formula-line">ΔP ≈ -[4 ÷ (1+0.07)] × 0.005 × 9,736 ≈ -182원</span>따라서 식의 부호·듀레이션·분모가 모두 맞는 ①이다.`,
29:`<b>핵심 개념</b> 이표채는 만기 전에 쿠폰을 회수하므로 현금흐름의 가중평균 회수기간인 듀레이션이 잔존만기보다 짧다. 표면이율이나 시장수익률이 높을수록 앞쪽 현금흐름의 현재가치 비중이 커져 듀레이션은 짧아진다. 무이표·복리채처럼 만기에 한 번 받는 채권만 듀레이션이 만기와 같다.`,
30:`<b>전략 구분</b> 현금흐름일치전략은 부채의 지급시점과 금액에 맞춰 채권 현금유입을 설계하는 소극적 전략이다. 수익률예측·나비형·수익률곡선타기는 금리 또는 곡선 형태의 변화를 예측해 초과수익을 추구하는 적극적 전략이므로 성격이 다른 것은 ①이다.`,
31:`<b>핵심 개념</b> 유동성선호가설은 투자자가 장기채의 가격변동·유동성 위험을 부담하는 대가로 양(+)의 기간프리미엄을 요구한다고 본다. 그러므로 동일한 미래 단기금리 기대라면 장기금리는 순수기대가설의 값보다 높아지는 방향이지 항상 낮아지지 않는다. 기대금리가 불변이어도 프리미엄 때문에 수익률곡선은 우상향할 수 있다.`,
32:`<b>선지 분석</b> 나비형은 불릿뿐 아니라 바벨과의 상대가치 포지션으로 구성하므로 ㄱ의 단정은 틀리다. 현금흐름일치는 유입액이 유출액 이상이 되게 구성해야 하므로 ㄴ도 반대다. 곡선타기는 우상향 곡선이 유지될 때 롤링효과를 얻으므로 우하향을 전제로 한 ㄹ도 틀리다. 듀레이션을 투자기간에 맞추는 ㄷ의 면역전략 설명은 옳다.`,
33:`<b>계산 원리</b> 패리티는 현재 주가가 전환가격의 몇 %인지 나타낸다.<span class="formula-line">패리티(%) = 주가 ÷ 전환가격 × 100</span>따라서 120 = 15,000 ÷ 전환가격 × 100이고, 전환가격은 15,000÷1.2=12,500원이다.`,
34:`<b>핵심 개념</b> 코넥스는 초기 중소기업의 진입부담을 낮춘 시장이라 지정자문인 제도를 두는 대신 K-IFRS 의무 적용과 분산요건 등을 완화한다. 따라서 외부감사인 지정과 K-IFRS 도입을 모두 의무라고 한 ③은 시장의 완화 취지와 반대다.`,
35:`<b>제재 단계</b> 지정자문인 미선임, 핵심 공시서류 미제출, 기업설명회 의무 불이행처럼 시장의 기본 유지요건을 잃으면 즉시 상장폐지 사유가 될 수 있다. 불성실공시는 통상 지정·벌점·공시제재가 먼저 적용되는 사항이어서 그 자체를 즉시 상장폐지와 동일시할 수 없다.`,
36:`<b>핵심 개념</b> 우체국예금·보험은 예금자보호기금의 한도보호가 아니라 국가가 지급을 책임지는 구조다. 따라서 최고 1억원까지만 보장된다는 ③이 틀리다. 신협 출자금은 예금이 아니라 조합원 지분이므로 예금보호 대상이 아니다.`,
37:`<b>핵심 개념</b> 콜ELW는 기초자산을 살 권리라 가격상승에, 풋ELW는 팔 권리라 가격하락에 가치가 커진다. 하락 시 행사가격보다 낮은 시장가격으로도 약정가격에 팔 수 있는 경제적 이익이 생기므로 정답은 풋ELW다.`,
38:`<b>상장요건</b> ELW는 인가받은 발행자, 적격 기초자산, 충분한 발행규모와 잔존기간을 요구해 유동성과 결제안전성을 확보한다. 시험 기준상 발행총액 하한은 10억원이므로 5억원이라고 한 ③이 기준에 미달한다.`,
39:`<b>핵심 개념</b> CD는 은행의 정기예금을 양도 가능한 무기명 할인식 증서로 만든 단기금융상품이다. 만기 전 은행에서 중도해지할 수는 없지만 시장에서 매도할 수 있으며, 정기예금 성격상 법정 최소기간 등 만기 제한이 존재한다. 따라서 예치기간 제한이 없다는 ②가 틀리다.`,
40:`<b>용어 구분</b> 펀드의 법정 이해관계자는 집합투자업자, 신탁업자(자산보관·운용감시), 판매업자인 투자매매·중개업자 등이다. ‘자산보관회사’는 별도 업자 유형이 아니라 신탁업자의 기능을 풀어 쓴 표현이므로 기관 구분상 ②가 해당하지 않는다.`,
41:`<b>구조 이해</b> 계약형 투자신탁에서 집합투자업자는 신탁계약을 설정하고 운용지시를 하는 위탁자, 신탁업자는 재산을 보관하는 수탁자, 투자자는 수익자다. 다수의 자금을 모아 증권 등에 운용하는 주체를 묻는 것이므로 위탁자에 해당한다.`,
42:`<b>계산 원리</b> 마코위츠 모형은 각 종목의 기대수익률·분산과 모든 종목쌍의 공분산이 필요하다. 50종목의 서로 다른 쌍은 50×49÷2=1,225개다. 따라서 기대수익률 50개, 분산 50개, 공분산 1,225개가 필요하며 이것이 입력정보가 급증하는 ‘차원의 문제’다.`,
43:`<b>핵심 개념</b> TAA는 중·단기 가격착오와 평균회귀를 예상해 비싸진 자산을 줄이고 싸진 자산을 늘리는 역투자 전략이다. 포뮬러 플랜도 Buy Low-Sell High의 기계적 재조정을 이용하므로 Buy High-Sell Low라고 한 ③은 방향이 정반대다.`,
44:`<b>벤치마크의 역할</b> 벤치마크는 운용 전에 자산군과 가중치가 명확하고, 성과를 추적할 수 있으며, 바람직한 운용상을 표현해야 한다. 그러나 투자목표·제약·시장구조가 본질적으로 바뀌면 합리적 절차로 변경할 수 있으므로 ‘절대 변경 불가’라는 ④는 지나친 표현이다.`,
45:`<b>자산집단 조건</b> 자산집단은 내부적으로 분산 가능하고 다른 집단과 충분히 독립적이어야 한다. 주식 등 투자자산은 가격변동성이 큰 대신 장기적으로 인플레이션 방어력이 기대되는 자산이므로 ‘변동성 낮음·인플레이션 취약’은 이자지급형자산의 성격에 가깝다.`,
46:`<b>도입 효과</b> 자산배분은 목표·위험예산·기준 포트폴리오를 명확히 해 운용성과를 일관되게 평가하게 한다. 핵심은 여러 자산군에 위험을 배분하는 것이므로 소수 자산 집중의 장점을 극대화한다는 ④는 분산투자의 목적과 반대다.`,
47:`<b>투자관리의 과제</b> 일차적 의사결정은 자산배분, 개별종목 선택, 투자시점 선택이며 이를 통합적으로 관리한다. 요구수익률은 투자목표와 가치평가에 쓰이는 입력값이지 이 세 가지 운용과제 자체로 분류하지 않는다.`,
48:`<b>핵심 개념</b> 전략적 자산배분(SAA)은 장기 투자목표와 위험수용도에 맞춰 주식·채권·부동산 같은 자산집단의 기준비중을 정하는 의사결정이다. 개별종목보다 자산군을 중시하고 단기 경기예측에 따라 수시로 바꾸지 않는 점에서 TAA와 구별된다.`,
49:`<b>경영 관점</b> 고객관리의 중요성은 신규고객 획득비용 상승, 정보비교의 용이성, 고객 의사결정의 고도화 때문에 ‘거래 건수’보다 장기 관계와 고객가치를 중시하게 된 데 있다. ④는 수익·고객 중심으로의 질적 전환을 양적 계수 중심으로 거꾸로 표현했다.`,
50:`<b>핵심 개념</b> 투자성향 혼합방식은 일반적인 위험성향은 점수화하고, 현재의 투자목적·기간·유동성 제약 등 부적합 요인은 추출해 보완하는 방식이다. ③은 점수화와 추출의 적용대상을 서로 바꿨다. 파생상품은 권유 시 적합성, 비권유 판매 시에도 적정성 확인이 중요하다.`,
51:`<b>상담 원칙</b> 고객상담은 본인소개와 관계 형성 뒤 고객의 목표·기간·위험수용도 등 니즈를 먼저 파악하고, 그 결과에 맞춰 상품을 제안·설명·계약한다. 상품 소개나 계약을 니즈 파악보다 앞세우면 고객 중심 권유가 아니라 판매자 중심 접근이 된다.`,
52:`<b>질문 기법</b> 개방형 질문은 고객이 자유롭게 설명하게 하고, 폐쇄형 질문은 사실을 확인하며, 확대형 질문은 배경·우선순위를 깊게 탐색한다. ‘축소형 질문’은 표준적인 고객 니즈 파악 질문 유형으로 분류하지 않는다.`,
53:`<b>서비스 이론</b> 고객서비스의 핵심은 서비스 종류를 늘리는 것보다 고객이 체감하는 편익과 경험을 설계하는 데 있다. 반복 접촉은 친숙성을, 먼저 제공한 도움은 상호성·보상성 원리를 통해 관계를 강화한다. 따라서 ‘무엇을 제공할지’만이 중요하다는 ①은 서비스 품질의 관계적 성격을 놓친다.`,
54:`<b>윤리경영</b> 금융업은 고객자산과 정보에 대한 신뢰를 기반으로 하므로 평판훼손 비용이 크고, 윤리는 규제 대응을 넘어 생존과 경쟁력의 조건이다. 윤리경영을 외부 압박에 따른 소극적 변화로만 보는 ③은 자율적 내부통제와 조직문화 구축의 취지를 거꾸로 본다.`,
55:`<b>고지의무</b> 판매대리·중개업자는 누구를 대리하는지, 단독대리 여부, 자신에게 계약체결 권한이 없다는 점, 손해배상책임 관련 사항 등을 알려야 한다. 금융소비자의 의사결정을 대신할 권한은 애초에 누구에게도 인정되지 않는 일반 원칙이지 이 문항의 법정 고지항목으로 열거되는 내용과는 거리가 멀다.`,
56:`<b>직무 경계</b> 친밀한 고객관계라도 비밀유지, 부당요구 거절, 압박 금지, 적합성 준수라는 직무 경계는 유지해야 한다. 미공개 중요정보를 주고받거나 고객에게 ‘투자권유’를 받는 상황은 친밀도 관리의 유의사항이 아니라 내부자거래·임직원 자기매매 통제의 문제이므로 ③의 분류가 맞지 않는다.`,
57:`<b>절차의 논리</b> 위험관리는 먼저 투자자정보로 적합한 범위를 정하고 그 범위 안에서 권유한 뒤, 거래 단계에서 실명확인과 제안서·기록 작성을 완결하는 흐름으로 본다. 핵심은 상품 제안 전에 투자자정보를 확인하는 것이며, 제시된 순서 중 이 원칙을 충족하는 것은 ④다.`,
58:`<b>기록관리 원칙</b> 고객기록은 진정성·무결성·추적가능성이 확보되어야 한다. 수기 원본, 전자문서, 전자우편은 보존통제 아래 기록이 될 수 있지만 단순 원본대비본은 원본성 입증이 약하고 사후 변경 위험이 있어 핵심 고객기록으로 사용하기 부적절하다.`,
59:`<b>지배구조 구분</b> 이사회가 기본방침을 승인하고, 대표이사 직속의 독립된 총괄기관과 CCO가 소비자보호 업무를 수행한다. 소비자보호 내부통제위원회의 의장은 대표이사이며, 회사 규모 등에 따라 설치 예외도 있으므로 ‘항상 의무·준법감시인이 의장’이라는 ④는 두 제도를 혼동했다.`,
60:`<b>판매원칙</b> 파생상품은 구조와 손실위험이 커 고객파악(KYC), 적합성, 비권유 판매 시 적정성이 핵심 보호원칙이다. 자기매매 금지는 회사의 고유재산 거래·이해상충을 다루는 규율이지 파생상품 판매 과정에서 적용되는 고객 적합성 원칙이 아니다.`,
61:`<b>손실보전 금지의 예외</b> 사전·사후를 막론하고 투자손실 보전이나 이익보장 약정은 원칙적으로 금지된다. 다만 위법행위 여부가 불분명한 분쟁을 사후에 사적 화해로 해결하며 손해를 배상하는 것은 금지되는 수익보장 약정과 성격이 달라 허용될 수 있다.`,
62:`<b>내부통제의 주체</b> 준법서약, 내부고발, 교육·점검, 우수자 인센티브는 조직 내부에 준법문화를 정착시키는 수단이다. 내부통제는 이사회·대표이사·준법감시인과 임직원이 운영하는 자율통제체계이며 감독기관이나 주주가 대신 운영하는 제도가 아니다.`,
63:`<b>제재 체계</b> 미등록 투자권유, 부당권유, 손실보전·이익보장 약정은 투자자의 의사결정과 재산을 직접 침해해 형사벌 대상이 된다. 투자광고규정 위반은 위반유형에 따라 과징금·과태료·행정제재 중심이므로 같은 ‘3년 이하 징역 또는 1억원 이하 벌금’ 묶음과 거리가 멀다.`,
64:`<b>핵심 개념</b> 개인정보보호법은 개인정보 일반법이며, 실제 손해액 입증이 어려운 피해자를 위해 법정손해배상제도를 둔다. 징벌적 손해배상과 개인 행위자에 대한 처벌규정도 존재하므로 ③·④는 틀리다.`,
65:`<b>단계 구분</b> 자금세탁은 범죄수익을 금융시스템에 넣는 예치(placement), 거래를 겹쳐 출처를 흐리는 은폐(layering), 합법재산처럼 사용하는 합법화(integration) 순이다. ②는 예치와 은폐의 순서를 바꿨다. CDD·EDD는 고객확인, STR은 의심거래, CTR은 고액현금거래 보고제도다.`,
66:`<b>업무 개념</b> 금융투자업자의 자기계산 매매는 금지되는 것이 아니라 투자매매업의 본질적 형태이며, 이해상충·자기매매 규제를 지켜 수행한다. 반면 핵심 계약체결·인수업무의 위탁 제한, 전문투자자에 대한 일부 보호규정 면제, 파생상품의 적정성 원칙은 자본시장법 체계의 내용이다.`,
67:`<b>내부정보 규제</b> 규제대상은 상장법인 관련 특정증권 등과 공개매수·대량취득 관련 정보이며, 일반 회사채 전체를 일률적으로 포함하지 않는다. 퇴직 내부자도 퇴직 후 1년 이내에는 규제될 수 있고, 전문투자자라는 이유만으로 미공개정보 이용이 허용되지 않는다. 문항은 ②의 ‘일반채권 포함’ 부분을 잘못된 연결로 본다.`,
68:`<b>자료열람권</b> 계약서·약관·설명서 등은 장기간 보존해 분쟁 시 판매과정을 검증한다. 금융소비자의 자료열람 요구에는 시험 기준상 6일 이내에 열람 가능하게 하는 것이 원칙이므로 14일이라고 한 ③이 틀리다. 제한·거절은 법정 사유가 있을 때만 가능하고 이유를 알려야 한다.`,
69:`<b>전문투자자 구분</b> 상대적 전문투자자는 원래 전문성이 인정되지만 본인의 의사에 따라 일반투자자 대우를 선택할 수 있는 집단으로, 주권상장법인·지자체·기금운용법인 등이 포함된다. 절대적 전문투자자는 임의로 일반투자자로 전환할 수 없으며, 장외파생상품에는 별도의 대우 규칙이 적용된다.`,
70:`<b>인가 유지의무</b> 금융투자업자는 인가 후에도 자기자본·인력·건전경영 등 핵심 요건을 유지해야 하지만, 최초 인가 시 대주주의 출자능력과 부채비율 같은 모든 세부조건을 영구히 동일하게 유지하는 것은 아니다. ③은 초기 심사요건과 계속 유지요건을 구분하지 않았다.`,
71:`<b>건전성 규제</b> 순자본비율은 위험을 감당할 수 있는 가용자본을 필요유지자기자본과 비교하는 지표로 일별 산정·정기 검토가 요구된다. 감독당국 즉시보고 기준을 순자본비율 150%(구 영업용순자본비율 200%)로 묶은 ④는 시험 기준의 보고·경영개선 기준과 맞지 않는다.`,
72:`<b>이해상충 통제</b> 금융회사는 선행매매·과당매매를 금지하고, 부서 사이 정보교류차단장치와 내부통제·보고체계를 둬 고객재산과 고유재산의 이해상충을 관리한다. 고유재산운용과 신탁업은 이해상충 가능성이 큰 조합이므로 통제가 필요 없다는 ④는 정반대다.`,
73:`<b>외국인 취득한도</b> 외국인은 정해진 매매경로·계좌·대리인 기준을 따라야 하며, 공공적 법인의 외국인 취득한도는 법령·정관 등 개별 기준으로 관리된다. 전체 취득한도를 모든 대상에 일률적으로 30%라고 한 ④는 개별 한도체계를 고정 수치로 일반화했다.`,
74:`<b>단기매매차익 반환</b> 임원·주요주주 등의 매수와 매도가 6개월 이내에 이루어지면 내부정보 이용 여부와 무관하게 차익반환 대상이 되는 것이 원칙이다. 안정조작·시장조성, 주식매수선택권 행사, 주식매수청구권 행사는 법정 예외지만 3개월 후 매도는 여전히 6개월 이내라 예외가 아니다.`,
75:`<b>업무 구분</b> 전자지급이체, 사채모집 수탁, 외국환업무는 금융투자업과 함께 할 수 있는 겸영업무의 예다. 투자매매 계약체결은 투자매매업 자체의 본질적 업무이므로 ‘겸영대상’이라는 별도 범주에 넣을 수 없다.`,
76:`<b>보호예수 취지</b> 보호예수는 일정 기간 처분을 제한해 책임경영과 시장안정을 확보하는 제도이므로 당사자 합의만으로 임의 해제할 수 없다. 통일규격 교환, 전환권·신주인수권 행사, 액면분할·병합처럼 증권의 형식이나 권리행사에 불가피한 경우에만 예외적 인출이 허용된다.`,
77:`<b>투자매매업 판단</b> 자기 책임과 계산으로 파생결합증권을 발행하는 행위는 그 자체가 투자매매업에 해당한다. 반면 투자매매업자를 상대방으로 하는 일반 법인의 거래, 일정 전문투자자 간 RP, 요건을 갖춘 외국업자의 국외 발행 등은 법정 적용배제 사유가 될 수 있다.`,
78:`<b>수치의 의미</b> 종합매입초과포지션은 여러 외화의 매입초과액을 합산해 환율변동에 노출된 규모를 재는 한도다. 시험 기준은 전월 말 자기자본의 50%이며, 이는 외환위험이 자기자본을 과도하게 잠식하지 못하도록 하는 건전성 규제다.`,
79:`<b>대주주 거래 통제</b> 대주주·특수관계인과의 신용공여·증권취득은 사익편취 위험 때문에 이사회 의결과 공시, 한도규제를 받는다. ③은 ‘자기자본 1% 취득’이라는 기준을 신용공여의 이사회 의결요건과 잘못 결합했다. 소액거래 예외는 자기자본 0.1%와 10억원 중 적은 금액을 기준으로 본다.`,
80:`<b>광고 원칙</b> 투자광고는 준법감시인 확인과 협회 심사를 거치고 심사필을 표시해야 하며, 수익·위험 정보를 공정하게 제시해야 한다. 다른 회사의 경영실태평가나 순자본비율과 단순 비교해 우월성을 암시하는 광고는 오인 가능성이 커 허용되는 방법이 아니다.`,
81:`<b>담보평가 원칙</b> 담보가치는 임의의 거래가격이 아니라 객관적이고 재현 가능한 기준가격으로 평가한다. 상장주권·ETF는 당일 종가, 채권은 복수 평가회사 가격, 펀드는 고시 기준가격을 사용하므로 ‘상장주식=매도가액’이라는 ①이 틀리다.`,
82:`<b>시장 구분</b> 소매채권시장은 개인 등 소액투자자의 장내 채권거래 접근성을 높이기 위한 시장이다. 시험 기준상 소매채권매매 전문회원의 대상은 액면 50억원 미만 거래이며, 이 금액은 채권의 시장가가 아니라 액면총액 기준이다.`,
83:`<b>제재 구조</b> 미공개 중요정보 이용에는 형사책임과 민사상 손해배상책임이 함께 성립할 수 있다. 손해배상청구권은 안 날부터 2년, 행위가 있은 날부터 5년이라는 단기 소멸구조로 이해해야 하므로 ‘안 날부터 3년’이라는 ④가 틀리다.`,
84:`<b>위험 분류</b> 시장위험은 주가·금리·환율 등 가격변동, 신용위험은 거래상대방의 채무불이행, 운영위험은 부적절한 내부절차·인력·시스템 또는 외부사건에서 생긴다. ④는 신용위험의 정의를 운영위험으로 잘못 붙였다.`,
85:`<b>자산건전성 단계</b> 손실가능성이 커질수록 정상 0.5%→요주의 2%→고정 20%→회수의문 75%→추정손실 100%처럼 충당률이 높아진다. 회수의문을 곧바로 100%로 적립한다고 한 ④는 회수의문과 추정손실을 혼동했다.`,
86:`<b>재산상 이익의 경계</b> 자체 개발한 분석·주문 소프트웨어와 불가피한 장비, 자체 조사자료, 기준 이내 경조비 등은 업무상 정보·관행으로 보아 예외가 인정될 수 있다. 반면 경품·식사는 소액이라도 협회 기준을 넘으면 재산상 이익에 해당하며, 문항의 5만원은 비재산상 이익으로 보는 기준을 초과한다.`,
87:`<b>청약철회 기간</b> 투자성 상품의 일반적 철회기간과 대출성 상품을 구분해야 한다. 대출성 상품은 계약체결일 또는 계약서류 제공일부터 14일 이내 철회할 수 있으므로 7일이라고 한 ②가 틀리다. 철회의 효력은 의사표시 발송과 이미 받은 원금·이자 등의 반환이 함께 이루어질 때 발생한다.`,
88:`<b>배정 규칙</b> 코스닥 상장 공모에서는 우리사주조합에 공모주식 20%를 의무배정하는 유가증권시장식 규칙이 그대로 적용되지 않는다. 일반청약자·고수익고위험투자신탁·벤처기업투자신탁에는 시험 기준의 최소배정 틀이 있으므로 ①이 부적절하다.`,
89:`<b>전문투자자 구분</b> 지방자치단체는 상대적 전문투자자여서 의사표시에 따라 일반투자자 대우를 받을 수 있다. 한국주택금융공사와 금융회사인 여신전문금융회사·상호저축은행은 절대적 전문투자자 범주라 임의 전환 대상이 아니다.`,
90:`<b>결의요건</b> 보통결의는 출석한 의결권의 과반수이면서 발행주식총수의 4분의 1 이상, 특별결의는 출석 의결권의 3분의 2 이상이면서 발행주식총수의 3분의 1 이상이다. ③은 특별결의의 총발행주식 기준을 2분의 1로 과도하게 높였다.`,
91:`<b>이사회 소집</b> 이사회는 각 이사가 소집할 수 있는 것이 원칙이고, 정관 또는 이사회 결의로 특정 이사를 소집권자로 정할 수 있다. 대표이사가 언제나 원칙적 소집권자라는 ①은 법의 기본구조를 좁혀 표현했다. 나머지는 의사록 열람, 찬성 추정, 보통결의 정족수에 관한 원칙이다.`,
92:`<b>자본금 원칙</b> 액면주식은 액면총액, 무액면주식은 발행가액 중 이사회가 자본금으로 정한 금액으로 자본금을 구성한다. 액면주식과 무액면주식의 상호 전환은 주식의 표시방식을 바꾸는 것이며 그 자체로 회사 자본금 총액을 증감시키지 않는다.`,
93:`<b>주식배당의 재원</b> 주식배당도 이익배당이므로 법정준비금 등을 공제해 산정한 배당가능이익 범위에서 해야 한다. 주주총회 결의가 필요하고, 주주는 그 결의가 있는 주주총회 종결 때 신주의 주주가 된다. 이익배당총액의 4분의 1 제한이나 이사회 결의만으로 가능하다는 설명은 맞지 않는다.`,
94:`<b>권리의 성격</b> 전환권을 행사하면 별도의 승낙 없이 사채가 주식으로 전환되는 법률효과가 생기므로 전환권은 형성권이다. 상대방에게 일정 행위를 요구하는 청구권이라고 한 ③이 틀리다. 전환 전에는 사채, 전환 후에는 주주 지위라는 상태변화가 핵심이다.`,
95:`<b>채권자보호</b> 감자는 주주 지분뿐 아니라 회사의 책임재산인 자본금을 줄여 채권자의 담보를 약화시킨다. 그래서 주주총회 특별결의와 함께 채권자 이의제출 등 보호절차가 필요하다. ‘주주 관련 사항이므로 채권자보호 불필요’라는 ③은 자본충실 원칙을 놓쳤다.`,
96:`<b>과세주체</b> 소득세·법인세·부가가치세는 국가가 부과하는 국세이고, 취득세는 부동산·차량 등 자산 취득에 대해 지방자치단체가 부과하는 지방세다. 세목은 과세대상보다 먼저 국세·지방세 체계로 구분하면 빠르게 판단할 수 있다.`,
97:`<b>납세의무의 승계</b> 납부, 충당, 부과취소, 부과제척기간 만료, 징수권 소멸시효 완성 등은 납세의무를 소멸시킨다. 납세자가 사망하면 일정 범위에서 상속인이 납세의무를 승계하므로 사망 자체는 소멸사유가 아니다.`,
98:`<b>제2차 납세의무</b> 본래 납세자의 재산으로 충당하지 못할 때 청산인·잔여재산 분배자, 과점주주, 사업양수인 등에게 보충적으로 책임을 지우는 제도다. 사업양도인의 체납세액에 대해 일정 범위에서 사업양수인이 제2차 납세의무를 지므로 ④는 책임 주체를 양도인으로 거꾸로 적었다.`,
99:`<b>상속세 책임</b> 상속인과 수유자는 각자가 받은 상속재산을 한도로 상속세를 부담하며, 여러 명이면 그 한도 안에서 연대납부의무가 있다. 따라서 연대책임이 없다는 ③이 틀리다. 영리법인은 상속재산에 법인세 체계가 적용되므로 상속세가 면제되는 취지도 함께 구분한다.`,
100:`<b>과세표준 구조</b> 상속세 과세표준은 상속세 과세가액에서 기초공제·인적공제 등 상속공제와 감정평가수수료를 차감해 계산한다. ‘조특공제’는 이 일반적인 상속세 공제항목으로 열거되지 않으므로 ③이 거리가 멀다.`
};
const $=x=>document.getElementById(x), esc=s=>s; let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};let subject=0,wrongOnly=false;
const subjects=[{number:0,name:'전체',range:'01-100'},...Array.from(new Map(Q.map(q=>[q.subject.number,q.subject])).values()).map(s=>({...s,range:s.number===1?'01-35':s.number===2?'36-65':'66-100'}))];
function save(){localStorage.setItem(KEY,JSON.stringify(saved))}
function buildTabs(){tabs.innerHTML=subjects.map(s=>`<button class="tab ${s.number===subject?'active':''}" data-s="${s.number}">${s.number?`제${s.number}과목 · `:''}${s.name}<small> ${s.range}</small></button>`).join('');tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{subject=+b.dataset.s;buildTabs();filter();scrollTo({top:0,behavior:'smooth'})})}
function render(){questions.innerHTML=Q.map(q=>`<article class="qcard" id="q${q.n}" data-n="${q.n}" data-s="${q.subject.number}"><div class="qtop"><span class="pill">제${q.subject.number}과목</span><span class="num">Q${String(q.n).padStart(2,'0')}</span></div><div class="qtitle">${q.title}</div><div class="stem">${q.stem}</div><div class="opts">${q.options.map((o,i)=>`<button class="opt" data-i="${i+1}"><span class="mark">${MARK[i]}</span><span>${o}</span></button>`).join('')}</div><div class="feedback"></div></article>`).join('');document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const c=b.closest('.qcard'),n=+c.dataset.n;if(saved[n])return;saved[n]=+b.dataset.i;save();paint(n);stats()});Q.forEach(q=>paint(q.n));filter();stats()}
function paint(n){const q=Q[n-1],c=$('q'+n),pick=saved[n],done=!!pick;c.classList.toggle('ok',done&&pick===q.answer);c.classList.toggle('bad',done&&pick!==q.answer);c.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=done;b.classList.toggle('correct',done&&i+1===q.answer);b.classList.toggle('wrong',done&&i+1===pick&&pick!==q.answer);b.querySelector('.tag')?.remove();if(done&&(i+1===q.answer||i+1===pick)){const t=document.createElement('span');t.className='tag';t.textContent=i+1===q.answer?'정답':'내 선택';b.appendChild(t)}});const f=c.querySelector('.feedback');f.classList.toggle('show',done);if(done)f.innerHTML=`<span class="result" style="color:var(--${pick===q.answer?'ok':'bad'})">${pick===q.answer?'정답입니다.':'오답입니다.'} 정답은 ${MARK[q.answer-1]}입니다.</span><div class="explain">${E[n]||'해설을 준비 중입니다.'}</div>`}
function filter(){Q.forEach(q=>{const v=(!subject||q.subject.number===subject)&&(!wrongOnly||(saved[q.n]&&saved[q.n]!==q.answer));$('q'+q.n).classList.toggle('hidden',!v)})}
function stats(){const done=Q.filter(q=>saved[q.n]).length,ok=Q.filter(q=>saved[q.n]===q.answer).length;$('stat').textContent=`${done} / 100 풀이 · ${ok} 정답`;$('bar').style.width=done+'%';$('summary').innerHTML=`<div class="sum"><b>100</b><span>전체 문항</span></div>`+subjects.slice(1).map(s=>{const a=Q.filter(q=>q.subject.number===s.number),d=a.filter(q=>saved[q.n]).length,k=a.filter(q=>saved[q.n]===q.answer).length;return `<div class="sum"><b>${k} / ${a.length}</b><span>제${s.number}과목 정답 · ${d}풀이</span></div>`}).join('')}
$('wrong').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);e.currentTarget.textContent=wrongOnly?'전체 문항 보기':'오답만 보기';filter()};
$('reset').onclick=()=>{if(confirm('모든 응답 기록을 초기화할까요?')){saved={};save();Q.forEach(q=>paint(q.n));stats();filter();gradebox.classList.add('hidden')}};
$('grade').onclick=()=>{const ok=Q.filter(q=>saved[q.n]===q.answer).length,done=Q.filter(q=>saved[q.n]).length,wrong=Q.filter(q=>saved[q.n]&&saved[q.n]!==q.answer);gradebox.innerHTML=`<h2>채점 요약</h2><div class="score">${ok}점</div><p>${ok} / 100 정답 · ${done}문항 풀이${done<100?' · 미풀이 문항은 0점 처리':''}</p>`+(wrong.length?`<div class="wronglinks"><b>오답 문항</b><br>${wrong.map(q=>`<button data-go="${q.n}">Q${String(q.n).padStart(2,'0')}</button>`).join('')}</div>`:'<p>현재까지 오답이 없습니다.</p>');gradebox.classList.remove('hidden');gradebox.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{subject=0;wrongOnly=false;buildTabs();filter();$('q'+b.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})});gradebox.scrollIntoView({behavior:'smooth'})};
function theme(t){document.documentElement.dataset.theme=t;$('theme').textContent=t==='dark'?'☀️':'🌙'}let th=localStorage.getItem(TKEY)||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');theme(th);$('theme').onclick=()=>{th=document.documentElement.dataset.theme==='dark'?'light':'dark';theme(th);localStorage.setItem(TKEY,th)};
buildTabs();render();
</script></body></html>
