<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>증권자문 Copilot 모의고사03 - 증권투자권유자문인력</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#697286;--pri:#3f5efb;--pri2:#7b61ff;--ok:#13a66b;--bad:#db3a34;--yel:#e0a800;--line:#e5e8f0;--soft:#eef2ff;--warn:#fff6df;--warn-line:#f1dc9a;--warn-ink:#5b4a17;--ok-bg:#eafaf3;--ok-line:rgba(19,166,107,.4);--bad-bg:#fff0ef;--bad-line:rgba(219,58,52,.4);--stem:#f8fafc;--hover:#fafbff;--hover-line:#b8c2ff;--pill:#f2f4f8;--pill-ink:#5b6478;--head:rgba(255,255,255,.94);--shadow:0 8px 22px rgba(23,32,51,.05)}
html[data-theme=dark]{color-scheme:dark;--bg:#12131a;--card:#1b1d27;--ink:#eceef6;--muted:#a3a9bb;--pri:#8ea2ff;--pri2:#b39dff;--ok:#4cd694;--bad:#ff8782;--yel:#f5c84c;--line:#32364a;--soft:#262b4a;--warn:#2d2815;--warn-line:#5f5222;--warn-ink:#ecdca3;--ok-bg:#12301f;--ok-line:rgba(76,214,148,.5);--bad-bg:#3a1b1d;--bad-line:rgba(255,135,130,.5);--stem:#20232f;--hover:#232638;--hover-line:#5a67b8;--pill:#262a39;--pill-ink:#b6bdd0;--head:rgba(27,29,39,.94);--shadow:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:15px;line-height:1.65;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:12px 20px;width:100%}
.pgrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px}
.pb{min-width:0}.pb .lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.pb .lab b{color:var(--ink)}.pb .lab .st{overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;width:0;background:var(--ok);transition:width .25s,background .25s}
.pb.yel .bar>span{background:var(--yel)}.pb.red .bar>span{background:var(--bad)}
.pb.yel .lab .st{color:var(--yel)}.pb.red .lab .st{color:var(--bad)}.pb.grn .lab .st{color:var(--ok)}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.tab small{margin-left:4px;opacity:.75;font-weight:800}
.tab.active{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .tab.active{color:#10131f}
button:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
.hero{padding:26px 20px 6px}
.badge{display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:800;font-size:13px}
.hero h1{font-size:30px;letter-spacing:-.04em;margin:12px 0 8px;line-height:1.25}
.hero p{margin:0;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.sumcard b{display:block;font-size:22px;line-height:1.25}.sumcard span{color:var(--muted);font-size:13px}
.sumcard.total{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0}.sumcard.total b,.sumcard.total span{color:#fff}
.note{margin-top:14px;background:var(--warn);border:1px solid var(--warn-line);border-radius:16px;padding:13px 16px;color:var(--warn-ink);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .btn.primary{color:#10131f}
.btn[aria-pressed=true]{border-color:var(--pri);color:var(--pri);background:var(--soft)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:16px 0;padding:22px;box-shadow:var(--shadow);scroll-margin-top:170px;min-width:0;overflow-wrap:anywhere}
.qcard.is-ok{border-left:5px solid var(--ok)}.qcard.is-bad{border-left:5px solid var(--bad)}
.qtop{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--pill);color:var(--pill-ink);font-weight:700}
.pill.sj{background:var(--pri);color:#fff}html[data-theme=dark] .pill.sj{color:#10131f}
.pill.ch{background:var(--soft);color:var(--pri)}
.num{font-weight:900;color:var(--pri);flex:none}
.q{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px;line-height:1.55}
.opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);transition:.15s;min-width:0}
.opt span.t{min-width:0;flex:1}
.opt b{flex:none;color:var(--pri)}
.opt:hover:not(:disabled){border-color:var(--hover-line);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}.opt.correct b{color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}.opt.wrong b{color:var(--bad)}
.opt .mark{flex:none;font-size:12px;font-weight:900}
.opt.correct .mark{color:var(--ok)}.opt.wrong .mark{color:var(--bad)}
.explain{display:none;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--stem);border:1px solid var(--line)}
.explain.show{display:block}
.result{font-weight:900;margin-bottom:6px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.result.peek{color:var(--pri)}
.ans{font-weight:800;margin-bottom:6px}
.src{margin-top:10px;padding:10px 12px;border-left:3px solid var(--warn-line);background:var(--warn);color:var(--warn-ink);border-radius:8px;font-size:13.5px}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-width:100%;overflow-x:auto;font-family:"Cambria Math","Times New Roman",serif;font-size:16px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.frac .top{border-bottom:1.5px solid currentColor;padding:0 4px;line-height:1.3}.frac .bottom{padding:0 4px;line-height:1.3}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.gradebox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.gradebox h2{margin:0 0 6px;font-size:20px}
.verdict{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px;margin-left:8px;vertical-align:middle}
.verdict.pass{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}.verdict.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.score-big{font-size:34px;font-weight:900;color:var(--pri);letter-spacing:-.03em}
.score-big small{font-size:15px;color:var(--muted);font-weight:700;margin-left:6px}
.chrow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.chrow .mini{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.chrow .mini i{display:block;height:100%}
.chrow .val{font-weight:800;white-space:nowrap}
.wrongs{margin-top:14px}.wrongs a{display:inline-block;margin:3px 6px 3px 0;padding:3px 10px;border-radius:999px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
.hidden{display:none!important}
main{padding-bottom:50px}
@media(max-width:820px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.hero h1{font-size:24px}.wrap,.hero{padding-left:14px;padding-right:14px}.qcard{padding:17px;border-radius:18px;scroll-margin-top:200px}.q{font-size:16px}.chrow{grid-template-columns:110px minmax(0,1fr);}.chrow .val{grid-column:1/-1}}
@media print{header,.controls{display:none}.explain{display:block!important}.qcard{break-inside:avoid;box-shadow:none}}

.casebox,.bulletbox{margin:14px 0 4px;padding:14px 16px;border:1px solid var(--hover-line);border-left:5px solid var(--pri);border-radius:12px;background:var(--soft);display:grid;gap:9px}.caseitem{padding:8px 10px;border-radius:8px;background:var(--card);border:1px solid var(--line);line-height:1.62}.bulletbox{display:block;padding-left:36px}.bulletbox li{margin:7px 0;line-height:1.62}.lesson{display:grid;gap:10px;margin-top:10px}.lesson-row{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:start;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);line-height:1.65}.lesson-label{font-weight:800;color:var(--pri)}@media(max-width:640px){.lesson-row{grid-template-columns:1fr;gap:4px}.casebox{padding:11px}.q{line-height:1.68}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="pgrid"><div class="bars" id="bars"></div><button class="theme" id="theme" type="button"></button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="과목 필터"></div>
</div></header>
<section class="hero wrap">
  <span class="badge">적중문제·레퍼런스 기반 100문항</span>
  <h1>증권투자권유자문인력<br>Copilot 모의고사 03</h1>
  <p>선택지를 누르면 정답 여부와 해설이 바로 열리고, 풀이 기록은 이 기기에 저장됩니다.</p>
  <div class="summary" id="summary"></div>
  <div class="note"><b>합격 기준</b><br>과목별 정답률 50% 이상, 총점 70% 이상이어야 합격입니다. 미풀이 문항은 오답으로 처리합니다. 상단 막대는 오답이 과락 경계에 도달하면 <b>노란색</b>, 경계를 넘으면 <b>빨간색</b>으로 바뀝니다.</div>
  <div class="controls">
    <button class="btn" id="wrongBtn" type="button" aria-pressed="false">오답만 보기</button>
    <button class="btn" id="expBtn" type="button" aria-pressed="false">해설 전체 펼치기</button>
    <button class="btn primary" id="gradeBtn" type="button">채점 요약 보기</button>
    <button class="btn" id="resetBtn" type="button">기록 초기화</button>
  </div>
</section>
<main class="wrap">
  <div id="questions"></div>
  <div class="empty hidden" id="empty">조건에 맞는 문항이 없습니다.</div>
  <div class="gradebox hidden" id="gradeBox"></div>
</main>
<script>
const RAW=[[1,"경기분석","심화응용","경기순환과정에서 순환주기(Cycle)에 대한 설명으로 올바른 것은?",["경기의 정점 또는 저점이 발생한 구체적인 시점을 의미한다.","저점에서 다음 저점까지 또는 정점에서 다음 정점까지의 기간을 의미한다.","정점과 저점 간의 차이를 의미한다.","순환의 강도를 의미한다."],1,"[[LESSON:핵심 판단｜정답은 ②이다. 정답 문장은 “저점에서 다음 저점까지 또는 정점에서 다음 정점까지의 기간을 의미한다.”이다.||정답 근거｜경기순환과정 · 순환주기(Cycle): 저점(Trough)에서 다음 저점까지 또는 정점(Peak)에서 다음 정점까지의 기간 순환과정 · 순환진폭 혹은 순환심도: 순환의 강도를 의미하는 정점과 저점 간의 차이 · 4국면: 호황(Boom), 회복(Recovery), 후퇴(Recession), 불황(Depression) 국면 · 이분법: 저점에서 정점까지를 확장국면(Expansion), 정점에서 저점까지를 수축국면(Contraction)||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “경기순환과정에서 순환주기(Cycle)에 대한 설명으로 올바른 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"경기분석","개념응용","거시경제지표의 통화량에 대한 설명으로 옳은 것은?",["통화량의 변화는 단기적으로는 물가 변화에, 장기적으로는 시차를 두고 실물부문에 영향을 미친다.","상대적 파급효과의 크기는 경제구조, 경기상황 등과 관계없이 동일하게 영향을 준다.","통화지표는 유동성에 의해서 M1, M2, Lf, L로 분류된다.","M1은 현금통화, 요구불예금 및 만기 2년 미만 정기예금으로 구성된다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “통화지표는 유동성에 의해서 M1, M2, Lf, L로 분류된다.”이다.||정답 근거｜통화지표는 유동성의 범위에 따라 M1, M2, Lf, L로 분류된다. 통화량 변화는 단기적으로 실물부문에, 장기적으로는 시차를 두고 물가에 영향을 미치며 파급효과는 경제구조와 경기상황 등에 따라 달라진다. M1에는 현금통화, 요구불예금 및 수시입출식 저축성예금이 포함된다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “거시경제지표의 통화량에 대한 설명으로 옳은 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"경기분석","심화응용","기업경기실사지수(BSI)에 대한 설명으로 가장 거리가 먼 것은?",["기업가의 경기동향 판단, 예측 등을 조사하여 지수화한 것이다.","단기 경기예측수단의 하나이다.","BSI가 80이면 수축국면을 의미한다.","BSI는 최소 0, 최대 100의 값을 갖는다."],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “BSI는 최소 0, 최대 100의 값을 갖는다.”이다.||정답 근거｜기업경기실사지수(BSI). · 전반적인 경기동향을 파악하고자 하는 단기 경기예측수단의 하나 개 요 · 피구(A. C. Pigou)나 케인즈(J. M. Keynes)의 심리적 경기이론 〕 · 선진국에서 널리 활용 I · 기업경기실사지수: 최소 0. 최대 200의 값 해 석 · 지수가 100 초과: 경기긍정 이 확장국면 j · 지수가 100 미만: 경기부정 아 수축국면||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “기업경기실사지수(BSI에 대한 설명으로 가장 거리가 먼 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"경기분석","개념응용","경기변동의 원인에 대한 내용으로 올바른 것은?",["케인즈는 민간기업의 투자지출 변화에 의한 공급측면의 충격을 경기변동의 원인이라고 하였다.","슘페터는 불완전 정보 상황에서 경제주체들의 기대가 경기변동의 원인이라고 하였다.","루카스는 기술이나 생산성 변화와 같은 공급측면의 충격이 경기변동의 원인이라고 하였다.","프리드먼은 통화량 변화와 같은 화폐적 충격이 경기변동의 원인이라고 하였다."],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “프리드먼은 통화량 변화와 같은 화폐적 충격이 경기변동의 원인이라고 하였다.”이다.||정답 근거｜프리드먼은 통화당국의 자의적인 통화량 조절과 같은 화폐적 충격을 경기변동의 원인으로 보았다. 케인즈는 투자지출 변화에 따른 수요측면의 충격, 루카스는 불완전 정보 아래의 기대와 판단 오류, 슘페터는 기술혁신과 같은 공급측면의 충격을 강조하였다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “경기변동의 원인에 대한 내용으로 올바른 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"경기분석","심화응용","토빈(J. Tobin)의 q이론에 대한 설명으로 거리가 먼 것은?",["주식의 가격변화가 투자에 미치는 영향에 관한 이론이다.","주가가 상승하면 q가 상승한다.","통화정책의 파급경로 중 금리경로를 설명할 수 있는 이론이다.","토빈의 q는 기업의 시장가치를 기업의 실물자본 대체비용으로 나눈 비율이다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “통화정책의 파급경로 중 금리경로를 설명할 수 있는 이론이다.”이다.||정답 근거｜토빈의 q이론 · 투자에 대한 주가변화(자산가격)의 영향을 분석한 것 · 자산가격경로를 설명할 수 있는 이론임 · 토빈의 q는 주식시장에서 평가된 기업의 시장가치를 기업의 실물자본 대체비용으로 나눈 비율임 · q > 1: 경영성과 상승 및 투자 증가 · q < 1: 경영성과 하락 및 투자 없음 아 M&A 대상||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “토빈(J. Tobin)의 q이론에 대한 설명으로 거리가 먼 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"경기분석","개념응용","다음 설명에 해당하는 물가지수는? [[BOX:국내 생산자가 국내시장에 공급하는 상품과 서비스의 가격 변동을 측정한다.||생산자의 판매가격을 조사하므로 기업 간 거래가격의 움직임을 파악하는 데 유용하다.]]",["소비자물가지수(CPI)","생산자물가지수(PPI)","GDP 디플레이터","수출입물가지수"],1,"[[LESSON:핵심 판단｜정답은 ②이다.||정답 근거｜생산자물가지수는 국내 생산자가 국내시장에 공급하는 상품과 서비스의 가격 변동을 생산자 판매가격 기준으로 측정한다. 소비자물가지수는 가계가 구입하는 소비재·서비스, GDP 디플레이터는 국내 최종생산물 전체의 가격수준을 대상으로 한다.||오답 정리｜조사대상이 가계인지 생산자인지, 품목범위가 소비바스켓인지 국내 최종생산물 전체인지 구분해야 한다.||실전 암기｜CPI는 소비자 구입가격, PPI는 생산자 판매가격, GDP 디플레이터는 명목GDP÷실질GDP×100이다.]]"],[1,"기본적 분석","심화응용","다음 자료를 이용하여 당기순이익을 계산하면 얼마인가? [[BOX:총자본이익률(ROI) 4%||총자본회전율 2회||매출액 1,000,000원]]",["20,000원","40,000원","60,000원","80,000원"],0,"[[LESSON:핵심 판단｜정답은 ①이다.||정답 근거｜총자본회전율=매출액÷총자본이므로 총자본은 1,000,000원÷2=500,000원이다. ROI=당기순이익÷총자본=4%이므로 당기순이익은 500,000원×4%=20,000원이다.||오답 정리｜총자본회전율을 곱해 총자본을 2,000,000원으로 잡거나, ROI를 매출액에 바로 곱하면 오답이 된다.||실전 암기｜매출액에서 총자본을 먼저 역산한 뒤 ROI를 적용한다.]]"],[1,"기본적 분석","개념응용","요구수익률이 9%이고, 매년 300원의 배당이 영구히 계속되며 성장하지 않는 주식의 이론가치는?",["3,000원","3,333원","4,250원","5,000원"],1,"[[LESSON:핵심 판단｜정답은 ②이다.||정답 근거｜무성장 영구배당모형은 P₀=D÷k이다. 따라서 300원÷0.09=3,333.33원으로 약 3,333원이다.||오답 정리｜성장률이 0이므로 고든모형의 분모는 k-g=9%-0%=9%이다. 배당을 EPS나 액면가와 혼동하면 안 된다.||실전 암기｜무성장주식은 영구연금과 동일하게 배당÷요구수익률로 평가한다.]]"],[1,"기본적 분석","심화응용","배당성향이 50%, 자기자본이익률이 10%, 현재 EPS가 1,000원, 요구수익률이 20%일 때, 이 기업의 적정주가를 항상성장모형으로 구하면?",["3,500원","4,500원","5,500원","6,500원"],0,"[[LESSON:핵심 판단｜정답은 ①이다. 정답 문장은 “3,500원”이다.||정답 근거｜P = Do(1 + g)/(k - g) = 500(1 + 0.05)/(0.2 - 0.05) = 3,500원 · Do = EPS x 배당성향 = 1,000원 x 50% = 500원 · g = 사내유보율 x ROE = 50% x 10% = 5%||오답 정리｜계산형은 공식, 단위, 기준시점을 먼저 적고 수치를 대입한다. 분모·분자와 백분율 환산을 마지막에 다시 확인하면 함정을 줄일 수 있다.||실전 암기｜이 문항의 기준어를 “배당성향이 50%, 자기자본이익률이 10%, 현재 EPS가 1,000원, 요구수익률이 20%일 때”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"기본적 분석","개념응용","EV/EBITDA에 관한 설명의 빈칸을 바르게 채운 것은? [[BOX:EV/EBITDA는 기업의 ( 가 )를 영업활동으로 창출한 현금흐름 대용치인 ( 나 )와 비교하는 지표이다.]]",["(가) 전체가치 / (나) EBITDA","(가) 주주가치 / (나) EBITDA","(가) 주주가치 / (나) EBIT","(가) 전체가치 / (나) 당기순이익"],0,"[[LESSON:핵심 판단｜정답은 ①이다.||정답 근거｜EV는 시가총액에 순차입금 등을 반영한 기업의 전체가치이고, EBITDA는 이자·법인세·감가상각비 차감 전 이익으로 영업현금창출력의 대용치다.||오답 정리｜주주가치만 비교하는 지표는 PER·PBR에 가깝다. EBIT와 당기순이익은 EBITDA와 달리 감가상각비 또는 금융·세금 효과를 반영한다.||실전 암기｜EV=주주가치+순부채, EV/EBITDA는 자본구조와 감가상각정책 차이를 완화해 기업가치를 비교한다.]]"],[1,"기본적 분석","심화응용","주가와 경기변동의 관계에 대한 설명으로 잘못된 것은?",["명목GDP 성장률과 주가 상승률은 관계가 없다.","통화량 증가가 장기적으로는 주가를 하락시키는 요인으로 작용할 수 있다.","금리와 주가는 역상관관계를 가지고 있다.","경기상승기의 완만한 물가 상승은 기업이윤 증가를 초래하여 주가 상승요인이 된다."],0,"[[LESSON:핵심 판단｜정답은 ①이다. 정답 문장은 “명목GDP 성장률과 주가 상승률은 관계가 없다.”이다.||정답 근거｜주가는 경기회복국면에서 상승하기 시작하여 호황국면에서 본격적으로 상승하게 되고, 그 상승폭은 명목GDP 성장률과 거의 일치한다 한편 경기상승기의 장기적인 물가 상승은 제조비용 상승에 따른 기업수지 악화로 주가 하락요인이 된다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “주가와 경기변동의 관계에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"기술적 분석","심화응용","이동평균선의 분석방법에 대한 설명으로 옳은 것은?",["주가 하락세에서 상승세로 전환될 경우 단기 · 중기 · 장기이동평균선의 순으로 상승한다.","주가 상승 시 위로부터 장기 · 중기 · 단기이동평균선의 순으로 배열되는 것을 정배열이라 한다.","주가 상승 시에는 단기 · 중기 · 장기이동평균선을 저항선으로 삼아 상승하고, 하락 시에는 단기 · 중기 · 장기이동평균선의 순으로 이탈하게 된다.","장기이동평균선이 단기이동평균선을 상향돌파할 때 이를 골든크로스(Golden Cross)라 하며 매수신호로 본다."],0,"[[LESSON:핵심 판단｜정답은 ①이다. 정답 문장은 “주가 하락세에서 상승세로 전환될 경우 단기 · 중기 · 장기이동평균선의 순으로 상승한다.”이다.||정답 근거｜2 주가 상승 시 위로부터 단기 · 중기 · 장기이동평균선의 순으로 배열되는 것을 정배열이라 한다. 3 주가 상승 시에는 단기 · 중기 · 장기이동평균선을 지지선으로 삼아 상승하고, 하락 시에는 단기 · 중기 · 장기이동평균선의 순 으로 이탈하게 된다. 4 단기이동평균선이 장기이동평균선을 상향돌파할 때 이를 골든크로스(Golden Cross)라 하며 매수신호로 본다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “이동평균선의 분석방법에 대한 설명으로 옳은 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"기술적 분석","개념응용","시장가격이 상승추세를 나타낼 때는 종가가격이 최근 시장가격의 변동폭 중 최고점에서 형성되는 경향이 높고, 반대로 하락추세를 나타낼 때는 종가가격이 최근 시장가격의 변동폭 중 최저점에 형성되는 경향이 높다는 과거 경험에서 비롯된 차트에 해당하는 것은?",["MACD","스토캐스틱 기법(Stochastics)","상대강도지수(RSI)","등락주선(ADL)"],1,"[[LESSON:핵심 판단｜정답은 ②이다. 정답 문장은 “스토캐스틱 기법(Stochastics)”이다.||정답 근거｜스토캐스틱 기법은 일정 기간의 주가변동폭에서 현재 종가가 차지하는 위치를 백분율로 나타낸다. 상승추세에서는 종가가 최근 변동폭의 최고점 부근, 하락추세에서는 최저점 부근에 형성되는 경향을 활용한다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “시장가격이 상승추세를 나타낼 때는 종가가격이 최근 시장가격의 변동폭 중 최고점에서 형성되는 경향이”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"기술적 분석","심화응용","엘리엇 파동이론에 대한 설명으로 올바른 것은?",["충격파동은 전체적인 시장 움직임과 다른 방향으로 형성되는 파동이다.","충격파동은 1·3·5번 파동이라는 3개의 소파동으로 구성된다.","1번 파동은 5개 파동 중에서 가장 강력하고 가격변동도 활발하게 일어나는 파동이다.","2번 파동은 1번 파동을 38.2% 또는 61.8%로 되돌리며. 100% 되돌리는 경우는 없다."],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “2번 파동은 1번 파동을 38.2% 또는 61.8%로 되돌리며. 100% 되돌리는 경우는 없다.”이다.||정답 근거｜1 충격파동은 전체적인 시장 움직임과 같은 방향으로 형성되는 파동이고. 조정파동은 전체적인 시장 움직임과 다른 방향으 로 형성되는 파동이다. 2 충격파동은 1번.3번-5번 a c파동이라는 5개의 소파동으로 구성된다. 3 5개 파동 중 가장 강력하고 가격변동도 활발하게 일어나는 파동은 3번 파동이다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “엘리엇 파동이론에 대한 설명으로 올바른 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"기술적 분석","계산형","최근 14일간 상승폭 합계가 90, 하락폭 합계가 30일 때 RSI와 일반적인 해석으로 옳은 것은?",["RSI 25, 과매도권","RSI 50, 중립권","RSI 75, 과매수권","RSI 90, 과매도권"],2,"[[LESSON:핵심 판단｜정답은 ③이다.||정답 근거｜RSI=상승폭 합계÷(상승폭 합계+하락폭 합계)×100이다. 90÷(90+30)×100=75이며, 일반적으로 70 이상은 과매수권으로 본다.||오답 정리｜분모를 하락폭만으로 잡거나 상승폭과 하락폭을 단순히 빼면 안 된다. 과매수는 즉시 하락 확정이 아니라 경계 신호다.||실전 암기｜RSI는 0-100 범위이며 통상 70 이상 과매수, 30 이하 과매도로 해석한다.]]"],[1,"유가증권시장","심화응용","신규 상장절차에 대한 설명 중 잘못된 것은?",["신규상장 신청 전에 거래소에 주권의 상장예비심사신청서를 제출하여 상장 적격 여부에 대한 심사를 받아야 한다.","상장위원회의 심의결과는 승인, 재심의, 미승인으로 구분된다.","거래소는 상장예비 심사청구인이 상장예비심사결과를 통보받은 날로부터 1개월 이내에 신규상장신청서를 제출하지 않은 경우 상장예비심사결과의 효력을 인정하지 않을 수 있다.","상장의 종류에는 신규상장, 추가상장, 변경상장, 재상장, 우회상장 등이 있다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “거래소는 상장예비 심사청구인이 상장예비심사결과를 통보받은 날로부터 1개월 이내에 신규상장신청서를 제출하지 않은 경우 상장예비심사결과의 효력을 인정하지 않을 수 있다.”이다.||정답 근거｜거래소는 상장예비 심사청구인이 상장예비 심사결과를 통보받은 날로부터 6개월 이내에 신규상장신청서를 제출하지 않은 경우 상장예비심사결과의 효력을 인정하지 않을 수 있다. [차고; 상장절차 · 상장신청 사전협의: 상장예비심사신청서의 부실기재 등을 사전예방 · 상장예비심사신청서 제출: 신규상장 신청 전에 거래소에 제출 · 예비상장심사: 상장자격 심사(상장규정에 명시된 형식적 요건 및 질적 요건) · 신규상장심사: 분산요건 심사(공모비율, 일반주주 수 등)||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “신규 상장절차에 대한 설명 중 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"유가증권시장","개념응용","배당락에 관한 설명으로 옳은 것은?",["배당락은 신주인수권이 소멸한 상태만을 의미한다.","배당기준일이 지나 배당을 받을 권리가 없는 상태를 말한다.","배당락일에 매수한 투자자도 직전 사업연도 배당을 받는다.","현금배당이 결정되면 항상 거래소가 주가를 배당액만큼 기계적으로 조정한다."],1,"[[LESSON:핵심 판단｜정답은 ②이다.||정답 근거｜배당락은 배당기준일이 지나 새로 주식을 매수해도 직전 사업연도 배당을 받을 권리가 없는 상태를 말한다. 권리락은 유상·무상증자 등 신주배정 권리와 관련된 개념이다.||오답 정리｜배당락일 매수자는 직전 배당 권리를 취득하지 못한다. 현금배당과 주식배당의 기준가격 처리도 동일하다고 단정하면 안 된다.||실전 암기｜배당은 배당락, 신주배정은 권리락으로 구분한다.]]"],[1,"유가증권시장","심화응용","단기과열종목 지정제도에 대한 설명 중 잘못된 것은?",["미확인된 특정 테마 등을 추종매매한 선의의 투자자에 대한 피해를 보호하기 위한 제도이다.","단기과열지표가 되는 것은 주가와 거래량이다.","최초 단기과열지표에 해당하는 종목이 10매매거래일 이내에 다시 단기과열지표에 해당하는 경우 지정예고하고, 그 후 10매매거래일 이내에 다시 단기과열지표에 해당하는 경우 단기과열종목으로 지정한다.","당일 종가가 지정일 전일의 종가보다 20% 이상 높으면 지정기간을 3매매거래일 연장한다."],1,"[[LESSON:핵심 판단｜정답은 ②이다. 정답 문장은 “단기과열지표가 되는 것은 주가와 거래량이다.”이다.||정답 근거｜단기과열지표가 되는 것은 주가, 회전율, 변동성이다. i참효] 단기과열지표 · 주가: 당일종가가 ||정답 근거｜코스닥시장에서는 정기보고서 미제출을 사유로 한 상장폐지 결정에 이의신청을 할 수 없다. 문서에서는 자본잠식, 매출액 미달, 해산, 시가총액 미달, 최종부도, 은행거래정지, 계속사업손실, 장기간 영업손실, 거래량 미달, 신청에 의한 상장폐지도 이의신청 제한사유로 제시한다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “코스닥상장법인이 거래소로부터 상장폐지 결정통지를 받은 경우 이의가 있으면 이의신청을 제기할 수 있”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"코스닥시장","심화응용","코스닥시장의 매매 관련 제도에 대한 설명 중 잘못된 것은?",["호가의 종류에는 지정가, 시장가, 조건부지정가, 최유리지정가, 최우선지정가 등이 있다.","FOK란 호가수량 중 접수 시점에 매매를 체결할 수 있는 수량에 대하여는 매매거래를 성립시키고 체결되지 않은 잔량은 즉시 취소하는 조건을 말한다.","가격제한폭은 유가증권시장과 동일하게 ±30%이다.","반대매매는 결제일 이전에도 가능하고, 유가증권시장과 코스닥시장 간에도 가능하다."],1,"[[LESSON:핵심 판단｜정답은 ②이다. 정답 문장은 “FOK란 호가수량 중 접수 시점에 매매를 체결할 수 있는 수량에 대하여는 매매거래를 성 립시키고 체결되지 않은 잔량은 즉시 취소하는 조건을 말한다.”이다.||정답 근거｜호가조건 중 IOC란 호가수량 중 접수 시점에 매매를 체결할 수 있는 수량에 대하여는 매매거래를 성립시키고 체결되지 않은 잔량은 즉시 취소하는 조건을 말한다. 한편 FOK는 호가수량을 접수 시점에 전량 매매체결할 수 있는 경우 매매거래를 성립 시키고, 전량 체결을 충족시키지 못하는 경우 호가전량을 즉시 취소하는 조건을 말한다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “코스닥시장의 매매 관련 제도에 대한 설명 중 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"채권시장","심화응용","채권가격의 상승 예상 시(채권수익률의 하락 예상 시) 적절한 전략은?",["장기채 비중을 낮춘다.","표면이자율이 낮은 채권의 비중을 높인다.","듀레이션을 짧게 한다.","금리선물매도포지션(Short Position)을 취한다."],1,"[[LESSON:핵심 판단｜정답은 ②이다. 정답 문장은 “표면이자율이 낮은 채권의 비중을 높인다.”이다.||정답 근거｜1 장기채 비중을 높인다. _ 3 듀레이션을 길게 한다. 4 금리선물 매수포지션(Long Position)을 취한다. 적극적 투자전략 · 면역전략 · 수익률예측전략 · 만기보유전략 · 채권교체전략 · 인덱스전략 · 수익률곡선타기전략 · 현금흐름일치전략 · 나비형 투자전략 · 사다리형 만기운용전략 · 역나비형 투자전략 · 바벨형 만기운용전략 구 분 만 기 · 단기채 비중 늘림 표면금리 · 표면금리 높은 채권을 늘림 이자지급횟수 · 이자지급 횟수 많은 채권(이표채) · 이자지급 횟수 적은 채권(복리채, 할인채) · 바벨형 포트폴리오 듀레이션 · 짧은 채권||오답 정리｜계산형은 공식, 단위, 기준시점을 먼저 적고 수치를 대입한다. 분모·분자와 백분율 환산을 마지막에 다시 확인하면 함정을 줄일 수 있다.||실전 암기｜이 문항의 기준어를 “채권가격의 상승 예상 시(채권수익률의 하락 예상 시) 적절한 전략은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"채권시장","개념응용","채권 유통시장에 관한 설명으로 옳은 것은?",["장외거래에서는 상장채권만 거래할 수 있다.","장내거래는 거래 당사자 간 상대매매만 가능하다.","국채전문유통시장은 국채 거래의 유동성과 가격발견 기능을 높이기 위한 장내시장이다.","채권의 장외거래는 결제불이행위험 때문에 동시결제(DVP)를 사용할 수 없다."],2,"[[LESSON:핵심 판단｜정답은 ③이다.||정답 근거｜국채전문유통시장은 국채의 유동성과 가격발견 기능을 높이기 위해 운영되는 장내시장이다. 채권 장외시장은 상대매매 비중이 높고, 결제위험을 줄이기 위해 증권과 대금을 동시에 교환하는 DVP가 활용된다.||오답 정리｜장외시장도 상장 여부와 무관하게 다양한 채권을 거래할 수 있다. DVP는 장외거래에서 사용할 수 없는 제도가 아니라 결제위험을 줄이는 핵심 장치다.||실전 암기｜장내는 경쟁매매·표준화, 장외는 상대매매·맞춤거래, 결제는 DVP로 기억한다.]]"],[1,"채권시장","심화응용","이자율의 기간구조에 대한 설명 중 옳은 것은?",["불편기대가설에 의하면 미래의 단기이자율이 현재의 단기이자율보다 높으면 수익률 곡선은 수평이다.","불편기대가설에서 장기이자율이 매년 상승할 것이라고 기대되면 수익률곡선은 우하향 한다.","유동성선호가설에 따르면 모든 조건이 동일할 때 장기이자율은 유동성 프리미엄으로 단기이자율보다 낮아진다.","시장분할가설은 기관투자자들의 경우 자산과 부채구조 등의 요인에 따라 수익률곡선 에서 선호하는 만기가 분할되어 있다고 본다."],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “시장분할가설은 기관투자자들의 경우 자산과 부채구조 등의 요인에 따라 수익률곡선 에서 선호하는 만기가 분할되어 있다고 본다.”이다.||정답 근거｜1 불편기대가설에 의하면 미래의 단기이자율이 현재의 단기이자율보다 높으면 수익률곡선은 우상향한다. 2 불편기대가설에서 장기이자율이 매년 상승할 것이라고 기대되면 수익률곡선은 우상향한다. 3 유동성선호가설에 따르면 모든 조건이 동일할 때 장기이자율은 유동성 프리미엄으로 단기이자율보다 높아진다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “이자율의 기간구조에 대한 설명 중 옳은 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"채권시장","개념응용","잔존만기가 3년, 표면이율이 8%인 연 단위 후급 이표채의 만기수익률이 10%이고 듀레이션이 2.78년이다. 만기수익률이 8%로 하락할 경우 듀레이션을 이용하여 추정한 채권가격의 변동률로 옳은 것은?",["5.6% 상승","5.6% 하락","5.05% 상승","5.05% 하락"],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “5.05% 상승”이다.||정답 근거｜수정듀레이션은 $D_M=D/(1+r)=2.78/1.10\\approx2.527$이다. 수익률 변화는 $\\Delta r=0.08-0.10=-0.02$이므로 가격변동률은 $\\Delta P/P\\approx-D_M\\Delta r=-2.527\\times(-0.02)=0.05054$이다. 따라서 약 5.05% 상승한다. 금리와 채권가격이 반대로 움직인다는 부호 관계도 함께 확인해야 한다.||오답 정리｜계산형은 공식, 단위, 기준시점을 먼저 적고 수치를 대입한다. 분모·분자와 백분율 환산을 마지막에 다시 확인하면 함정을 줄일 수 있다.||실전 암기｜이 문항의 기준어를 “잔존만기가 3년, 표면이율이 8%인 연 단위 후급 이표채의 만기수익률이 10%이고 듀레이션이 2.”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"채권시장","심화응용","채권투자전략 중 수익률변동위험을 제거하고 투자목표를 달성하기 위해 투자기간과 채권 포트폴리오의 듀레이션을 일치시키는 전략은?",["채권교체전략","인덱스전략","면역전략","현금흐름일치전략"],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “면역전략”이다.||정답 근거｜면역전략 · 수익률변동위험을 제거하고 투자목표를 달성하기 위한 전략 · 투자기간과 채권 포트폴리오의 듀레이션을 일치시킴으로써 수익률상승(하락) 시 채권가격하락(상승)분과 표면이자에 대한 재투자 수익 증대(감소)분을 상호 상쇄시켜 채권투자 종료 시 실현수익률을 목표수익률과 일치시키는 전략||오답 정리｜계산형은 공식, 단위, 기준시점을 먼저 적고 수치를 대입한다. 분모·분자와 백분율 환산을 마지막에 다시 확인하면 함정을 줄일 수 있다.||실전 암기｜이 문항의 기준어를 “채권투자전략 중 수익률변동위험을 제거하고 투자목표를 달성하기 위해 투자기간과 채권 포트폴리오의 듀”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"채권시장","개념응용","채권 용어에 관한 설명으로 옳은 것은?",["잔존기간은 채권 발행일부터 최종 원금상환일까지의 전체 기간이다.","표면이율은 현재 시장가격으로 매수했을 때 실현되는 만기수익률이다.","채권단가는 일반적으로 액면 10,000원당 시장에서 거래되는 가격을 뜻한다.","선매출은 발행일 이후에만 채권을 판매하는 방식이다."],2,"[[LESSON:핵심 판단｜정답은 ③이다.||정답 근거｜채권단가는 액면 10,000원당 시장거래가격으로 표시하는 것이 일반적이다. 잔존기간은 현재 시점부터 만기까지의 기간이고, 표면이율은 액면금액에 적용되는 약정이율이다.||오답 정리｜만기수익률은 현재가격과 미래 현금흐름을 일치시키는 할인율이므로 표면이율과 다르다. 선매출은 발행일 이전에 미리 판매하는 방식이다.||실전 암기｜전체기간은 만기, 현재부터 남은 기간은 잔존기간, 약정금리는 표면이율, 시장수익률은 만기수익률이다.]]"],[1,"채권시장","심화응용","발행주체에 따라 채권을 분류한 것으로 바르게 연결된 것은?",["국채 - 지역개발채권","특수채 — 신주인수권부사채권","금융채 - 통화안정증권","지방채 - 한국도로공사채권"],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “금융채 - 통화안정증권”이다.||정답 근거｜발행주체에 따른 분류 구분 제1종 및 제2종 국민주택채권, 재정증권, 국고채권(양곡기금채권, 외국환평형기금 국채 채권 통합) 지방채 (비금융) 특별법에 의하여 설립된 법인 특수채 금융채 보증사채. 무보증사채, 담보부사채. 전환사채. 교환사채, 신주인수권부사채, 옵션 회사채 부사채||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “발행주체에 따라 채권을 분류한 것으로 바르게 연결된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"기타 증권시장","심화응용","K-OTC시장의 매매제도에 대한 설명 중 잘못된 것은?",["호가수량단위는 1주이고, 호가가격단위는 주권의 가격대별로 7단계로 세분화되었다.","매수호가 제출시점에 가장 낮은 매도호가보다 3호가 가격단위를 초과하여 높은 매수호가에 대하여 호가접수를 거부하고 있다.","신규종목의 최초 매매거래개시일에는 기준가격의 30-500% 가격범위 내에서 호가를 접수하여 매매를 체결시킨다.","장 종료 시까지 거래가 형성되지 않더라도 호가가 있는 경우 이를 기준가격에 반영하는 기세제도를 도입하였다."],1,"[[LESSON:핵심 판단｜정답은 ②이다. 정답 문장은 “매수호가 제출시점에 가장 낮은 매도호가보다 3호가 가격단위를 초과하여 높은 매수호가 에 대하여 호가접수를 거부하고 있다.”이다.||정답 근거｜매수호가 제출시점에 가장 낮은 매도호가보다 5호가 가격단위를 초과하여 높은 매수호가에 대하여 호가접수를 거부하고 있 다. 또한 매도호가 제출시점에 가장 높은 매수호가보다 5호가 가격단위를 초과하여 낮은 매도호가에 대한 호가접수를 거부하 고 있다. (불합리한 호가제한)||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “K-OTC시장의 매매제도에 대한 설명 중 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[1,"기타 증권시장","개념응용","다음 중 코넥스시장의 LP(유동성공급자)제도에 대한 설명이 적절하지 않은 것은?",["원칙적으로 지정자문인이 유동성공급자 역할을 하도록 의무화하였다.","코넥스시장의 LP가 되려면 투자매매업 인가를 덩어리로 기억한다.]]"],[2,"금융상품분석","개념응용","변액보험에 관한 설명으로 옳은 것은?",["보험료 전액을 일반계정에서 확정금리로 운용한다.","특별계정의 운용실적에 따라 보험금이나 해지환급금이 변동될 수 있다.","투자실적과 관계없이 모든 해지환급금이 원금 보장된다.","보험계약자는 특별계정의 운용위험을 전혀 부담하지 않는다."],1,"[[LESSON:핵심 판단｜정답은 ②이다.||정답 근거｜변액보험은 보험료의 일부를 특별계정에서 주식·채권 등에 운용하고 그 실적에 따라 보험금이나 해지환급금이 달라지는 실적배당형 보험이다.||오답 정리｜확정금리·전액 원금보장 상품이 아니며 투자성과에 따른 위험의 일부를 계약자가 부담한다. 다만 상품별 최저보증 기능은 약관을 별도로 확인해야 한다.||실전 암기｜일반계정은 보험회사가 운용위험을 부담하고, 특별계정은 운용실적이 계약자 급부에 반영된다.]]"],[2,"금융상품분석","비교형","ELS·ELD·ELF의 구분에 관한 설명으로 옳은 것은?",["ELS는 은행예금이므로 예금자보호 대상이다.","ELD는 예금에 주가지수 연계수익 구조를 결합한 은행상품이다.","ELF는 증권회사가 자기 신용으로 발행하는 채무증권이다.","ELS·ELD·ELF는 모두 동일한 법적 형태와 신용위험을 가진다."],1,"[[LESSON:핵심 판단｜정답은 ②이다.||정답 근거｜ELD는 은행예금에 주가지수 등 기초자산 연계수익 구조를 결합한 상품이다. ELS는 증권회사가 발행하는 파생결합증권이고, ELF는 자산운용사가 운용하는 펀드다.||오답 정리｜세 상품은 수익구조가 비슷해 보여도 법적 형태와 발행·운용주체가 다르다. ELS를 예금으로, ELF를 발행증권으로 보면 오답이다.||실전 암기｜D는 Deposit, S는 Securities, F는 Fund로 발행·운용주체를 구분한다.]]"],[2,"금융상품분석","개념응용","다음 중 CMA(현금자산 관리계좌)와 IMA(종합투자계좌)에 대한 설명으로 옳은 것은?",["IMA는 자산 규모와 상관없이 모든 증권사에서 가입할 수 있는 대중적인 상품이다.","CMA는 원칙적으로 증권사가 원금 지급을 보장하며, 확정 금리만을 제공한다.","IMA는 자기자본 8조 원 이상의 종합금융투자사업자만 취급할 수 있다.","CMA와 IMA 모두 예금자보호법에 따라 모든 증권사에서 1인당 1억 원까지 보호받는다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “IMA는 자기자본 8조 원 이상의 종합금융투자사업자만 취급할 수 있다.”이다.||정답 근거｜IMA는 자기자본 8조 원 이상이라는 법적 요건을 충족한 종합금융투자사업자만 취급할 수 있다. 증권사 CMA는 실적배당형 위주로 운용되어 수익률이 변동될 수 있으며 원칙적으로 예금자보호 대상이 아니다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “다음 중 CMA(현금자산 관리계좌)와 IMA(종합투자계좌)에 대한 설명으로 옳은 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"금융상품분석","심화응용","다음 중 파생결합증권에 대한 설명으로 잘못된 것은?",["공동사업의 결과에 따른 손익을 귀속받는 계약상의 권리가 표시된 것이다.","기초자산의 가격 등의 변동과 연계하여 지급금액 또는 회수금액이 결정되는 권리가 표시 된 것이다.","대표적인 상품으로 주식워런트증권(ELW)가 있다.","대표적인 상품으로 주가지수연계증권(ELS)이 있다."],0,"[[LESSON:핵심 판단｜정답은 ①이다. 정답 문장은 “공동사업의 결과에 따른 손익을 귀속받는 계약상의 권리가 표시된 것이다.”이다.||정답 근거｜해당 설명은 투자계약증권에 해당하는 설명이다. 투자계약증권은 특정 투자자가 그 투자자와 타인 간의 공동사업에 금전 등 을 투자하고 주로 타인이 수행한 공동사업의 결과에 따른 손익을 귀속받는 계약상의 권리가 표시된 증권이다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “다음 중 파생결합증권에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"투자전략","심화응용","보기의 자료를 바탕으로 효율적 증권과 최적 증권에 관한 설명으로 옳은 것은? [[BOX:A: 기대수익률 12%, 표준편차 15%||B: 기대수익률 12%, 표준편차 20%||C: 기대수익률 6%, 표준편차 4%||D: 기대수익률 5%, 표준편차 4%||E: 기대수익률 9%, 표준편차 12%]]",["A주식과 B주식을 비교할 때 B주식이 효율적 증권이다.","C주식과 D주식을 비교할 때 D주식이 효율적 증권이다.","E주식은 A주식, C주식과 비교할 때 효율적 증권이 아니다.","보수적 투자자에게는 C주식이 최적 증권이 될 수 있다."],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “보수적 투자자는 C주식 이 최 적 증권이다.”이다.||정답 근거｜효율적 증권 A주식. C주식, E주식 중에서 최적 증권의 선택은 투자자의 위험성향에 따라 다르므로 공격적 투자자는 A주식이 최적 증권이 되고, 보수적 투자자는 C주식이 최적 증권이 된다. 1 A주식과 B주식의 기대수익률은 12%로 동일하지만. A주식이 위험(표준편차)이 더 적으므로 효율적 증권이다. 2 C주식과 D주식의 위험(표준편차)은 4%로 동일하지만. C주식이 기대수익률이 더 크旦루 효율적 증권이다. 3 E주식은 A주식, C주식과 비교하여 지배당하는 경우가 아니므로 효율적 증권이다.||오답 정리｜복수지문형은 각 항목을 독립적으로 O/X 판정한 뒤 조합한다. 한 항목이라도 불확실하면 보기 조합에서 공통으로 빠지거나 들어간 항목부터 제거한다.||실전 암기｜이 문항의 기준어를 “보기의 내용으로 볼 때 효율적 증권, 최적 증권에 대한 설명으로 옳은 것은? 주식 A B C D ”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"투자전략","개념응용","두 위험자산의 상관계수가 -1일 때 분산투자효과에 관한 설명으로 옳은 것은?",["적절한 투자비중을 선택하면 포트폴리오 위험을 0까지 낮출 수 있다.","두 자산의 공분산은 반드시 0이다.","두 자산을 결합해도 위험은 가중평균과 항상 같다.","상관계수가 +1인 경우보다 분산투자효과가 작다."],0,"[[LESSON:핵심 판단｜정답은 ①이다.||정답 근거｜상관계수가 -1이면 두 자산의 수익률이 완전히 반대 방향으로 움직이므로 적절한 비중에서 위험을 이론적으로 0까지 낮출 수 있다.||오답 정리｜상관계수 -1의 공분산은 0이 아니라 음수다. 상관계수가 낮을수록 분산투자효과는 커지고, +1이면 효과가 가장 작다.||실전 암기｜상관계수는 -1-+1 범위이며 -1에 가까울수록 위험감축효과가 크다.]]"],[2,"투자전략","심화응용","다음 확률분포를 이용해 A주식과 B주식의 기대수익률을 계산한 값으로 옳은 것은? [[BOX:호황 확률 30%: A 100%, B 40%||정상 확률 40%: A 15%, B 15%||불황 확률 30%: A -70%, B -10%]]",["12%, 12%","12%, 15%","15%, 12%","15%, 15%"],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “15%, 15%”이다.||정답 근거｜투자금액의 비율로 가중평균하여 구하는 방법 E(R„) = Si시 x E(R) E(Rp) = 1dx x E(RJ +(內 x 티凡) ((시: 개별 증권 j에 대한 투자비율, E(R): 개별 증권 j에 대한 기대수익률) · E(Ra) =(0.3 x 1.0) + (0.4 x 0.15) + (0.3 X -0.7) = 0.15 = 15% · E(Rb)= (0.3 x 0.4) + (0.4 x 0.15) + (0.3 X -0.1) = 0.15 = 15%||오답 정리｜계산형은 공식, 단위, 기준시점을 먼저 적고 수치를 대입한다. 분모·분자와 백분율 환산을 마지막에 다시 확인하면 함정을 줄일 수 있다.||실전 암기｜이 문항의 기준어를 “다음 미래수익률의 확률분포표를 보고 구한 A주식과 B주식의 기대수익률로 옳은 것은? 구분 호황 정”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"투자전략","개념응용","마코위츠 모형에 의한 분산투자효과에 대한 설명 중 옳은 것은?",["구성종목수를 증가시켜도 줄어들지 않는 위험은 비체계적 위험이다.","구성종목수를 증가시킴에 따라 줄어드는 위험은 시장위험이다.","포트폴리오에 포함되는 종목의 수가 증가할 수록 포트폴리오의 위험은 각 종목들 간의 공분산의 평균에 근접한다.","포트폴리오에 포함되는 종목의 수가 감소할 수록 개별종목의 위험이 포트폴리오의 위험에 미칠 영향은 감소한다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “포트폴리오에 포함되는 종목의 수가 증가할수록 포트폴리오의 위험은 각 종목들 간의 공분산의 평균에 근접한다.”이다.||정답 근거｜동일한 비중으로 구성한 $n$개 종목 포트폴리오의 분산은 개별 종목 분산의 평균에 관한 항과 종목 간 공분산의 평균에 관한 항으로 나뉜다. 종목 수가 커질수록 개별 종목 고유위험의 영향은 작아지고 포트폴리오 위험은 평균 공분산, 즉 시장과 함께 움직이는 체계적 위험에 가까워진다. 종목 수 증가로 감소하는 것은 비체계적 위험이며 시장위험은 제거되지 않는다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “마코위츠 모형에 의한 분산투자효과에 대한 설명 중 옳은 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"투자전략","심화응용","다음 두 자산으로 기대수익률 9%의 포트폴리오를 구성하려 한다. 투자비율로 옳은 것은? [[BOX:위험자산 기대수익률 10%, 표준편차 15%||무위험자산 수익률 6%||총투자금액 1억원]]",["50%, 50%","55%, 45%","65%, 35%","75%, 25%"],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “75%, 25%”이다.||정답 근거｜위험자산에 대한 투자비율을 아라고 한다면. 0.09 = w x (0.1) + (1 - w) x 0.06 아 w = 0.75 = 75% 무위험자산에 대한 투자비율은 (1 - w)이므로, 1 - 0.75 = 0.25 = 25%.‘. 75%. 25%||오답 정리｜계산형은 공식, 단위, 기준시점을 먼저 적고 수치를 대입한다. 분모·분자와 백분율 환산을 마지막에 다시 확인하면 함정을 줄일 수 있다.||실전 암기｜이 문항의 기준어를 “기대수익률 0.1, 표준편차 0.15인 위험자산과 무위험자산수익률 0.06인 무위험자산이 있 다.”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"투자전략","개념응용","자산배분(Asset Allocation)의 중요성이 높아지는 이유와 거리가 먼 것은?",["투자대상 자산군이 증가하고 있기 때문이다.","투자위험관리의 필요성이 증대하고 있기 때문이다.","투자수익률 결정에 자산배분이 절대적인 영향을 미친다는 인식이 높아지고 있기 때문이다.","시장예측이나 증권선택이 총수익률에 미치는 영향이 높아지고 있기 때문이다."],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “시장예측이나 증권선택이 총수익률에 미치는 영향이 높아지고 있기 때문이다.”이다.||정답 근거｜자산배분은 기대수익률과 위험수준이 서로 다른 여러 자산집단에 투자자금을 배분하여 최적의 포트폴리오를 구성하는 과정이다. 투자성과 연구에서는 시장예측이나 개별 증권선택보다 자산배분이 총수익률에 더 큰 영향을 미치는 것으로 본다. 따라서 시장예측이나 증권선택의 영향이 높아지고 있다는 설명은 자산배분의 중요성이 커지는 이유와 거리가 멀다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “자산배분(Asset Allocation)의 중  대한 설명 중 옳은 것은?",["금융투자업자는 이해상충방지체계를 자율적으로 마련해야 한다.","금융투자업자는 이해상충 발생 가능성을 파악·평가하고 표준투자권유준칙에 따라 관리해야 한다.","이해상충 발생 가능성이 있다고 인정되는 경우 그 사실을 투자자에게 알리고, 문제가 없는 수준으로 낮춘 후 거래해야 한다.","이해상충 발생 가능성을 낮추기 곤란한 경우 투자자의 승낙을 얻어 거래해야 한다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “이해상충 발생 가능성이 있다고 인정되는 경우 그 사실을 투자자에게 알리고, 문제가 없는 수준으로 낮춘 후 거래해야 한다.”이다.||정답 근거｜이해상충 가능성이 있으면 투자자에게 고지하고 투자자보호에 문제가 없는 수준으로 낮춘 뒤 거래해야 한다. 낮추기 곤란하면 승낙을 받더라도 거래해서는 안 되며, 관련 가능성은 내부통제기준에 따라 관리한다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “자본시장법상 이해상충방지체계에 대한 설명 중 옳은 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"직무윤리 및 투자자분쟁예방","심화응용","차명거래금지제도에 대한 설명 중 잘못된 것은?",["모든 차명금융거래는 의심거래보고(STR)의 대상이 되며 금지된다.","실명이 확인된 계좌에 보유하고 있는 금융자산은 명의자소유로 추정된다.","금융종사자는 불법 차명거래의 알선 및 중개가 금지되고. 이를 위반 시 5년 이하의 징역 또는 5천만원 이하의 벌금에 처한다.","차명거래 금지 위반 시 의심거래보고(STR)를 해야 한다."],0,"[[LESSON:핵심 판단｜정답은 ①이다. 정답 문장은 “모든 차명금융거래는 의심거래보고(STR)의 대상이 되며 금지된다.”이다.||정답 근거｜불법행위를 목적으로 하는 차명금융거래는 금지되나 불법행위를 목적으로 하지 않는 합법적인 차명거래는 가능하고 STR의 보고대상이 아니다. 합법적인 차명거래에는 동창회 회비관리용 차명계좌, 문중 · 교회자산관리용 차명계좌, 미성년 자산보호를 위한 부모명의 차명계좌 등이 있다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “차명거래금지제도에 대한 설명 중 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"직무윤리 및 투자자분쟁예방","개념응용","개인정보의 처리 및 관리에 대한 설명 중 옳은 것은?",["개인정보에는 고유식별정보, 금융정보뿐 아니라 민감정보도 포함한다.","최소한의 개인정보 수집이라는 입증책임은 정보주체가 부담한다.","민감정보 및 고유식별정보는 정보주체의 동의를 얻은 경우에만 처리를 허용한다.","주민등록번호는 외부망의 경우에 한하여 암호화한 후 안전하게 보호하여야 한다."],0,"[[LESSON:핵심 판단｜정답은 ①이다. 정답 문장은 “개인정보에는 고유식별정보, 금융정보뿐 아니라 민감정보도 포함한다.”이다.||정답 근거｜최소수집의 입증책임은 개인정보처리자에게 있다. 민감정보와 고유식별정보는 정보주체의 동의 또는 구체적인 법령상 근거가 있을 때 처리할 수 있으며, 주민등록번호는 내·외부망을 가리지 않고 암호화해야 한다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “개인정보의 처리 및 관리에 대한 설명 중 옳은 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[2,"직무윤리 및 투자자분쟁예방","비교형","자금세탁방지제도의 STR과 CTR에 관한 설명으로 옳은 것은?",["STR은 일정 금액 이상 모든 현금거래를 자동 보고하는 제도이다.","CTR은 거래금액과 무관하게 의심만 있으면 보고하는 제도이다.","STR은 의심스러운 거래를, CTR은 기준금액 이상의 현금거래를 보고하는 제도이다.","STR과 CTR은 모두 고객의 사전동의를 받아야만 보고할 수 있다."],2,"[[LESSON:핵심 판단｜정답은 ③이다.||정답 근거｜STR은 자금세탁 등이 의심되는 거래를 합리적 근거에 따라 보고하는 제도이고, CTR은 법정 기준금액 이상의 현금거래를 객관적 기준에 따라 보고하는 제도다.||오답 정리｜STR은 의심 여부가 핵심이고 정액 기준이 아니다. CTR은 의심 판단이 없어도 기준금액 요건을 충족하면 보고한다. 보고 사실을 고객에게 알리는 것도 제한된다.||실전 암기｜S는 Suspicious-의심, C는 Currency-고액현금 기준으로 구분한다.]]"],[2,"직무윤리 및 투자자분쟁예방","사례형","내부통제와 투자자보호에 관한 설명으로 가장 적절한 것은?",["내부통제는 준법감시부서만의 업무이므로 영업부서는 책임을 지지 않는다.","민원이 반복되어도 개별 직원의 문제이면 내부통제기준을 개선할 필요가 없다.","금융투자회사는 이해상충·상품판매·민원처리 위험을 식별하고 통제절차와 책임체계를 마련해야 한다.","내부통제기준은 외부에 공시하면 충분하고 실제 점검이나 교육은 필요하지 않다."],2,"[[LESSON:핵심 판단｜정답은 ③이다.||정답 근거｜내부통제는 영업부서, 준법감시, 경영진과 이사회가 각자의 역할에 따라 위험을 식별·관리하는 전사적 체계다. 상품판매와 민원처리 절차, 이해상충 통제, 교육·점검·개선이 함께 작동해야 한다.||오답 정리｜준법감시부서에 모든 책임을 전가하거나 규정만 작성해 두는 방식은 실효적 내부통제가 아니다. 반복 민원은 절차상 취약점을 알리는 신호이므로 원인분석과 개선이 필요하다.||실전 암기｜내부통제는 문서-실행-점검-개선의 순환체계로 기억한다.]]"],[3,"자본시장 관련 법규","심화응용","금융위원회로부터 적기 시정조치를 받은 금융투자업자는 경영개선계획을 제출하고 이행 해야 한다. 이에 대한 설명으로 잘못된 것은?",["당해 조치일부터 2개월 범위 내에서 당해 조치권자가 정하는 기간 내에 경영개선계획을 금융감독원장에게 제출해야 한다.","금융위원회는 당해 경영개선계획을 제출받은 날부터 1개월 이내에 승인 여부를 결정해야 한다.","경영개선계획의 이행기간은 경영개선권고의 경우 승인일부터 3개월 이내이다.","금융투자업자는 매 분기 말부터 10일 이내에 계획의 분기별 이행실적을 감독원장에게 제출해야 한다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “경영개선계획의 이행기간은 경영개선권고의 경우 승인일부터 3개월 이내이다.”이다.||정답 근거｜경영개선계획의 이행기간은 경영개선권고의 경우 승인일부터 6개월 이내(부동산신탁업자의 경우는 1년), 경영개선요구의 경 우 승인일부터 1년 이내(부동산신탁업자의 경우는 1년 6개월). 경영개선명령의 경우에는 금융위원회가 승인하면서 그 이행기 한을 정한다. 경영개선권고를 받은 금융투자업자가 그 경영개선계획 이행 중 경영개선요구를 받은 경우에는 경영개선권고에 따른 경영개선계획의 승인일부터 1년(부동산신탁업자의 경우는 1년 6개월) 이내로 한다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “금융위원회로부터 적기 시정조치를 받은 금융투자업자는 경영개선계획을 제출하고 이행 해야 한다. 이에”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"자본시장 관련 법규","개념응용","금융투자업자의 대주주와의 거래 제한에 대한 설명으로 잘못된 것은?",["원칙적으로 금융투자업자는 대주주가 발행한 증권을 소유할 수 없다.","원칙적으로 금융투자업자는 그 계열사가 발행한 주식, 채권 및 약속어음을 자기자본의 10%를 초과하여 소유할 수 있다.","원칙적으로 금융투자업자는 대주주 및 그 특수관계인에 대한 신용공여가 금지되고, 대주주 및 그 특수관계인은 금융투자업자로부터 신용공여를 받는 것이 금지된다.","금융투자업자는 계열사 발행증권을 한도 내에서 예 행하거나 발행된 금융투자상품에 관한 내용을 표시하는 행위는 금지되나 일반사모펀드의 투자광고는 허용된다.","수익률, 수수료, 수상실적 및 통계수치를 표시하는 경우 우대조건 또는 수상시기 및 조건 등을 쉽게 인식할 수 있도록 표시하지 않는 행위는 금지된다.","여러 신탁재산을 집합하여 운용한다는 내용을 표시하는 행위는 금지된다."],0,"[[LESSON:핵심 판단｜정답은 ①이다. 정답 문장은 “투자일임재산을 각각 투자자별로 운용하는 행위는 금지된다.”이다.||정답 근거｜투자일임재산을 투자자별로 각각 운용하는 것은 정상적인 운용 방식이다. 금지되는 것은 여러 투자자의 자산을 집합하여 운용하는 것처럼 표시하는 행위이다. 여러 신탁재산을 집합하여 운용한다는 표시도 금지된다. 사모 금융투자상품 광고는 원칙적으로 제한되지만, 일정 요건을 갖춘 일반투자자를 대상으로 서면·전화·전자우편 등으로 하는 일반사모펀드 광고에는 예외가 인정된다. 수익률·수수료·수상실적·통계수치를 표시할 때에는 관련 조건과 출처를 쉽게 인식할 수 있도록 함께 표시해야 한다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “투자광고 시 규제에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"한국금융투자협회 규정","사례형","표준투자권유준칙상 적합성 원칙을 적용한 절차로 가장 적절한 것은? [[BOX:일반투자자 A가 투자권유를 요청했지만 투자목적·재산상황·투자경험 등의 정보 제공을 거부했다.]]",["정보가 없어도 고위험상품을 우선 권유한다.","투자자정보를 파악하지 못했으므로 투자권유를 하지 않고 그 사유를 안내한다.","직원이 임의로 투자성향을 추정하여 중위험상품을 권유한다.","일반투자자를 전문투자자로 간주하고 설명의무를 면제한다."],1,"[[LESSON:핵심 판단｜정답은 ②이다.||정답 근거｜적합성 원칙을 적용하려면 투자목적, 재산상황, 투자경험 등 필요한 정보를 파악해야 한다. 일반투자자가 정보 제공을 거부해 적합성을 판단할 수 없으면 투자권유를 해서는 안 된다.||오답 정리｜직원이 성향을 임의 추정하거나 정보 없이 상품을 권유할 수 없다. 정보 제공 거부가 전문투자자 전환이나 설명의무 면제를 의미하지도 않는다.||실전 암기｜정보파악-투자성향 분류-적합상품 권유-설명·기록의 순서를 지킨다.]]"],[3,"한국금융투자협회 규정","개념응용","금융투자분석사의 매매거래 제한에 대한 설명으로 잘못된 것은?",["금융투자분석사는 자신이 담당하는 업종에 속하는 법인이 발행한 주식을 매매할 수 없다.","금융투자분석사 개인에게도 이해상충문제 해소를 위해 매매거래제한 및 이해관계 고지의무를 협회 자율규제 차원에서 부과하고 있다.","금융투자분석사는 자료 공표 시 자신과 이해관계가 있는 금융투자상품의 매매를 권유하는 경우 그 재산적 이해관계를 고지해야 한다.","금융투자분석사는 금융투자상품 및 주식매수선택권의 보유가액이 5백만원 이하이면 고지하지 않아도 된다."],3,"[[LESSON:핵심 판단｜정답은 ④이다. 정답 문장은 “금융투자분석사는 금융투자상품 및 주식매수선택권의 보유가액이 5백만원 이하이면 고지하지 않아도 된다.”이다.||정답 근거｜재산적 이해관계 고지의 예외 기준은 금융투자상품과 주식매수선택권의 보유가액 합계가 3백만원 이하인 경우이다. 다만 레버리지 효과가 큰 주식선물·주식옵션·주식워런트증권은 보유가액과 관계없이 고지해야 한다. 금융투자분석사는 담당 업종 법인이 발행한 주식 등의 매매가 제한되고, 소속 회사가 조사분석자료를 공표한 금융투자상품은 공표 후 24시간이 지나야 매매할 수 있으며 공표일부터 7일 동안은 공표한 투자의견과 같은 방향으로 매매해야 한다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “금융투자분석사의 매매거래 제한에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"회사법","개념응용","주식회사에 관한 설명으로 옳은 것은?",["주주는 회사채무에 대하여 항상 무한책임을 진다.","1인만으로는 주식회사를 설립할 수 없다.","주주는 인수가액을 한도로 유한책임을 부담한다.","주식회사는 반드시 액면주식만 발행해야 한다."],2,"[[LESSON:핵심 판단｜정답은 ③이다.||정답 근거｜주식회사의 주주는 자신이 인수한 주식의 인수가액을 한도로 책임을 부담하는 유한책임 사원이다. 회사채권자는 원칙적으로 회사재산에 대해 권리를 행사한다.||오답 정리｜1인 주식회사도 가능하고 무액면주식 발행도 허용된다. 주주가 회사채무 전부에 무한책임을 진다는 설명은 주식회사 원칙과 반대다.||실전 암기｜주식회사의 핵심은 법인격, 자본, 주식, 주주의 유한책임이다.]]"],[3,"회사법","개념응용","정관의 절대적 기재사항은 정관으로서 효력을 가지기 위해 반드시 기재해야 하는 사항으로, 기재 흠결이 있거나 위법하면 정관이 무효가 된다. 다음 중 상법상 절대적 기재사항이 아닌 것은?",["회사가 발행할 주식의 총수","회사의 설립 시에 발행하는 주식의 총수","현물출자","회사가 공고를 하는 방법"],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “현물출자”이다.||정답 근거｜현물출자는 정관의 절대적 기재사항이 아니라 변태설립사항이다. 절대적 기재사항에는 목적, 상호, 회사가 발행할 주식의 총수, 1주의 금액, 설립 시 발행하는 주식의 총수, 본점 소재지, 공고 방법, 발기인의 성명·주민등록번호·주소 등이 포함된다. 변태설립사항은 회사자본의 충실과 회사채권자를 해칠 위험이 있어 정관에 기재해야 효력이 인정되는 사항이다. 현물출자 외에도 발기인의 특별이익, 재산인수, 설립비용과 발기인 보수 등이 이에 해당한다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “정관의 절대적 기재사항은 정관으로서 효력을 가지기 위해 반드시 기재해야 하는 사항으로, 기재 흠결”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"회사법","심화응용","주주명부에 대한 설명으로 옳은 것은?",["주주 및 회사채권자는 영업시간 외에도 주주명부의 열람 또는 등사가 가능하다.","주주명부 폐쇄는 주주를 주주명부에서 삭제하는 것이다.","주주명부 폐쇄기간 중에도 전환주식 또는 전환사채의 전환권 행사는 가능하나. 당해 주주총회에서 의결권 행사는 불가능하다.","실질주주명부는 상법상의 주주명부와 서로 구별되는 것으로 법적효력이 다르다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “주주명부 폐쇄기간 중에도 전환주식 또는 전환사채의 전환권 행사는 가능하나. 당해 주주 총회에서 의결권 행사는 불가능하다.”이다.||정답 근거｜1 주주 및 회사채권자는 영업시간 내에는 언제나 주주명부의 열람 또는 등사가 가능하다. 2 주주명부 폐쇄는 권리를 행사할 자를 확정하기 위하여 일정 기간 동안 주주명부의 기재변경(명의개서)을 정지시키는 것이다. 4 실질주주명부는 예탁결제원이 통지한 증권회사별 고객명부를 기초로 하여 상장법인이 작성한 주주명부로 상법상의 주주 명부와 동일한 효력이 있다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “주주명부에 대한 설명으로 옳은 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"회사법","개념응용","주식의 포괄적 교환에 대한 설명으로 잘못된 것은?",["주식교환계약서를 작성하여 주주총회 특별결의에 의한 승인을 받아야 한다.","주식교환에 관련되는 각 회사의 주주 부담이 가중되는 경우 주주총회 및 종류주주총회 결의뿐만 아니라 주주 2/3 이상의 동의가 있어야 한다.","간이주식교환, 소규모주식교환의 경우에는 주주총회의 승인을 이사회 승인으로 갈음할 수 있다.","주식의 포괄적 교환에 반대하는 주주는 주식매수청구권을 행사할 수 있다."],1,"[[LESSON:핵심 판단｜정답은 ②이다. 정답 문장은 “주식교환에 관련되는 각 회사의 주주 부담이 가중되는 경우 주주총회 및 종류주주총회 결의뿐만 아니라 주주 2/3 이상의 동의가 있어야 한다.”이다.||정답 근거｜주식교환으로 각 회사 주주의 부담이 가중되는 경우에는 주주총회와 종류주주총회의 결의에 더해 주주 전원의 동의가 필요하다. 주주 2/3 이상의 동의로 충분하다고 한 2가 잘못되었다. 포괄적 주식교환은 기존 회사가 다른 회사의 발행주식 전부를 취득해 완전모회사가 되는 제도다. 원칙적으로 주식교환계약서 작성과 주주총회 특별결의가 필요하지만 간이·소규모 주식교환은 이사회 승인으로 갈음할 수 있다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “주식의 포괄적 교환에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"회사법","심화응용","주주 이외의 자에 대하여 전환사채를 발행하는 경우 그 내용에 관한 정관의 규정이 없으면 어떻게 정하는가?",["이사회 결의","주주총회 보통결의","주주총회 특별결의","법원의 결정"],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “주주총회 특별결의”이다.||정답 근거｜전환사채의 인수권을 주주에게 부여하는 경우 원칙적으로 이사회가 전환사채의 발행을 결정한다. 그러나 주주 이외의 자에 대하여 전환사채를 발행하는 경우에 그 발행할 수 있는 전환사채의 액, 전환의 조건, 전환으로 인하여 발행할 주식의 내용과 전환을 청구할 수 있는 기간에 관하여 정관에 규정이 없으면 주주총회의 특별결의로써 이를 정해야 한다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “주주 이외의 자에 대하여 전환사채를 발행하는 경우 그 내용에 관한 정관의 규정이 없으면 어떻게 정”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"회사법","개념응용","액면·무액면주식을 불문하고 주주총회의 특별결의를 거쳐야 하는 것은?",["주식소각","주식병합","주식분할","주식매도"],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “주식분할”이다.||정답 근거｜주식분할은 회사의 자본이나 재산을 늘리지 않고 1주의 주식을 2개 이상의 주식으로 나누는 것이다. 액면주식은 액면가를 종전보다 작은 금액으로 나누게 되므로 정관변경을 위한 주주총회의 특별결의가 필요하며, 무액면주식도 동일하게 특별결의를 거쳐야 한다. 주식분할 후에도 1주의 액면가는 100원 미만으로 할 수 없다. 주식소각·병합·분할은 각각 요건과 결의 방식이 다르므로 구분해야 한다.||오답 정리｜정의-적용대상-예외 순서로 선택지를 대조한다. 원칙을 묻는지 예외를 묻는지 먼저 표시하면 유사 문장 사이의 차이를 빠르게 찾을 수 있다.||실전 암기｜이 문항의 기준어를 “액면·무액면주식을 불문하고 주주총회의 특별결의를 거쳐야 하는 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"증권세제","심화응용","세법상 서류송달에 대한 설명으로 잘못된 것은?",["서류의 송달을 받을 자가 서류의 요지를 공고한 날부터 14일이 경과하면 서류송달로 간주한다.","주소 또는 영업소가 불분명한 경우 공시송달하게 된다.","세무공무원이 1회 방문하였으나 부재중으로 송달이 곤란한 경우에 공시송달할 수 있다.","서류의 송달방법에는 교부송달, 우편송달, 전자송달, 공시송달이 있다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “세무공무원이 1회 방문하였으나 부재중으로 송달이 곤란한 경우에 공시송달할 수 있다.”이다.||정답 근거｜공시송달사유 I · 주소 또는 영업소가 국외에 있어 그 송달이 곤란한 경우 · 주소 또는 영업소가 분명하지 않은 경우 · 서류를 등기우편으로 송달하였으나 수취인이 부재중인 것으로 확인되어 반송됨으로써 납부기한 내 송달이 곤란하다고 인정되 는 경우 · 세무공무원이 2회 이상 납세자를 방문하여 서류를 교부하고자 하였으나 수취인이 부재중인 것으로 확인되어 납부 기한 내 송달 이 곤란하다고 인정되는 경우||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “세법상 서류송달에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"증권세제","개념응용","증권거래세의 과세표준 등에 대한 설명으로 잘못된 것은?",["증권거래세의 과세표준은 원칙적으로 양도가액이다.","특수관계자에게 시가액보다 낮은 가액으로 양도한 것으로 인정되는 경우 과세표준은 그 시가액이다.","비거주자가 정상가격보다 낮은 가액으로 양도한 경우 그 낮은 가액을 과세표준으로 한다.","대체결제회사(예탁결제원) 및 금융투자업자는 다음 달 10일까지 증권거래세를 신고·납부해야 한다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “비거주자가 정상가격보다 낮은 가액으로 양도한 경우 그 낮은 가액을 과세표준으로 한다.”이다.||정답 근거｜비거주자 또는 외국법인이 국외특수관계자에게 정상가격보다 낮은 가액으로 양도한 것으로 인정되면 국제조세조정에 관한 법률상의 정상가격을 과세표준으로 한다. 원칙적인 과세표준은 양도가액이며, 특수관계자에게 시가보다 낮게 양도한 경우에는 시가를 적용한다. 양도가액을 확인할 수 없는 장외거래는 상장주권·장외시장주권·기타 주권별 법정 평가기준을 적용한다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “증권거래세의 과세표준 등에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"증권세제","심화응용","상속세의 과세가액 산정 시 가산항목에 대한 설명으로 잘못된 것은?",["상속재산에는 상속개시일 현재 피상속인에게 귀속되는 재산으로 경제적 가치가 있는 모든 물건뿐 아니라 재산적 가치가 있는 법률상 또는 사실상의 모든 권리도 포함된다.","보험금, 신탁재산 및 퇴직금 등도 상속재산으로 의제되므로 과세가액 산출 시 가산항목 이다.","상속개시일 전 10년 이내에 피상속인이 상속인이 아닌 자에게 증여한 재산가액은 가산항목이다.","상속개시일 전 1년 이내에 처분받은 재산이 2억원 이상인 경우 상속재산으로 추정한다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “상속개시일 전 10년 이내에 피상속인이 상속인이 아닌 자에게 증여한 재산가액은 가산항 목이다.”이다.||정답 근거｜생전증여재산 중 상속개시일 전 10년 이내에 피상속인이 상속인에게 증여한 재산가액, 상속개시일 전 5년 이내에 피상속인이 상속인이 아닌 자에게 증여한 재산가액은 과세가액 산정 시 가산항목이다. 상속세 과세가액 산정 시 가산항목에는 본래의 상 속재산(1), 의제상속재산(2), 상속추정재산(4) 등이 있고 차감항목에는 공과금. 장례비, 채무 등이 있다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “상속세의 과세가액 산정 시 가산항목에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"증권세제","개념응용","배당소득금액의 계산에 대한 설명으로 잘못된 것은?",["배당소득도 이자소득과 같이 필요경비가 인정되지 않으므로 배당소득으로 수입된 총수입금액이 그대로 배당소득이 된다.","배당가산(Gross-up) 적용대상 배당소득이 있는 경우 배당가산액을 가산한 금액을 배당소득금액으로 한다.","이중과세 방지를 위해 배당소득이 부담한 법인세상당액을 배당소득금액에서 공제한다.","내국법인으로부터 받은 배당소득은 배당가산 적용대상 배당소득에 해당한다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “이중과세 방지를 위해 배당소득이 부담한 법인세상당액을 배당소득금액에서 공제한다.”이다.||정답 근거｜법인 단계에서 과세된 소득이 개인주주에게 배당될 때 다시 소득세가 부과되는 이중과세를 조정하기 위해, 법인세상당액을 배당소득금액에 가산한 뒤 산출세액에서 배당세액공제로 차감한다. 즉 법인세상당액을 배당소득금액에서 직접 공제하는 것이 아니다. 배당소득은 필요경비가 인정되지 않으며, 배당가산액은 일반적으로 해당 배당소득의 10%이다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “배당소득금액의 계산에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"],[3,"증권세제","심화응용","상속세 과세가액 산정에 대한 설명으로 잘못된 것은?",["상속개시일 현재 피상속인이 납부해야 할 의무가 있는 공과금은 차감한다.","장례비 지출이 500만원 미만인 경우에는 500만원, 1,000만원을 초과하는 경우에는 1,000만 원까지 차감한다.","상속개시일 전 10년 이내에 피상속인이 상속인에게 부담한 증여채무나, 상속개시일 전 5년 이내에 상속인이 아닌 자에게 부담한 증여채무를 차감한다.","상속재산 중 공익법인에 출연한 재산가액은 과세가액 불산입한다."],2,"[[LESSON:핵심 판단｜정답은 ③이다. 정답 문장은 “상속개시일 전 10년 이내에 피상속인이 상속인에게 진 증여채무나 상속개시일 전 5년 이 내에 피상속인이 상속인이 아닌 자에게 진 증여채무를 차감한다.”이다.||정답 근거｜명칭 여하를 불구하고 상속개시 당시 피상속인이 부담해야 할 확정된 채무로서 공과금 이외의 모든 부채는 차감항목이다. 단, 0|>| 고 상속개시일 전 10년 이내에 피상속인이 상속인에게 진 증여채무, 상속개시일 전 5년 이내에 피상속인이 상속인이 아닌 자에 게 진 증여채무는 제외된다.||오답 정리｜부정형 문항이다. 세 선택지는 원칙에 맞고, 정답 선택지만 주체·요건·수치 또는 예외를 바꾸어 놓았는지 역으로 확인한다.||실전 암기｜이 문항의 기준어를 “상속세 과세가액 산정에 대한 설명으로 잘못된 것은?”로 잡고, 정답 문장의 요건을 한 덩어리로 기억한다.]]"]];

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fml(src){const p=src.split('|');let h='';for(let i=0;i<p.length;i+=3){if(p[i])h+=`<span>${esc(p[i])}</span>`;if(p[i+1]!==undefined)h+=`<span class="frac"><span class="top">${esc(p[i+1])}</span><span class="bottom">${esc(p[i+2]||'')}</span></span>`}return `<div class="formula">${h}</div>`}
function rich(s){return String(s).split(/(\[\[[\s\S]*?\]\])/).map(seg=>{const m=seg.match(/^\[\[([\s\S]*)\]\]$/);if(!m)return esc(seg).replace(/\n/g,'<br>');const z=m[1];if(z.startsWith('NOTE:'))return `<div class="src"><b>📘 교재 기준 주석</b> ${esc(z.slice(5))}</div>`;if(z.startsWith('BOX:'))return `<div class="casebox">${z.slice(4).split('||').map(v=>`<div class="caseitem">${esc(v)}</div>`).join('')}</div>`;if(z.startsWith('BULLETS:'))return `<ul class="bulletbox">${z.slice(8).split('||').map(v=>`<li>${esc(v)}</li>`).join('')}</ul>`;if(z.startsWith('LESSON:'))return `<div class="lesson">${z.slice(7).split('||').map(v=>{const p=v.split('｜');return `<div class="lesson-row"><span class="lesson-label">${esc(p.shift()||'학습 포인트')}</span><span>${esc(p.join('｜'))}</span></div>`}).join('')}</div>`;return fml(z)}).join('')}
const SUBS=[1,2,3];
const idxOf=s=>Q.map((q,i)=>i).filter(i=>s==='all'||Q[i].s===s);
function limit(s){const n=idxOf(s).length,r=s==='all'?0.7:0.5;return n-Math.ceil(n*r-1e-9)}
function applyTheme(t){document.documentElement.dataset.theme=t;const b=$('theme');b.textContent=t==='dark'?'☀️ 라이트':'🌙 다크'}
let th='light';try{th=localStorage.getItem(TKEY)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
applyTheme(th);
$('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(n);try{localStorage.setItem(TKEY,n)}catch(e){}};
$('bars').innerHTML=['all',...SUBS].map(s=>`<div class="pb grn" id="pb-${s}"><div class="lab"><b>${s==='all'?'전체':'제'+s+'과목'}</b><span class="st"></span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div></div>`).join('');
$('summary').innerHTML=`<div class="sumcard total"><b>${Q.length}</b><span>총 문항 · 합격 ${Math.ceil(Q.length*0.7)}문항 이상</span></div>`+SUBS.map(s=>{const n=idxOf(s).length;return `<div class="sumcard"><b>${n}</b><span>제${s}과목 ${SUBJ[s]} · 과락 기준 ${Math.ceil(n*0.5)}문항</span></div>`}).join('');
$('tabs').innerHTML=`<button class="tab active" role="tab" data-f="all">전체<small>${Q.length}</small></button>`+SUBS.map(s=>`<button class="tab" role="tab" data-f="${s}">제${s}과목 ${SUBJ[s]}<small>${idxOf(s).length}</small></button>`).join('');
$('questions').innerHTML=Q.map((x,i)=>`<article class="qcard" id="q${i}" data-i="${i}"><div class="qtop"><div class="meta"><span class="pill sj">제${x.s}과목</span><span class="pill ch">${esc(x.ch)}</span><span class="pill">${esc(x.t)}</span></div><span class="num">Q${String(i+1).padStart(2,'0')}</span></div><div class="q">${rich(x.q)}</div><div class="opts">${x.o.map((v,j)=>`<button type="button" class="opt" data-j="${j}"><b>${MARK[j]}</b><span class="t">${rich(v)}</span></button>`).join('')}</div><div class="explain"><div class="result"></div><div class="ans"></div><div class="why">${rich(x.e)}</div></div></article>`).join('');
function paint(i){
  const x=Q[i],card=$('q'+i),ch=saved[i],done=ch!==undefined,ok=done&&ch===x.a;
  card.classList.toggle('is-ok',ok);card.classList.toggle('is-bad',done&&!ok);
  card.querySelectorAll('.opt').forEach(o=>{const j=+o.dataset.j;o.disabled=done;
    o.classList.toggle('correct',done&&j===x.a);o.classList.toggle('wrong',done&&j===ch&&ch!==x.a);
    let m=o.querySelector('.mark');if(m)m.remove();
    if(done&&(j===x.a||j===ch)){m=document.createElement('span');m.className='mark';m.textContent=j===x.a?(j===ch?'정답 · 내 선택':'정답'):'내 선택';o.appendChild(m)}});
  card.querySelector('.explain').classList.toggle('show',done||expand);
  const r=card.querySelector('.result');r.textContent=done?(ok?'정답입니다.':`오답입니다. 내 선택 ${MARK[ch]}`):'정답 미리보기';r.className='result '+(done?(ok?'ok':'bad'):'peek');
  card.querySelector('.ans').textContent='정답 '+MARK[x.a];
}
function tally(s){const id=idxOf(s);const a=id.filter(i=>saved[i]!==undefined).length,c=id.filter(i=>saved[i]===Q[i].a).length;return{n:id.length,a,c,w:a-c}}
function stats(){['all',...SUBS].forEach(s=>{const t=tally(s),L=limit(s),el=$('pb-'+s);
  const st=t.w>L?'red':t.w===L?'yel':'grn';el.className='pb '+st;
  el.querySelector('.bar>span').style.width=(t.a/t.n*100)+'%';el.querySelector('.bar').setAttribute('aria-valuenow',Math.round(t.a/t.n*100));
  el.querySelector('.st').textContent=`${t.a}/${t.n} · 오답 ${t.w}/${L}${st==='red'?(s==='all'?' 불합격':' 과락'):st==='yel'?' 경계':''}`;})}
function visible(i){const x=Q[i];if(filter!=='all'&&x.s!==+filter)return false;if(wrongOnly&&!(saved[i]!==undefined&&saved[i]!==x.a))return false;return true}
function applyFilter(){let n=0;Q.forEach((x,i)=>{const v=visible(i);$('q'+i).classList.toggle('hidden',!v);if(v)n++});$('empty').classList.toggle('hidden',n>0)}
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const i=+b.closest('.qcard').dataset.i;if(saved[i]!==undefined)return;saved[i]=+b.dataset.j;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}paint(i);stats();if(!$('gradeBox').classList.contains('hidden'))grade(false)}));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.f;applyFilter()}));
$('wrongBtn').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);e.currentTarget.textContent=wrongOnly?'전체 문항 보기':'오답만 보기';applyFilter()};
$('expBtn').onclick=e=>{expand=!expand;e.currentTarget.setAttribute('aria-pressed',expand);e.currentTarget.textContent=expand?'해설 전체 접기':'해설 전체 펼치기';Q.forEach((_,i)=>paint(i))};
$('resetBtn').onclick=()=>{if(!confirm('응답 기록을 모두 초기화할까요?'))return;saved={};try{localStorage.removeItem(KEY)}catch(e){}Q.forEach((_,i)=>paint(i));stats();$('gradeBox').classList.add('hidden');applyFilter();scrollTo({top:0,behavior:'smooth'})};
function grade(scroll=true){
  const box=$('gradeBox'),T=tally('all');let pass=T.c>=Math.ceil(T.n*0.7-1e-9);
  const rows=SUBS.map(s=>{const t=tally(s),need=Math.ceil(t.n*0.5-1e-9),okS=t.c>=need;if(!okS)pass=false;
    const chs=[...new Set(idxOf(s).map(i=>Q[i].ch))].map(ch=>{const id=idxOf(s).filter(i=>Q[i].ch===ch),k=id.filter(i=>saved[i]===Q[i].a).length;return `${esc(ch)} ${k}/${id.length}`}).join(' · ');
    return `<div class="chrow"><span><b>제${s}과목</b><br><small>${SUBJ[s]}</small></span><div class="mini"><i style="width:${t.c/t.n*100}%;background:${okS?'var(--ok)':'var(--bad)'}"></i></div><span class="val">${t.c} / ${t.n} (${Math.round(t.c/t.n*100)}%) ${okS?'통과':'과락'}</span></div><div style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">${chs}</div>`}).join('');
  const wrong=Q.map((q,i)=>i).filter(i=>saved[i]!==undefined&&saved[i]!==Q[i].a);
  box.innerHTML=`<h2>채점 요약<span class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</span></h2><div class="score-big">${T.c}점<small>${T.c} / ${T.n} 정답 · 풀이 ${T.a} · 미풀이 ${T.n-T.a}(오답 처리)</small></div><div style="margin-top:14px">${rows}</div>`+
    (wrong.length?`<div class="wrongs"><b>틀린 문항</b><br>${wrong.map(i=>`<a data-go="${i}">Q${String(i+1).padStart(2,'0')}</a>`).join('')}</div>`:'');
  box.classList.remove('hidden');
  box.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{filter='all';wrongOnly=false;$('wrongBtn').setAttribute('aria-pressed','false');$('wrongBtn').textContent='오답만 보기';document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===0));applyFilter();$('q'+a.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})});
  if(scroll)box.scrollIntoView({behavior:'smooth',block:'center'});
}
$('gradeBtn').onclick=()=>grade(true);
Q.forEach((_,i)=>paint(i));stats();applyFilter();
</script>
</body>
</html>
