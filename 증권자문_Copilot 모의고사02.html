<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>증권자문 Copilot 모의고사02 - 증권투자권유자문인력</title>
<style>
:root{color-scheme:light;--bg:#f6f7fb;--card:#fff;--ink:#172033;--muted:#697286;--pri:#3f5efb;--pri2:#7b61ff;--ok:#13a66b;--bad:#db3a34;--yel:#e0a800;--line:#e5e8f0;--soft:#eef2ff;--warn:#fff6df;--warn-line:#f1dc9a;--warn-ink:#5b4a17;--ok-bg:#eafaf3;--ok-line:rgba(19,166,107,.4);--bad-bg:#fff0ef;--bad-line:rgba(219,58,52,.4);--stem:#f8fafc;--hover:#fafbff;--hover-line:#b8c2ff;--pill:#f2f4f8;--pill-ink:#5b6478;--head:rgba(255,255,255,.94);--shadow:0 8px 22px rgba(23,32,51,.05)}
html[data-theme=dark]{color-scheme:dark;--bg:#12131a;--card:#1b1d27;--ink:#eceef6;--muted:#a3a9bb;--pri:#8ea2ff;--pri2:#b39dff;--ok:#4cd694;--bad:#ff8782;--yel:#f5c84c;--line:#32364a;--soft:#262b4a;--warn:#2d2815;--warn-line:#5f5222;--warn-ink:#ecdca3;--ok-bg:#12301f;--ok-line:rgba(76,214,148,.5);--bad-bg:#3a1b1d;--bad-line:rgba(255,135,130,.5);--stem:#20232f;--hover:#232638;--hover-line:#5a67b8;--pill:#262a39;--pill-ink:#b6bdd0;--head:rgba(27,29,39,.94);--shadow:none}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Malgun Gothic",Arial,sans-serif;font-size:15px;line-height:1.65;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;background:var(--head);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:12px 20px;width:100%}
.pgrid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start}
.bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 14px}
.pb{min-width:0}.pb .lab{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}
.pb .lab b{color:var(--ink)}.pb .lab .st{overflow:hidden;text-overflow:ellipsis}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:3px}
.bar>span{display:block;height:100%;width:0;background:var(--ok);transition:width .25s,background .25s}
.pb.yel .bar>span{background:var(--yel)}.pb.red .bar>span{background:var(--bad)}
.pb.yel .lab .st{color:var(--yel)}.pb.red .lab .st{color:var(--bad)}.pb.grn .lab .st{color:var(--ok)}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap}
.tabs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;color:var(--muted)}
.tab small{margin-left:4px;opacity:.75;font-weight:800}
.tab.active{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .tab.active{color:#10131f}
button:focus-visible{outline:3px solid #f5b301;outline-offset:2px}
.hero{padding:26px 20px 6px}
.badge{display:inline-flex;padding:6px 11px;border-radius:999px;background:var(--soft);color:var(--pri);font-weight:800;font-size:13px}
.hero h1{font-size:30px;letter-spacing:-.04em;margin:12px 0 8px;line-height:1.25}
.hero p{margin:0;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:18px}
.sumcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-width:0}
.sumcard b{display:block;font-size:22px;line-height:1.25}.sumcard span{color:var(--muted);font-size:13px}
.sumcard.total{background:linear-gradient(135deg,var(--pri),var(--pri2));border:0}.sumcard.total b,.sumcard.total span{color:#fff}
.note{margin-top:14px;background:var(--warn);border:1px solid var(--warn-line);border-radius:16px;padding:13px 16px;color:var(--warn-ink);font-size:14px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}html[data-theme=dark] .btn.primary{color:#10131f}
.btn[aria-pressed=true]{border-color:var(--pri);color:var(--pri);background:var(--soft)}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;margin:16px 0;padding:22px;box-shadow:var(--shadow);scroll-margin-top:170px;min-width:0;overflow-wrap:anywhere}
.qcard.is-ok{border-left:5px solid var(--ok)}.qcard.is-bad{border-left:5px solid var(--bad)}
.qtop{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.meta{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.pill{font-size:12px;border-radius:999px;padding:4px 10px;background:var(--pill);color:var(--pill-ink);font-weight:700}
.pill.sj{background:var(--pri);color:#fff}html[data-theme=dark] .pill.sj{color:#10131f}
.pill.ch{background:var(--soft);color:var(--pri)}
.num{font-weight:900;color:var(--pri);flex:none}
.q{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:10px 0 14px;line-height:1.55}
.opts{display:grid;gap:9px}
.opt{width:100%;text-align:left;display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;font-size:15px;color:var(--ink);transition:.15s;min-width:0}
.opt span.t{min-width:0;flex:1}
.opt b{flex:none;color:var(--pri)}
.opt:hover:not(:disabled){border-color:var(--hover-line);background:var(--hover)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok-line);background:var(--ok-bg)}.opt.correct b{color:var(--ok)}
.opt.wrong{border-color:var(--bad-line);background:var(--bad-bg)}.opt.wrong b{color:var(--bad)}
.opt .mark{flex:none;font-size:12px;font-weight:900}
.opt.correct .mark{color:var(--ok)}.opt.wrong .mark{color:var(--bad)}
.explain{display:none;margin-top:14px;padding:15px 16px;border-radius:16px;background:var(--stem);border:1px solid var(--line)}
.explain.show{display:block}
.result{font-weight:900;margin-bottom:6px}.result.ok{color:var(--ok)}.result.bad{color:var(--bad)}.result.peek{color:var(--pri)}
.ans{font-weight:800;margin-bottom:6px}
.src{margin-top:10px;padding:10px 12px;border-left:3px solid var(--warn-line);background:var(--warn);color:var(--warn-ink);border-radius:8px;font-size:13.5px}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin:8px 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:10px;max-width:100%;overflow-x:auto;font-family:"Cambria Math","Times New Roman",serif;font-size:16px}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px}
.frac .top{border-bottom:1.5px solid currentColor;padding:0 4px;line-height:1.3}.frac .bottom{padding:0 4px;line-height:1.3}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.gradebox{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.gradebox h2{margin:0 0 6px;font-size:20px}
.verdict{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:900;font-size:14px;margin-left:8px;vertical-align:middle}
.verdict.pass{background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-line)}.verdict.fail{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line)}
.score-big{font-size:34px;font-weight:900;color:var(--pri);letter-spacing:-.03em}
.score-big small{font-size:15px;color:var(--muted);font-weight:700;margin-left:6px}
.chrow{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;align-items:center;margin:9px 0;font-size:14px}
.chrow .mini{height:8px;background:var(--line);border-radius:999px;overflow:hidden}.chrow .mini i{display:block;height:100%}
.chrow .val{font-weight:800;white-space:nowrap}
.wrongs{margin-top:14px}.wrongs a{display:inline-block;margin:3px 6px 3px 0;padding:3px 10px;border-radius:999px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);font-weight:800;font-size:13px;text-decoration:none;cursor:pointer}
.hidden{display:none!important}
main{padding-bottom:50px}
@media(max-width:820px){.bars{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.hero h1{font-size:24px}.wrap,.hero{padding-left:14px;padding-right:14px}.qcard{padding:17px;border-radius:18px;scroll-margin-top:200px}.q{font-size:16px}.chrow{grid-template-columns:110px minmax(0,1fr);}.chrow .val{grid-column:1/-1}}
@media print{header,.controls{display:none}.explain{display:block!important}.qcard{break-inside:avoid;box-shadow:none}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="pgrid"><div class="bars" id="bars"></div><button class="theme" id="theme" type="button"></button></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="과목 필터"></div>
</div></header>
<section class="hero wrap">
  <span class="badge">적중문제·레퍼런스 기반 100문항</span>
  <h1>증권투자권유자문인력<br>Copilot 모의고사 02</h1>
  <p>선택지를 누르면 정답 여부와 해설이 바로 열리고, 풀이 기록은 이 기기에 저장됩니다.</p>
  <div class="summary" id="summary"></div>
  <div class="note"><b>합격 기준</b><br>과목별 정답률 50% 이상, 총점 70% 이상이어야 합격입니다. 미풀이 문항은 오답으로 처리합니다. 상단 막대는 오답이 과락 경계에 도달하면 <b>노란색</b>, 경계를 넘으면 <b>빨간색</b>으로 바뀝니다.</div>
  <div class="controls">
    <button class="btn" id="wrongBtn" type="button" aria-pressed="false">오답만 보기</button>
    <button class="btn" id="expBtn" type="button" aria-pressed="false">해설 전체 펼치기</button>
    <button class="btn primary" id="gradeBtn" type="button">채점 요약 보기</button>
    <button class="btn" id="resetBtn" type="button">기록 초기화</button>
  </div>
</section>
<main class="wrap">
  <div id="questions"></div>
  <div class="empty hidden" id="empty">조건에 맞는 문항이 없습니다.</div>
  <div class="gradebox hidden" id="gradeBox"></div>
</main>
<script>
const RAW=[[1,"경기분석","적중","경기순환과 관련하여 단기파동에 대한 설명 중 가장 옳은 것은?",["기술혁신, 신자원개발 등에 의해 나타난다.","기술혁신, 설비투자 내용년수에 관련하여 나타난다.","통화공급변동, 금리변동, 물가변동에 의해 나타난다.","쥬글라 순환이라고도 한다."],2,"단기파동인 키친파동은 통화공급·금리·물가 변동과 관련되고 통상 2-6년의 주기를 갖는다."],[1,"경기분석","적중","우리나라 거시경제지표에 관한 설명이다. 옳은 것은?",["소비자물가지수(CPI) 산정시 모든 소비자를 대상으로 재화에 대하여만 조사한다.","통화유통속도는 경기변화 및 인플레이션 압력 예측 에 유용하게 활용된다.","GDP 디플레이터는 명목 GDP를 실질GDP로 나누어 계산된다.","국제수지 중 경상수지 항목은 상품수지와 서비스수 지와 자본수지로 구성되어 있다."],2,"GDP 디플레이터는 명목 GDP를 실질 GDP로 나누어 산출한다. CPI는 재화와 서비스를 포함하고 경상수지는 자본수지를 포함하지 않는다."],[1,"경기분석","적중","경기변동과 관련 된 설명중 거리가 먼 것은?",["추세변동을 나타내는 추세선은 진폭이 없는 직선 또 는 곡선의 형태로 표시된다.","순환변동은 비교적 장기에 걸쳐 추세선을 중심으로 완만한 진폭을 보이는 것이다.","분기별 시계열자료를 갖고 시장분석할 때 계절조정 을 할 필요가 있다.","경기통계시계열 중에서 변동요인으로 설명할 수 없는 잔차요인(residual)에 해당하는 시계열 변동은 계절변동이다."],3,"설명할 수 없는 잔차요인은 불규칙변동이다. 계절변동은 일정 주기로 반복되는 변동이다."],[1,"경기분석","적중","시계열에 내재되어 있는 계절변동을 제거하기 위한 방법 중 거리가 먼 것은?",["MCD (Months for Cycial Dominance)이동평균법","X-11 ARIMA","중심화 이동평균법","단순이동평균법"],0,"MCD 이동평균법은 불규칙변동을 조정하는 방법이므로 계절변동 제거 방법과 거리가 멀다."],[1,"경기분석","적중","경기순환 특징에 관한 설명이다. 거리가 먼 것은?",["공행성은 경제변수들이 서로 안정적인 관계를 가지 고 일정한 방향으로 함께 움직이는 특성을 말한다.","변동성은 경기변수의 증가율의 평균으로 측정된다.","변동성은 경기변수의 증가율의 표준편차로 측정되는 데 변동성이 작을수록 경기 안정성의 증 가로 해석된다.","가격이나 임금의 경직성을 근거로 경기변동의 지속 성을 설명하는 견해도 있다."],1,"변동성은 경기변수 증가율의 평균이 아니라 표준편차로 측정한다."],[1,"경기분석","적중","경기변동의 원인에 대한 설명 중 거리가 먼 것은?",["케인즈는 민간기업의 투자지출의 변화에 의한 수요 측면의 충격이 경기변동의 원인이라 주장 하였다.","통화주의자는 준칙에 의한 통화정책이 경기변동의 원인이라 주장하였다.","화폐적 경기변동이론에 의하면 불완전한 정보에 의한 실질물가수준에 대한 판단오류를 경기 변동의 원인으로 보았다.","실물적 경기변동이론에서는 기술변화와 같은 실물적 충격이 경기변동의 원인이라 하였다."],1,"통화주의자는 준칙 자체가 아니라 임의적인 통화량 변동이 경기변동의 원인이 될 수 있다고 본다."],[1,"경기분석","적중","새케인즈학파에 대한 설명 중 거리가 먼 것은?",["케인즈학파의 핵심 가정인 임금 가격 경직성과 승수 효과의 아이디어를 계승하였다.","정부개입의 타당성을 뒷받침하였다.","임금 가격의 경직성은 경제주체의 비효율적인 대처 로 인한 것으로 보았다.","생산물시장이나 노동시장의 불완전성을 근거한다."],2,"새케인즈학파는 가격·임금 경직성을 경제주체의 최적화 행동에서 나타나는 합리적 결과로 설명한다."],[1,"경기분석","적중","다음은 실물적 경기변동이론(RBC)에 대한 설명이다. 맞는 것은?",["실질임금의 경기순응적 현상을 설명할 수 있다.","경기변동의 지속성은 내적 충격에 의해 촉발된 외생 적 파급경로의 결과로 해석된다.","경기변동의 공행성을 설명할 수 없다.","경기변동의 지속성을 설명할 수 없다."],0,"실물적 경기변동이론은 기술충격을 중심으로 실질임금의 경기순응성과 경기의 공행성·지속성을 설명한다."],[1,"경기분석","적중","다음은 새 케인즈학파의 경기변동이론과 관련된 내용 을 설명한 것이다. 사실과 다른 것은?",["메뉴이론은 재화가격의 경직성을 설명하는 이론이다.","케인즈학파의 승수효과의 아이디어를 계승하고 있다.","가격, 임금의 경직성이 경제주체들의 최적화 행동의 결과로 나타나는 합리적인 행동임을 주장 하였다.","“루카스비판”이라는 방법론적 오류가 있음을 비판받 았다."],3,"루카스 비판은 전통적 케인즈학파의 정책평가 방법에 제기된 비판이므로 새케인즈학파 자체의 오류라는 진술은 부적절하다."],[1,"경기분석","적중","통화정책 파급경로에 관한 설명이다. 거리가 먼 것 은?",["금리경로는 단기 및 장기 금리에 영향을 주어 결국 실물경기에 파급 효과를 제공한다.","‘토빈의 q이론’ 통해 설명할 수 있는 통화정책의 파 급경로는 자산가격경로이다.","환율경로는 통화가 늘어나면 국내금리가 하락하여 순자본유출이 일어나 환율이 상승하여 순 수출이 증가한다고 본다.","자산경로는 통화가 확장되면 채권수익률의 상승으로 주식가격하락을 유도하여 실물경제를 위 축한다고 한다."],3,"통화확장은 일반적으로 채권수익률을 낮추고 주식가격을 높이는 방향으로 작용하므로 ④는 방향이 반대이다."],[1,"경기분석","적중","경기종합지수(CI) 중에서 선행지수의 구성 지표가 아닌 것은?",["장단기금리차이","회사채유통수익률","재고순환지표","종합주가지수"],1,"회사채유통수익률은 후행종합지수의 구성지표이고 장단기금리차·재고순환지표·종합주가지수는 선행지표이다."],[1,"경기분석","적중","경기지표에 대한 설명중 거리가 먼 것은?",["DI와 CI 모두 선행지표, 동행지표, 후행지표로 구분 하여 확인한다.","CI는 경기 방향, 국면, 전환점 뿐만 아니라 속도, 진 폭도 파악할 수 있다.","경기확산지수(DI)가 80%이면 경기수축국면이다.","경기확산지수(DI)는 경기국면 파악은 가능하나 경기 수준은 알 수 없다."],2,"DI 80%는 구성지표 중 확장 신호가 우세하다는 뜻이므로 경기수축국면이라는 설명은 잘못이다."],[1,"경기분석","적중","기업실사지수(BSI)에 대한 설명과 거리가 먼 것은?",["값의 범위는 0 ~ 200 이다.","60%가 경기 긍정적업체수 비율이고 40%가 경기 부 정적업체수 비율이면 BSI 는 120을 나타 난다.","단기경기 예측 수단으로 활용된다.","경기국면 파악 및 경기수준을 파악하는데 유용하다."],3,"BSI는 기업의 체감경기 방향을 파악하는 단기예측 지표지만 경기수준 자체를 직접 측정하는 지표는 아니다."],[1,"경기분석","적중","경기국면 및 전환점 판단에 관한 설명이다. 거리가 먼 것은?",["향후 경기국면과 단기예측에는 선행지수 전년동월비 를 이용하여 판단한다.","선행지수의 증가율을 이용하는 확정적 방법에는 3연 속법칙, 연속신호법칙, 하이만즈 법칙 등 이 있다.","네프치 방법에 의한 전환점 판단은 선행지수의 증가 율을 이용한 확정적 방법이다.","연속신호법칙은 선행종합지수의 증가율과 동행종합 지수의 증가율의 변화를 이용한 경기 전환 점 포착방법이다."],2,"네프치 방법은 확률적 접근에 해당하므로 선행지수 증가율을 이용한 확정적 방법이라는 설명은 틀리다."],[1,"경기분석","적중","측정된 모형이 어느 정도 믿을 만한가 테스트 하는 과정을 검정(test)이라고 한다. 다음 중 검 정에 이용되는 통계량의 설명으로 틀린 것은?",["RMSE(root mean squre error) : 시뮬레이션 결과를 도출하는데 사용된 내생변수들의 값이 실 제 데이터값을 얼마나 가깝게 추적했는가를 평가하는 통계량이다.","t : 개별 설명변수의 통계적 유의성을 검정하는 통계 량이다.","R : 독립변수가 종속변수 변동을 잘 설명하는 정도 로 0에 가까울수록 설명력이 높다.","DW(durbin-watson statistic) : 2에 접근할수록 오차 항간 자기 상관이 없다."],2,"결정계수는 1에 가까울수록 설명력이 높다. 0에 가까울수록 높다는 설명이 반대이다."],[1,"경기분석","적중","모형에 의한 경기예측방법 대한 설명 중 거리가 먼 것은?",["ARIMA모형의 구축과정은 식별 → 모수추정 → 진단 검정 → 예측 단계로 이루어진다.","ARIMA모형은 불충분한 통계자료의 경우 보간법등을 이용하여 시계열의 연속성을 유지할 수 있다.","시계열모형중에 자기회귀(AR)모형은 시계열의 과거 관측치와 미래 예측치를 이용하는 모형이다.","계량경제모형은 모형표기－모형추정－추정결과의 검 정－모의실험 절차를 반복한다."],2,"자기회귀모형은 과거 관측치로 현재·미래 값을 설명하며 미래 예측치를 설명변수로 사용하지 않는다."],[1,"기본적 분석","적중","기본적 분석에 대한 설명으로 적절한 것은?",["주가는 시장에서 수요와 공급으로 결정된다고 본다.","과거의 주가 움직임을 파악함으로서 미래주가의 변동추이를 알 수 있다고 가정한다.","기업가치에 영향을 미치는 거시경제변수, 산업변수, 기업자체변수에 대해 분석한다.","추세분석, 패턴분석 등의 방법을 사용한다."],2,"기본적 분석은 거시경제·산업·기업 변수를 분석해 기업의 내재가치를 평가한다."],[1,"기본적 분석","적중","총자본이익률(ROI)과 자기자본이익률(ROE)에 관한 설명 중 틀린 것은?",["순이익이 일정할 때 총자본이 증가하면 ROI는 감소 한다.","매출액 순이익률이 일정한 상태에서 총자본회전율이 증가 시 ROI는 감소한다.","자기자본비율이 일정한 상태에서 ROI가 증가하면 ROE가 증가한다.","매출액 순이익률이 일정한 상태에서 총자본이 증가 하면 ROI가 감소한다."],1,"ROI는 매출액순이익률과 총자본회전율의 곱이므로 순이익률이 일정할 때 회전율이 높아지면 ROI도 높아진다."],[1,"기본적 분석","적중","기업 재무비율에 대한 설명으로 가장 적절한 것은?",["유동비율은 장기 채무능력을 평가하기 위한 비율이다.","총자산이익률은 안정성을 평가하기 위한 비율이다.","이자보상비율은 영업이익을 이자비용으로 나눈 값이다.","부채비율은 총자본에서 타인자본(부채)이 차지하는 비율이다."],2,"이자보상비율은 영업이익을 이자비용으로 나눈 값으로 이자 지급능력을 나타낸다."],[1,"기본적 분석","적중","다음 중 비율분석 중 잘못된 것은?",["유동비율= 유동부채/유동자산 × 100","고정비율= 고정자산/자기자본 × 100","부채비율= 부채총계/자본총계 × 100","이자보상배율= 영업이익/이자비용 × 100"],0,"유동비율은 유동자산을 유동부채로 나누어 계산한다. ①은 분자와 분모가 뒤바뀌었다."],[1,"기본적 분석","적중","총자본이 800억원이고 매출액 순이익률이 20%이고 당분간 변하지 않을 것이다. 현재 10%인 ROI를 15%로 상승시키려면 매출액을 얼마나 증가시켜 야 하는가?",["120억원","150억원","200억원","240억원"],2,"ROI=매출액순이익률×총자본회전율이다. 목표 매출액은 600억원, 현재 매출액은 400억원이므로 200억원 늘려야 한다."],[1,"기본적 분석","적중","대차대조표 와 손익계산서 항목을 통하여 계산 가능한 재무비율은?",["고정비율","매출액순이익률","영업이익증가율","재고자산회전율"],3,"재고자산회전율은 매출원가와 재고자산을 함께 사용하므로 손익계산서와 재무상태표 항목을 모두 이용한다."],[1,"기본적 분석","적중","“ABC중공업”의 영업레버리지도 5이며, 사업성격상 쉽게 변화시킬 수 없다. 영업이익은 1,000억원, 결합레 버리지도(DCL)는 10을 넘기지 않는 것이 내부방침일 때, 이 회사가 부담할 수 있는 이자비용은 최대 얼마인가?",["100억원","200억원","333억원","500억원"],3,"DCL=DOL×DFL이고 DFL=영업이익/(영업이익-이자비용)이다. DCL 10을 적용하면 최대 이자비용은 500억원이다."],[1,"기본적 분석","적중","주식의 배당평가모형 중 정률배당모형의 가정이 아닌 것은?",["성장자금을 내부자금으로만 조달한다.","기업의 이익, 배당이 일정한 비율로 성장한다.","요구수익률이 일정하며 요구수익률이 성장률보다 작 다.","재투자수익률이 일정하다."],2,"정률성장모형은 요구수익률이 성장률보다 커야 성립한다. 요구수익률이 성장률보다 작다는 ③은 가정이 아니다."],[1,"기본적 분석","적중","A주식의 매년 배당금이 2,000원으로 동일하고 현재 요구수익률이 10%라고 할 때 배당평가모 형에 대한 A주식의 가치는?",["10,000원","18,000원","15,000원","20,000원"],3,"배당이 일정한 제로성장모형의 가치는 2,000원÷10%=20,000원이다."],[1,"기본적 분석","적중","시장가치비율에 관한 설명 중 잘못된 것은?",["시장가치비율은 기업의 주식가격을 주당이익 및 장 부가치와 관련시킨 비율이다.","수익성 이외의 다른 면이 동일하다고 가정할 경우 기업의 주가수익률이 비교대상기업보다 낮 으면 그 기업의 주가가 상대적으로 저평가되어 있다고 본다.","다른 조건이 동일한 경우 PBR이 낮은 기업은 주식시장에서 주가가 저평가되어 있다고 본다.","토빈의 q가 1보다 작으면 기업들에게 설비투자에 대한 동기를 부여한다."],3,"토빈의 q가 1보다 클 때 설비투자 유인이 생기며, 1보다 작으면 투자 유인이 약해진다."],[1,"기본적 분석","적중","A기업의 자기자본이익률 10% 유지, 배당성향은 20%이다. 기말의 주당배당을 기초의 주가로 나눈 배당수익률이 5%일 경우 배당평가모형에서 주가 의 요구수익률은?",["13%","15%","17%","20%"],0,"유보율은 80%이고 성장률은 80%×ROE 10%=8%이다. 요구수익률은 배당수익률 5%와 성장률 8%의 합인 13%이다."],[1,"기본적 분석","적중","( ) 안에 들어 갈 말은? PBR = 자기 자본 순이익 률 x ( )",["부채 레버리지","매출액 / 총 자본","PER","PSR"],2,"PBR은 PER과 ROE의 곱으로 나타낼 수 있다."],[1,"기본적 분석","적중","PBR에 대한 설명이다. 가장 거리가 먼 것은?",["PBR은 계속기업을 전제로 하기보다는 기업 청산을 전제로 한 청산가치를 추정할 때 유용하 다.","PBR이 1이 아닌 이유 중의 하나는 분자인 주가와 분모인 주당순자산의 시간성에서 차이가 있 기 때문이다.","PBR은 자기자본이익률(ROE)를 주가수익배율(PER)를 나누어 계산된다.","기업의 원천적 수익력을 평가할 수 없다는 문제점이 있다."],2,"PBR=PER×ROE이므로 ROE로 PER을 나눈다는 ③은 잘못이다."],[1,"기본적 분석","적중","EVA(경제적 부가가치)에 대한 다음 설명 중 옳지 않 은 것은?",["EVA = 투자자본 × [투하지본수익률(ROIC)－가중평 균자본비용(WACC)]","세후 순영업이익에서 기업의 타인자본비용을 차감한 값","가치중심 경영을 유도하기 위한 성과측정 수단","주주 부(stockholder wealth)의 관점에서 기업가치를 평가한 지표"],1,"EVA는 세후영업이익에서 자기자본과 타인자본을 포함한 총자본비용을 차감한 값이다."],[1,"기술적 분석","적중","차트분석에 대한 설명이다. 옳은 것은?",["전일종가 보다 당일종가가 높을 때를 양선(양봉)이라 고 한다.","미국식 차트는 시가, 고가, 저가, 종가, 모두 표시한 다.","점수도표는 매일매일의 주가변화 그대로를 나타낸다.","선차트는 매일의 종가를 직선으로 연결한 도표이다."],3,"선차트는 각 거래일의 종가를 직선으로 연결한 도표이다."],[1,"기술적 분석","적중","추세이론에 관한 설명이다. 옳은 것은?",["다우이론에서 기술적분석에 따라 주식투자를 하는 사람이 가장 많은 투자수익을 올릴 수 있는 국면은 상승국면(강세2국면)이다.","엘리엇 파동이론에 2번파동, 4번파동, b파동은 충격 파동으로 분류된다.","일목균형표에서 기준선이 전환선을 상향 돌파할 때 를 매수신호로 보며 이를 호전이라고 한다.","일목균형표에서 구름대는 선행스팬1과 선행스팬2 사 이를 의미하는데 주가가 구름대에 들어서 면 주가는 큰 변동성을 나타내는 경우가 많다."],0,"다우이론의 강세 제2국면인 상승국면은 일반투자자의 참여가 확대되며 추세추종 수익기회가 큰 구간이다."],[1,"기술적 분석","적중","캔들차트분석에 대한 설명으로 올바르지 않은 것은?",["십자형은 장중 주가가 등락을 반복하다가 시가와 종가가 같아지는 시점에서 나타난다.","해머형은 더 이상 하락하지 않고 상승할 가능성이 있는 것으로 바닥권에서 출현이 신뢰도가 높다.","헤머형은 몸통보다 꼬리가 더 중요하다.","장악형에서는 몸통보다 꼬리가 더 중요하다."],3,"장악형은 앞선 캔들의 몸통을 다음 캔들의 몸통이 감싸는 패턴이므로 꼬리보다 몸통의 관계가 중요하다."],[1,"기술적 분석","적중","캔들차트분석에 관한 설명 중 잘못된 것은?",["헹인맨형은 주가하락을 암시한다.","관통형은 주가하락을 암시한다.","상승장악형은 주가상승을 암시하며, '음선+양선'일 경우 신뢰도가 높다.","유성형은 주가하락을 암시하며, 양선보다 음선의 신 뢰도가 높다."],1,"관통형은 하락추세에서 긴 음선 뒤 긴 양선이 나타나는 상승전환 신호이다."],[1,"기술적 분석","적중","패턴모형에서 거래량 분석에 대한 설명이다. 가장 알맞은 것은?",["삼봉천장형의 거래량은 헤드부분인 고점에서 가장 많이 발생한다.","깃대모형은 형성기간 중 거래량이 점차 증가한다.","다이아몬드형의 거래량은 일반적으로 주가 상승시에 는 증가하고 하락시에는 감소한다.","직사각형 모형은 매수시와 매도시 균형을 이루며 거래량이 증가한다."],2,"다이아몬드형에서는 일반적으로 상승 시 거래량이 늘고 하락 시 줄어드는 흐름이 나타난다."],[2,"유가증권시장","적중","증권의 발행형태에 관한 설명이다. 옳은 것은?",["발행주체가 불특정 다수인을 대상으로 증권을 모집 하는 형태를 사모발행이라 한다.","매출이란 이미 발행된 증권을 불특정 다수에게 증권 시장에서 투자 권유를 하는 것을 말한다.","간접발행의 대부분은 총액인수방식을 사용하며 인수 기관의 부담이 큰 만큼 인수수수료도 가장 높다.","직접발행 방법에는 위탁모집, 잔액인수, 총액인수 방 법이 있다."],2,"간접발행은 인수기관이 발행위험을 부담하며, 총액인수는 부담이 큰 만큼 인수수수료도 높다."],[2,"유가증권시장","적중","주권상장법인 혜택에 대한 설명으로 옳지 않은 것은?",["대주주가 상장주식 양도시는 양도소득득세를 부과하 나, 그 외 주주가장내시장에서 거래시는 비과세한다.","상장법인 또는 협회등록법인은 주주에게 배당할 이익으로 주식을 소각할 수 있다는 뜻을 정관으로 정하고 있는 경우는 주총결의를 거치지 않아도 되며, 이 경우 이사회 결의 후 3일 경과 후 3개월 이내에 취득한 주식 에 한한다.","상장법인과 비상장법인과의 합병 시 시가에 의한 경 우에도 합병비율의 적정성에 대하여 외부 평가기관의 평가를 받아야 한다.","시가가 액면가 이상인 경우에 한하여 이익배당총액 에 상당하는 금액까지 주식배당을 할 수 있다."],2,"시가를 적용하는 합병이라고 해서 항상 외부평가기관의 합병비율 평가가 필요한 것은 아니다."],[2,"유가증권시장","적중","자본시장법 중 증권의 공모에 관한 설명으로 가장 옳은 것은?",["공모대상인 증권의 신규발행 여부에 따라 모집과 매 출로 구분된다.","공모에 있어서 50인의 산정은 청약을 한 자의 수를 기준으로 판단한다.","공모 시 50인의 산정은 전문가와 연고자를 포함한 다.","매출 시 50인은 원칙적으로 증권시장에서 청약한 자 를 기준으로 산정한다."],0,"신규발행 증권의 공모는 모집, 이미 발행된 증권의 공모는 매출로 구분한다."],[2,"유가증권시장","적중","거래소주식시장의 상장제도에 대한 설명 중 맞는 것 은?",["상장법인의 상호가 변경된 경우 재상장을 신청해야 한다.","상장폐지된 법인이 재상장하기 위해서는 폐지된 날 로부터 3년 이내에 재상장을 신청하여야 한다.","상장폐지기준에 해당된 종목은 사유발생일 익일 상장을 폐지한다.","최근 사업연도의 사업보고서상 자본금 전액이 잠식 된 경우 상장이 폐지된다."],3,"최근 사업연도 말 자본금이 전액 잠식된 경우는 상장폐지 사유이다."],[2,"유가증권시장","적중","유가증권시장에 상장된 주식워런트 증권(ELW)의 기초자산으로 거리가 먼 지수는?",["KOSPI 200지수","항셍 지수","NIKKEI 225지수","S&P 지수"],3,"제시된 자료의 ELW 기초자산 지수에는 KOSPI 200·항셍·NIKKEI 225가 포함되며 S&P 지수는 거리가 멀다."],[2,"유가증권시장","적중","주권상장법인의 유·무상증자에 대한 설명이다. 잘못된 것은?",["주주배정방식으로 유상증자하는 경우 발행가액은 자 율로 결정한다.","제3자배정방식의 경우 발행가격은 기준주가에 90% 이상으로 한다.","일반공모방식의 경우 발행가격은 기준주가에 70% 이상으로 한다.","기업이 무상증자를 실시하는 목적은 자금조달을 위 해서 한다."],3,"무상증자는 자본구성을 바꾸는 절차로 회사에 새 현금이 유입되지 않으므로 자금조달 목적이라는 설명은 틀리다."],[2,"유가증권시장","적중","주권상장법인 공시에 관한 설명으로 틀린 것은?",["주권상장법인의 자율공시사항은 사유 발생 당일 중 신고해야 한다.","조회공시를 받은 경우 요구시점이 오전인 경우 오후, 오후인 경우에는 다음날 오전까지 공시하여야 한다.","보도목적 취재에 응한 정보제공과 비밀유지 의무자 에 대한 정보제공에 대하여 공정공시 의무가 적용 예외 를 인정하고 있다.","공시 위반시 관리종목 지정되거나 상장폐지 사유가 된다."],0,"자율공시사항은 사유 발생 당일이 아니라 일정 기한 내 신고하므로 ①이 틀린 설명이다."],[2,"유가증권시장","적중","증권 거래소에서의 기업내용 공시제도 중 부적절한 것은?",["조회공시 불이행, 공시번복이나 공시변경 경우 거래 소는 매매정지를 시킬 수 있다.","상장외국법인은 국내법인과 동일한 공시의무 거래, 의무사항 신고시 원칙적으로 그의 모국어로 하여야 한 다.","공정공시대상정보는 장내사업계획, 매출거래 등의 전 망 또는 예측이다.","보도목적 취재에 응한 정보제공과 비밀유지 의무자 에 대한 정보제공에 대하여 공정공시의무가 적용되지 않는다."],1,"상장외국법인의 의무사항 신고는 원칙적으로 한글로 해야 하므로 모국어로 한다는 설명은 부적절하다."],[2,"유가증권시장","적중","유가증권시장의 호가접수와 주문 효력에 관한 설명으로 옳은 것은?",["증권시장의 호가접수 개시시간은 정규매매 개시 30 분전 부터 시작한다.","증권시장의 정규시장 최소 매매거래단위는 가격에 관계없이 10주이다.","매매주문 관련하여 호가는 호가 접수 당일에는 효과 가 있으나 당일 시간외시장에서는 효력이 없다.","정리매매종목은 복수가격 경쟁매매 방식으로 거래가 이루어진다."],2,"호가는 접수 당일 정규시장에 효력이 있고 별도 규정이 없는 한 당일 시간외시장으로 자동 연장되지 않는다."],[2,"유가증권시장","적중","유가증권시장의 결제 및 지정가호가에 관한 설명으로 옳은 것은?",["거래소 주권결제방식은 실물결제방식, 차금결제방식, 집중결제방식을 채택하고 있다.","증권결제업무는 한국증권금융이 담당한다.","매도 최우선 지정가 호가의 경우, 해당 호가의 접수 시점에 매도 호가가 있을 때는 가장 높은 매도호가의 가격을 지정한 것으로 본다.","매수 최유리 지정가 호가의 경우, 해당 호가의 접수 시점에 매도 호가가 있을 때는 가장 낮은 매도호가의 가격을 지정한 것으로 본다."],3,"매수 최유리지정가호가는 매도호가가 있으면 가장 낮은 매도호가를 지정한 것으로 본다."],[2,"유가증권시장","적중","유가증권시장 가격제한폭에 대한 설명으로 가장 거리가 먼 것은?",["가격제한폭이 존재함으로써 시장의 효율성을 저해할 소지가 있다.","주식의 가격제한폭은 원칙적으로 전일종가에 15%를 곱하여 산출한다.","신주인수권증서, 주식워런트증권(ELW)의 경우 가격제 한폭이 적용되지 않는다.","정리매매종목의 경우에는 가격제한폭을 적용하지 않 는다."],1,"자료상 주식의 가격제한폭은 기준가격에 15%를 곱해 산출하므로 전일종가 기준이라는 ②가 부적절하다."],[2,"유가증권시장","적중","유가증권 시장에서의 매매호가단위에 관한 설명 중 틀린 것은?",["주가가 1,000원 미만인 종목의 호가단위는 1원이다.","상장지수펀드(ETF)는 가격에 관계없이 10원단위로 호 가한다.","500,000원 이상인 종목은 1,000원 단위로 호가한다.","코스닥시장과 비교하여 호가단위가 다르게 적용하고 있다."],1,"ETF는 가격과 관계없이 5원 단위로 호가하므로 10원 단위라는 설명이 틀리다."],[2,"유가증권시장","적중","프로그램매매호가 효력일시정지(Side Car)와 Circuit Breaker에 대한 설명이다. 틀린 것은?",["Side Car의 경우 KOSPI200 선물가격이 5% 이상 상 승 또는 하락하여 1분간 지속되는 경우 즉시 발동된다.","두 제도 모두 1일 1회에 한하여 발동되며 장 종료 40분 전 이후에는 적용하지 않는다.","Circuit Breakers는 KOSPI가 전일종가보다 8%, 15%, 20% 이상 하락하여 1분간 지속하면 주식시장의 모든 종목의 매매거래를 중단한다.","Side Car 는 발동시 5분간 효력을 정지한다."],2,"서킷브레이커는 단계별로 거래중단 방식이 다르므로 8%·15%·20%에서 모두 같은 방식으로 전 종목을 중단한다는 설명은 틀리다."],[2,"유가증권시장","적중","유가증권시장에서의 단일가격에 의한 개별경쟁 매매방법을 적용하는 경우가 아닌 것은?",["주권상장법인의 자기주식 매매가격 결정시","장 개시 전 시가 결정 시","정리매매종목, 단기과열종목일 경우","주식시장의 매매거래 중단 후 재개시 최초가격 결정 시"],0,"자기주식 매매가격 결정은 단일가격 개별경쟁매매의 일반적 적용대상이 아니다."],[2,"유가증권시장","적중","주권상장법인의 자기주식 매매시 거리가 먼 것은?",["장내를 통하지 않고 장외에서도 매수가 가능하다.","1일 주문은 발행총수의 1%를 초과할 수 없다.","신규주문은 오후 3시장종료시 까지 가능하다.","장개시전 매수주문 가격은 전일종가 이상 전일종가 5% 높은 가격 이하로 해야 한다."],2,"자기주식 신규 주문 가능시간은 장 종료시각까지가 아니므로 ③이 부적절하다."],[2,"유가증권시장","적중","유가증권시장 매매체결원칙에 관한 설명이다. 거리 가 먼 것은?",["단일가매매시간 중에서 동시호가인 경우에 고객의 위탁매매가 금융투자업자의 자기매매에 우선한다.","매도시장가호가와 하한가매도호가는 동일한 가격의 호가로 본다.","시간우선의 원칙은 복수가격에 의한 개별경쟁매매에 적용되나 단일가격에 의한 개별경쟁매매에는 적용되지 않는다.","원칙적으로 가격우선원칙이 우선하고 다음에 시간우 선의 원칙이 적용된다."],2,"단일가매매에서는 동시호가 수량배분 규칙을 적용하므로 ③의 설명은 문항 기준과 맞지 않는다."],[2,"유가증권시장","적중","유가증권시장의 시간외매매에 관한 설명이다. 거리 가 먼 것은?",["시간외 바스켓매매의 바스켓 구성 종목수는 5종목 이상이고 10억원 이상인 경우 가능하다.","시간외대량매매의 주문수량은 매매단위 5000배 이상 또는 수량의 가격을 곱한 1억원 이상이다.","시간외 단일가매매는 종가대비 ±10% 범위와 당일의 상.하한가 이내 가격으로 거래한다.","시간외 종가매매 거래단위는 10주이다."],3,"시간외 종가매매의 거래단위는 1주이므로 10주라는 설명은 틀리다."],[2,"유가증권시장","적중","다음 설명 중 옳지 않은 것은?",["투자주의종목으로 지정되면 신용거래가 제한된다.","관리종목으로 지정되면 대용증권 지정이 제한된다.","투자위험종목으로 지정되면 대용증권 지정이 제한된 다.","투자위험종목으로 지정되면 100% 위탁증거금 의무 된다."],0,"투자주의종목 지정만으로 곧바로 신용거래가 제한되는 것은 아니므로 ①이 옳지 않다."],[2,"유가증권시장","적중","거래소 시장에서의 권리락조치에 관한 설명 중 가장 부적절한 것은?",["권리락은 유무상증자시 신주배정기준일이 경과하여 신주를 배정받을 권리가 없는 상태를 말한다.","권리락 조치는 신주인수권을 받을 권리가 소멸됨을 조건으로 하는 매매임을 투자자에게 주지시키는 조치이다.","권리락 조치시기는 결제일에 따라 달라질 수 있다.","보통결제의 경우 권리락 조치는 신주배정기준일 당 일에 이루어진다."],3,"보통결제에서는 결제주기를 고려해 기준일보다 앞서 권리락 조치를 하므로 기준일 당일이라는 설명은 부적절하다."],[2,"코스닥시장","적중","코스닥시장의 매매제도에 관한 설명 중 옳은 것은?",["Circuit Breakers의 발동요건은 코스닥시장과 유가증권시장 모두 동일하다.","종목당 최소 호가수량단위는 10주이다.","기준가격에 상관없이 최소 호가단위는 10원이다.","가격제한폭은 기준가격 대비 ±12%이다."],0,"제시된 자료에서는 코스닥과 유가증권시장의 서킷브레이커 발동요건이 동일하다고 본다."],[2,"코스닥시장","적중","코스닥시장에 벤처기업이 상장하는 경우 일반기업 에 비하여 상장요건이 완화되어 있다. 해당사항으로 거리가 먼 것은?",["설립 후 경과연수","기업규모(자기자본)","감사인의 감사의견","매출, 이익 및 시가총액 기준"],2,"감사의견 요건은 일반기업과 벤처기업에 공통 적용되므로 완화항목과 거리가 멀다."],[2,"코스닥시장","적중","코스닥시장 공시제도에 대한 설명으로 가장 거리가 먼 것은?",["코스닥시장 상장법인은 사업연도 경과 후 90일 이내 에 사업보고서를 금융위원회와 한국거래소에 제출하여 야 한다.","수시공시는 원칙적으로 사유발생일 당일 6시까지 한국거래소에 신고하여야 한다.","공정공시 의무를 위반하는 경우에는 불성실공시법인 지정대상이 되지 않는다.","코스닥시장 상장법인이 사업보고서를 제출하지 않은 경우 거래소는 관리종목으로 지정하고 필요하면 상장폐 지 조치가 내려진다."],2,"공정공시 의무 위반은 불성실공시법인 지정대상이 될 수 있으므로 ③이 틀리다."],[2,"코스닥시장","적중","코스닥시장의 매매거래에 대한 설명으로 옳은 것은?",["위탁증거금의 징수율과 징수방법은 원칙적으로 한국 거래소가 정한다.","고객은 거래의 체결여부와 상관없이 매도 시에만 금융투자업자에게 위탁수수료를 지불하여야한다.","증권거래세는 고객이 직접 세무서에 납부하여야 한 다.","거래소가 운영을 담당하는 시장으로 경쟁매매방식으 로 체결된다."],3,"코스닥시장은 거래소가 운영하고 경쟁매매방식으로 체결된다."],[2,"코스닥시장","적중","다음 중 코스닥시장 상장법인의 관리종목 지정사유 에 대한 설명으로 가장 거리가 먼 것은?",["최근 사업연도말 기준 자본잠식률이 100분의 50 이 상인 경우","불성실공시로 인한 누계벌점이 최근 1년간 15점 이 상인 경우","시가총액이 50억원 미만인 상태가 연속하여 30일간 지속되는 경우","사업보고서를 법정제출기한 내에 제출하지 않는 경 우"],2,"자료상 관리종목 지정 시가총액 기준은 40억원 미만이므로 50억원 미만이라는 ③이 거리가 멀다."],[2,"코스닥시장","적중","코스닥시장의 매매제도에 대한 설명으로 올바른 것 은?",["5,000원 이상, 10,000원 미만의 주권의 호가가격의 단위는 50원이다","가격변동성이 커서 신용거래를 금지하고 있다.","코스닥상장주식에 대하여도 대용증권으로 가능하다.","코스닥시장에서의 최소주문수량단위는 10주이다."],2,"코스닥 상장주식도 일정 요건을 충족하면 대용증권으로 지정할 수 있다."],[2,"코스닥시장","적중","상장폐지제도에 대한 설명으로 거리가 먼 것은?",["회사가 부실화가 되거나 공개기업으로 의무를 다하 지 못한 경우로서 투자자를 보호하기 위한 제도이다.","신청에 의한 폐지의 경우 거래소는 거부가 불가능하 다.","시가총액이 일정미달하거나 매매거래실적이 부실한 경우에도 상장폐지 대상이 된다.","코스닥시장에서 유가증권시장으로 이전하는 경우에 는 원칙적으로 정리매매기간을 두지 않는다."],1,"신청에 의한 const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fml(src){const p=src.split('|');let h='';for(let i=0;i<p.length;i+=3){if(p[i])h+=`<span>${esc(p[i])}</span>`;if(p[i+1]!==undefined)h+=`<span class="frac"><span class="top">${esc(p[i+1])}</span><span class="bottom">${esc(p[i+2]||'')}</span></span>`}return `<div class="formula">${h}</div>`}
function rich(s){return String(s).split(/(\[\[[\s\S]*?\]\])/).map(seg=>{const m=seg.match(/^\[\[([\s\S]*)\]\]$/);if(!m)return esc(seg);if(m[1].startsWith('NOTE:'))return `<div class="src"><b>📘 교재 기준 주석</b> ${esc(m[1].slice(5))}</div>`;return fml(m[1])}).join('')}
const SUBS=[1,2,3];
const idxOf=s=>Q.map((q,i)=>i).filter(i=>s==='all'||Q[i].s===s);
function limit(s){const n=idxOf(s).length,r=s==='all'?0.7:0.5;return n-Math.ceil(n*r-1e-9)}
function applyTheme(t){document.documentElement.dataset.theme=t;const b=$('theme');b.textContent=t==='dark'?'☀️ 라이트':'🌙 다크'}
let th='light';try{th=localStorage.getItem(TKEY)||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){}
applyTheme(th);
$('theme').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme(n);try{localStorage.setItem(TKEY,n)}catch(e){}};
$('bars').innerHTML=['all',...SUBS].map(s=>`<div class="pb grn" id="pb-${s}"><div class="lab"><b>${s==='all'?'전체':'제'+s+'과목'}</b><span class="st"></span></div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><span></span></div></div>`).join('');
$('summary').innerHTML=`<div class="sumcard total"><b>${Q.length}</b><span>총 문항 · 합격 ${Math.ceil(Q.length*0.7)}문항 이상</span></div>`+SUBS.map(s=>{const n=idxOf(s).length;return `<div class="sumcard"><b>${n}</b><span>제${s}과목 ${SUBJ[s]} · 과락 기준 ${Math.ceil(n*0.5)}문항</span></div>`}).join('');
$('tabs').innerHTML=`<button class="tab active" role="tab" data-f="all">전체<small>${Q.length}</small></button>`+SUBS.map(s=>`<button class="tab" role="tab" data-f="${s}">제${s}과목 ${SUBJ[s]}<small>${idxOf(s).length}</small></button>`).join('');
$('questions').innerHTML=Q.map((x,i)=>`<article class="qcard" id="q${i}" data-i="${i}"><div class="qtop"><div class="meta"><span class="pill sj">제${x.s}과목</span><span class="pill ch">${esc(x.ch)}</span><span class="pill">${esc(x.t)}</span></div><span class="num">Q${String(i+1).padStart(2,'0')}</span></div><div class="q">${rich(x.q)}</div><div class="opts">${x.o.map((v,j)=>`<button type="button" class="opt" data-j="${j}"><b>${MARK[j]}</b><span class="t">${rich(v)}</span></button>`).join('')}</div><div class="explain"><div class="result"></div><div class="ans"></div><div class="why">${rich(x.e)}</div></div></article>`).join('');
function paint(i){
  const x=Q[i],card=$('q'+i),ch=saved[i],done=ch!==undefined,ok=done&&ch===x.a;
  card.classList.toggle('is-ok',ok);card.classList.toggle('is-bad',done&&!ok);
  card.querySelectorAll('.opt').forEach(o=>{const j=+o.dataset.j;o.disabled=done;
    o.classList.toggle('correct',done&&j===x.a);o.classList.toggle('wrong',done&&j===ch&&ch!==x.a);
    let m=o.querySelector('.mark');if(m)m.remove();
    if(done&&(j===x.a||j===ch)){m=document.createElement('span');m.className='mark';m.textContent=j===x.a?(j===ch?'정답 · 내 선택':'정답'):'내 선택';o.appendChild(m)}});
  card.querySelector('.explain').classList.toggle('show',done||expand);
  const r=card.querySelector('.result');r.textContent=done?(ok?'정답입니다.':`오답입니다. 내 선택 ${MARK[ch]}`):'정답 미리보기';r.className='result '+(done?(ok?'ok':'bad'):'peek');
  card.querySelector('.ans').textContent='정답 '+MARK[x.a];
}
function tally(s){const id=idxOf(s);const a=id.filter(i=>saved[i]!==undefined).length,c=id.filter(i=>saved[i]===Q[i].a).length;return{n:id.length,a,c,w:a-c}}
function stats(){['all',...SUBS].forEach(s=>{const t=tally(s),L=limit(s),el=$('pb-'+s);
  const st=t.w>L?'red':t.w===L?'yel':'grn';el.className='pb '+st;
  el.querySelector('.bar>span').style.width=(t.a/t.n*100)+'%';el.querySelector('.bar').setAttribute('aria-valuenow',Math.round(t.a/t.n*100));
  el.querySelector('.st').textContent=`${t.a}/${t.n} · 오답 ${t.w}/${L}${st==='red'?(s==='all'?' 불합격':' 과락'):st==='yel'?' 경계':''}`;})}
function visible(i){const x=Q[i];if(filter!=='all'&&x.s!==+filter)return false;if(wrongOnly&&!(saved[i]!==undefined&&saved[i]!==x.a))return false;return true}
function applyFilter(){let n=0;Q.forEach((x,i)=>{const v=visible(i);$('q'+i).classList.toggle('hidden',!v);if(v)n++});$('empty').classList.toggle('hidden',n>0)}
document.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>{const i=+b.closest('.qcard').dataset.i;if(saved[i]!==undefined)return;saved[i]=+b.dataset.j;try{localStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}paint(i);stats();if(!$('gradeBox').classList.contains('hidden'))grade(false)}));
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');filter=t.dataset.f;applyFilter()}));
$('wrongBtn').onclick=e=>{wrongOnly=!wrongOnly;e.currentTarget.setAttribute('aria-pressed',wrongOnly);e.currentTarget.textContent=wrongOnly?'전체 문항 보기':'오답만 보기';applyFilter()};
$('expBtn').onclick=e=>{expand=!expand;e.currentTarget.setAttribute('aria-pressed',expand);e.currentTarget.textContent=expand?'해설 전체 접기':'해설 전체 펼치기';Q.forEach((_,i)=>paint(i))};
$('resetBtn').onclick=()=>{if(!confirm('응답 기록을 모두 초기화할까요?'))return;saved={};try{localStorage.removeItem(KEY)}catch(e){}Q.forEach((_,i)=>paint(i));stats();$('gradeBox').classList.add('hidden');applyFilter();scrollTo({top:0,behavior:'smooth'})};
function grade(scroll=true){
  const box=$('gradeBox'),T=tally('all');let pass=T.c>=Math.ceil(T.n*0.7-1e-9);
  const rows=SUBS.map(s=>{const t=tally(s),need=Math.ceil(t.n*0.5-1e-9),okS=t.c>=need;if(!okS)pass=false;
    const chs=[...new Set(idxOf(s).map(i=>Q[i].ch))].map(ch=>{const id=idxOf(s).filter(i=>Q[i].ch===ch),k=id.filter(i=>saved[i]===Q[i].a).length;return `${esc(ch)} ${k}/${id.length}`}).join(' · ');
    return `<div class="chrow"><span><b>제${s}과목</b><br><small>${SUBJ[s]}</small></span><div class="mini"><i style="width:${t.c/t.n*100}%;background:${okS?'var(--ok)':'var(--bad)'}"></i></div><span class="val">${t.c} / ${t.n} (${Math.round(t.c/t.n*100)}%) ${okS?'통과':'과락'}</span></div><div style="font-size:12.5px;color:var(--muted);margin:-4px 0 10px">${chs}</div>`}).join('');
  const wrong=Q.map((q,i)=>i).filter(i=>saved[i]!==undefined&&saved[i]!==Q[i].a);
  box.innerHTML=`<h2>채점 요약<span class="verdict ${pass?'pass':'fail'}">${pass?'합격':'불합격'}</span></h2><div class="score-big">${T.c}점<small>${T.c} / ${T.n} 정답 · 풀이 ${T.a} · 미풀이 ${T.n-T.a}(오답 처리)</small></div><div style="margin-top:14px">${rows}</div>`+
    (wrong.length?`<div class="wrongs"><b>틀린 문항</b><br>${wrong.map(i=>`<a data-go="${i}">Q${String(i+1).padStart(2,'0')}</a>`).join('')}</div>`:'');
  box.classList.remove('hidden');
  box.querySelectorAll('[data-go]').forEach(a=>a.onclick=()=>{filter='all';wrongOnly=false;$('wrongBtn').setAttribute('aria-pressed','false');$('wrongBtn').textContent='오답만 보기';document.querySelectorAll('.tab').forEach((t,k)=>t.classList.toggle('active',k===0));applyFilter();$('q'+a.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})});
  if(scroll)box.scrollIntoView({behavior:'smooth',block:'center'});
}
$('gradeBtn').onclick=()=>grade(true);
Q.forEach((_,i)=>paint(i));stats();applyFilter();
</script>
</body>
</html>
